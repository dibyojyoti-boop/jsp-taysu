name: Build TAYSU APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: android-app/android-app
        run: npm install

      - name: Add Android
        working-directory: android-app/android-app
        run: npx --yes cap add android

      - name: Sync Capacitor
        working-directory: android-app/android-app
        run: npx --yes cap sync android

      - name: Build APK
        working-directory: android-app/android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TAYSU-debug-apk
          path: android-app/android-app/android/app/build/outputs/apk/debug/app-debug.apk
