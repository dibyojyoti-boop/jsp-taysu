<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DEBUG MESSAGE V2</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  background:#08090c;
  color:#f5f5f7;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

body{
  overflow:hidden;
}

button,input{
  font:inherit;
}

button{
  border:0;
  background:none;
  color:inherit;
  cursor:pointer;
}

.app{
  width:100%;
  height:100dvh;
  position:relative;
  overflow:hidden;
  background:#08090c;
}

/* =========================
   INBOX
========================= */

.inbox{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  background:#08090c;
}

.inbox-header{
  height:62px;
  min-height:62px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  border-bottom:1px solid #202228;
}

.inbox-header h1{
  font-size:20px;
  font-weight:700;
}

.back-home{
  position:absolute;
  left:10px;
  width:40px;
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
}

.back-home:active,
.chat-back:active{
  background:#181a1f;
}

.back-home svg,
.chat-back svg{
  width:23px;
  height:23px;
  stroke:currentColor;
}

.search-wrap{
  padding:12px 15px 8px;
}

.search-box{
  height:43px;
  width:100%;
  border-radius:12px;
  background:#17191e;
  border:1px solid #22252c;
  display:flex;
  align-items:center;
  padding:0 13px;
  gap:9px;
}

.search-box svg{
  width:18px;
  height:18px;
  color:#858991;
  flex:none;
}

.search-box input{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  color:#f5f5f7;
  font-size:15px;
}

.search-box input::placeholder{
  color:#858991;
}

.content{
  flex:1;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}

.section-title{
  padding:13px 16px 8px;
  font-size:13px;
  color:#8d9098;
  font-weight:650;
}

.conversation{
  width:100%;
  min-height:76px;
  display:flex;
  align-items:center;
  gap:13px;
  padding:10px 16px;
  transition:background .12s ease;
}

.conversation:active{
  background:#111318;
}

.avatar{
  width:54px;
  height:54px;
  min-width:54px;
  border-radius:50%;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#20232a;
  color:#a9adb6;
  font-size:20px;
  font-weight:700;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.conversation-info{
  min-width:0;
  flex:1;
}

.conversation-name{
  font-size:15px;
  color:#f4f4f6;
  font-weight:650;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.last-message{
  margin-top:4px;
  font-size:13px;
  color:#858991;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.unread .conversation-name{
  color:#fff;
  font-weight:750;
}

.unread .last-message{
  color:#e4e5e8;
  font-weight:600;
}

.unread-dot{
  width:9px;
  height:9px;
  min-width:9px;
  border-radius:50%;
  background:#2387ff;
}

.empty{
  padding:70px 25px;
  text-align:center;
  color:#858991;
}

.empty-title{
  color:#f3f3f5;
  font-size:18px;
  font-weight:700;
  margin-bottom:7px;
}

.empty-text{
  font-size:14px;
  line-height:1.5;
  overflow-wrap:anywhere;
}

.search-results{
  display:none;
}

.search-results.active{
  display:block;
}

.loading{
  padding:35px;
  text-align:center;
  color:#777b84;
  font-size:14px;
}

/* =========================
   CHAT
========================= */

.chat{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  background:#08090c;
  transform:translateX(100%);
  transition:transform .24s cubic-bezier(.2,.8,.2,1);
  z-index:20;
}

.chat.open{
  transform:translateX(0);
}

.chat-header{
  height:76px;
  min-height:76px;
  border-bottom:1px solid #202228;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  background:#08090c;
  z-index:3;
}

.chat-back{
  position:absolute;
  left:9px;
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
}

.chat-user{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  padding:3px 12px;
  border-radius:12px;
}

.chat-user:active{
  background:#111318;
}

.chat-user .avatar{
  width:39px;
  height:39px;
  min-width:39px;
  font-size:15px;
}

.chat-user-name{
  margin-top:3px;
  max-width:180px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:#f5f5f7;
  font-size:12px;
  font-weight:650;
}

/* =========================
   MESSAGES
========================= */

.messages{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:18px 10px 13px;
  display:flex;
  flex-direction:column;
  gap:5px;
  background:#08090c;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}

.start-chat{
  margin:auto;
  text-align:center;
  color:#858991;
}

.start-chat .avatar{
  width:82px;
  height:82px;
  min-width:82px;
  margin:0 auto 11px;
  font-size:29px;
}

.start-chat-name{
  color:#f4f4f6;
  font-size:18px;
  font-weight:700;
  margin-bottom:5px;
}

.start-chat-text{
  color:#858991;
  font-size:13px;
}

/* =========================
   MESSAGE ROW
========================= */

.message-row{
  width:100%;
  display:flex;
  align-items:flex-end;
  gap:5px;
  position:relative;
  animation:messageIn .12s ease-out;
  user-select:none;
  -webkit-user-select:none;
  touch-action:pan-y;
}

.message-row.mine{
  justify-content:flex-end;
}

.message-row.theirs{
  justify-content:flex-start;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(3px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/*
  TRUE SHRINK-WRAP:
  The message-content never becomes a full-width box.
*/

.message-content{
  flex:0 1 auto;
  width:max-content;
  max-width:min(78%,420px);
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  position:relative;
}

.mine .message-content{
  align-items:flex-end;
}

/* Opponent DP beside message */

.message-avatar{
  width:28px;
  height:28px;
  min-width:28px;
  border-radius:50%;
  overflow:hidden;
  background:#20232a;
  color:#a9adb6;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:700;
  margin-bottom:2px;
}

.message-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/*
  Bubble itself is also shrink-wrapped.
  No forced width.
*/

.message-bubble{
  display:block;
  width:max-content;
  max-width:100%;
  padding:7px 10px;
  border-radius:16px;
  font-size:15px;
  line-height:1.34;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.mine .message-bubble{
  background:#1677e8;
  color:#fff;
  border-bottom-right-radius:5px;
}

.theirs .message-bubble{
  background:#202228;
  color:#f2f2f4;
  border:1px solid #292c33;
  border-bottom-left-radius:5px;
}

/* Reply quote inside message */

.reply-quote{
  width:100%;
  max-width:100%;
  margin-bottom:4px;
  padding:6px 9px;
  border-radius:10px;
  background:rgba(255,255,255,.09);
  border-left:3px solid #2387ff;
  overflow:hidden;
}

.mine .reply-quote{
  background:rgba(255,255,255,.13);
}

.reply-label{
  font-size:10px;
  font-weight:700;
  color:#8ebfff;
  margin-bottom:2px;
}

.reply-text{
  font-size:11px;
  color:#bfc3ca;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* Media */

.message-image,
.message-video{
  width:auto;
  max-width:245px;
  max-height:320px;
  border-radius:17px;
  display:block;
  object-fit:cover;
  background:#17191e;
  cursor:pointer;
}
.shared-post-card{
  position:relative;
  width:245px;
  max-width:100%;
  overflow:hidden;
  border-radius:17px;
  background:#111318;
  border:1px solid rgba(255,255,255,.08);
  cursor:pointer;
}

.shared-reel-card{
  aspect-ratio:9/16;
}

.shared-image-card{
  aspect-ratio:4/5;
}

.shared-post-media{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.shared-post-shade{
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.4),
      transparent 32%,
      transparent 65%,
      rgba(0,0,0,.65)
    );
  pointer-events:none;
}

.shared-post-author{
  position:absolute;
  top:9px;
  left:9px;
  right:9px;
  z-index:3;
  display:flex;
  align-items:center;
  gap:7px;
  color:#fff;
  font-size:11px;
  font-weight:700;
  text-shadow:0 1px 6px rgba(0,0,0,.8);
}

.shared-post-author-avatar{
  width:30px;
  height:30px;
  min-width:30px;
  border-radius:50%;
  overflow:hidden;
  background:#242831;
  border:1px solid rgba(255,255,255,.75);
  display:grid;
  place-items:center;
  font-size:10px;
  font-weight:800;
}

.shared-post-author-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.shared-post-play{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:48px;
  height:48px;
  border-radius:50%;
  background:rgba(0,0,0,.5);
  display:grid;
  place-items:center;
  pointer-events:none;
}

.shared-post-play svg{
  width:22px;
  height:22px;
  margin-left:2px;
  color:#fff;
}

.shared-post-caption{
  position:absolute;
  left:11px;
  right:11px;
  bottom:10px;
  z-index:3;
  color:#fff;
  font-size:11px;
  line-height:1.35;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
  text-shadow:0 1px 6px rgba(0,0,0,.8);
}
.mine .message-image,
.mine .message-video{
  border-bottom-right-radius:5px;
}

.theirs .message-image,
.theirs .message-video{
  border-bottom-left-radius:5px;
}

.video-wrap{
  position:relative;
  width:max-content;
  max-width:100%;
  cursor:pointer;
}

.video-play{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:48px;
  height:48px;
  border-radius:50%;
  background:rgba(0,0,0,.62);
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
}

.video-play svg{
  width:20px;
  height:20px;
  margin-left:2px;
}

.message-time{
  flex:none;
  font-size:9px;
  color:#6f727a;
  margin:0 3px 2px;
  white-space:nowrap;
}

.message-sending{
  opacity:.72;
}

.message-sending .message-time{
  color:#777b84;
}

/* =========================
   SWIPE REPLY
========================= */

.reply-icon{
  position:absolute;
  left:2px;
  top:50%;
  width:29px;
  height:29px;
  margin-top:-15px;
  border-radius:50%;
  background:#202228;
  color:#8ebfff;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  transform:scale(.7);
  pointer-events:none;
  transition:opacity .12s ease,transform .12s ease;
}

.reply-icon.show{
  opacity:1;
  transform:scale(1);
}

.reply-icon svg{
  width:16px;
  height:16px;
}

/* =========================
   TYPING
========================= */

.typing-inline{
  display:flex;
  align-items:center;
  gap:4px;
  width:max-content;
  min-width:32px;
  height:23px;
  margin-top:3px;
  padding:0 9px;
  border-radius:13px;
  background:#202228;
  border:1px solid #292c33;
}

.typing-inline span{
  width:4px;
  height:4px;
  border-radius:50%;
  background:#858991;
  animation:typingDot 1s infinite ease-in-out;
}

.typing-inline span:nth-child(2){
  animation-delay:.15s;
}

.typing-inline span:nth-child(3){
  animation-delay:.3s;
}

@keyframes typingDot{
  0%,60%,100%{
    transform:translateY(0);
    opacity:.35;
  }
  30%{
    transform:translateY(-3px);
    opacity:1;
  }
}

/* =========================
   REPLY COMPOSER PREVIEW
========================= */

.reply-preview{
  display:none;
  min-height:48px;
  padding:7px 11px;
  background:#111318;
  border-top:1px solid #202228;
  align-items:center;
  gap:9px;
}

.reply-preview.show{
  display:flex;
}

.reply-preview-line{
  width:3px;
  height:31px;
  border-radius:3px;
  background:#2387ff;
  flex:none;
}

.reply-preview-info{
  min-width:0;
  flex:1;
}

.reply-preview-title{
  font-size:11px;
  color:#8ebfff;
  font-weight:700;
  margin-bottom:2px;
}

.reply-preview-text{
  font-size:12px;
  color:#bfc3ca;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.reply-preview-close{
  width:30px;
  height:30px;
  border-radius:50%;
  color:#9b9fa8;
  display:flex;
  align-items:center;
  justify-content:center;
}

.reply-preview-close:active{
  background:#202228;
}

.reply-preview-close svg{
  width:18px;
  height:18px;
}

/* =========================
   COMPOSER
========================= */

.composer{
  min-height:67px;
  padding:9px 11px calc(9px + env(safe-area-inset-bottom));
  border-top:1px solid #202228;
  display:flex;
  align-items:center;
  gap:8px;
  background:#08090c;
}

.photo-button{
  width:42px;
  height:42px;
  min-width:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  color:#3d94ff;
}

.photo-button:active{
  background:#121820;
}

.photo-button svg{
  width:23px;
  height:23px;
}

.message-input{
  flex:1;
  min-width:0;
  height:43px;
  border:1px solid #292c33;
  outline:0;
  border-radius:22px;
  background:#17191e;
  color:#f4f4f6;
  padding:0 15px;
  font-size:15px;
}

.message-input::placeholder{
  color:#858991;
}

.send-button{
  width:43px;
  height:43px;
  min-width:43px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#1677e8;
  color:#fff;
  transition:transform .1s ease,opacity .15s ease;
}

.send-button:active{
  transform:scale(.94);
}

.send-button:disabled{
  opacity:.35;
}

.send-button svg{
  width:20px;
  height:20px;
}

/* =========================
   UPLOAD
========================= */

.upload-status{
  position:absolute;
  left:0;
  right:0;
  bottom:67px;
  padding:8px 15px;
  background:#111318;
  border-top:1px solid #292c33;
  display:none;
  color:#b7bac2;
  font-size:12px;
  z-index:5;
}

.upload-status.active{
  display:block;
}

.progress-line{
  height:3px;
  margin-top:6px;
  background:#282b32;
  border-radius:4px;
  overflow:hidden;
}

.progress-bar{
  width:0;
  height:100%;
  background:#2387ff;
  transition:width .08s linear;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:84px;
  transform:translateX(-50%) translateY(12px);
  background:#f2f2f4;
  color:#111216;
  padding:10px 16px;
  border-radius:10px;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.18s ease;
  z-index:100;
  max-width:90%;
  text-align:center;
  overflow-wrap:anywhere;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* =========================
   ACTION SHEET
========================= */

.sheet-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  opacity:0;
  pointer-events:none;
  transition:opacity .18s ease;
  z-index:200;
}

.sheet-backdrop.show{
  opacity:1;
  pointer-events:auto;
}

.action-sheet{
  position:fixed;
  left:50%;
  bottom:10px;
  width:calc(100% - 20px);
  max-width:500px;
  transform:translate(-50%,120%);
  background:#191b20;
  border:1px solid #292c33;
  border-radius:17px;
  overflow:hidden;
  transition:transform .22s cubic-bezier(.2,.8,.2,1);
  z-index:201;
}

.sheet-backdrop.show .action-sheet{
  transform:translate(-50%,0);
}

.sheet-button{
  width:100%;
  height:52px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:600;
  border-bottom:1px solid #292c33;
}

.sheet-button:last-child{
  border-bottom:0;
}

.sheet-button:active{
  background:#22252b;
}

.sheet-button.danger{
  color:#ff5d68;
}

/* =========================
   MEDIA PREVIEW
========================= */

.media-preview-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.88);
  opacity:0;
  pointer-events:none;
  transition:opacity .18s ease;
  z-index:300;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.media-preview-backdrop.show{
  opacity:1;
  pointer-events:auto;
}

.media-preview{
  width:100%;
  max-width:560px;
  max-height:90dvh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.preview-media{
  max-width:100%;
  max-height:75dvh;
  border-radius:12px;
  object-fit:contain;
  background:#08090c;
}

.preview-actions{
  width:100%;
  display:flex;
  gap:9px;
  margin-top:14px;
}

.preview-action{
  flex:1;
  height:45px;
  border-radius:12px;
  background:#202228;
  color:#fff;
  font-size:14px;
  font-weight:650;
}

.preview-action.primary{
  background:#1677e8;
}

.preview-action:active{
  opacity:.75;
}

@media(min-width:700px){

  .inbox,
  .chat{
    max-width:600px;
    margin:auto;
    border-left:1px solid #202228;
    border-right:1px solid #202228;
  }

  .app{
    background:#050608;
  }
}
</style>
</head>

<body>

<div class="app">

<section class="inbox" id="inbox">

<header class="inbox-header">

<button class="back-home" id="homeBackBtn" aria-label="Back">

<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<path d="M15 18l-6-6 6-6"/>
</svg>

</button>

<h1>Messages</h1>

</header>

<div class="search-wrap">

<div class="search-box">

<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<circle cx="11" cy="11" r="7"/>
<path d="M20 20l-4-4"/>
</svg>

<input
id="userSearch"

async function loadConversations(){

  const user =
    getCurrentUser();

  if(!user){
    return;
  }

  if(conversationUnsubscribe){

    conversationUnsubscribe();
    conversationUnsubscribe = null;

  }

  conversationList.innerHTML =
    `<div class="loading">Loading messages...</div>`;

  conversationUnsubscribe =
    db.collection("conversations")
      .where(
        "participants",
        "array-contains",
        user.uid
      )
      .onSnapshot(
        async snapshot => {

          const conversations = [];

          for(
            const doc of snapshot.docs
          ){

            const data =
              doc.data();

            const otherUid =
              (data.participants || [])
                .find(
                  uid => uid !== user.uid
                );

            if(!otherUid){
              continue;
            }

            conversations.push({
              doc,
              data,
              otherUid
            });

          }

          /*
            IMPORTANT:
            typingBy is deliberately excluded.
            Therefore typing changes cannot cause
            an inbox redraw.
          */

          const signature =
            conversations
              .map(item => {

                const data =
                  item.data || {};

                const unread =
                  Number(
                    data?.unreadCounts?.[user.uid] || 0
                  );

                const time =
                  data.lastMessageAt?.toMillis
                    ? data.lastMessageAt.toMillis()
                    : 0;

                return [
                  item.doc.id,
                  data.lastMessage || "",
                  data.lastMessageType || "",
                  data.lastSenderId || "",
                  unread,
                  time
                ].join("|");

              })
              .sort()
              .join("||");

          if(
            signature ===
            lastInboxRenderSignature
          ){

            return;

          }

          lastInboxRenderSignature =
            signature;

          if(!conversations.length){

            conversationList.innerHTML = `
              <div class="empty">

                <div class="empty-title">
                  No messages yet
                </div>

                <div class="empty-text">
                  Search for a member and start a conversation.
                </div>

              </div>
            `;

            return;

          }

          conversations.sort(
            (a,b) => {

              const aTime =
                a.data.lastMessageAt?.toMillis
                  ? a.data.lastMessageAt.toMillis()
                  : 0;

              const bTime =
                b.data.lastMessageAt?.toMillis
                  ? b.data.lastMessageAt.toMillis()
                  : 0;

              return bTime - aTime;

            }
          );

          const fragment =
            document.createDocumentFragment();

          for(
            const item of conversations
          ){

            const userData =
              await getUserData(
                item.otherUid
              );

            const unreadCount =
              Number(
                item.data?.unreadCounts?.[user.uid] || 0
              );

            const name =
              userData.displayName ||
              userData.name ||
              userData.username ||
              "Member";

            const itemElement =
              document.createElement("div");

            itemElement.className =
              "conversation";

            if(unreadCount > 0){

              itemElement.classList.add(
                "unread"
              );

            }

            const preview =
              getInboxPreview(
                item.data,
                user.uid,
                unreadCount
              );

            itemElement.innerHTML = `

              <div class="avatar">
                ${avatarHTML(userData)}
              </div>

              <div class="conversation-info">

                <div class="conversation-name">
                  ${escapeHTML(name)}
                </div>

                <div class="last-message">
                  ${escapeHTML(preview)}
                </div>

              </div>

              ${
                unreadCount > 0
                ? `<div class="unread-dot"></div>`
                : ""
              }

            `;

            itemElement.addEventListener(
              "click",
              () => {

                openChat({
                  uid:item.otherUid,
                  ...userData
                });

              }
            );

            fragment.appendChild(
              itemElement
            );

          }

          conversationList.innerHTML = "";

          conversationList.appendChild(
            fragment
          );

        },
        error => {

          console.error(
            "INBOX ERROR:",
            error
          );

          conversationList.innerHTML = `
            <div class="empty">

              <div class="empty-title">
                Couldn't load messages
              </div>

              <div class="empty-text">
                ${escapeHTML(
                  error.message ||
                  "Please try again."
                )}
              </div>

            </div>
          `;

        }
      );

}


/* =========================================================
   INBOX PREVIEW
========================================================= */

function getInboxPreview(
  data,
  uid,
  unreadCount
){

  if(unreadCount > 1){

    return unreadCount +
      " new messages";

  }

  const type =
    data.lastMessageType;

  const message =
    data.lastMessage || "";

  const when =
    formatRelativeTime(
      data.lastMessageAt
    );

  let label = "";

  if(type === "sharedPost"){

    const sharedType =
      data.lastSharedPostType || "image";

    if(sharedType === "video"){

      label =
        data.lastSenderId === uid
          ? "Reel sent"
          : "Reel";

    }else{

      label =
        data.lastSenderId === uid
          ? "Post sent"
          : "Post";

    }

  }else if(type === "image"){

    label =
      data.lastSenderId === uid
        ? "Photo sent"
        : "Photo";

  }else if(type === "video"){

    label =
      data.lastSenderId === uid
        ? "Video sent"
        : "Video";

  }else{

    label =
      data.lastSenderId === uid
        ? "Message sent"
        : message || "Message";

  }

  if(!when){

    return label;

  }

  return label +
    " • " +
    when;

}


/* =========================================================
   RELATIVE TIME
========================================================= */

function formatRelativeTime(timestamp){

  if(!timestamp){
    return "";
  }

  let date;

  try{

    date =
      timestamp?.toDate
        ? timestamp.toDate()
        : new Date(timestamp);

  }catch(error){

    return "";

  }

  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "";

  }

  const seconds =
    Math.max(
      0,
      Math.floor(
        (Date.now() - date.getTime()) / 1000
      )
    );

  if(seconds < 10){
    return "just now";
  }

  if(seconds < 60){
    return seconds + " sec ago";
  }

  const minutes =
    Math.floor(seconds / 60);

  if(minutes < 60){

    return minutes +
      " min ago";

  }

  const hours =
    Math.floor(minutes / 60);

  if(hours < 24){

    return hours +
      " hr ago";

  }

  const days =
    Math.floor(hours / 24);

  if(days < 7){

    return days +
      " day" +
      (days === 1 ? "" : "s") +
      " ago";

  }

  return date.toLocaleDateString(
    [],
    {
      day:"numeric",
      month:"short"
    }
  );

}

async function searchMembers(query){

  const user =
    getCurrentUser();

  if(!user){
    return;
  }

  memberResults.innerHTML =
    `<div class="loading">Searching...</div>`;

  try{

    const snapshot =
      await db.collection("users")
        .limit(100)
        .get();

    const q =
      query.toLowerCase();

    const users = [];

    snapshot.forEach(doc => {

      if(doc.id === user.uid){
        return;
      }

      const data =
        doc.data();

      const name =
        String(
          data.displayName ||
          data.name ||
          data.username ||
          ""
        );

      const username =
        String(
          data.username ||
          ""
        );

      if(
        name.toLowerCase().includes(q) ||
        username.toLowerCase().includes(q)
      ){

        users.push({
          uid:doc.id,
          ...data
        });

      }

    });

    renderMemberResults(users);

  }catch(error){

    console.error(
      "SEARCH ERROR:",
      error
    );

    memberResults.innerHTML = `
      <div class="empty">

        <div class="empty-text">
          ${escapeHTML(
            error.message ||
            "Couldn't search members."
          )}
        </div>

      </div>

  }

}

function openChat(userData){

  const user =
    getCurrentUser();

  if(
    !user ||
    !userData?.uid ||
    userData.uid === user.uid
  ){

    return;

  }

  activeChatUser =
    userData;

  opponentTyping =
    false;

  clearReply();

  chatAvatar.innerHTML =
    avatarHTML(userData);

  chatUserName.textContent =
    userData.displayName ||
    userData.name ||
    userData.username ||
    "Member";

  chatOpen = true;

  /*
    Push a chat history state.
    Android Back now returns to inbox instead
    of immediately leaving message.html.
  */

  history.pushState(
    {
      page:"chat",
      uid:userData.uid
    },
    "",
    window.location.href
  );

  chat.classList.add("open");

  startConversationListeners();

  loadMessages();

  markConversationSeen();

  setTimeout(
    () => messageInput.focus(),
    260
  );

}

        snap => {

          if(!snap.exists){

            opponentTyping =
              false;

            renderTypingUnderLastMessage();

            return;

          }

          const data =
            snap.data() || {};

          const typingBy =
            data.typingBy || {};

          opponentTyping =
            typingBy[
              activeChatUser.uid
            ] === true;

          renderTypingUnderLastMessage();

        },
        error => {

          console.error(
            "CONVERSATION LISTENER ERROR:",
            error
          );

        }
      );

}


/* =========================================================
   TYPING UNDER OPPONENT MESSAGE
========================================================= */

function renderTypingUnderLastMessage(){

  document
    .querySelectorAll(".typing-inline")
    .forEach(el => el.remove());

  if(!opponentTyping){
    return;
  }

  const rows =
    Array.from(
      messages.querySelectorAll(
        ".message-row.theirs"
      )
    );

  /*
    If opponent has no message yet,
    show typing bubble at bottom left.
  */

  if(!rows.length){

    const typingRow =
      document.createElement("div");

    typingRow.className =
      "message-row theirs";

    const avatar =
      document.createElement("div");

    avatar.className =
      "message-avatar";

    avatar.innerHTML =
      avatarHTML(activeChatUser);

    const content =
      document.createElement("div");

    content.className =
      "message-content";

    content.innerHTML = `
      <div class="typing-inline">
        <span></span>
        <span></span>
        <span></span>
      </div>
    `;

    typingRow.appendChild(avatar);
    typingRow.appendChild(content);

    messages.appendChild(
      typingRow
    );

    scrollMessages();

    return;

  }

  const lastRow =
    rows[rows.length - 1];

  const content =
    lastRow.querySelector(
      ".message-content"
    );

  if(!content){
    return;
  }

  const typing =
    document.createElement("div");

  typing.className =
    "typing-inline";

  typing.innerHTML = `
    <span></span>
    <span></span>
    <span></span>
  `;

  content.appendChild(
    typing
  );

  scrollMessages();

}

========================================================= */

function loadMessages(){

  const user =
    getCurrentUser();

  if(
    !user ||
    !activeChatUser
  ){

    return;

  }

  if(messagesUnsubscribe){

    messagesUnsubscribe();
    messagesUnsubscribe = null;

  }

  messages.innerHTML =
    `<div class="loading">Loading conversation...</div>`;

  const cid =
    conversationId(
      user.uid,
      activeChatUser.uid
    );

  messagesUnsubscribe =
    db.collection("conversations")
      .doc(cid)
      .collection("messages")
      .orderBy(
        "createdAt",
        "asc"
      )
      .onSnapshot(
        snapshot => {

          messages.innerHTML = "";

          if(snapshot.empty){

            messages.innerHTML = `

              <div class="start-chat">

                <div class="avatar">
                  ${avatarHTML(activeChatUser)}
                </div>

                <div class="start-chat-name">
                  ${escapeHTML(
                    activeChatUser.displayName ||
                    activeChatUser.name ||
                    activeChatUser.username ||
                    "Member"
                  )}
                </div>

                <div class="start-chat-text">
                  Start a conversation
                </div>

              </div>

            `;

            renderTypingUnderLastMessage();

            return;

          }

          snapshot.forEach(
            doc => {

              renderMessage(
                doc.id,
                doc.data()
              );

            }
          );

          renderTypingUnderLastMessage();

          scrollMessages();

          markConversationSeen();

        },
        error => {

          console.error(
            "MESSAGES ERROR:",
            error
          );

          messages.innerHTML = `
            <div class="empty">

              <div class="empty-title">
                Couldn't load messages
              </div>

              <div class="empty-text">
                ${escapeHTML(
                  error.message ||
                  "Please try again."
                )}
              </div>

            </div>
          `;

        }
      );

}


/* =========================================================
   RENDER MESSAGE
========================================================= */



function renderMessage(
  messageId,
  data
){

  const user =
    getCurrentUser();

  if(!user){
    return;
  }

  const mine =
    data.senderId === user.uid;

  const row =
    document.createElement("div");

  row.className =
    "message-row " +
    (mine ? "mine" : "theirs");

  row.dataset.messageId =
    messageId;

  /*
    Reply icon
  */

  const replyIcon =
    document.createElement("div");

  replyIcon.className =
    "reply-icon";

  replyIcon.innerHTML = `
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2">

      <path d="M9 17l-5-5 5-5"/>
      <path d="M4 12h10a6 6 0 0 1 6 6"/>

    </svg>
  `;

  row.appendChild(
    replyIcon
  );

  /*
    Opponent DP
  */

  if(!mine){

    const avatar =
      document.createElement("div");

    avatar.className =
      "message-avatar";

    avatar.innerHTML =
      avatarHTML(activeChatUser);

    row.appendChild(
      avatar
    );

  }

  const content =
    document.createElement("div");

  content.className =
    "message-content";

  /*
    Reply quote
  */

  if(data.replyTo){

    const reply =
      document.createElement("div");

    reply.className =
      "reply-quote";

    let repliedText =
      data.replyTo.text || "";

    if(
      data.replyTo.type === "image"
    ){

      repliedText =
        "Photo";

    }
    else if(
      data.replyTo.type === "video"
    ){

      repliedText =
        "Video";

    }

    reply.innerHTML = `

      <div class="reply-label">
        ${mine ? "You replied" : "Reply"}
      </div>

      <div class="reply-text">
        ${escapeHTML(repliedText)}
      </div>

    `;

    content.appendChild(
      reply
    );

  }

  /*
    MESSAGE CONTENT
  */

  if(
    data.type === "sharedPost" &&
    data.sharedPostId
  ){

    renderSharedPostMessage(
      data,
      content
    );

  }

  else if(
    data.type === "image" &&
    data.imageUrl
  ){

    const image =
      document.createElement("img");

    image.className =
      "message-image";

    image.src =
      data.imageUrl;

    image.alt =
      "Photo";

    image.loading =
      "lazy";

    image.addEventListener(
      "click",
      () => {

        openMediaViewer(
          "image",
          data.imageUrl
        );

      }
    );

    content.appendChild(
      image
    );

  }

  else if(
    data.type === "video" &&
    data.videoUrl
  ){

    const videoWrap =
      document.createElement("div");

    videoWrap.className =
      "video-wrap";

    videoWrap.innerHTML = `

      <video
        class="message-video"
        src="${escapeAttribute(data.videoUrl)}"
        muted
        playsinline
        preload="metadata">
      </video>

      <div class="video-play">

        <svg
          viewBox="0 0 24 24"
          fill="currentColor">

          <path d="M8 5v14l11-7z"/>

        </svg>

      </div>

    `;

    videoWrap.addEventListener(
      "click",
      () => {

        openMediaViewer(
          "video",
          data.videoUrl
        );

      }
    );

    content.appendChild(
      videoWrap
    );

  }

  else{

    const bubble =
      document.createElement("div");

    bubble.className =
      "message-bubble";

    bubble.textContent =
      data.text || "";

    content.appendChild(
      bubble
    );

  }

  /*
    Add content
  */

  row.appendChild(
    content
  );

  /*
    Time
  */

  if(data.createdAt){

    const time =
      document.createElement("div");

    time.className =
      "message-time";

    time.textContent =
      formatTime(
        data.createdAt
      );

    row.appendChild(
      time
    );

  }

  /*
    Add message
  */

  messages.appendChild(
    row
  );

  /*
    Long press only on own messages
  */

  if(mine){

    attachLongPress(
      row,
      messageId
    );

  }

  /*
    Swipe reply
  */

  attachSwipeReply(
    row,
    messageId,
    data
  );

}

/* =========================================================
   SWIPE TO REPLY
========================================================= */

function attachSwipeReply(
  row,
  messageId,
  data
){

  let startX = 0;
  let startY = 0;
  let currentX = 0;
  let swiping = false;

  const threshold =
    58;

  row.addEventListener(
    "touchstart",
    event => {

      if(
        !event.touches ||
        !event.touches[0]
      ){

        return;

      }

      startX =
        event.touches[0].clientX;

      startY =
        event.touches[0].clientY;

      currentX =
        startX;

      swiping =
        false;

      row.style.transition =
        "none";

    },
    {
      passive:true
    }
  );


  row.addEventListener(
    "touchmove",
    event => {

      if(
        !event.touches ||
        !event.touches[0]
      ){

        return;

      }

      currentX =
        event.touches[0].clientX;

      const currentY =
        event.touches[0].clientY;

      const dx =
        currentX - startX;

      const dy =
        currentY - startY;

      /*
        Only activate when the gesture is
        clearly horizontal and moves right.
      */

      if(
        Math.abs(dy) >
        Math.abs(dx)
      ){

        return;

      }

      if(dx <= 0){

        return;

      }

      swiping =
        true;

      const distance =
        Math.min(
          dx,
          82
        );

      row.style.transform =
        "translateX(" +
        distance +
        "px)";

      const icon =
        row.querySelector(
          ".reply-icon"
        );

      if(icon){

        if(distance >= threshold){

          icon.classList.add(
            "show"
          );

        }else{

          icon.classList.remove(
            "show"
          );

        }

      }

    },
    {
      passive:true
    }
  );


  row.addEventListener(
    "touchend",
    () => {

      const dx =
        currentX - startX;

      const icon =
        row.querySelector(
          ".reply-icon"
        );

      row.style.transition =
        "transform .16s ease";

      row.style.transform =
        "translateX(0)";

      if(icon){

        icon.classList.remove(
          "show"
        );

      }

      if(
        swiping &&
        dx >= threshold
      ){

        beginReply(
          messageId,
          data
        );

      }

      swiping =
        false;

    }
  );


  row.addEventListener(
    "touchcancel",
    () => {

      row.style.transition =
        "transform .16s ease";

      row.style.transform =
        "translateX(0)";

      const icon =
        row.querySelector(
          ".reply-icon"
        );

      if(icon){

        icon.classList.remove(
          "show"
        );

      }

      swiping =
        false;

    }
  );

}

/* =========================================================
   LONG PRESS
========================================================= */

function attachLongPress(
  element,
  messageId
){

  let timer = null;

  const start = () => {

    timer =
      setTimeout(
        () => {

          openActionSheet(
            messageId
          );

        },
        550
      );

  };

  const cancel = () => {

    if(timer){

      clearTimeout(timer);
      timer = null;

    }

  };

  element.addEventListener(
    "touchstart",
    start,
    {
      passive:true
    }
  );

  element.addEventListener(
    "touchend",
    cancel
  );

  element.addEventListener(
    "touchcancel",
    cancel
  );

  element.addEventListener(
    "touchmove",
    cancel
  );

  element.addEventListener(
    "mousedown",
    start
  );

  element.addEventListener(
    "mouseup",
    cancel
  );

  element.addEventListener(
    "mouseleave",
    cancel
  );

}

async function unsendMessage(
  messageId
){

  const user =
    getCurrentUser();

  if(
    !user ||
    !activeChatUser
  ){

    return;

  }

  const cid =
    conversationId(
      user.uid,
      activeChatUser.uid
    );

  const messageRef =
    db.collection("conversations")
      .doc(cid)
      .collection("messages")
      .doc(messageId);

  try{

    const messageSnap =
      await messageRef.get();

    if(!messageSnap.exists){
      return;
    }

    const messageData =
      messageSnap.data();

    if(
      messageData.senderId !==
      user.uid
    ){

      showToast(
        "You can only unsend your own messages."
      );

      return;

    }

    await messageRef.delete();

    const latest =
      await db.collection("conversations")
        .doc(cid)
        .collection("messages")
        .orderBy(
          "createdAt",
          "desc"
        )
        .limit(1)
        .get();

    const conversationRef =
      db.collection("conversations")
        .doc(cid);

    if(latest.empty){

      await conversationRef.update({

        lastMessage:"",
        lastMessageType:"",
        lastSenderId:"",
        lastMessageAt:
          firebase.firestore.FieldValue.delete()

      });

    }else{

      const latestData =
        latest.docs[0].data();

      let preview =
        "";

      if(
        latestData.type ===
        "image"
      ){

        preview =
          "Photo";

      }else if(
        latestData.type ===
        "video"
      ){

        preview =
          "Video";

      }else{

        preview =
          latestData.text ||
          "";

      }

      await conversationRef.update({

        lastMessage:
          preview,

        lastMessageType:
          latestData.type ||
          "text",

        lastSenderId:
          latestData.senderId ||
          "",

        lastMessageAt:
          latestData.createdAt ||
          firebase.firestore.FieldValue.serverTimestamp()

      });

    }

    showToast(
      "Message unsent."
    );

  }catch(error){

    console.error(
      "UNSEND ERROR:",
      error
    );

    showToast(
      error.message ||
      "Couldn't unsend message."
    );

  }

}

async function sendTextMessage(
  text
){

  const user =
    getCurrentUser();

  if(
    !user ||
    !activeChatUser?.uid
  ){

    showToast(
      "Please open a chat first."
    );

    return;

  }

  if(
    activeChatUser.uid ===
    user.uid
  ){

    return;

  }

  const replyData =
    replyTarget
      ? {
          messageId:
            replyTarget.messageId,

          text:
            replyTarget.text,

          type:
            replyTarget.type,

          senderId:
            replyTarget.senderId
        }
      : null;

  messageInput.value = "";

  clearReply();

  updateSendButton();

  setTyping(false);

  const cid =
    conversationId(
      user.uid,
      activeChatUser.uid
    );

  const conversationRef =
    db.collection("conversations")
      .doc(cid);

  const messageRef =
    conversationRef
      .collection("messages")
      .doc();

  const timestamp =
    firebase.firestore.FieldValue
      .serverTimestamp();

  const receiverUid =
    activeChatUser.uid;

  try{

    await conversationRef.set({

      participants:[
        user.uid,
        receiverUid
      ],

      lastMessage:text,

      lastMessageType:"text",

      lastSenderId:user.uid,

      lastMessageAt:timestamp,

      seenByCurrentUser:true,

      unreadCounts:{
        [user.uid]:0,
        [receiverUid]:
          firebase.firestore.FieldValue.increment(1)
      }

    },{
      merge:true
    });

    const messageData = {

      senderId:user.uid,

      receiverId:receiverUid,

      text:text,

      type:"text",

      createdAt:timestamp

    };

    if(replyData){

      messageData.replyTo =
        replyData;

    }

    await messageRef.set(
      messageData
    );

  }catch(error){

    console.error(
      "SEND TEXT ERROR:",
      error
    );

    showToast(
      error.message ||
      "Couldn't send message."
    );

  }

}


/* =========================================================
   MEDIA SELECT
========================================================= */

photoButton.addEventListener(
  "click",
  () => {

    if(
      !getCurrentUser() ||
      !activeChatUser
    ){

      showToast(
        "Open a chat first."
      );

      return;

    }

    photoInput.click();

  }
);


photoInput.addEventListener(
  "change",
  () => {

    const file =
      photoInput.files?.[0];

    photoInput.value = "";

    if(!file){
      return;
    }

    if(
      !file.type.startsWith("image/") &&
      !file.type.startsWith("video/")
    ){

      showToast(
        "Please select a photo or video."
      );

      return;

    }

    if(
      file.type.startsWith("image/") &&
      file.size >
      25 * 1024 * 1024
    ){

      showToast(
        "Image must be under 25 MB."
      );

      return;

    }

    if(
      file.type.startsWith("video/") &&
      file.size >
      100 * 1024 * 1024
    ){

      showToast(
        "Video must be under 100 MB."
      );

      return;

    }

    openSelectedMediaPreview(
      file
    );

  }
);


/* =========================================================
   SELECTED MEDIA PREVIEW
========================================================= */

function openSelectedMediaPreview(
  file
){

  pendingMediaFile =
    file;

  previewMediaContainer.innerHTML = "";

  if(file.type.startsWith("image/")){

    const image =
      document.createElement("img");

    image.className =
      "preview-media";

    image.src =
      URL.createObjectURL(file);

    image.alt =
      "Selected photo";

    previewMediaContainer.appendChild(
      image
    );

  }else{

    const video =
      document.createElement("video");

    video.className =
      "preview-media";

    video.src =
      URL.createObjectURL(file);

    video.controls =
      true;

    video.playsInline =
      true;

    previewMediaContainer.appendChild(
      video
    );

  }

  previewCancelButton.style.display =
    "block";

  previewSendButton.style.display =
    "block";

  mediaPreviewBackdrop.classList.add(
    "show"
  );

}


previewSendButton.addEventListener(
  "click",
  async () => {

    if(!pendingMediaFile){
      return;
    }

    const file =
      pendingMediaFile;

    pendingMediaFile =
      null;

    closeMediaPreview();

    await sendMediaMessage(
      file
    );

  }
);


/* =========================================================
   IMAGEKIT AUTH
========================================================= */

async function getImageKitAuth(){

  const response =
    await fetch(
      IMAGEKIT_AUTH_URL
    );

  if(!response.ok){

    throw new Error(
      "Image upload authentication failed."
    );

  }

  return response.json();

}


/* =========================================================
   IMAGEKIT UPLOAD
========================================================= */

function uploadToImageKit(
  file,
  onProgress
){

  return new Promise(
    async (
      resolve,
      reject
    ) => {

      try{

        const user =
          getCurrentUser();

        if(!user){

          reject(
            new Error(
              "Please sign in again."
            )
          );

          return;

        }

        const authData =
          await getImageKitAuth();

        const safeName =
          file.name.replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );

        const formData =
          new FormData();

        formData.append(
          "file",
          file
        );

        formData.append(
          "fileName",
          Date.now() +
          "_" +
          safeName
        );

        formData.append(
          "publicKey",
          IMAGEKIT_PUBLIC_KEY
        );

        formData.append(
          "signature",
          authData.signature
        );

        formData.append(
          "expire",
          String(authData.expire)
        );

        formData.append(
          "token",
          authData.token
        );

        formData.append(
          "useUniqueFileName",
          "true"
        );

        formData.append(
          "folder",
          "messages/" +
          user.uid
        );

        const xhr =
          new XMLHttpRequest();

        xhr.open(
          "POST",
          IMAGEKIT_UPLOAD_URL
        );

        xhr.upload.onprogress =
          event => {

            if(
              event.lengthComputable
            ){

              const percent =
                Math.round(
                  event.loaded /
                  event.total *
                  100
                );

              onProgress(percent);

            }

          };

        xhr.onload = () => {

          if(
            xhr.status >= 200 &&
            xhr.status < 300
          ){

            try{

              const result =
                JSON.parse(
                  xhr.responseText
                );

              if(result.url){

                resolve(
                  result.url
                );

              }else{

                reject(
                  new Error(
                    "Media URL missing."
                  )
                );

              }

            }catch(error){

              reject(error);

            }

          }else{

            reject(
              new Error(
                "Media upload failed."
              )
            );

          }

        };

        xhr.onerror = () => {

          reject(
            new Error(
              "Network error while uploading."
            )
          );

        };

        xhr.send(
          formData
        );

      }catch(error){

        reject(error);

      }

    }
  );

}


/* =========================================================
   SEND MEDIA
========================================================= */

async function sendMediaMessage(
  file
){

  const user =
    getCurrentUser();

  if(
    !user ||
    !activeChatUser
  ){

    return;

  }

  const isVideo =
    file.type.startsWith(
      "video/"
    );

  const replyData =
    replyTarget
      ? {
          messageId:
            replyTarget.messageId,

          text:
            replyTarget.text,

          type:
            replyTarget.type,

          senderId:
            replyTarget.senderId
        }
      : null;

  clearReply();

  uploadStatus.classList.add(
    "active"
  );

  uploadStatus.firstChild.textContent =
    isVideo
      ? "Sending video..."
      : "Sending photo...";

  progressBar.style.width =
    "0%";

  setTyping(false);

  try{

    const mediaUrl =
      await uploadToImageKit(
        file,
        percent => {

          progressBar.style.width =
            percent + "%";

        }
      );

    const cid =
      conversationId(
        user.uid,
        activeChatUser.uid
      );

    const conversationRef =
      db.collection("conversations")
        .doc(cid);

    const messageRef =
      conversationRef
        .collection("messages")
        .doc();

    const timestamp =
      firebase.firestore.FieldValue
        .serverTimestamp();

    const receiverUid =
      activeChatUser.uid;

    await conversationRef.set({

      participants:[
        user.uid,
        receiverUid
      ],

      lastMessage:
        isVideo
          ? "Video"
          : "Photo",

      lastMessageType:
        isVideo
          ? "video"
          : "image",

      lastSenderId:user.uid,

      lastMessageAt:timestamp,

      seenByCurrentUser:true,

      unreadCounts:{
        [user.uid]:0,
        [receiverUid]:
          firebase.firestore.FieldValue.increment(1)
      }

    },{
      merge:true
    });

    const messageData = {

      senderId:user.uid,

      receiverId:receiverUid,

      type:
        isVideo
          ? "video"
          : "image",

      createdAt:timestamp

    };

    if(isVideo){

      messageData.videoUrl =
        mediaUrl;

    }else{

      messageData.imageUrl =
        mediaUrl;

    }

    if(replyData){

      messageData.replyTo =
        replyData;

    }

    await messageRef.set(
      messageData
    );

  }catch(error){

    console.error(
      "SEND MEDIA ERROR:",
      error
    );

    showToast(
      error.message ||
      "Couldn't send media."
    );

  }finally{

    setTimeout(
      () => {

        uploadStatus.classList.remove(
          "active"
        );

        progressBar.style.width =
          "0%";

      },
      250
    );

  }

}

function closeChat(
  navigateBack = false
){

  clearTimeout(
    typingTimer
  );

  setTyping(false);

  chat.classList.remove(
    "open"
  );

  chatOpen =
    false;

  activeChatUser =
    null;

  opponentTyping =
    false;

  clearReply();

  sendButton.disabled =
    true;

  if(messagesUnsubscribe){

    messagesUnsubscribe();
    messagesUnsubscribe = null;

  }

  if(activeConversationUnsubscribe){

    activeConversationUnsubscribe();
    activeConversationUnsubscribe = null;

  }

  if(navigateBack){

    history.back();

  }

}

/* =========================================================
   MESSAGE TIME
========================================================= */

function formatTime(timestamp){

  try{

    const date =
      timestamp?.toDate
        ? timestamp.toDate()
        : new Date(timestamp);

    return date.toLocaleTimeString(
      [],
      {
        hour:"numeric",
        minute:"2-digit",
        hour12:true
      }
    );

  }catch(error){

    return "";

  }

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

  return escapeHTML(value)
    .replace(/`/g,"&#096;");

}
