<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Messages • JSP TAYSU</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  background:#08090c;
  color:#f5f5f7;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

body{
  overflow:hidden;
}

button,input{
  font:inherit;
}

button{
  border:0;
  background:none;
  color:inherit;
  cursor:pointer;
}

.app{
  width:100%;
  height:100dvh;
  position:relative;
  overflow:hidden;
  background:#08090c;
}

/* =========================
   INBOX
========================= */

.inbox{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  background:#08090c;
}

.inbox-header{
  height:62px;
  min-height:62px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  border-bottom:1px solid #202228;
}

.inbox-header h1{
  font-size:20px;
  font-weight:700;
}

.back-home{
  position:absolute;
  left:10px;
  width:40px;
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
}

.back-home:active,
.chat-back:active{
  background:#181a1f;
}

.back-home svg,
.chat-back svg{
  width:23px;
  height:23px;
  stroke:currentColor;
}

/* Search */

.search-wrap{
  padding:12px 15px 8px;
}

.search-box{
  height:43px;
  width:100%;
  border-radius:12px;
  background:#17191e;
  border:1px solid #22252c;
  display:flex;
  align-items:center;
  padding:0 13px;
  gap:9px;
}

.search-box svg{
  width:18px;
  height:18px;
  color:#858991;
  flex:none;
}

.search-box input{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  color:#f5f5f7;
  font-size:15px;
}

.search-box input::placeholder{
  color:#858991;
}

/* Inbox list */

.content{
  flex:1;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}

.section-title{
  padding:13px 16px 8px;
  font-size:13px;
  color:#8d9098;
  font-weight:650;
}

.conversation{
  width:100%;
  min-height:76px;
  display:flex;
  align-items:center;
  gap:13px;
  padding:10px 16px;
  transition:background .12s ease;
}

.conversation:active{
  background:#111318;
}

.avatar{
  width:54px;
  height:54px;
  min-width:54px;
  border-radius:50%;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#20232a;
  color:#a9adb6;
  font-size:20px;
  font-weight:700;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.conversation-info{
  min-width:0;
  flex:1;
}

.conversation-name{
  font-size:15px;
  color:#f4f4f6;
  font-weight:650;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.last-message{
  margin-top:4px;
  font-size:13px;
  color:#858991;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.unread .conversation-name{
  color:#fff;
  font-weight:750;
}

.unread .last-message{
  color:#e4e5e8;
  font-weight:600;
}

.unread-dot{
  width:9px;
  height:9px;
  min-width:9px;
  border-radius:50%;
  background:#2387ff;
}

.empty{
  padding:70px 25px;
  text-align:center;
  color:#858991;
}

.empty-title{
  color:#f3f3f5;
  font-size:18px;
  font-weight:700;
  margin-bottom:7px;
}

.empty-text{
  font-size:14px;
  line-height:1.5;
  overflow-wrap:anywhere;
}

.search-results{
  display:none;
}

.search-results.active{
  display:block;
}

.loading{
  padding:35px;
  text-align:center;
  color:#777b84;
  font-size:14px;
}

/* =========================
   CHAT
========================= */

.chat{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  background:#08090c;
  transform:translateX(100%);
  transition:transform .24s cubic-bezier(.2,.8,.2,1);
  z-index:20;
}

.chat.open{
  transform:translateX(0);
}

.chat-header{
  height:76px;
  min-height:76px;
  border-bottom:1px solid #202228;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  background:#08090c;
  z-index:3;
}

.chat-back{
  position:absolute;
  left:9px;
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
}

.chat-user{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  padding:3px 12px;
  border-radius:12px;
}

.chat-user:active{
  background:#111318;
}

.chat-user .avatar{
  width:39px;
  height:39px;
  min-width:39px;
  font-size:15px;
}

.chat-user-name{
  margin-top:3px;
  max-width:180px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:#f5f5f7;
  font-size:12px;
  font-weight:650;
}

.typing-indicator{
  position:absolute;
  left:0;
  right:0;
  bottom:-22px;
  height:20px;
  display:none;
  justify-content:center;
  align-items:center;
  pointer-events:none;
  z-index:4;
}

.typing-indicator.show{
  display:flex;
}

.typing-label{
  color:#8d9098;
  font-size:11px;
  display:flex;
  align-items:center;
  gap:3px;
}

.typing-dots{
  display:flex;
  gap:2px;
  margin-left:3px;
}

.typing-dots span{
  width:3px;
  height:3px;
  border-radius:50%;
  background:#8d9098;
  animation:typingDot 1s infinite ease-in-out;
}

.typing-dots span:nth-child(2){
  animation-delay:.15s;
}

.typing-dots span:nth-child(3){
  animation-delay:.3s;
}

@keyframes typingDot{
  0%,60%,100%{
    transform:translateY(0);
    opacity:.35;
  }
  30%{
    transform:translateY(-3px);
    opacity:1;
  }
}

/* Messages */

.messages{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:18px 13px 13px;
  display:flex;
  flex-direction:column;
  gap:6px;
  background:#08090c;
  -webkit-overflow-scrolling:touch;
}

.start-chat{
  margin:auto;
  text-align:center;
  color:#858991;
}

.start-chat .avatar{
  width:82px;
  height:82px;
  min-width:82px;
  margin:0 auto 11px;
  font-size:29px;
}

.start-chat-name{
  color:#f4f4f6;
  font-size:18px;
  font-weight:700;
  margin-bottom:5px;
}

.start-chat-text{
  color:#858991;
  font-size:13px;
}

/* Message row */

.message-row{
  width:100%;
  display:flex;
  align-items:flex-end;
  gap:3px;
  animation:messageIn .12s ease-out;
  user-select:none;
  -webkit-user-select:none;
}

.message-row.mine{
  justify-content:flex-end;
}

.message-row.theirs{
  justify-content:flex-start;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(3px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.message-content{
  display:block;
  min-width:0;
  max-width:78%;
}

.message-bubble{
  display:inline-block;
  width:auto;
  max-width:100%;
  padding:8px 11px;
  border-radius:17px;
  font-size:15px;
  line-height:1.38;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  word-break:normal;
}

.mine .message-bubble{
  background:#1677e8;
  color:#fff;
  border-bottom-right-radius:5px;
}

.theirs .message-bubble{
  background:#202228;
  color:#f2f2f4;
  border:1px solid #292c33;
  border-bottom-left-radius:5px;
}

.message-image{
  width:auto;
  max-width:245px;
  max-height:320px;
  border-radius:17px;
  display:block;
  object-fit:cover;
  background:#17191e;
}

.mine .message-image{
  border-bottom-right-radius:5px;
}

.theirs .message-image{
  border-bottom-left-radius:5px;
}

.message-time{
  flex:none;
  font-size:9px;
  color:#6f727a;
  margin:0 4px 2px;
  white-space:nowrap;
}

/* Sending */

.message-sending{
  opacity:.72;
}

.message-sending .message-time{
  color:#777b84;
}

/* Composer */

.composer{
  min-height:67px;
  padding:9px 11px calc(9px + env(safe-area-inset-bottom));
  border-top:1px solid #202228;
  display:flex;
  align-items:center;
  gap:8px;
  background:#08090c;
}

.photo-button{
  width:42px;
  height:42px;
  min-width:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  color:#3d94ff;
}

.photo-button:active{
  background:#121820;
}

.photo-button svg{
  width:23px;
  height:23px;
}

.message-input{
  flex:1;
  min-width:0;
  height:43px;
  border:1px solid #292c33;
  outline:0;
  border-radius:22px;
  background:#17191e;
  color:#f4f4f6;
  padding:0 15px;
  font-size:15px;
}

.message-input::placeholder{
  color:#858991;
}

.send-button{
  width:43px;
  height:43px;
  min-width:43px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#1677e8;
  color:#fff;
  transition:transform .1s ease,opacity .15s ease;
}

.send-button:active{
  transform:scale(.94);
}

.send-button:disabled{
  opacity:.35;
}

.send-button svg{
  width:20px;
  height:20px;
}

/* Upload */

.upload-status{
  position:absolute;
  left:0;
  right:0;
  bottom:67px;
  padding:8px 15px;
  background:#111318;
  border-top:1px solid #292c33;
  display:none;
  color:#b7bac2;
  font-size:12px;
  z-index:5;
}

.upload-status.active{
  display:block;
}

.progress-line{
  height:3px;
  margin-top:6px;
  background:#282b32;
  border-radius:4px;
  overflow:hidden;
}

.progress-bar{
  width:0;
  height:100%;
  background:#2387ff;
  transition:width .08s linear;
}

/* Toast */

.toast{
  position:fixed;
  left:50%;
  bottom:84px;
  transform:translateX(-50%) translateY(12px);
  background:#f2f2f4;
  color:#111216;
  padding:10px 16px;
  border-radius:10px;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.18s ease;
  z-index:100;
  max-width:90%;
  text-align:center;
  overflow-wrap:anywhere;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* =========================
   ACTION SHEET
========================= */

.sheet-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  opacity:0;
  pointer-events:none;
  transition:opacity .18s ease;
  z-index:200;
}

.sheet-backdrop.show{
  opacity:1;
  pointer-events:auto;
}

.action-sheet{
  position:fixed;
  left:50%;
  bottom:10px;
  width:calc(100% - 20px);
  max-width:500px;
  transform:translate(-50%,120%);
  background:#191b20;
  border:1px solid #292c33;
  border-radius:17px;
  overflow:hidden;
  transition:transform .22s cubic-bezier(.2,.8,.2,1);
  z-index:201;
}

.sheet-backdrop.show .action-sheet{
  transform:translate(-50%,0);
}

.sheet-button{
  width:100%;
  height:52px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:600;
  border-bottom:1px solid #292c33;
}

.sheet-button:last-child{
  border-bottom:0;
}

.sheet-button:active{
  background:#22252b;
}

.sheet-button.danger{
  color:#ff5d68;
}

/* =========================
   PROFILE LOADING
========================= */

.profile-open-loading{
  opacity:.7;
}

@media(min-width:700px){

  .inbox,
  .chat{
    max-width:600px;
    margin:auto;
    border-left:1px solid #202228;
    border-right:1px solid #202228;
  }

  .app{
    background:#050608;
  }
}
</style>
</head>

<script>

/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {
  apiKey:"AIzaSyDpv2vqAZbCFgT_XJ4u-KB0AeZWVB2GIUs",
  authDomain:"jsp-taysu.firebaseapp.com",
  projectId:"jsp-taysu",
  storageBucket:"jsp-taysu.firebasestorage.app",
  messagingSenderId:"280992025632",
  appId:"1:280992025632:web:48efa21208a78be9a78045"
};

if(!firebase.apps.length){
  firebase.initializeApp(firebaseConfig);
}

const auth = firebase.auth();
const db = firebase.firestore();


/* =========================================================
   IMAGEKIT
========================================================= */

const IMAGEKIT_PUBLIC_KEY =
  "public_3h6iOJBuIST7Aphxt+20NsXp4q4=";

const IMAGEKIT_AUTH_URL =
  "https://jsp-taysu.vercel.app/api/imagekit-auth";

const IMAGEKIT_UPLOAD_URL =
  "https://upload.imagekit.io/api/v1/files/upload";


/* =========================================================
   ELEMENTS
========================================================= */

const chat =
  document.getElementById("chat");

const homeBackBtn =
  document.getElementById("homeBackBtn");

const chatBackBtn =
  document.getElementById("chatBackBtn");

const chatUserButton =
  document.getElementById("chatUserButton");

const userSearch =
  document.getElementById("userSearch");

const conversationList =
  document.getElementById("conversationList");

const conversationSection =
  document.getElementById("conversationSection");

const searchResults =
  document.getElementById("searchResults");

const memberResults =
  document.getElementById("memberResults");

const chatAvatar =
  document.getElementById("chatAvatar");

const chatUserName =
  document.getElementById("chatUserName");

const typingIndicator =
  document.getElementById("typingIndicator");

const messages =
  document.getElementById("messages");

const messageForm =
  document.getElementById("messageForm");

const messageInput =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");

const photoButton =
  document.getElementById("photoButton");

const photoInput =
  document.getElementById("photoInput");

const uploadStatus =
  document.getElementById("uploadStatus");

const progressBar =
  document.getElementById("progressBar");

const toast =
  document.getElementById("toast");

const sheetBackdrop =
  document.getElementById("sheetBackdrop");

const unsendButton =
  document.getElementById("unsendButton");

const cancelSheetButton =
  document.getElementById("cancelSheetButton");


/* =========================================================
   STATE
========================================================= */

let currentUser = null;
let activeChatUser = null;

let messagesUnsubscribe = null;
let conversationUnsubscribe = null;
let activeConversationUnsubscribe = null;

let searchTimer = null;
let toastTimer = null;

let typingTimer = null;

let selectedMessageId = null;


/* =========================================================
   AUTH
========================================================= */

auth.onAuthStateChanged(async user => {

  if(!user){

    currentUser = null;

    window.location.href =
      "index.html";

    return;

  }

  currentUser = user;

  await loadConversations();

  handleIncomingProfile();

});


/* =========================================================
   CURRENT USER
========================================================= */

function getCurrentUser(){

  return auth.currentUser ||
         currentUser ||
         null;

}


/* =========================================================
   TOAST
========================================================= */

function showToast(text){

  clearTimeout(toastTimer);

  toast.textContent =
    String(text || "Something went wrong.");

  toast.classList.add("show");

  toastTimer =
    setTimeout(() => {

      toast.classList.remove("show");

    },3000);

}


/* =========================================================
   AVATAR
========================================================= */

function avatarHTML(userData){

  const photo =
    userData?.photoURL ||
    userData?.photoUrl ||
    userData?.profilePhoto ||
    "";

  const name =
    userData?.displayName ||
    userData?.name ||
    userData?.username ||
    "M";

  const letter =
    escapeHTML(
      String(name)
        .trim()
        .charAt(0)
        .toUpperCase() || "M"
    );

  if(photo){

    return `
      <img
        src="${escapeAttribute(photo)}"
        alt=""
        loading="lazy"
      >
    `;

  }

  return letter;

}


/* =========================================================
   USER DATA
========================================================= */

async function getUserData(uid){

  try{

    const snap =
      await db.collection("users")
        .doc(uid)
        .get();

    if(snap.exists){

      return {
        uid,
        ...snap.data()
      };

    }

  }catch(error){

    console.error(
      "GET USER ERROR:",
      error
    );

  }

  return {
    uid,
    displayName:"Member"
  };

}


/* =========================================================
   CONVERSATION ID
========================================================= */

function conversationId(uid1,uid2){

  return [uid1,uid2]
    .sort()
    .join("_");

}


/* =========================================================
   INCOMING PROFILE
========================================================= */

function handleIncomingProfile(){

  const user =
    getCurrentUser();

  if(!user){
    return;
  }

  const params =
    new URLSearchParams(
      window.location.search
    );

  const uid =
    params.get("uid");

  if(
    !uid ||
    uid === user.uid
  ){

    return;

  }

  openChatByUid(uid);

}


/* =========================================================
   LOAD INBOX
   No composite orderBy.
========================================================= */

async function loadConversations(){

  const user =
    getCurrentUser();

  if(!user){
    return;
  }

  if(conversationUnsubscribe){

    conversationUnsubscribe();
    conversationUnsubscribe = null;

  }

  conversationList.innerHTML =
    `<div class="loading">Loading messages...</div>`;

  conversationUnsubscribe =
    db.collection("conversations")
      .where(
        "participants",
        "array-contains",
        user.uid
      )
      .onSnapshot(
        async snapshot => {

          if(snapshot.empty){

            conversationList.innerHTML = `
              <div class="empty">

                <div class="empty-title">
                  No messages yet
                </div>

                <div class="empty-text">
                  Search for a member and start a conversation.
                </div>

              </div>
            `;

            return;

          }

          const conversations = [];

          for(
            const doc of snapshot.docs
          ){

            const data =
              doc.data();

            const otherUid =
              (data.participants || [])
                .find(
                  uid => uid !== user.uid
                );

            if(!otherUid){
              continue;
            }

            conversations.push({
              doc,
              data,
              otherUid
            });

          }

          conversations.sort(
            (a,b) => {

              const aTime =
                a.data.lastMessageAt?.toMillis
                  ? a.data.lastMessageAt.toMillis()
                  : 0;

              const bTime =
                b.data.lastMessageAt?.toMillis
                  ? b.data.lastMessageAt.toMillis()
                  : 0;

              return bTime - aTime;

            }
          );

          conversationList.innerHTML = "";

          for(
            const item of conversations
          ){

            const userData =
              await getUserData(
                item.otherUid
              );

            const unreadCount =
              Number(
                item.data?.unreadCounts?.[user.uid] || 0
              );

            const name =
              userData.displayName ||
              userData.name ||
              userData.username ||
              "Member";

            const itemElement =
              document.createElement("div");

            itemElement.className =
              "conversation";

            if(unreadCount > 0){

              itemElement.classList.add(
                "unread"
              );

            }

            const preview =
              getInboxPreview(
                item.data,
                user.uid,
                unreadCount
              );

            itemElement.innerHTML = `

              <div class="avatar">
                ${avatarHTML(userData)}
              </div>

              <div class="conversation-info">

                <div class="conversation-name">
                  ${escapeHTML(name)}
                </div>

                <div class="last-message">
                  ${escapeHTML(preview)}
                </div>

              </div>

              ${
                unreadCount > 0
                ? `<div class="unread-dot"></div>`
                : ""
              }

            `;

            itemElement.addEventListener(
              "click",
              () => {

                openChat({
                  uid:item.otherUid,
                  ...userData
                });

              }
            );

            conversationList.appendChild(
              itemElement
            );

          }

        },
        error => {

          console.error(
            "INBOX ERROR:",
            error
          );

          conversationList.innerHTML = `
            <div class="empty">

              <div class="empty-title">
                Couldn't load messages
              </div>

              <div class="empty-text">
                ${escapeHTML(
                  error.message ||
                  "Please try again."
                )}
              </div>

            </div>
          `;

        }
      );

}


/* =========================================================
   INBOX PREVIEW
========================================================= */

function getInboxPreview(
  data,
  uid,
  unreadCount
){

  if(unreadCount > 1){

    return unreadCount +
      " new messages";

  }

  const type =
    data.lastMessageType;

  const message =
    data.lastMessage || "";

  const when =
    formatRelativeTime(
      data.lastMessageAt
    );

  let label = "";

  if(type === "image"){

    label =
      data.lastSenderId === uid
        ? "Photo sent"
        : "Photo";

  }else{

    label =
      data.lastSenderId === uid
        ? "Message sent"
        : message || "Message";

  }

  if(!when){

    return label;

  }

  return label +
    " • " +
    when;

}


/* =========================================================
   RELATIVE TIME
========================================================= */

function formatRelativeTime(timestamp){

  if(!timestamp){
    return "";
  }

  let date;

  try{

    date =
      timestamp?.toDate
        ? timestamp.toDate()
        : new Date(timestamp);

  }catch(error){

    return "";

  }

  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "";

  }

  const seconds =
    Math.max(
      0,
      Math.floor(
        (Date.now() - date.getTime()) / 1000
      )
    );

  if(seconds < 10){
    return "just now";
  }

  if(seconds < 60){
    return seconds + " sec ago";
  }

  const minutes =
    Math.floor(seconds / 60);

  if(minutes < 60){

    return minutes +
      " min ago";

  }

  const hours =
    Math.floor(minutes / 60);

  if(hours < 24){

    return hours +
      " hr ago";

  }

  const days =
    Math.floor(hours / 24);

  if(days < 7){

    return days +
      " day" +
      (days === 1 ? "" : "s") +
      " ago";

  }

  return date.toLocaleDateString(
    [],
    {
      day:"numeric",
      month:"short"
    }
  );

}

async function searchMembers(query){

  const user =
    getCurrentUser();

  if(!user){
    return;
  }

  memberResults.innerHTML =
    `<div class="loading">Searching...</div>`;

  try{

    const snapshot =
      await db.collection("users")
        .limit(100)
        .get();

    const q =
      query.toLowerCase();

    const users = [];

    snapshot.forEach(doc => {

      if(doc.id === user.uid){
        return;
      }

      const data =
        doc.data();

      const name =
        String(
          data.displayName ||
          data.name ||
          data.username ||
          ""
        );

      const username =
        String(
          data.username ||
          ""
        );

      if(
        name.toLowerCase().includes(q) ||
        username.toLowerCase().includes(q)
      ){

        users.push({
          uid:doc.id,
          ...data
        });

      }

    });

    renderMemberResults(users);

  }catch(error){

    console.error(
      "SEARCH ERROR:",
      error
    );

    memberResults.innerHTML = `
      <div class="empty">
        <div class="empty-text">
          ${escapeHTML(
            error.message ||
            "Couldn't search members."
          )}
        </div>
      </div>
    `;

  }

}

  }else{

    content.innerHTML = `

      document.createElement("div");

    time.className =
      "message-time";

      formatTime(
        data.createdAt

      row,
      messageId
    );

  }

/* =========================================================
   LONG PRESS
========================================================= */

function attachLongPress(
  element,
  messageId
){

  let timer = null;
  let triggered = false;

  const start = event => {

    triggered = false;

    timer =
      setTimeout(
        () => {

          triggered = true;

          openActionSheet(
            messageId
          );

        },
        550
      );

  };

  const cancel = () => {

    if(timer){

      clearTimeout(timer);
      timer = null;

    }

  };

  element.addEventListener(
    "touchstart",
    start,
    {
      passive:true
    }
  );

  element.addEventListener(
    "touchend",
    cancel
  );

  element.addEventListener(
    "touchcancel",
    cancel
  );

  element.addEventListener(
    "touchmove",
    cancel
  );

  element.addEventListener(
    "mousedown",
    start
  );

  element.addEventListener(
    "mouseup",
    cancel
  );

  element.addEventListener(
    "mouseleave",
    cancel
  );

}

async function unsendMessage(
  messageId
){

  const user =
    getCurrentUser();

  if(
    !user ||
    !activeChatUser
  ){

    return;

  }

  const cid =
    conversationId(
      user.uid,
      activeChatUser.uid
    );

  const messageRef =
    db.collection("conversations")
      .doc(cid)
      .collection("messages")
      .doc(messageId);

  try{

    const messageSnap =
      await messageRef.get();

    if(!messageSnap.exists){
      return;
    }

    const messageData =
      messageSnap.data();

    if(
      messageData.senderId !==
      user.uid
    ){

      showToast(
        "You can only unsend your own messages."
      );

      return;

    }

    await messageRef.delete();

    /*
      Rebuild inbox preview from the
      newest remaining message.
    */

    const latest =
      await db.collection("conversations")
        .doc(cid)
        .collection("messages")
        .orderBy(
          "createdAt",
          "desc"
        )
        .limit(1)
        .get();

    const conversationRef =
      db.collection("conversations")
        .doc(cid);

    if(latest.empty){

      await conversationRef.update({

        lastMessage:"",
        lastMessageType:"",
        lastSenderId:"",
        lastMessageAt:
          firebase.firestore.FieldValue.delete()

      });

    }else{

      const latestData =
        latest.docs[0].data();

      await conversationRef.update({

        lastMessage:
          latestData.type === "image"
            ? "Photo"
            : (
                latestData.text ||
                ""
              ),

        lastMessageType:
          latestData.type || "text",

        lastSenderId:
          latestData.senderId || "",

        lastMessageAt:
          latestData.createdAt ||
          firebase.firestore.FieldValue.serverTimestamp()

      });

    }

    showToast(
      "Message unsent."
    );

  }catch(error){

    console.error(
      "UNSEND ERROR:",
      error
    );

    showToast(
      error.message ||
      "Couldn't unsend message."
    );

  }

}

async function sendTextMessage(
  text
){

  const user =
    getCurrentUser();

  if(
    !user ||
    !activeChatUser?.uid
  ){

    showToast(
      "Please open a chat first."
    );

    return;

  }

  if(
    activeChatUser.uid ===
    user.uid
  ){

    return;

  }

  messageInput.value = "";

  updateSendButton();

  const cid =
    conversationId(
      user.uid,
      activeChatUser.uid
    );

  const conversationRef =
    db.collection("conversations")
      .doc(cid);

  const messageRef =
    conversationRef
      .collection("messages")
      .doc();

  const timestamp =
    firebase.firestore.FieldValue
      .serverTimestamp();

  const receiverUid =
    activeChatUser.uid;

  /*
    Create/update conversation immediately.
    unread count is maintained per user.
  */

  try{

    await conversationRef.set({

      participants:[
        user.uid,
        receiverUid
      ],

      lastMessage:text,

      lastMessageType:"text",

      lastSenderId:user.uid,

      lastMessageAt:timestamp,

      seenByCurrentUser:true,

      unreadCounts:{
        [user.uid]:0,
        [receiverUid]:
          firebase.firestore.FieldValue.increment(1)
      }

    },{
      merge:true
    });

    await messageRef.set({

      senderId:user.uid,

      receiverId:receiverUid,

      text:text,

      type:"text",

      createdAt:timestamp

    });

  }catch(error){

    console.error(
      "SEND TEXT ERROR:",
      error
    );

    showToast(
      error.message ||
      "Couldn't send message."
    );

  }

}

/* =========================================================
   IMAGEKIT UPLOAD
========================================================= */

function uploadToImageKit(
  file,
  onProgress
){

  return new Promise(
    async (
      resolve,
      reject
    ) => {

      try{

        const user =
          getCurrentUser();

        if(!user){

          reject(
            new Error(
              "Please sign in again."
            )
          );

          return;

        }

        const authData =
          await getImageKitAuth();

        const safeName =
          file.name.replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );

        const formData =
          new FormData();

        formData.append(
          "file",
          file
        );

        formData.append(
          "fileName",
          Date.now() +
          "_" +
          safeName
        );

        formData.append(
          "publicKey",
          IMAGEKIT_PUBLIC_KEY
        );

        formData.append(
          "signature",
          authData.signature
        );

        formData.append(
          "expire",
          String(authData.expire)
        );

        formData.append(
          "token",
          authData.token
        );

        formData.append(
          "useUniqueFileName",
          "true"
        );

        formData.append(
          "folder",
          "messages/" +
          user.uid
        );

        const xhr =
          new XMLHttpRequest();

        xhr.open(
          "POST",
          IMAGEKIT_UPLOAD_URL
        );

        xhr.upload.onprogress =
          event => {

            if(
              event.lengthComputable
            ){

              const percent =
                Math.round(
                  event.loaded /
                  event.total *
                  100
                );

              onProgress(percent);

            }

          };

        xhr.onload = () => {

          if(
            xhr.status >= 200 &&
            xhr.status < 300
          ){

            try{

              const result =
                JSON.parse(
                  xhr.responseText
                );

              if(result.url){

                resolve(
                  result.url
                );

              }else{

                reject(
                  new Error(
                    "Image URL missing."
                  )
                );

              }

            }catch(error){

              reject(error);

            }

          }else{

            reject(
              new Error(
                "Image upload failed."
              )
            );

          }

        };

        xhr.onerror = () => {

          reject(
            new Error(
              "Network error while uploading."
            )
          );

        };

        xhr.send(
          formData
        );

      }catch(error){

        reject(error);

      }

    }
  );

}


/* =========================================================
   SEND PHOTO
========================================================= */

async function sendPhotoMessage(
  file
){

  const user =
    getCurrentUser();

  if(
    !user ||
    !activeChatUser
  ){

    return;

  }

  uploadStatus.classList.add(
    "active"
  );

  progressBar.style.width =
    "0%";

  try{

    const imageUrl =
      await uploadToImageKit(
        file,
        percent => {

          progressBar.style.width =
            percent + "%";

        }
      );

    const cid =
      conversationId(
        user.uid,
        activeChatUser.uid
      );

    const conversationRef =
      db.collection("conversations")
        .doc(cid);

    const messageRef =
      conversationRef
        .collection("messages")
        .doc();

    const timestamp =
      firebase.firestore.FieldValue
        .serverTimestamp();

    const receiverUid =
      activeChatUser.uid;

    await conversationRef.set({

      participants:[
        user.uid,
        receiverUid
      ],

      lastMessage:"Photo",

      lastMessageType:"image",

      lastSenderId:user.uid,

      lastMessageAt:timestamp,

      seenByCurrentUser:true,

      unreadCounts:{
        [user.uid]:0,
        [receiverUid]:
          firebase.firestore.FieldValue.increment(1)
      }

    },{
      merge:true
    });

    await messageRef.set({

      senderId:user.uid,

      receiverId:receiverUid,

      type:"image",

      imageUrl:imageUrl,

      createdAt:timestamp

    });

  }catch(error){

    console.error(
      "SEND PHOTO ERROR:",
      error
    );

    showToast(
      error.message ||
      "Couldn't send photo."
    );

  }finally{

    setTimeout(
      () => {

        uploadStatus.classList.remove(
          "active"
        );

        progressBar.style.width =
          "0%";

      },
      250
    );

  }

}

========================================================= */

chatBackBtn.addEventListener(
  "click",
  closeChat
);


function closeChat(){

  clearTimeout(
    typingTimer
  );

  setTyping(false);

  chat.classList.remove(
    "open"
  );

  typingIndicator.classList.remove(
    "show"
  );

  activeChatUser = null;

  sendButton.disabled =
    true;

  if(messagesUnsubscribe){

    messagesUnsubscribe();
    messagesUnsubscribe = null;

  }

  if(activeConversationUnsubscribe){

    activeConversationUnsubscribe();
    activeConversationUnsubscribe = null;

  }

}

/* =========================================================
   MESSAGE TIME
========================================================= */

function formatTime(timestamp){

  try{

    const date =
      timestamp?.toDate
        ? timestamp.toDate()
        : new Date(timestamp);

    return date.toLocaleTimeString(
      [],
      {
        hour:"numeric",
        minute:"2-digit",
        hour12:true
      }
    );

  }catch(error){

    return "";

  }

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

  return escapeHTML(value)
    .replace(/`/g,"&#096;");

}

    if(conversationUnsubscribe){

    }

    if(activeConversationUnsubscribe){
      activeConversationUnsubscribe();
    }

);
