<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Messages • JSP TAYSU</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  background:#08090c;
  color:#f5f5f7;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

body{
  overflow:hidden;
}

button,
input{
  font:inherit;
}

button{
  border:0;
  background:none;
  color:inherit;
  cursor:pointer;
}

.app{
  width:100%;
  height:100dvh;
  overflow:hidden;
  position:relative;
  background:#08090c;
}

/* =========================
   INBOX
========================= */

.inbox{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  background:#08090c;
}

.inbox-header{
  height:62px;
  min-height:62px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  border-bottom:1px solid #202228;
  background:#08090c;
}

.inbox-header h1{
  font-size:20px;
  font-weight:700;
  letter-spacing:-.2px;
}

.back-home{
  position:absolute;
  left:10px;
  width:40px;
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
}

.back-home:active,
.chat-back:active{
  background:#181a1f;
}

.back-home svg,
.chat-back svg{
  width:23px;
  height:23px;
  stroke:currentColor;
}

/* Search */

.search-wrap{
  padding:12px 15px 8px;
  background:#08090c;
}

.search-box{
  height:43px;
  width:100%;
  border-radius:12px;
  background:#17191e;
  border:1px solid #22252c;
  display:flex;
  align-items:center;
  padding:0 13px;
  gap:9px;
}

.search-box svg{
  width:18px;
  height:18px;
  color:#858991;
  flex:none;
}

.search-box input{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  color:#f5f5f7;
  font-size:15px;
}

.search-box input::placeholder{
  color:#858991;
}

/* Content */

.content{
  flex:1;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}

.section-title{
  padding:13px 16px 8px;
  font-size:13px;
  color:#8d9098;
  font-weight:650;
}

.conversation{
  width:100%;
  min-height:76px;
  display:flex;
  align-items:center;
  gap:13px;
  padding:10px 16px;
  transition:background .12s ease;
}

.conversation:active{
  background:#111318;
}

.avatar{
  width:54px;
  height:54px;
  min-width:54px;
  border-radius:50%;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#20232a;
  color:#a9adb6;
  font-size:20px;
  font-weight:700;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.conversation-info{
  min-width:0;
  flex:1;
}

.conversation-name{
  font-size:15px;
  color:#f4f4f6;
  font-weight:650;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.last-message{
  margin-top:4px;
  font-size:13px;
  color:#858991;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.unread .conversation-name{
  font-weight:750;
  color:#fff;
}

.unread .last-message{
  color:#d8dae0;
  font-weight:550;
}

.unread-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#2387ff;
  flex:none;
}

.empty{
  padding:70px 25px;
  text-align:center;
  color:#858991;
}

.empty-title{
  color:#f3f3f5;
  font-size:18px;
  font-weight:700;
  margin-bottom:7px;
}

.empty-text{
  font-size:14px;
  line-height:1.5;
  overflow-wrap:anywhere;
}

.search-results{
  display:none;
}

.search-results.active{
  display:block;
}

/* =========================
   CHAT
========================= */

.chat{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  background:#08090c;
  transform:translateX(100%);
  transition:transform .24s cubic-bezier(.2,.8,.2,1);
  z-index:20;
}

.chat.open{
  transform:translateX(0);
}

.chat-header{
  height:76px;
  min-height:76px;
  border-bottom:1px solid #202228;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  background:#08090c;
  z-index:3;
}

.chat-back{
  position:absolute;
  left:9px;
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
}

.chat-user{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  max-width:180px;
}

.chat-user .avatar{
  width:39px;
  height:39px;
  min-width:39px;
  font-size:15px;
}

.chat-user-name{
  margin-top:3px;
  max-width:170px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:#f5f5f7;
  font-size:12px;
  font-weight:650;
}

/* Messages */

.messages{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:18px 13px 13px;
  display:flex;
  flex-direction:column;
  gap:6px;
  background:#08090c;
  -webkit-overflow-scrolling:touch;
}

.start-chat{
  margin:auto;
  text-align:center;
  color:#858991;
}

.start-chat .avatar{
  width:82px;
  height:82px;
  min-width:82px;
  margin:0 auto 11px;
  font-size:29px;
}

.start-chat-name{
  color:#f4f4f6;
  font-size:18px;
  font-weight:700;
  margin-bottom:5px;
}

.start-chat-text{
  color:#858991;
  font-size:13px;
}

.message-row{
  width:100%;
  display:flex;
  align-items:flex-end;
  gap:2px;
  animation:messageIn .12s ease-out;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(3px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.message-row.mine{
  justify-content:flex-end;
}

.message-row.theirs{
  justify-content:flex-start;
}

.message-content{
  display:block;
  min-width:0;
  max-width:78%;
}

.message-bubble{
  display:block;
  width:max-content;
  max-width:100%;
  padding:10px 13px;
  border-radius:19px;
  font-size:15px;
  line-height:1.4;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  word-break:normal;
}

.mine .message-bubble{
  background:#1677e8;
  color:#fff;
  border-bottom-right-radius:6px;
}

.theirs .message-bubble{
  background:#202228;
  color:#f2f2f4;
  border:1px solid #292c33;
  border-bottom-left-radius:6px;
}

.message-image{
  width:auto;
  max-width:245px;
  max-height:320px;
  border-radius:17px;
  display:block;
  object-fit:cover;
  background:#17191e;
}

.mine .message-image{
  border-bottom-right-radius:6px;
}

.theirs .message-image{
  border-bottom-left-radius:6px;
}

.message-time{
  flex:none;
  font-size:9px;
  color:#6f727a;
  margin:0 4px 2px;
  white-space:nowrap;
}

/* Composer */

.composer{
  min-height:67px;
  padding:9px 11px calc(9px + env(safe-area-inset-bottom));
  border-top:1px solid #202228;
  display:flex;
  align-items:center;
  gap:8px;
  background:#08090c;
}

.photo-button{
  width:42px;
  height:42px;
  min-width:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  color:#3d94ff;
}

.photo-button:active{
  background:#121820;
}

.photo-button svg{
  width:23px;
  height:23px;
}

.message-input{
  flex:1;
  min-width:0;
  height:43px;
  border:1px solid #292c33;
  outline:0;
  border-radius:22px;
  background:#17191e;
  color:#f4f4f6;
  padding:0 15px;
  font-size:15px;
}

.message-input::placeholder{
  color:#858991;
}

.send-button{
  width:43px;
  height:43px;
  min-width:43px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#1677e8;
  color:#fff;
  transition:transform .1s ease,opacity .15s ease;
}

.send-button:active{
  transform:scale(.94);
}

.send-button:disabled{
  opacity:.35;
}

.send-button svg{
  width:20px;
  height:20px;
}

/* Upload */

.upload-status{
  position:absolute;
  left:0;
  right:0;
  bottom:67px;
  padding:8px 15px;
  background:#111318;
  border-top:1px solid #292c33;
  display:none;
  color:#b7bac2;
  font-size:12px;
  z-index:5;
}

.upload-status.active{
  display:block;
}

.progress-line{
  height:3px;
  margin-top:6px;
  background:#282b32;
  border-radius:4px;
  overflow:hidden;
}

.progress-bar{
  width:0;
  height:100%;
  background:#2387ff;
  transition:width .08s linear;
}

/* Toast */

.toast{
  position:fixed;
  left:50%;
  bottom:84px;
  transform:translateX(-50%) translateY(12px);
  background:#f2f2f4;
  color:#111216;
  padding:10px 16px;
  border-radius:10px;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.18s ease;
  z-index:100;
  max-width:90%;
  text-align:center;
  overflow-wrap:anywhere;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.loading{
  padding:35px;
  text-align:center;
  color:#777b84;
  font-size:14px;
}

@media(min-width:700px){
  .inbox,
  .chat{
    max-width:600px;
    margin:auto;
    border-left:1px solid #202228;
    border-right:1px solid #202228;
  }

  .app{
    background:#050608;
  }
}
</style>
</head>

<body>

<section class="inbox" id="inbox">

<script>

/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {
  apiKey:"AIzaSyDpv2vqAZbCFgT_XJ4u-KB0AeZWVB2GIUs",
  authDomain:"jsp-taysu.firebaseapp.com",
  projectId:"jsp-taysu",
  storageBucket:"jsp-taysu.firebasestorage.app",
  messagingSenderId:"280992025632",
  appId:"1:280992025632:web:48efa21208a78be9a78045"
};

if(!firebase.apps.length){
  firebase.initializeApp(firebaseConfig);
}

const auth = firebase.auth();
const db = firebase.firestore();


/* =========================================================
   IMAGEKIT
========================================================= */

const IMAGEKIT_PUBLIC_KEY =
  "public_3h6iOJBuIST7Aphxt+20NsXp4q4=";

const IMAGEKIT_AUTH_URL =
  "https://jsp-taysu.vercel.app/api/imagekit-auth";

const IMAGEKIT_UPLOAD_URL =
  "https://upload.imagekit.io/api/v1/files/upload";


/* =========================================================
   ELEMENTS
========================================================= */

const chat =
  document.getElementById("chat");

const homeBackBtn =
  document.getElementById("homeBackBtn");

const chatBackBtn =
  document.getElementById("chatBackBtn");

const userSearch =
  document.getElementById("userSearch");

const conversationList =
  document.getElementById("conversationList");

const conversationSection =
  document.getElementById("conversationSection");

const searchResults =
  document.getElementById("searchResults");

const memberResults =
  document.getElementById("memberResults");

const chatAvatar =
  document.getElementById("chatAvatar");

const chatUserName =
  document.getElementById("chatUserName");

const messages =
  document.getElementById("messages");

const messageForm =
  document.getElementById("messageForm");

const messageInput =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");

const photoButton =
  document.getElementById("photoButton");

const photoInput =
  document.getElementById("photoInput");

const uploadStatus =
  document.getElementById("uploadStatus");

const progressBar =
  document.getElementById("progressBar");

const toast =
  document.getElementById("toast");


/* =========================================================
   STATE
========================================================= */

let currentUser = null;
let activeChatUser = null;

let messagesUnsubscribe = null;
let conversationUnsubscribe = null;

let searchTimer = null;
let toastTimer = null;

let optimisticMessageIds = new Set();


/* =========================================================
   TOAST
========================================================= */

function showToast(text){

  clearTimeout(toastTimer);

  toast.textContent =
    String(text || "Something went wrong.");

  toast.classList.add("show");

  toastTimer =
    setTimeout(() => {
      toast.classList.remove("show");
    },3000);

}


/* =========================================================
   AUTH
========================================================= */

auth.onAuthStateChanged(async user => {

  if(!user){

    currentUser = null;

    showToast(
      "Please sign in again."
    );

    setTimeout(() => {
      window.location.href = "index.html";
    },800);

    return;
  }

  currentUser = user;

  console.log(
    "Authenticated:",
    currentUser.uid
  );

  await loadConversations();

  handleIncomingProfile();

});


/* =========================================================
   SAFE CURRENT USER
========================================================= */

function getCurrentUser(){

  return auth.currentUser || currentUser || null;

}


/* =========================================================
   URL PROFILE
========================================================= */

function handleIncomingProfile(){

  const user =
    getCurrentUser();

  if(!user){
    return;
  }

  const params =
    new URLSearchParams(
      window.location.search
    );

  const uid =
    params.get("uid");

  if(!uid || uid === user.uid){
    return;
  }

  openChatByUid(uid);

}


/* =========================================================
   AVATAR
========================================================= */

function avatarHTML(userData){

  const photo =
    userData?.photoURL ||
    userData?.photoUrl ||
    userData?.profilePhoto ||
    "";

  const name =
    userData?.displayName ||
    userData?.name ||
    userData?.username ||
    "M";

  const letter =
    escapeHTML(
      String(name)
        .trim()
        .charAt(0)
        .toUpperCase() || "M"
    );

  if(photo){

    return `
      <img
        src="${escapeAttribute(photo)}"
        alt=""
        loading="lazy"
      >
    `;

  }

  return letter;

}


/* =========================================================
   GET USER
========================================================= */

async function getUserData(uid){

  try{

    const snap =
      await db.collection("users")
        .doc(uid)
        .get();

    if(snap.exists){

      return {
        uid,
        ...snap.data()
      };

    }

  }catch(error){

    console.error(
      "GET USER ERROR:",
      error
    );

  }

  return {
    uid,
    displayName:"Member"
  };

}


/* =========================================================
   CONVERSATION ID
========================================================= */

function conversationId(uid1,uid2){

  return [uid1,uid2]
    .sort()
    .join("_");

}


/* =========================================================
   LOAD CONVERSATIONS
   No orderBy = no composite index required.
========================================================= */

async function loadConversations(){

  const user =
    getCurrentUser();

  if(!user){
    return;
  }

  if(conversationUnsubscribe){

    conversationUnsubscribe();
    conversationUnsubscribe = null;

  }

  conversationList.innerHTML =
    `<div class="loading">Loading messages...</div>`;

  try{

    conversationUnsubscribe =
      db.collection("conversations")
        .where(
          "participants",
          "array-contains",
          user.uid
        )
        .onSnapshot(
          async snapshot => {

            if(snapshot.empty){

              conversationList.innerHTML = `
                <div class="empty">

                  <div class="empty-title">
                    No messages yet
                  </div>

                  <div class="empty-text">
                    Search for a member and start a conversation.
                  </div>

                </div>
              `;

              return;

            }

            const conversations = [];

            for(const doc of snapshot.docs){

              const data =
                doc.data();

              const otherUid =
                (data.participants || [])
                  .find(
                    uid => uid !== user.uid
                  );

              if(!otherUid){
                continue;
              }

              conversations.push({
                doc,
                data,
                otherUid
              });

            }

            /* Client-side sorting */
            conversations.sort(
              (a,b) => {

                const aTime =
                  a.data.lastMessageAt?.toMillis
                    ? a.data.lastMessageAt.toMillis()
                    : 0;

                const bTime =
                  b.data.lastMessageAt?.toMillis
                    ? b.data.lastMessageAt.toMillis()
                    : 0;

                return bTime - aTime;

              }
            );

            const fragment =
              document.createDocumentFragment();

            for(const itemData of conversations){

              const data =
                itemData.data;

              const otherUid =
                itemData.otherUid;

              const userData =
                await getUserData(otherUid);

              const item =
                document.createElement("div");

              item.className =
                "conversation";

              const unread =
                data.lastSenderId === otherUid &&
                data.seenByCurrentUser !== true;

              if(unread){
                item.classList.add("unread");
              }

              let preview =
                data.lastMessage || "";

              if(data.lastMessageType === "image"){
                preview = "Photo";
              }

              const name =
                userData.displayName ||
                userData.name ||
                userData.username ||
                "Member";

              item.innerHTML = `

                <div class="avatar">
                  ${avatarHTML(userData)}
                </div>

                <div class="conversation-info">

                  <div class="conversation-name">
                    ${escapeHTML(name)}
                  </div>

                  <div class="last-message">
                    ${escapeHTML(
                      preview ||
                      "Start a conversation"
                    )}
                  </div>

                </div>

                ${
                  unread
                  ? `<div class="unread-dot"></div>`
                  : ""
                }

              `;

              item.addEventListener(
                "click",
                () => {

                  openChat({
                    uid:otherUid,
                    ...userData
                  });

                }
              );

              fragment.appendChild(item);

            }

            conversationList.innerHTML = "";

            conversationList.appendChild(
              fragment
            );

          },
          error => {

            console.error(
              "CONVERSATION LIST ERROR:",
              error
            );

            conversationList.innerHTML = `
              <div class="empty">

                <div class="empty-title">
                  Couldn't load messages
                </div>

                <div class="empty-text">
                  ${escapeHTML(
                    error.message ||
                    "Please try again."
                  )}
                </div>

              </div>
            `;

          }
        );

  }catch(error){

    console.error(
      "LOAD CONVERSATIONS ERROR:",
      error
    );

    conversationList.innerHTML = `
      <div class="empty">

        <div class="empty-title">
          Couldn't load messages
        </div>

        <div class="empty-text">
          ${escapeHTML(
            error.message ||
            "Please try again."
          )}
        </div>

      </div>
    `;

  }

}

/* =========================================================
   SEARCH MEMBERS
========================================================= */

async function searchMembers(query){

  const user =
    getCurrentUser();

  if(!user){

    showToast(
      "Please sign in again."
    );

    return;

  }

  memberResults.innerHTML =
    `<div class="loading">Searching...</div>`;

  try{

    const snapshot =
      await db.collection("users")
        .limit(100)
        .get();

    const q =
      query.toLowerCase();

    const users = [];

    snapshot.forEach(doc => {

      if(doc.id === user.uid){
        return;
      }

      const data =
        doc.data();

      const name =
        String(
          data.displayName ||
          data.name ||
          data.username ||
          ""
        );

      const username =
        String(
          data.username ||
          ""
        );

      if(
        name.toLowerCase().includes(q) ||
        username.toLowerCase().includes(q)
      ){

        users.push({
          uid:doc.id,
          ...data
        });

      }

    });

    renderMemberResults(users);

  }catch(error){

    console.error(
      "SEARCH MEMBERS ERROR:",
      error
    );

    memberResults.innerHTML = `
      <div class="empty">

        <div class="empty-text">
          ${escapeHTML(
            error.message ||
            "Couldn't search members."
          )}
        </div>

      </div>
    `;

  }

}


/* =========================================================
   SEARCH RESULTS
========================================================= */

function renderMemberResults(users){

  if(!users.length){

    memberResults.innerHTML = `
      <div class="empty">

        <div class="empty-title">
          No members found
        </div>

        <div class="empty-text">
          Try another name.
        </div>

      </div>
    `;

    return;

  }

  memberResults.innerHTML = "";

  users.forEach(userData => {

    const item =
      document.createElement("div");

    item.className =
      "conversation";

    const name =
      userData.displayName ||
      userData.name ||
      userData.username ||
      "Member";

    const username =
      userData.username
        ? "@" + userData.username
        : "Start a conversation";

    item.innerHTML = `

      <div class="avatar">
        ${avatarHTML(userData)}
      </div>

      <div class="conversation-info">

        <div class="conversation-name">
          ${escapeHTML(name)}
        </div>

        <div class="last-message">
          ${escapeHTML(username)}
        </div>

      </div>

    `;

    item.addEventListener(
      "click",
      () => openChat(userData)
    );

    memberResults.appendChild(item);

  });

}

/* =========================================================
   LOAD CHAT MESSAGES
========================================================= */

function loadMessages(){

  const user =
    getCurrentUser();

  if(
    !activeChatUser ||
    !user
  ){

    return;

  }

  if(messagesUnsubscribe){

    messagesUnsubscribe();
    messagesUnsubscribe = null;

  }

  messages.innerHTML =
    `<div class="loading">Loading conversation...</div>`;

  const cid =
    conversationId(
      user.uid,
      activeChatUser.uid
    );

  messagesUnsubscribe =
    db.collection("conversations")
      .doc(cid)
      .collection("messages")
      .orderBy(
        "createdAt",
        "asc"
      )
      .onSnapshot(
        snapshot => {

          if(snapshot.empty){

            messages.innerHTML = `

              <div class="start-chat">

                <div class="avatar">
                  ${avatarHTML(activeChatUser)}
                </div>

                <div class="start-chat-name">
                  ${escapeHTML(
                    activeChatUser.displayName ||
                    activeChatUser.name ||
                    activeChatUser.username ||
                    "Member"
                  )}
                </div>

                <div class="start-chat-text">
                  Start a conversation
                </div>

              </div>

            `;

            return;

          }

          messages.innerHTML = "";

          snapshot.forEach(doc => {

            /*
              Remove optimistic duplicate once
              the real Firestore document appears.
            */

            optimisticMessageIds.delete(
              doc.id
            );

            renderMessage(
              doc.data()
            );

          });

          scrollMessages();

        },
        error => {

          console.error(
            "LOAD CHAT ERROR:",
            error
          );

          messages.innerHTML = `
            <div class="empty">

              <div class="empty-title">
                Couldn't load messages
              </div>

              <div class="empty-text">
                ${escapeHTML(
                  error.message ||
                  "Please try again."
                )}
              </div>

            </div>
          `;

        }
      );

}


/* =========================================================
   RENDER MESSAGE
========================================================= */

function renderMessage(data){

  const user =
    getCurrentUser();

  if(!user){
    return;
  }

  const mine =
    data.senderId === user.uid;

  const row =
    document.createElement("div");

  row.className =
    "message-row " +
    (mine ? "mine" : "theirs");

  const content =
    document.createElement("div");

  content.className =
    "message-content";

  if(
    data.type === "image" &&
    data.imageUrl
  ){

    content.innerHTML = `
      <img
        class="message-image"
        src="${escapeAttribute(data.imageUrl)}"
        alt="Photo"
        loading="lazy"
      >
    `;

  }else{

    content.innerHTML = `
      <div class="message-bubble">
        ${escapeHTML(data.text || "")}
      </div>
    `;

  }

  row.appendChild(content);

  if(data.createdAt){

    const time =
      document.createElement("div");

    time.className =
      "message-time";

    time.textContent =
      formatTime(data.createdAt);

    row.appendChild(time);

  }

  messages.appendChild(row);

}


/* =========================================================
   OPTIMISTIC TEXT MESSAGE
========================================================= */

function renderOptimisticText(
  text,
  user
){

  const row =
    document.createElement("div");

  row.className =
    "message-row mine";

  row.dataset.optimistic = "true";

  const content =
    document.createElement("div");

  content.className =
    "message-content";

  content.innerHTML = `
    <div class="message-bubble">
      ${escapeHTML(text)}
    </div>

  const time =
    document.createElement("div");

  time.className =
    "message-time";

  time.textContent =
    "Sending";

  row.appendChild(time);

  messages.appendChild(row);

  scrollMessages();

  return row;

}

/* =========================================================
   SEND TEXT MESSAGE
========================================================= */

async function sendTextMessage(text){

  const user =
    getCurrentUser();

  if(!user){

    showToast(
      "Your login session expired. Please sign in again."
    );

    return;

  }

  if(!activeChatUser?.uid){

    showToast(
      "Chat user not found."
    );

    return;

  }

  if(activeChatUser.uid === user.uid){

    showToast(
      "You can't message yourself."
    );

    return;

  }

  /*
    Save the input before clearing it.
  */

  messageInput.value = "";

  updateSendButton();

  /*
    Show immediately.
  */

  const optimisticRow =
    renderOptimisticText(
      text,
      user
    );

  try{

    const cid =
      conversationId(
        user.uid,
        activeChatUser.uid
      );

    const conversationRef =
      db.collection("conversations")
        .doc(cid);

    const messageRef =
      conversationRef
        .collection("messages")
        .doc();

    const now =
      firebase.firestore.FieldValue
        .serverTimestamp();

    /*
      Parent conversation first.
    */

    await conversationRef.set({

      participants:[
        user.uid,
        activeChatUser.uid
      ],

      lastMessage:text,

      lastMessageType:"text",

      lastSenderId:user.uid,

      lastMessageAt:now,

      seenByCurrentUser:true

    },{
      merge:true
    });

    /*
      Then actual message.
    */

    await messageRef.set({

      senderId:user.uid,

      receiverId:activeChatUser.uid,

      text:text,

      type:"text",

      createdAt:now

    });

    /*
      Firestore listener will now render
      the real message. Remove optimistic row.
    */

    if(
      optimisticRow &&
      optimisticRow.parentNode
    ){

      optimisticRow.remove();

    }

  }catch(error){

    console.error(
      "SEND MESSAGE ERROR:",
      error
    );

    /*
      Remove optimistic message if failed.
    */

    if(
      optimisticRow &&
      optimisticRow.parentNode
    ){

      optimisticRow.remove();

    }

    const errorText =
      error?.code
        ? error.code +
          ": " +
          (error.message || "")
        : (
            error?.message ||
            "Couldn't send message."
          );

    showToast(errorText);

    updateSendButton();

  }

}

/* =========================================================
   IMAGEKIT AUTH
========================================================= */

async function getImageKitAuth(){

  const response =
    await fetch(
      IMAGEKIT_AUTH_URL,
      {
        method:"GET"
      }
    );

  if(!response.ok){

    throw new Error(
      "Image upload authentication failed."
    );

  }

  return response.json();

}


/* =========================================================
   IMAGEKIT UPLOAD
========================================================= */

function uploadToImageKit(
  file,
  onProgress
){

  return new Promise(
    async (resolve,reject) => {

      try{

        const user =
          getCurrentUser();

        if(!user){

          reject(
            new Error(
              "Please sign in again."
            )
          );

          return;

        }

        const authData =
          await getImageKitAuth();

        const safeName =
          file.name.replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );

        const formData =
          new FormData();

        formData.append(
          "file",
          file
        );

        formData.append(
          "fileName",
          Date.now() +
          "_" +
          safeName
        );

        formData.append(
          "publicKey",
          IMAGEKIT_PUBLIC_KEY
        );

        formData.append(
          "signature",
          authData.signature
        );

        formData.append(
          "expire",
          String(authData.expire)
        );

        formData.append(
          "token",
          authData.token
        );

        formData.append(
          "useUniqueFileName",
          "true"
        );

        formData.append(
          "folder",
          "messages/" +
          user.uid
        );

        const xhr =
          new XMLHttpRequest();

        xhr.open(
          "POST",
          IMAGEKIT_UPLOAD_URL
        );

        xhr.upload.onprogress =
          event => {

            if(event.lengthComputable){

              const percent =
                Math.round(
                  event.loaded /
                  event.total *
                  100
                );

              onProgress(percent);

            }

          };

        xhr.onload = () => {

          if(
            xhr.status >= 200 &&
            xhr.status < 300
          ){

            try{

              const result =
                JSON.parse(
                  xhr.responseText
                );

              if(result.url){

                resolve(result.url);

              }else{

                reject(
                  new Error(
                    "Image URL missing."
                  )
                );

              }

            }catch(error){

              reject(error);

            }

          }else{

            let message =
              "Image upload failed.";

            try{

              const result =
                JSON.parse(
                  xhr.responseText
                );

              message =
                result.message ||
                result.error ||
                message;

            }catch(error){}

            reject(
              new Error(message)
            );

          }

        };

        xhr.onerror = () => {

          reject(
            new Error(
              "Network error while uploading."
            )
          );

        };

        xhr.send(formData);

      }catch(error){

        reject(error);

      }

    }
  );

}


/* =========================================================
   SEND PHOTO MESSAGE
========================================================= */

async function sendPhotoMessage(file){

  const user =
    getCurrentUser();

  if(!user){

    showToast(
      "Your login session expired. Please sign in again."
    );

    return;

  }

  if(!activeChatUser?.uid){

    showToast(
      "Chat user not found."
    );

    return;

  }

  uploadStatus.classList.add(
    "active"
  );

  progressBar.style.width =
    "0%";

  try{

    const imageUrl =
      await uploadToImageKit(
        file,
        percent => {

          progressBar.style.width =
            percent + "%";

        }
      );

    const cid =
      conversationId(
        user.uid,
        activeChatUser.uid
      );

    const conversationRef =
      db.collection("conversations")
        .doc(cid);

    const messageRef =
      conversationRef
        .collection("messages")
        .doc();

    const now =
      firebase.firestore.FieldValue
        .serverTimestamp();

    await conversationRef.set({

      participants:[
        user.uid,
        activeChatUser.uid
      ],

      lastMessage:"Photo",

      lastMessageType:"image",

      lastSenderId:user.uid,

      lastMessageAt:now,

      seenByCurrentUser:true

    },{
      merge:true
    });

    await messageRef.set({

      senderId:user.uid,

      receiverId:activeChatUser.uid,

      type:"image",

      imageUrl:imageUrl,

      createdAt:now

    });

    showToast(
      "Photo sent."
    );

  }catch(error){

    console.error(
      "SEND PHOTO ERROR:",
      error
    );

    const errorText =
      error?.code
        ? error.code +
          ": " +
          (error.message || "")
        : (
            error?.message ||
            "Couldn't send photo."
          );

    showToast(errorText);

  }finally{

    setTimeout(
      () => {

        uploadStatus.classList.remove(
          "active"
        );

        progressBar.style.width =
          "0%";

      },
      250
    );

  }

}

/* =========================================================
   TIME
   12-hour format
========================================================= */

function formatTime(timestamp){

  try{

    const date =
      timestamp?.toDate
        ? timestamp.toDate()
        : new Date(timestamp);

    return date.toLocaleTimeString(
      [],
      {
        hour:"numeric",
        minute:"2-digit",
        hour12:true
      }
    );

  }catch(error){

    return "";

  }

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

  return escapeHTML(value)
    .replace(/`/g,"&#096;");

}
