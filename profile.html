<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile • JSP TAYSU</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#0b0d12;
  color:#f5f5f5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  padding-bottom:78px;
}

/* =========================
   TOP BAR
========================= */

.topbar{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid #252832;
  position:sticky;
  top:0;
  background:#0b0d12;
  z-index:50;
}

.back{
  width:40px;
  font-size:32px;
  cursor:pointer;
  color:#fff;
}

.username-title{
  font-size:20px;
  font-weight:750;
  max-width:230px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.more{
  width:40px;
  text-align:right;
  font-size:25px;
  letter-spacing:2px;
  cursor:pointer;
}

/* =========================
   PROFILE
========================= */

.profile{
  padding:18px 18px 0;
}

.profile-top{
  display:flex;
  align-items:center;
  gap:22px;
}

.avatar{
  width:105px;
  height:105px;
  border-radius:50%;
  background:#006b57;
  border:3px solid #242832;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:48px;
  font-weight:500;
  overflow:hidden;
  flex-shrink:0;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.stats{
  flex:1;
  display:flex;
  justify-content:space-around;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:21px;
  font-weight:750;
}

.stat span{
  display:block;
  margin-top:5px;
  color:#969aa6;
  font-size:13px;
}

/* =========================
   PROFILE INFO
========================= */

.info{
  margin-top:22px;
}

.name{
  font-size:22px;
  font-weight:750;
}

.bio{
  margin-top:6px;
  color:#d1d3d8;
  font-size:15px;
  line-height:1.4;
  white-space:pre-wrap;
}

.org{
  margin-top:7px;
  color:#858995;
  font-size:13px;
}

/* =========================
   BUTTONS
========================= */

.buttons{
  display:flex;
  gap:9px;
  margin-top:17px;
}

.btn{
  flex:1;
  height:43px;
  border:0;
  border-radius:10px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}

.edit{
  background:#f1f1f3;
  color:#111318;
}

.share{
  background:#1b1e26;
  color:#fff;
  border:1px solid #2b303b;
}

/* =========================
   MY POSTS HEADER
========================= */

.post-header{
  height:55px;
  margin-top:22px;
  border-top:1px solid #252832;
  border-bottom:1px solid #252832;
  display:flex;
  align-items:center;
  justify-content:center;
}

.post-icon{
  font-size:24px;
  color:#fff;
}

/* =========================
   MY POSTS
========================= */

.posts{
  padding:0 0 25px;
}

.my-post{
  position:relative;
  padding:14px 18px 13px;
  border-bottom:1px solid #252832;
}

.my-post-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:7px;
}

.my-post-user{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}

.small-avatar{
  width:30px;
  height:30px;
  border-radius:50%;
  background:#006b57;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:700;
  flex-shrink:0;
}

.my-post-meta{
  min-width:0;
}

.my-post-name{
  font-size:13px;
  font-weight:750;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.my-post-time{
  color:#777c88;
  font-size:11px;
  margin-top:2px;
}

.post-menu-button{
  border:0;
  background:none;
  color:#9a9da6;
  font-size:21px;
  letter-spacing:2px;
  padding:5px 3px;
  cursor:pointer;
  line-height:1;
}

.post-menu-button:hover{
  color:#fff;
}

.my-post-text{
  color:#e5e6e9;
  font-size:15px;
  line-height:1.45;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

/* POST MENU */

.post-menu{
  display:none;
  position:absolute;
  top:48px;
  right:15px;
  width:115px;
  background:#1b1e26;
  border:1px solid #30343f;
  border-radius:11px;
  overflow:hidden;
  z-index:20;
  box-shadow:0 10px 30px rgba(0,0,0,.45);
}

.post-menu button{
  width:100%;
  border:0;
  background:none;
  color:#ff6574;
  text-align:left;
  padding:12px 14px;
  font-size:13px;
  cursor:pointer;
}

.post-menu button:hover{
  background:#272b34;
}

/* EMPTY */

.empty{
  min-height:260px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#888d98;
  text-align:center;
  padding:30px 20px;
}

.empty-icon{
  font-size:34px;
  margin-bottom:9px;
}

.empty h3{
  color:#d7d8dc;
  font-size:16px;
  margin-bottom:5px;
}

.empty p{
  font-size:13px;
}

/* =========================
   MENU
========================= */

.menu{
  display:none;
  position:fixed;
  top:68px;
  right:14px;
  width:150px;
  background:#1b1e26;
  border:1px solid #303541;
  border-radius:13px;
  overflow:hidden;
  z-index:100;
  box-shadow:0 12px 35px rgba(0,0,0,.5);
}

.menu button{
  width:100%;
  padding:14px;
  border:0;
  background:none;
  color:#fff;
  text-align:left;
  font-size:14px;
  cursor:pointer;
}

.menu button:hover{
  background:#272b34;
}

.signout{
  color:#ff5d6c !important;
}

/* =========================
   EDIT MODAL
========================= */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  z-index:200;
  align-items:flex-end;
}

.modal{
  width:100%;
  background:#171a21;
  border-radius:24px 24px 0 0;
  padding:23px 20px 34px;
  border-top:1px solid #30343e;
}

.modal-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.modal-title h2{
  font-size:21px;
}

.close{
  font-size:27px;
  color:#aaa;
  cursor:pointer;
}

.field{
  margin-bottom:16px;
}

.field label{
  display:block;
  color:#999da8;
  font-size:13px;
  margin-bottom:7px;
}

.field input,
.field textarea{
  width:100%;
  background:#0e1015;
  border:1px solid #30343e;
  color:#fff;
  border-radius:12px;
  padding:13px;
  font-size:15px;
  outline:none;
}

.field textarea{
  min-height:90px;
  resize:none;
}

.field input:focus,
.field textarea:focus{
  border-color:#777d8b;
}

.save{
  width:100%;
  height:48px;
  border:0;
  border-radius:12px;
  background:#f2f2f4;
  color:#111;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.status{
  text-align:center;
  margin-top:9px;
  font-size:13px;
  color:#aaa;
}

/* =========================
   LOADING
========================= */

.loading{
  position:fixed;
  inset:0;
  background:#0b0d12;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:500;
}

.loader{
  width:30px;
  height:30px;
  border:3px solid #333743;
  border-top-color:white;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:70px;
  background:rgba(11,13,18,.97);
  backdrop-filter:blur(12px);
  border-top:1px solid #252832;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:100;
}

.nav-item{
  flex:1;
  max-width:100px;
  border:0;
  background:none;
  color:#858995;
  text-align:center;
  font-size:11px;
  cursor:pointer;
}

.nav-item .icon{
  display:block;
  font-size:24px;
  margin-bottom:3px;
}

.nav-item.active{
  color:#fff;
}

.create-icon{
  font-size:30px !important;
}

/* =========================
   MOBILE
========================= */

@media(max-width:500px){

  .profile{
    padding:16px 15px 0;
  }

  .profile-top{
    gap:17px;
  }

  .avatar{
    width:92px;
    height:92px;
    font-size:42px;
  }

  .stats{
    justify-content:space-between;
  }

  .stat strong{
    font-size:19px;
  }

  .stat span{
    font-size:12px;
  }

  .name{
    font-size:20px;
  }

  .bio{
    font-size:14px;
  }

  .org{
    font-size:12px;
  }

  .my-post{
    padding-left:15px;
    padding-right:15px;
  }

}

@media(min-width:700px){

  body{
    max-width:650px;
    margin:auto;
  }

  .bottom-nav{
    max-width:650px;
    margin:auto;
  }

}

</style>
</head>

<body>

<!-- LOADING -->

<div class="loading" id="loading">
  <div class="loader"></div>
</div>


<!-- TOP BAR -->

<header class="topbar">

  <div class="back" onclick="goHome()">‹</div>

  <div class="username-title" id="topUsername">
    Profile
  </div>

  <div class="more" onclick="toggleMenu()">
    •••
  </div>

</header>


<!-- THREE DOT MENU -->

<div class="menu" id="menu">

  <button class="signout" onclick="signOut()">
    Sign out
  </button>

</div>


<!-- PROFILE -->

<main class="profile">

  <section class="profile-top">

    <div class="avatar" id="avatar">

    <div class="stats">

      <div class="stat">
        <strong id="postCount">0</strong>
        <span>posts</span>
      </div>

      <div class="stat">
        <strong id="followersCount">0</strong>

    <p>

    </p>

<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <button class="nav-item" onclick="goHome()">

    <span class="icon">⌂</span>

    Home

  </button>


  <button class="nav-item" onclick="goExplore()">

    <span class="icon">⌕</span>

    Explore

  </button>


  <button class="nav-item" onclick="goCreate()">

    <span class="icon create-icon">＋</span>

    Create

  </button>


  <button class="nav-item" onclick="goAlerts()">

    <span class="icon">♧</span>

    Alerts

  </button>


  <button class="nav-item active">

    <span class="icon">♙</span>

    Profile

  </button>

</nav>


<!-- EDIT PROFILE -->

<div class="overlay" id="editOverlay">

  <div class="modal">

    <div class="modal-title">

      <h2>Edit profile</h2>

      <div class="close" onclick="closeEdit()">
        ×

    </div>


    <div class="field">

      <label>
        Username

      <input
        type="text"
        id="editUsername"

        placeholder="Enter username"
      >

    </div>


    <div class="field">

      <label>
        Bio
      </label>

      <textarea
        id="editBio"
        maxlength="160"
        placeholder="Write something about yourself..."
      ></textarea>

    </div>


    <button class="save" onclick="saveProfile()">
      Save changes
    </button>


    <div class="status" id="saveStatus"></div>

  </div>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<script>

/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyDpv2vqAZbCFgT_XJ4u-KB0AeZWVB2GIUs",

  authDomain:
    "jsp-taysu.firebaseapp.com",

  projectId:
    "jsp-taysu",

  storageBucket:
    "jsp-taysu.firebasestorage.app",

  messagingSenderId:
    "280992025632",

  appId:
    "1:280992025632:web:48efa21208a78be9a78045"

};


/* =====================================================
   FIREBASE INIT
===================================================== */

firebase.initializeApp(firebaseConfig);

const auth =
  firebase.auth();

const db =
  firebase.firestore();


/* =====================================================
   ELEMENTS
===================================================== */

const loading =
  document.getElementById("loading");

const profileName =
  document.getElementById("profileName");

const profileBio =
  document.getElementById("profileBio");

const topUsername =
  document.getElementById("topUsername");

const avatar =
  document.getElementById("avatar");

const postCount =
  document.getElementById("postCount");

const postsContainer =
  document.getElementById("posts");

const editOverlay =
  document.getElementById("editOverlay");

const editUsername =
  document.getElementById("editUsername");

const editBio =
  document.getElementById("editBio");

const saveStatus =
  document.getElementById("saveStatus");

const menu =
  document.getElementById("menu");


let currentUser = null;


/* =====================================================
   AUTH STATE
===================================================== */

auth.onAuthStateChanged(async user => {

  if(!user){

    window.location.href =
      "index.html";

    return;

  }

  currentUser = user;

  try{

    await loadProfile(user);

    await loadMyPosts();

  }catch(error){

    console.error(error);

  }

  loading.style.display =
    "none";

});


/* =====================================================
   LOAD PROFILE
===================================================== */

async function loadProfile(user){

  try{

    const ref =
      db.collection("users").doc(user.uid);

    const snap =
      await ref.get();


    let username =
      user.displayName ||
      user.email?.split("@")[0] ||
      "Member";


    let bio =
      "Building and preserving our heritage.";


    if(snap.exists){

      const data =
        snap.data();


      if(data.username){

        username =
          data.username;

      }


      if(data.bio){

        bio =
          data.bio;

      }

    }else{

      await ref.set({

        username:
          username,

        bio:
          bio,

        email:
          user.email || "",

        createdAt:
          firebase.firestore.FieldValue.serverTimestamp()

      },{

        merge:true

      });

    }


    displayProfile(
      username,
      bio
    );


  }catch(error){

    console.error(
      "Profile error:",
      error
    );


    displayProfile(

      user.displayName ||
      "Member",

      "Building and preserving our heritage."

    );

  }

}


/* =====================================================
   DISPLAY PROFILE
===================================================== */

function displayProfile(
  username,
  bio
){

  profileName.textContent =
    username;

  topUsername.textContent =
    username;

  profileBio.textContent =
    bio;


  const firstLetter =
    username
      .trim()
      .charAt(0)
      .toUpperCase() ||
      "M";


  avatar.textContent =
    firstLetter;

}


/* =====================================================
   LOAD MY POSTS
===================================================== */

async function loadMyPosts(){

  if(!currentUser){

    return;

  }


  postsContainer.innerHTML = `

    <div class="empty">

      <div class="empty-icon">
        ◌
      </div>

      <h3>
        Loading posts...
      </h3>

      <p>
        Please wait a moment.
      </p>

    </div>

  `;


  try{

    const snapshot =
      await db
        .collection("posts")
        .where(
          "authorId",
          "==",
          currentUser.uid
        )
        .get();


    const posts = [];


    snapshot.forEach(
      postDoc => {

        posts.push({

          id:
            postDoc.id,

          ...postDoc.data()

        });

      }
    );


    /* NEWEST FIRST */

    posts.sort(
      (a,b) => {

        const aTime =
          a.createdAt?.seconds || 0;

        const bTime =
          b.createdAt?.seconds || 0;

        return bTime - aTime;

      }
    );


    postCount.textContent =
      posts.length;


    postsContainer.innerHTML =
      "";


    if(posts.length === 0){

      postsContainer.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            ✦
          </div>

          <h3>
            No posts yet
          </h3>

          <p>
            Your posts will appear here.
          </p>

        </div>

      `;

      return;

    }


    posts.forEach(
      post => {

        renderMyPost(post);

      }
    );


  }catch(error){

    console.error(
      "My posts error:",
      error
    );


    postsContainer.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          ⚠️
        </div>

        <h3>
          Couldn't load posts
        </h3>

        <p>
          Please refresh the page.
        </p>

      </div>

    `;

  }

}


/* =====================================================
   RENDER POST
===================================================== */

function renderMyPost(post){

  const username =
    post.authorName ||
    profileName.textContent ||
    "Member";


  const article =
    document.createElement("article");


  article.className =
    "my-post";


  article.innerHTML = `

    <div class="my-post-top">

      <div class="my-post-user">

        <div class="small-avatar">

          ${escapeHTML(
            username
              .charAt(0)
              .toUpperCase()
          )}

        </div>

        <div class="my-post-meta">

          <div class="my-post-name">

            ${escapeHTML(username)}

          </div>

          <div class="my-post-time">

            ${formatPostTime(post.createdAt)}

          </div>

        </div>

      </div>


      <button
        class="post-menu-button"
        type="button"
        aria-label="Post options">

        •••

      </button>

    </div>


    <div class="my-post-text">

      ${escapeHTML(post.text || "")}

    </div>


    <div class="post-menu">

      <button
        type="button"
        class="delete-post-button">

        Delete post

      </button>

    </div>

  `;


  postsContainer.appendChild(
    article
  );


  /* MENU */

  const menuButton =
    article.querySelector(
      ".post-menu-button"
    );


  const postMenu =
    article.querySelector(
      ".post-menu"
    );


  menuButton.addEventListener(
    "click",
    event => {

      event.stopPropagation();


      document
        .querySelectorAll(".post-menu")
        .forEach(otherMenu => {

          if(otherMenu !== postMenu){

            otherMenu.style.display =
              "none";

          }

        });


      postMenu.style.display =
        postMenu.style.display === "block"
          ? "none"
          : "block";

    }
  );


  /* DELETE */

  const deleteButton =
    article.querySelector(
      ".delete-post-button"
    );


  deleteButton.addEventListener(
    "click",
    async () => {

      if(!currentUser){

        return;

      }


      const confirmed =
        confirm(
          "Delete this post?"
        );


      if(!confirmed){

        return;

      }


      deleteButton.disabled =
        true;

      deleteButton.textContent =
        "Deleting...";


      try{

        await db
          .collection("posts")
          .doc(post.id)
          .delete();


        article.remove();


        const currentCount =
          Number(postCount.textContent) || 0;


        postCount.textContent =
          Math.max(
            0,
            currentCount - 1
          );


        if(
          postsContainer
            .querySelectorAll(".my-post")
            .length === 0
        ){

          postsContainer.innerHTML = `

            <div class="empty">

              <div class="empty-icon">
                ✦
              </div>

              <h3>
                No posts yet
              </h3>

              <p>
                Your posts will appear here.
              </p>

            </div>

          `;

        }


      }catch(error){

        console.error(
          "Delete post error:",
          error
        );


        alert(
          error.code +
          ": " +
          error.message
        );


        deleteButton.disabled =
          false;

        deleteButton.textContent =
          "Delete post";

      }

    }
  );

}


/* =====================================================
   POST TIME
===================================================== */

function formatPostTime(timestamp){

  if(!timestamp){

    return "Just now";

  }


  let date;


  if(
    timestamp.toDate
  ){

    date =
      timestamp.toDate();

  }else{

    date =
      new Date(timestamp);

  }


  const diff =
    Date.now() -
    date.getTime();


  const seconds =
    Math.floor(
      diff / 1000
    );


  if(seconds < 60){

    return "Just now";

  }


  const minutes =
    Math.floor(
      seconds / 60
    );


  if(minutes < 60){

    return minutes +
      "m";

  }


  const hours =
    Math.floor(
      minutes / 60
    );


  if(hours < 24){

    return hours +
      "h";

  }


  const days =
    Math.floor(
      hours / 24
    );


  if(days < 7){

    return days +
      "d";

  }


  return date.toLocaleDateString(
    undefined,
    {
      day:"numeric",
      month:"short"
    }
  );

}


/* =====================================================
   EDIT PROFILE
===================================================== */

function openEdit(){

  editUsername.value =
    profileName.textContent;

  editBio.value =
    profileBio.textContent;

  saveStatus.textContent =
    "";

  editOverlay.style.display =
    "flex";

}


function closeEdit(){

  editOverlay.style.display =
    "none";

}


/* =====================================================
   SAVE PROFILE
===================================================== */

async function saveProfile(){

  const user =
    auth.currentUser;


  if(!user){

    saveStatus.textContent =
      "Please sign in again.";

    return;

  }


  const username =
    editUsername.value.trim();


  const bio =
    editBio.value.trim();


  if(!username){

    saveStatus.textContent =
      "Username cannot be empty.";

    return;

  }


  saveStatus.textContent =
    "Saving...";


  try{

    await db
      .collection("users")
      .doc(user.uid)
      .set({

        username:
          username,

        bio:
          bio,

        updatedAt:
          firebase.firestore.FieldValue.serverTimestamp()

      },{

        merge:true

      });


    await user.updateProfile({

      displayName:
        username

    });


    displayProfile(
      username,
      bio
    );


    saveStatus.textContent =
      "Saved ✓";


    /* Update username in current posts visually */

    document
      .querySelectorAll(".my-post-name")
      .forEach(element => {

        element.textContent =
          username;

      });


    setTimeout(
      () => {

        closeEdit();

      },
      600
    );


  }catch(error){

    console.error(
      "Save profile error:",
      error
    );


    saveStatus.textContent =
      "Could not save. Check Firestore rules.";

  }

}

/* CLOSE TOP MENU */

document.addEventListener(
  "click",
  function(event){

    if(
      !event.target.closest(".more") &&
      !event.target.closest(".menu")
    ){

      menu.style.display =
        "none";

    }

    if(
      !event.target.closest(".post-menu-button") &&
      !event.target.closest(".post-menu")
    ){

      document
        .querySelectorAll(".post-menu")
        .forEach(postMenu => {

          postMenu.style.display =
            "none";

        });

    }

  }
);

/* =====================================================
   SHARE PROFILE
===================================================== */

async function shareProfile(){

  const shareData = {

    title:
      "JSP TAYSU",

    text:
      "Check out this profile on JSP TAYSU.",

    url:
      window.location.href

  };


  try{

    if(navigator.share){

      await navigator.share(
        shareData
      );

    }else{

      await navigator.clipboard.writeText(
        window.location.href
      );

      alert(
        "Profile link copied!"
      );

    }

  }catch(error){

    console.log(
      "Share cancelled."
    );

  }

}

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text){

  const div =
    document.createElement("div");

  div.textContent =
    text == null
      ? ""
      : String(text);

  return div.innerHTML;

}
