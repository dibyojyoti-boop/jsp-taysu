<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Profile • JSP TAYSU</title>

  <style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #f7f4ed;
  color: #211c17;
  padding: 18px;
}

/* TOP BAR */

.top-bar {
  max-width: 520px;
  margin: 0 auto 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.back-button {
  border: 1px solid #ded7ca;
  background: #fffdf9;
  color: #3a3028;
  padding: 9px 14px;
  border-radius: 12px;
  cursor: pointer;
  font-size: 14px;
}

.brand {
  font-weight: 800;
  letter-spacing: .7px;
  color: #4a392b;
}

/* PROFILE CARD */

.profile-card {
  max-width: 520px;
  margin: auto;
  padding: 32px 22px;
  border-radius: 24px;
  text-align: center;
  background: #fffdf9;
  border: 1px solid #e8e0d3;
  box-shadow: 0 8px 30px rgba(64, 48, 32, .07);
}

/* AVATAR */

.avatar {
  width: 96px;
  height: 96px;
  margin: 0 auto 15px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;

  background: #4a392b;
  color: #f7e9c8;

  font-size: 36px;
  font-weight: 800;

  border: 4px solid #eadfc9;
}

/* NAME */

.username {
  font-size: 25px;
  font-weight: 800;
  margin-bottom: 5px;
  color: #211c17;
}

.email {
  color: #81776b;
  font-size: 13px;
  margin-bottom: 22px;
}

/* STATS */

.stats {
  display: flex;
  justify-content: center;
  gap: 70px;

  padding: 18px 0;
  margin-bottom: 22px;

  border-top: 1px solid #eee6da;
  border-bottom: 1px solid #eee6da;
}

.stat {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.stat strong {
  font-size: 21px;
  color: #30251d;
}

.stat span {
  color: #8a8177;
  font-size: 12px;
}

/* EDIT BUTTON */

.edit-button {
  border: 1px solid #c9b99f;
  padding: 10px 19px;
  border-radius: 12px;

  background: #f5eee2;
  color: #493a2d;

  font-weight: 700;
  cursor: pointer;
}

.edit-button:hover {
  background: #eee4d4;
}

/* EDITOR */

.editor {
  display: none;
  margin-top: 18px;
}

.editor input {
  width: 100%;
  max-width: 300px;

  padding: 12px;

  border: 1px solid #dcd3c5;
  border-radius: 11px;

  background: #fff;
  color: #211c17;

  outline: none;
}

.editor input:focus {
  border-color: #ad8d5c;
}

.save-button {
  margin-top: 9px;

  border: none;
  padding: 10px 18px;
  border-radius: 11px;

  background: #4a392b;
  color: #fff;

  font-weight: 700;
  cursor: pointer;
}

/* POSTS */

.posts-section {
  max-width: 520px;
  margin: 24px auto 0;
}

.posts-section h3 {
  margin-bottom: 10px;
  font-size: 17px;
  color: #493a2d;
}

.empty-posts {
  padding: 22px;
  border-radius: 17px;
  text-align: center;

  background: #fffdf9;
  border: 1px solid #e8e0d3;

  color: #8a8177;
  font-size: 14px;
}

/* LOGOUT */

.logout {
  margin-top: 25px;

  padding: 10px 20px;

  border: 1px solid #ded5c8;
  border-radius: 12px;

  background: transparent;
  color: #766b60;

  cursor: pointer;
  font-size: 13px;
}

.logout:hover {
  background: #f1ebe2;
}

/* MOBILE */

@media (max-width: 500px) {

  body {
    padding: 12px;
  }

  .profile-card {
    padding: 28px 18px;
    border-radius: 22px;
  }

  .stats {
    gap: 55px;
  }

  .username {
    font-size: 23px;
  }
}
  </style>
</head>

<body>

  <div class="top-bar">
    <button class="back-button" id="backButton">
      ← Back
    </button>

    <div class="brand">
      🐉 JSP TAYSU
    </div>
  </div>

  <main class="profile-card">

    <div class="avatar" id="profileAvatar">
      M
    </div>

    <h1 class="username" id="profileUsername">
      Member
    </h1>

    <p class="email" id="profileEmail">
      Loading profile...
    </p>

    <div class="stats">

      <div class="stat">
        <strong id="followersCount">0</strong>
        <span>Followers</span>
      </div>

      <div class="stat">
        <strong id="followingCount">0</strong>
        <span>Following</span>
      </div>

    </div>

    <button class="edit-button" id="editProfileButton">
      ✏️ Edit Profile
    </button>

    <div class="editor" id="profileEditor">

      <input
        type="text"
        id="usernameInput"
        placeholder="Choose username"
        maxlength="20"
      >

      <br>

      <button
        class="save-button"
        id="saveUsernameButton">
        Save Username
      </button>

    </div>

  </main>

  <section class="posts-section">

    <h3>My Posts</h3>

    <div class="empty-posts" id="myPosts">
      No posts yet.
    </div>

  </section>

  <div style="text-align:center;">
    <button class="logout" id="logoutButton">
      Sign out
    </button>
  </div>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
  getAuth,
  onAuthStateChanged,
  signOut,
  setPersistence,
  browserLocalPersistence,
  
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      collection,
      getDocs,
      serverTimestamp
    }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyDpv2vqAZbCFgT_XJ4u-KB0AeZWVB2GIUs",
      authDomain: "jsp-taysu.firebaseapp.com",
      projectId: "jsp-taysu",
      storageBucket: "jsp-taysu.firebasestorage.app",
      messagingSenderId: "280992025632",
      appId: "1:280992025632:web:48efa21208a78be9a78045"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

await setPersistence(auth, browserLocalPersistence);
const db = getFirestore(app);
let currentUser = null;

await auth.authStateReady();
    
onAuthStateChanged(auth, async (user) => {

  console.log("PROFILE USER:", user);

  if (!user) {
  document.getElementById("profileUsername").textContent =
    "Please sign in"

  

  return;
}
  currentUser = user;

  document.getElementById("profileEmail").textContent =
    user.email || "";

  try {

    const profileRef = doc(db, "users", user.uid);
    const profileSnap = await getDoc(profileRef);

    let username = user.displayName || "Member";

    if (profileSnap.exists()) {
      const data = profileSnap.data();

      if (data.username) {
        username = data.username;
      }
    }

    document.getElementById("profileUsername").textContent =
      username;

    document.getElementById("usernameInput").value =
      username;

    document.getElementById("profileAvatar").textContent =
      username.charAt(0).toUpperCase();

    await loadFollowCounts();

  } catch (error) {

    console.error("Profile loading error:", error);

  }

});

    async function loadFollowCounts() {

      if (!currentUser) return;

      const snapshot =
        await getDocs(
          collection(db, "follows")
        );

      let followers = 0;
      let following = 0;

      snapshot.forEach((followDoc) => {

        const data =
          followDoc.data();

        if (
          data.followingId ===
          currentUser.uid
        ) {
          followers++;
        }

        if (
          data.followerId ===
          currentUser.uid
        ) {
          following++;
        }

      });

      document.getElementById(
        "followersCount"
      ).textContent = followers;

      document.getElementById(
        "followingCount"
      ).textContent = following;

    }


    document.getElementById(
      "editProfileButton"
    ).addEventListener("click", () => {

      const editor =
        document.getElementById(
          "profileEditor"
        );

      editor.style.display =
        editor.style.display === "block"
          ? "none"
          : "block";

    });


    document.getElementById(
      "saveUsernameButton"
    ).addEventListener("click", async () => {

      const username =
        document.getElementById(
          "usernameInput"
        ).value.trim();

      if (username.length < 3) {
        alert("Username must be at least 3 characters.");
        return;
      }

      try {

        await setDoc(
          doc(
            db,
            "users",
            currentUser.uid
          ),
          {
            username: username,
            updatedAt: serverTimestamp()
          },
          {
            merge: true
          }
        );

        document.getElementById(
          "profileUsername"
        ).textContent = username;

        document.getElementById(
          "profileAvatar"
        ).textContent =
          username.charAt(0).toUpperCase();

        document.getElementById(
          "profileEditor"
        ).style.display = "none";

        alert("Username updated! 🐉");

      } catch (error) {

        console.error(error);

        alert(
          error.code + ": " +
          error.message
        );

      }

    });


    document.getElementById(
      "logoutButton"
    ).addEventListener("click", async () => {

      await signOut(auth);

      window.location.href =
        "index.html";

    });


    document.getElementById(
      "backButton"
    ).addEventListener("click", () => {

      window.location.href =
        "community.html";

    });

  </script>

</body>
</html>
