<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile | JSP TAYSU</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#0b0d12;
  --card:#151820;
  --card2:#1c2029;
  --border:#282d37;
  --text:#f5f5f7;
  --muted:#9b9faa;
  --brown:#4a392b;
  --brown-light:#70553f;
  --accent:#d7b47a;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  padding-bottom:78px;
}

/* =================================
   TOP BAR
================================= */

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  height:62px;
  background:rgba(11,13,18,.94);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
}

.topbar-inner{
  max-width:720px;
  height:100%;
  margin:auto;
  padding:0 17px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.back-button,
.menu-button{
  width:40px;
  height:40px;
  border:0;
  background:none;
  color:white;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
}

.back-button:hover,
.menu-button:hover{
  background:#1c2028;
}

.profile-title{
  font-size:18px;
  font-weight:800;
  letter-spacing:.2px;
}

.top-actions{
  display:flex;
  gap:3px;
}

/* =================================
   MAIN
================================= */

.container{
  max-width:720px;
  margin:auto;
}

/* =================================
   PROFILE HEADER
================================= */

.profile-header{
  padding:22px 17px 18px;
}

/* username */

.username-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
}

.username{
  font-size:21px;
  font-weight:800;
  letter-spacing:.2px;
}

.verified{
  display:inline-flex;
  width:17px;
  height:17px;
  margin-left:5px;
  border-radius:50%;
  background:#4d82ff;
  align-items:center;
  justify-content:center;
  font-size:11px;
}

/* =================================
   AVATAR + STATS
================================= */

.profile-main{
  display:flex;
  align-items:center;
  gap:25px;
}

.profile-avatar{
  width:88px;
  height:88px;
  min-width:88px;
  border-radius:50%;
  background:linear-gradient(
    145deg,
    #5c4635,
    #34271e
  );
  border:3px solid #292e38;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  font-weight:800;
  color:#f0dfbd;
  overflow:hidden;
}

.profile-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.stats{
  flex:1;
  display:flex;
  justify-content:space-around;
  text-align:center;
}

.stat{
  cursor:default;
}

.stat-number{
  display:block;
  font-size:18px;
  font-weight:800;
  margin-bottom:5px;
}

.stat-label{
  display:block;
  color:var(--muted);
  font-size:12px;
}

/* =================================
   BIO
================================= */

.bio{
  margin-top:18px;
}

.display-name{
  font-size:15px;
  font-weight:800;
  margin-bottom:7px;
}

.bio-text{
  color:#d5d6db;
  font-size:14px;
  line-height:1.5;
  white-space:pre-wrap;
}

.community-label{
  color:#a8abb4;
  font-size:13px;
  margin-top:7px;
}

/* =================================
   PROFILE BUTTONS
================================= */

.profile-buttons{
  display:flex;
  gap:8px;
  margin-top:17px;
}

.profile-btn{
  flex:1;
  border:1px solid var(--border);
  background:var(--card2);
  color:white;
  height:38px;
  border-radius:9px;
  font-size:13px;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}

.profile-btn:hover{
  background:#252a34;
}

.profile-btn.primary{
  background:#f0f0f2;
  color:#111319;
  border-color:#f0f0f2;
}

.profile-btn.primary:hover{
  background:#dcdde1;
}

/* =================================
   HIGHLIGHTS
================================= */

.highlights{
  display:flex;
  gap:18px;
  overflow-x:auto;
  padding:4px 17px 19px;
  scrollbar-width:none;
}

.highlights::-webkit-scrollbar{
  display:none;
}

.highlight{
  min-width:65px;
  text-align:center;
  cursor:pointer;
}

.highlight-circle{
  width:62px;
  height:62px;
  border-radius:50%;
  border:2px solid #303540;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#171a21;
  margin:auto auto 7px;
  font-size:22px;
}

.highlight-circle.add{
  border:1px solid #555b67;
  font-size:29px;
  color:#d8dae0;
}

.highlight span{
  font-size:10px;
  color:#c5c7ce;
  white-space:nowrap;
}

/* =================================
   TABS
================================= */

.tabs{
  height:51px;
  display:flex;
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
}

.tab{
  flex:1;
  border:0;
  background:none;
  color:#777d89;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.tab.active{
  color:white;
}

.tab.active::after{
  content:"";
  position:absolute;
  bottom:-1px;
  left:20%;
  right:20%;
  height:2px;
  background:white;
}

/* =================================
   POST GRID
================================= */

.posts-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:2px;
}

.grid-post{
  position:relative;
  aspect-ratio:1/1;
  background:#171a20;
  overflow:hidden;
  cursor:pointer;
}

.grid-post img,
.grid-post video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.grid-text{
  width:100%;
  height:100%;
  padding:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:#171a20;
  color:#eeeeef;
  font-size:12px;
  line-height:1.4;
  overflow:hidden;
}

.grid-post:hover .post-overlay{
  opacity:1;
}

.post-overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.56);
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  transition:.2s;
}

.overlay-info{
  display:flex;
  gap:14px;
  font-size:12px;
  font-weight:bold;
}

/* =================================
   EMPTY
================================= */

.empty-profile{
  text-align:center;
  padding:70px 20px;
  color:var(--muted);
}

.empty-icon{
  width:65px;
  height:65px;
  border:2px solid #515763;
  border-radius:50%;
  margin:0 auto 16px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.empty-profile h3{
  color:#f1f1f3;
  font-size:18px;
  margin-bottom:7px;
}

.empty-profile p{
  font-size:13px;
}

/* =================================
   LOADING
================================= */

.loading{
  padding:70px 20px;
  text-align:center;
  color:var(--muted);
}

/* =================================
   DELETE MODAL
================================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  z-index:500;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:350px;
  background:#1a1d24;
  border:1px solid #30343e;
  border-radius:17px;
  padding:21px;
  text-align:center;
}

.modal-box h3{
  margin-bottom:8px;
  font-size:18px;
}

.modal-box p{
  color:#a4a8b1;
  font-size:13px;
  line-height:1.5;
  margin-bottom:18px;
}

.modal-buttons{
  display:flex;
  gap:8px;
}

.modal-btn{
  flex:1;
  height:40px;
  border-radius:9px;
  border:1px solid #333843;
  background:#242831;
  color:white;
  font-weight:700;
  cursor:pointer;
}

.modal-btn.delete{
  background:#8d3e3e;
  border-color:#8d3e3e;
}

.modal-btn.delete:hover{
  background:#a54848;
}

/* =================================
   POST VIEW
================================= */

.post-view{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.88);
  z-index:400;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.post-view.show{
  display:flex;
}

.post-view-box{
  width:100%;
  max-width:600px;
  max-height:90vh;
  overflow:auto;
  background:#151820;
  border:1px solid #30343e;
  border-radius:17px;
  padding:18px;
}

.close-view{
  float:right;
  border:0;
  background:none;
  color:white;
  font-size:25px;
  cursor:pointer;
}

.view-author{
  font-size:15px;
  font-weight:800;
  margin-bottom:17px;
}

.view-text{
  font-size:17px;
  line-height:1.6;
  white-space:pre-wrap;
  margin-bottom:20px;
}

.view-media{
  width:100%;
  max-height:500px;
  object-fit:contain;
  border-radius:10px;
  background:#090a0e;
}

/* =================================
   BOTTOM NAV
================================= */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:68px;
  z-index:200;

  background:rgba(11,13,18,.96);
  backdrop-filter:blur(15px);

  border-top:1px solid var(--border);

  display:flex;
  justify-content:center;
  padding:7px 8px;
}

.nav-item{
  flex:1;
  max-width:120px;
  border:0;
  background:none;
  color:#777d88;
  cursor:pointer;
  border-radius:12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
}

.nav-item svg{
  width:23px;
  height:23px;
  stroke:currentColor;
}

.nav-item span{
  font-size:10px;
}

.nav-item:hover{
  background:#171a21;
  color:#dddfe4;
}

.nav-item.active{
  color:white;
}

/* =================================
   MOBILE
================================= */

@media(max-width:500px){

  .profile-header{
    padding:19px 14px 16px;

  }

  .highlights{
    padding-left:14px;
    padding-right:14px;
  }

  .grid-text{
    font-size:11px;
    padding:9px;
  }

}

</style>

<script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  getDocs,
  query,
  where,
  doc,
  getDoc,
  deleteDoc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =================================
   FIREBASE CONFIG
================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyDpv2vqAZbCFgT_XJ4u-KB0AeZWVB2GIUs",

  authDomain:
    "jsp-taysu.firebaseapp.com",

  projectId:
    "jsp-taysu",

  storageBucket:
    "jsp-taysu.firebasestorage.app",

  messagingSenderId:
    "280992025632",

  appId:
    "1:280992025632:web:48efa21208a78be9a78045"

};


const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);


const db =
  getFirestore(app);


let currentUser = null;

let currentPosts = [];

let deletePostId = null;


/* =================================
   ELEMENTS
================================= */

const usernameElement =
  document.getElementById("username");

const topUsername =
  document.getElementById("topUsername");

const displayName =
  document.getElementById("displayName");

const profileAvatar =
  document.getElementById("profileAvatar");

const bioText =
  document.getElementById("bioText");

const postCount =
  document.getElementById("postCount");

const postsGrid =
  document.getElementById("postsGrid");


/* =================================
   AUTH
================================= */

onAuthStateChanged(
  auth,
  async (user) => {

    if(!user){

      window.location.href =
        "community.html";

      return;

    }


    currentUser = user;

    await loadProfile();

    await loadUserPosts();

  }
);


/* =================================
   LOAD PROFILE
================================= */

async function loadProfile(){

  let username =
    currentUser.displayName ||
    "Member";


  let bio =
    "Building and preserving our heritage.";


  let photo =
    currentUser.photoURL || "";


  try{

    const profileRef =
      doc(
        db,
        "users",
        currentUser.uid
      );


    const profileSnap =
      await getDoc(profileRef);


    if(profileSnap.exists()){

      const data =
        profileSnap.data();


      if(data.username){

        username =
          data.username;

      }


      if(data.bio){

        bio =
          data.bio;

      }


      if(data.photoURL){

        photo =
          data.photoURL;

      }

    }

  }catch(error){

    console.error(
      "Profile error:",
      error
    );

  }


  usernameElement.textContent =
    username;


  topUsername.textContent =
    username;


  displayName.textContent =
    username;


  bioText.textContent =
    bio;


  if(photo){

    profileAvatar.innerHTML = `

      <img
        src="${escapeAttribute(photo)}"
        alt="Profile">

    `;

  }else{

    profileAvatar.textContent =
      username
        .charAt(0)
        .toUpperCase();

  }

}


/* =================================
   LOAD POSTS
================================= */

async function loadUserPosts(){

  postsGrid.innerHTML = `

    <div class="loading">
      Loading your posts...
    </div>

  `;


  try{

    const postsQuery =
      query(
        collection(db,"posts"),
        where(
          "authorId",
          "==",
          currentUser.uid
        )
      );


    const snapshot =
      await getDocs(postsQuery);


    currentPosts = [];


    snapshot.forEach(
      (postDoc) => {

        currentPosts.push({

          id:
            postDoc.id,

          ...postDoc.data()

        });

      }
    );


    /* newest first */

    currentPosts.sort(
      (a,b) => {

        const aTime =
          a.createdAt?.seconds || 0;

        const bTime =
          b.createdAt?.seconds || 0;

        return bTime - aTime;

      }
    );


    postCount.textContent =
      currentPosts.length;


    renderPosts();


  }catch(error){

    console.error(
      "Posts error:",
      error
    );


    postsGrid.innerHTML = `

      <div class="empty-profile">

        <div class="empty-icon">

          <svg
            width="30"
            height="30"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2">

            <path d="M12 9v4"/>
            <path d="M12 17h.01"/>
            <circle
              cx="12"
              cy="12"
              r="9"/>

          </svg>

        </div>

        <h3>
          Couldn't load posts
        </h3>

        <p>
          Please refresh the page.
        </p>

      </div>

    `;

  }

}


/* =================================
   RENDER POSTS
================================= */

function renderPosts(){

  postsGrid.innerHTML = "";


  if(currentPosts.length === 0){

    postsGrid.innerHTML = `

      <div class="empty-profile">

        <div class="empty-icon">

          <svg
            width="30"
            height="30"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2">

            <rect
              x="3"
              y="3"
              width="18"
              height="18"
              rx="3"/>

            <path d="M12 8v8"/>
            <path d="M8 12h8"/>

          </svg>

        </div>

        <h3>
          No posts yet
        </h3>

        <p>
          Share your first post with the community.
        </p>

      </div>

    `;

    return;

  }


  currentPosts.forEach(
    (post) => {

      const item =
        document.createElement("div");


      item.className =
        "grid-post";


      /* PHOTO */

      if(post.mediaType === "image" && post.mediaUrl){

        item.innerHTML = `

          <img
            src="${escapeAttribute(post.mediaUrl)}"
            alt="Post">

          <div class="post-overlay">

            <div class="overlay-info">
              View post
            </div>

          </div>

        `;

      }

      /* VIDEO */

      else if(
        post.mediaType === "video" &&
        post.mediaUrl
      ){

        item.innerHTML = `

          <video
            src="${escapeAttribute(post.mediaUrl)}"
            muted
            preload="metadata">
          </video>

          <div class="post-overlay">

            <div class="overlay-info">
              View video
            </div>

          </div>

        `;

      }

      /* TEXT POST */

      else{

        const text =
          post.text || "";


        item.innerHTML = `

          <div class="grid-text">

            ${escapeHTML(text)}

          </div>


          <div class="post-overlay">

            <div class="overlay-info">

              <span>
                View
              </span>

              <span>
                Delete
              </span>

            </div>

          </div>

        `;

      }


      /* CLICK */

      item.addEventListener(
        "click",
        () => {

          openPost(post);

        }
      );


      postsGrid.appendChild(item);

    }
  );

}


/* =================================
   OPEN POST
================================= */

function openPost(post){

  document.getElementById(
    "viewAuthor"
  ).textContent =
    post.authorName ||
    currentUser.displayName ||
    "Member";


  document.getElementById(
    "viewText"
  ).textContent =
    post.text || "";


  const media =
    document.getElementById(
      "viewMedia"
    );


  media.innerHTML = "";


  if(
    post.mediaType === "image" &&
    post.mediaUrl
  ){

    const img =
      document.createElement("img");


    img.className =
      "view-media";


    img.src =
      post.mediaUrl;


    media.appendChild(img);

  }


  if(
    post.mediaType === "video" &&
    post.mediaUrl
  ){

    const video =
      document.createElement("video");


    video.className =
      "view-media";


    video.controls =
      true;


    video.src =
      post.mediaUrl;


    media.appendChild(video);

  }


  document.getElementById(
    "postView"
  ).classList.add("show");


  /* add delete button */

  const existing =
    document.getElementById(
      "viewDeleteButton"
    );


  if(existing){

    existing.remove();

  }


  const deleteButton =
    document.createElement("button");


  deleteButton.id =
    "viewDeleteButton";


  deleteButton.textContent =
    "Delete post";


  deleteButton.style.cssText = `

    width:100%;
    height:42px;
    margin-top:18px;
    border:0;
    border-radius:10px;
    background:#8d3e3e;
    color:white;
    font-weight:800;
    cursor:pointer;

  `;


  deleteButton.addEventListener(
    "click",
    () => {

      closePostView();

      showDeleteModal(
        post.id
      );

    }
  );


  document
    .querySelector(".post-view-box")
    .appendChild(deleteButton);

}


/* =================================
   DELETE
================================= */

function showDeleteModal(postId){

  deletePostId =
    postId;


  document.getElementById(
    "deleteModal"
  ).classList.add("show");

}


function closeDeleteModal(){

  deletePostId =
    null;


  document.getElementById(
    "deleteModal"
  ).classList.remove("show");

}


document.getElementById(
  "cancelDelete"
).addEventListener(
  "click",
  closeDeleteModal
);


document.getElementById(
  "confirmDelete"
).addEventListener(
  "click",
  async () => {

    if(!deletePostId){

      return;

    }


    const id =
      deletePostId;


    const button =
      document.getElementById(
        "confirmDelete"
      );


    button.textContent =
      "Deleting...";


    try{

      await deleteDoc(
        doc(
          db,
          "posts",
          id
        )
      );


      currentPosts =
        currentPosts.filter(
          post =>
            post.id !== id
        );


      postCount.textContent =
        currentPosts.length;


      renderPosts();

      closeDeleteModal();


      alert(
        "Post deleted."
      );


    }catch(error){

      console.error(
        "Delete post error:",
        error
      );


      alert(
        error.code +
        ": " +
        error.message
      );

    }


    button.textContent =
      "Delete";

  }
);

  document.getElementById(

}


document.getElementById(

    }catch(error){

      console.log(
        "Share cancelled."
      );

    }

  }
);

/* =================================
   ESCAPE HTML
================================= */

function escapeHTML(text){

  const div =
    document.createElement("div");

  div.textContent =
    text || "";

  return div.innerHTML;

}


function escapeAttribute(text){

  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}
