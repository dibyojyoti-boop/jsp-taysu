<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile • JSP TAYSU</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#0b0d12;
  color:#f5f5f5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  padding-bottom:75px;
}

.topbar{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid #252832;
  position:sticky;
  top:0;
  background:#0b0d12;
  z-index:20;
}

.back,
.more{
  cursor:pointer;
  user-select:none;
}

.back{
  font-size:31px;
}

.more{
  font-size:23px;
  letter-spacing:3px;
}

.username-title{
  font-size:20px;
  font-weight:700;
  max-width:220px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* PROFILE */

.profile{
  padding:20px;
}

.profile-top{
  display:flex;
  align-items:center;
  gap:24px;
}

.avatar{
  width:105px;
  height:105px;
  border-radius:50%;
  background:#006b57;
  border:4px solid #20242e;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:48px;
  flex-shrink:0;
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.stats{
  flex:1;
  display:flex;
  justify-content:space-around;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:20px;
}

.stat span{
  display:block;
  color:#9da1ac;
  font-size:13px;
  margin-top:5px;
}

.info{
  margin-top:23px;
}

.name{
  font-size:22px;
  font-weight:750;
}

.bio{
  margin-top:7px;
  color:#d5d6da;
  font-size:15px;
  line-height:1.45;
}

.org{
  margin-top:7px;
  color:#9699a4;
  font-size:13px;
}

.buttons{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.btn{
  flex:1;
  height:45px;
  border:0;
  border-radius:11px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}

.edit{
  background:#f1f1f3;
  color:#111318;
}

.share{
  background:#1d212a;
  color:#fff;
  border:1px solid #2b303b;
}

/* POSTS */

.post-header{
  height:55px;
  border-top:1px solid #272b34;
  border-bottom:1px solid #272b34;
  display:flex;
  justify-content:center;
  align-items:center;
}

.post-icon{
  font-size:24px;
}

.posts{
  padding:0 0 20px;
}

.empty{
  min-height:250px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#9699a4;
  font-size:14px;
  text-align:center;
  padding:30px;
}

/* POST CARD */

.user-post{
  border-bottom:1px solid #252832;
  padding:15px 17px;
}

.user-post-header{
  display:flex;
  align-items:center;
  gap:9px;
  margin-bottom:8px;
}

.mini-avatar{
  width:35px;
  height:35px;
  border-radius:50%;
  background:#006b57;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  flex-shrink:0;
}

.post-user{
  font-size:14px;
  font-weight:700;
}

.post-date{
  color:#858995;
  font-size:11px;
  margin-top:2px;
}

.user-post-text{
  font-size:15px;
  line-height:1.45;
  color:#e5e5e8;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  margin-left:44px;
}

.post-delete{
  margin-left:44px;
  margin-top:8px;
  border:0;
  background:none;
  color:#ff5d6c;
  font-size:12px;
  cursor:pointer;
}

/* MENU */

.menu{
  display:none;
  position:fixed;
  top:68px;
  right:14px;
  width:145px;
  background:#1b1e26;
  border:1px solid #303541;
  border-radius:13px;
  overflow:hidden;
  z-index:100;
  box-shadow:0 12px 35px rgba(0,0,0,.5);
}

.menu button{
  width:100%;
  padding:14px;
  border:0;
  background:none;
  color:#fff;
  text-align:left;
  font-size:14px;
  cursor:pointer;
}

.menu button:hover{
  background:#272b34;
}

.signout{
  color:#ff5d6c !important;
}

/* MODAL */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  z-index:200;
  align-items:flex-end;
}

.modal{
  width:100%;
  background:#171a21;
  border-radius:24px 24px 0 0;
  padding:24px 20px 35px;
  border-top:1px solid #30343e;
}

.modal-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.modal-title h2{
  font-size:21px;
}

.close{
  font-size:27px;
  color:#aaa;
  cursor:pointer;
}

.field{
  margin-bottom:16px;
}

.field label{
  display:block;
  color:#999da8;
  font-size:13px;
  margin-bottom:7px;
}

.field input,
.field textarea{
  width:100%;
  background:#0e1015;
  border:1px solid #30343e;
  color:white;
  border-radius:12px;
  padding:13px;
  font-size:15px;
  outline:none;
}

.field textarea{
  min-height:90px;
  resize:none;
}

.save{
  width:100%;
  height:48px;
  border:0;
  border-radius:12px;
  background:#f2f2f4;
  color:#111;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.status{
  text-align:center;
  margin-top:9px;
  font-size:13px;
  color:#aaa;
}

/* LOADING */

.loading{
  position:fixed;
  inset:0;
  background:#0b0d12;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:500;
}

.loader{
  width:30px;
  height:30px;
  border:3px solid #333743;
  border-top-color:white;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:70px;
  background:#0b0d12;
  border-top:1px solid #252832;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:30;
}

.nav-item{
  color:#858995;
  text-align:center;
  font-size:11px;
  cursor:pointer;
}

.nav-item .icon{
  font-size:25px;
  display:block;
  margin-bottom:3px;
}

.nav-item.active{
  color:white;
}

.create-icon{
  font-size:32px !important;
}

@media(min-width:700px){

  body{
    max-width:650px;
    margin:auto;
  }

  .bottom-nav{
    max-width:650px;
    margin:auto;
  }
}
</style>
</head>

<body>

<div class="loading" id="loading">
  <div class="loader"></div>
</div>

<header class="topbar">

  <div class="back" onclick="goHome()">‹</div>

  <div class="username-title" id="topUsername">
    Profile
  </div>

  <div class="more" onclick="toggleMenu()">
    •••
  </div>

</header>

<div class="menu" id="menu">

  <button class="signout" onclick="signOut()">
    Sign out
  </button>

</div>

<main class="profile">

  <section class="profile-top">

    <div class="avatar" id="avatar">
      M
    </div>

    <div class="stats">

      <div class="stat">
        <strong id="postCount">0</strong>
        <span>posts</span>
      </div>

      <div class="stat">
        <strong id="followersCount">0</strong>
        <span>followers</span>
      </div>

      <div class="stat">
        <strong id="followingCount">0</strong>
        <span>following</span>
      </div>

    </div>

  </section>

  <section class="info">

    <div class="name" id="profileName">
      Member
    </div>

    <div class="bio" id="profileBio">
      Building and preserving our heritage.
    </div>

    <div class="org">
      JSP TAYSU • Tai Ahom Youth & Students Union
    </div>

  </section>

  <div class="buttons">

    <button class="btn edit" onclick="openEdit()">
      Edit profile
    </button>

    <button class="btn share" onclick="shareProfile()">
      Share profile
    </button>

  </div>

</main>

<section class="post-header">

  <div class="post-icon">
    ▦
  </div>

</section>

<section class="posts" id="posts">

  <div class="empty">
    Loading posts...
  </div>

</section>

<nav class="bottom-nav">

  <div class="nav-item" onclick="goHome()">
    <span class="icon">⌂</span>
    Home
  </div>

  <div class="nav-item" onclick="goExplore()">
    <span class="icon">⌕</span>
    Explore
  </div>

  <div class="nav-item" onclick="goCreate()">
    <span class="icon create-icon">＋</span>
    Create
  </div>

  <div class="nav-item" onclick="goAlerts()">
    <span class="icon">♧</span>
    Alerts
  </div>

  <div class="nav-item active">
    <span class="icon">♙</span>
    Profile
  </div>

</nav>

<!-- EDIT PROFILE -->

<div class="overlay" id="editOverlay">

  <div class="modal">

    <div class="modal-title">

      <h2>Edit profile</h2>

      <div class="close" onclick="closeEdit()">×</div>

    </div>

    <div class="field">

      <label>Username</label>

      <input
        type="text"
        id="editUsername"
        maxlength="40"
        placeholder="Enter username"
      >

    </div>

    <div class="field">

      <label>Bio</label>

      <textarea
        id="editBio"
        maxlength="160"
        placeholder="Write something about yourself..."
      ></textarea>

    </div>

    <button class="save" onclick="saveProfile()">
      Save changes
    </button>

    <div class="status" id="saveStatus"></div>

  </div>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

/* =====================================================
   FIREBASE CONFIG
   SAME PROJECT AS COMMUNITY.HTML
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyDpv2vqAZbCFgT_XJ4u-KB0AeZWVB2GIUs",

  authDomain:
    "jsp-taysu.firebaseapp.com",

  projectId:
    "jsp-taysu",

  storageBucket:
    "jsp-taysu.firebasestorage.app",

  messagingSenderId:
    "280992025632",

  appId:
    "1:280992025632:web:48efa21208a78be9a78045"

};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();


/* =====================================================
   ELEMENTS
===================================================== */

const loading =
  document.getElementById("loading");

const profileName =
  document.getElementById("profileName");

const profileBio =
  document.getElementById("profileBio");

const topUsername =
  document.getElementById("topUsername");

const avatar =
  document.getElementById("avatar");

const postCount =
  document.getElementById("postCount");

const followersCount =
  document.getElementById("followersCount");

const followingCount =
  document.getElementById("followingCount");

const postsContainer =
  document.getElementById("posts");

const editOverlay =
  document.getElementById("editOverlay");

const editUsername =
  document.getElementById("editUsername");

const editBio =
  document.getElementById("editBio");

const saveStatus =
  document.getElementById("saveStatus");

const menu =
  document.getElementById("menu");


/* =====================================================
   AUTH
===================================================== */

auth.onAuthStateChanged(async user => {

  if(!user){

    /*
      IMPORTANT:
      Do NOT redirect to username/address setup page.
      Only go to main login page if completely logged out.
    */

    window.location.href = "index.html";

    return;
  }

  try{

    await loadProfile(user);

    await loadMyPosts(user);

    await loadFollowCounts(user);

  }catch(error){

    console.error(
      "Profile loading error:",
      error
    );

  }

  loading.style.display = "none";

});


/* =====================================================
   LOAD PROFILE
===================================================== */

async function loadProfile(user){

  let username =
    user.displayName ||
    user.email?.split("@")[0] ||
    "Member";

  let bio =
    "Building and preserving our heritage.";

  try{

    const ref =
      db.collection("users").doc(user.uid);

    const snap =
      await ref.get();

    if(snap.exists){

      const data =
        snap.data();

      /*
        Use existing username saved by
        your username/address page.
      */

      if(data.username){

        username =
          data.username;

      }

      if(data.bio){

        bio =
          data.bio;

      }

    }else{

      /*
        If document doesn't exist,
        create a basic profile.

        This does NOT redirect anywhere.
      */

      await ref.set({

        username:
          username,

        bio:
          bio,

        email:
          user.email || "",

        createdAt:
          firebase.firestore.FieldValue.serverTimestamp()

      },{merge:true});

    }

  }catch(error){

    console.error(
      "Profile Firestore error:",
      error
    );

  }

  displayProfile(
    username,
    bio
  );

}


/* =====================================================
   DISPLAY PROFILE
===================================================== */

function displayProfile(
  username,
  bio
){

  profileName.textContent =
    username;

  topUsername.textContent =
    username;

  profileBio.textContent =
    bio;

  const firstLetter =
    username
      .trim()
      .charAt(0)
      .toUpperCase() || "M";

  avatar.textContent =
    firstLetter;

}


/* =====================================================
   LOAD MY POSTS
===================================================== */

async function loadMyPosts(user){

  postsContainer.innerHTML =
    "";

  try{

    const snapshot =
      await db
        .collection("posts")
        .where(
          "authorId",
          "==",
          user.uid
        )
        .get();

    const posts = [];

    snapshot.forEach(doc => {

      posts.push({

        id:
          doc.id,

        ...doc.data()

      });

    });

    posts.sort((a,b) => {

      const aTime =
        a.createdAt?.seconds || 0;

      const bTime =
        b.createdAt?.seconds || 0;

      return bTime - aTime;

    });

    postCount.textContent =
      posts.length;

    if(posts.length === 0){

      postsContainer.innerHTML = `

        <div class="empty">
          No posts yet 🌙
        </div>

      `;

      return;
    }

    posts.forEach(post => {

      const username =
        post.authorName ||
        profileName.textContent ||
        "Member";

      const article =
        document.createElement("article");

      article.className =
        "user-post";

      let dateText =
        "Just now";

      if(post.createdAt){

        try{

          const date =
            new Date(
              post.createdAt.seconds * 1000
            );

          dateText =
            date.toLocaleDateString(
              "en-IN",
              {
                day:"numeric",
                month:"short",
                year:"numeric"
              }
            );

        }catch(error){}

      }

      article.innerHTML = `

        <div class="user-post-header">

          <div class="mini-avatar">
            ${escapeHTML(
              username
                .charAt(0)
                .toUpperCase()
            )}
          </div>

          <div>

            <div class="post-user">
              ${escapeHTML(username)}
            </div>

            <div class="post-date">
              ${dateText}
            </div>

          </div>

        </div>

        <div class="user-post-text">
          ${escapeHTML(post.text || "")}
        </div>

        <button
          class="post-delete"
          type="button">

          Delete post

        </button>

      `;

      postsContainer.appendChild(
        article
      );

      const deleteButton =
        article.querySelector(
          ".post-delete"
        );

      deleteButton.addEventListener(
        "click",
        async () => {

          const confirmDelete =
            confirm(
              "Delete this post?"
            );

          if(!confirmDelete){

            return;

          }

          try{

            deleteButton.disabled =
              true;

            deleteButton.textContent =
              "Deleting...";

            await db
              .collection("posts")
              .doc(post.id)
              .delete();

            article.remove();

            const current =
              Number(
                postCount.textContent
              ) || 0;

            postCount.textContent =
              Math.max(
                0,
                current - 1
              );

            if(
              postsContainer
                .querySelectorAll(
                  ".user-post"
                ).length === 0
            ){

              postsContainer.innerHTML = `

                <div class="empty">
                  No posts yet 🌙
                </div>

              `;

            }

          }catch(error){

            console.error(
              "Delete post error:",
              error
            );

            alert(
              "Could not delete post."
            );

            deleteButton.disabled =
              false;

            deleteButton.textContent =
              "Delete post";

          }

        }
      );

    });

  }catch(error){

    console.error(
      "Posts loading error:",
      error
    );

    /*
      If Firestore rules don't allow the query,
      show a clean message instead of redirecting.
    */

    postsContainer.innerHTML = `

      <div class="empty">
        Couldn't load posts.
      </div>

    `;

  }

}


/* =====================================================
   FOLLOW COUNTS
===================================================== */

async function loadFollowCounts(user){

  try{

    const followingSnap =
      await db
        .collection("follows")
        .where(
          "followerId",
          "==",
          user.uid
        )
        .get();

    const followersSnap =
      await db
        .collection("follows")
        .where(
          "followingId",
          "==",
          user.uid
        )
        .get();

    followingCount.textContent =
      followingSnap.size;

    followersCount.textContent =
      followersSnap.size;

  }catch(error){

    console.error(
      "Follow count error:",
      error
    );

    followersCount.textContent =
      "0";

    followingCount.textContent =
      "0";

  }

}


/* =====================================================
   EDIT PROFILE
===================================================== */

function openEdit(){

  editUsername.value =
    profileName.textContent;

  editBio.value =
    profileBio.textContent;

  saveStatus.textContent =
    "";

  editOverlay.style.display =
    "flex";

}


function closeEdit(){

  editOverlay.style.display =
    "none";

}


/* =====================================================
   SAVE PROFILE
===================================================== */

async function saveProfile(){

  const user =
    auth.currentUser;

  if(!user){

    saveStatus.textContent =
      "Please sign in again.";

    return;

  }

  const username =
    editUsername.value.trim();

  const bio =
    editBio.value.trim();

  if(!username){

    saveStatus.textContent =
      "Username cannot be empty.";

    return;

  }

  saveStatus.textContent =
    "Saving...";

  try{

    await db
      .collection("users")
      .doc(user.uid)
      .set({

        username:
          username,

        bio:
          bio,

        updatedAt:
          firebase.firestore.FieldValue.serverTimestamp()

      },{merge:true});


    await user.updateProfile({

      displayName:
        username

    });


    displayProfile(
      username,
      bio
    );


    saveStatus.textContent =
      "Saved ✓";


    setTimeout(() => {

      closeEdit();

    },700);


  }catch(error){

    console.error(
      "Save profile error:",
      error
    );

    saveStatus.textContent =
      "Could not save profile.";

  }

}


/* =====================================================
   MENU
===================================================== */

function toggleMenu(){

  if(menu.style.display === "block"){

    menu.style.display =
      "none";

  }else{

    menu.style.display =
      "block";

  }

}


document.addEventListener(
  "click",
  event => {

    if(
      !event.target.closest(".more") &&
      !event.target.closest(".menu")
    ){

      menu.style.display =
        "none";

    }

  }
);


/* =====================================================
   SIGN OUT
===================================================== */

async function signOut(){

  try{

    await auth.signOut();

    window.location.href =
      "index.html";

  }catch(error){

    console.error(error);

    alert(
      "Sign out failed. Please try again."
    );

  }

}


/* =====================================================
   SHARE PROFILE
===================================================== */

async function shareProfile(){

  const username =
    profileName.textContent;

  const shareData = {

    title:
      username + " • JSP TAYSU",

    text:
      "Check out " +
      username +
      "'s profile on JSP TAYSU.",

    url:
      window.location.href

  };

  try{

    if(navigator.share){

      await navigator.share(
        shareData
      );

    }else{

      await navigator.clipboard.writeText(
        window.location.href
      );

      alert(
        "Profile link copied! 🔗"
      );

    }

  }catch(error){

    console.log(
      "Share cancelled."
    );

  }

}


/* =====================================================
   NAVIGATION
===================================================== */

function goHome(){

  window.location.href =
    "community.html";

}

function goExplore(){

  window.location.href =
    "explore.html";

}

function goCreate(){

  window.location.href =
    "create.html";

}

function goAlerts(){

  window.location.href =
    "alerts.html";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text){

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}


/* =====================================================
   CLOSE EDIT MODAL
===================================================== */

editOverlay.addEventListener(
  "click",
  event => {

    if(
      event.target === editOverlay
    ){

      closeEdit();

    }

  }
);

</script>

</body>
</html>
