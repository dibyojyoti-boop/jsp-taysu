<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile • JSP TAYSU</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:#f7f4ed;
  color:#211c17;
  padding:18px 14px 35px;
}

/* TOP BAR */

.top-bar{
  max-width:560px;
  margin:0 auto 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.back-button{
  border:1px solid #ded7ca;
  background:#fffdf9;
  color:#3a3028;
  padding:9px 14px;
  border-radius:12px;
  cursor:pointer;
  font-size:14px;
  transition:.2s;
}

.back-button:hover{
  background:#f1ebe2;
}

.brand{
  font-weight:800;
  letter-spacing:.7px;
  color:#4a392b;
}

/* PROFILE CARD */

.profile-card{
  max-width:560px;
  margin:auto;
  padding:34px 24px 28px;
  border-radius:26px;
  text-align:center;
  background:#fffdf9;
  border:1px solid #e8e0d3;
  box-shadow:0 10px 32px rgba(64,48,32,.08);
}

/* AVATAR */

.avatar{
  width:96px;
  height:96px;
  margin:0 auto 15px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;

  background:#4a392b;
  color:#f7e9c8;

  font-size:36px;
  font-weight:800;

  border:4px solid #eadfc9;
  box-shadow:0 5px 15px rgba(74,57,43,.12);
}

/* NAME */

.username{
  font-size:26px;
  font-weight:800;
  margin-bottom:5px;
  color:#211c17;
  word-break:break-word;
}

.email{
  color:#81776b;
  font-size:13px;
  margin-bottom:24px;
  word-break:break-word;
}

/* STATS */

.stats{
  display:flex;
  justify-content:center;
  gap:12px;

  padding:0;
  margin:0 auto 23px;

  max-width:330px;
}

.stat{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;

  padding:13px 10px;

  background:#f8f2e8;
  border:1px solid #eee5d7;
  border-radius:15px;
}

.stat strong{
  font-size:21px;
  color:#30251d;
}

.stat span{
  color:#8a8177;
  font-size:12px;
}

/* EDIT BUTTON */

.edit-button{
  border:1px solid #c9b99f;
  padding:10px 19px;
  border-radius:12px;

  background:#f5eee2;
  color:#493a2d;

  font-weight:700;
  cursor:pointer;
  transition:.2s;
}

.edit-button:hover{
  background:#eee4d4;
}

/* EDITOR */

.editor{
  display:none;
  margin-top:18px;
  padding-top:17px;
  border-top:1px solid #eee6da;
}

.editor input{
  width:100%;
  max-width:300px;

  padding:12px;

  border:1px solid #dcd3c5;
  border-radius:11px;

  background:#fff;
  color:#211c17;

  outline:none;
  font-size:14px;
}

.editor input:focus{
  border-color:#ad8d5c;
}

.save-button{
  margin-top:9px;

  border:none;
  padding:10px 18px;
  border-radius:11px;

  background:#4a392b;
  color:#fff;

  font-weight:700;
  cursor:pointer;
}

.save-button:hover{
  background:#382b20;
}

/* POSTS */

.posts-section{
  max-width:560px;
  margin:26px auto 0;
}

.posts-section h3{
  margin-bottom:11px;
  font-size:18px;
  color:#493a2d;
}

.empty-posts{
  padding:22px;
  border-radius:17px;
  text-align:center;

  background:#fffdf9;
  border:1px solid #e8e0d3;

  color:#8a8177;
  font-size:14px;
}

/* POST CARD */

.my-post{
  background:#fffdf9;
  border:1px solid #e8e0d3;
  border-radius:17px;
  padding:15px 16px;
  margin-bottom:11px;
  box-shadow:0 5px 18px rgba(64,48,32,.05);
}

.my-post-header{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:9px;
}

.my-post-avatar{
  width:40px;
  height:40px;
  flex-shrink:0;
  border-radius:50%;

  background:#4a392b;
  color:#f7e9c8;

  display:flex;
  align-items:center;
  justify-content:center;

  font-weight:800;
  font-size:15px;
}

.my-post-name{
  font-size:14px;
  font-weight:800;
}

.my-post-date{
  margin-top:2px;
  color:#8a8177;
  font-size:11px;
}

.my-post-text{
  font-size:15px;
  line-height:1.5;
  color:#302820;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

/* LOGOUT */

.logout{
  margin-top:25px;

  padding:10px 20px;

  border:1px solid #ded5c8;
  border-radius:12px;

  background:transparent;
  color:#766b60;

  cursor:pointer;
  font-size:13px;
  transition:.2s;
}

.logout:hover{
  background:#f1ebe2;
}

/* MOBILE */

@media(max-width:500px){

  body{
    padding:12px 10px 30px;
  }

  .top-bar{
    margin-bottom:14px;
  }

  .brand{
    font-size:14px;
  }

  .back-button{
    padding:8px 12px;
    font-size:13px;
  }

  .profile-card{
    padding:28px 17px 24px;
    border-radius:23px;
  }

  .avatar{
    width:88px;
    height:88px;
    font-size:33px;
  }

  .username{
    font-size:23px;
  }

  .stats{
    max-width:300px;
  }

  .stat{
    padding:12px 8px;
  }

  .stat strong{
    font-size:20px;
  }

  .my-post{
    padding:14px;
  }
}
</style>
</head>

<body>

<div class="top-bar">

  <button class="back-button" id="backButton">
    ← Back
  </button>

  <div class="brand">
    🐉 JSP TAYSU
  </div>

</div>


<main class="profile-card">

  <div class="avatar" id="profileAvatar">
    M
  </div>

  <h1 class="username" id="profileUsername">
    Member
  </h1>

  <p class="email" id="profileEmail">
    Loading profile...
  </p>


  <div class="stats">

    <div class="stat">
      <strong id="followersCount">0</strong>
      <span>Followers</span>
    </div>

    <div class="stat">
      <strong id="followingCount">0</strong>
      <span>Following</span>
    </div>

  </div>


  <button class="edit-button" id="editProfileButton">
    ✏️ Edit Profile
  </button>


  <div class="editor" id="profileEditor">

    <input
      type="text"
      id="usernameInput"
      placeholder="Choose username"
      maxlength="20"
    >

    <br>

    <button
      class="save-button"
      id="saveUsernameButton">
      Save Username
    </button>

  </div>

</main>


<section class="posts-section">

  <h3>My Posts</h3>

  <div id="myPosts">

    <div class="empty-posts">
      Loading your posts...
    </div>

  </div>

</section>


<div style="text-align:center;">

  <button class="logout" id="logoutButton">
    Sign out
  </button>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut,
  setPersistence,
  browserLocalPersistence
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  collection,
  getDocs,
  query,
  where,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ================================
   FIREBASE
================================ */

const firebaseConfig = {

  apiKey:
    "AIzaSyDpv2vqAZbCFgT_XJ4u-KB0AeZWVB2GIUs",

  authDomain:
    "jsp-taysu.firebaseapp.com",

  projectId:
    "jsp-taysu",

  storageBucket:
    "jsp-taysu.firebasestorage.app",

  messagingSenderId:
    "280992025632",

  appId:
    "1:280992025632:web:48efa21208a78be9a78045"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);

let currentUser = null;


/* ================================
   KEEP LOGIN
================================ */

await setPersistence(
  auth,
  browserLocalPersistence
);


/* ================================
   AUTH STATE
================================ */

onAuthStateChanged(
  auth,
  async (user) => {

    console.log(
      "PROFILE USER:",
      user
    );


    if(!user){

      currentUser = null;

      document.getElementById(
        "profileUsername"
      ).textContent =
        "Please sign in";

      document.getElementById(
        "profileEmail"
      ).textContent =
        "";

      document.getElementById(
        "myPosts"
      ).innerHTML = `
        <div class="empty-posts">
          Please sign in to view your posts.
        </div>
      `;

      return;

    }


    currentUser = user;


    document.getElementById(
      "profileEmail"
    ).textContent =
      user.email || "";


    try{

      /* LOAD PROFILE */

      const profileRef =
        doc(
          db,
          "users",
          user.uid
        );


      const profileSnap =
        await getDoc(
          profileRef
        );


      let username =
        user.displayName ||
        "Member";


      if(
        profileSnap.exists()
      ){

        const data =
          profileSnap.data();


        if(data.username){

          username =
            data.username;

        }

      }


      /* DISPLAY PROFILE */

      document.getElementById(
        "profileUsername"
      ).textContent =
        username;


      document.getElementById(
        "usernameInput"
      ).value =
        username;


      document.getElementById(
        "profileAvatar"
      ).textContent =
        username
          .charAt(0)
          .toUpperCase();


      /* LOAD COUNTS */

      await loadFollowCounts();


      /* LOAD POSTS */

      await loadMyPosts();


    }catch(error){

      console.error(
        "Profile loading error:",
        error
      );

    }

  }
);


/* ================================
   FOLLOW COUNTS
================================ */

async function loadFollowCounts(){

  if(!currentUser) return;


  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "follows"
        )
      );


    let followers = 0;
    let following = 0;


    snapshot.forEach(
      (followDoc) => {

        const data =
          followDoc.data();


        if(
          data.followingId ===
          currentUser.uid
        ){

          followers++;

        }


        if(
          data.followerId ===
          currentUser.uid
        ){

          following++;

        }

      }
    );


    document.getElementById(
      "followersCount"
    ).textContent =
      followers;


    document.getElementById(
      "followingCount"
    ).textContent =
      following;


  }catch(error){

    console.error(
      "Follow count error:",
      error
    );

  }

}


/* ================================
   LOAD MY POSTS
================================ */

async function loadMyPosts(){

  const postsContainer =
    document.getElementById(
      "myPosts"
    );


  if(!currentUser){

    postsContainer.innerHTML = `
      <div class="empty-posts">
        Please sign in to view your posts.
      </div>
    `;

    return;

  }


  try{

    const postsQuery =
      query(
        collection(
          db,
          "posts"
        ),
        where(
          "authorId",
          "==",
          currentUser.uid
        )
      );


    const snapshot =
      await getDocs(
        postsQuery
      );


    postsContainer.innerHTML =
      "";


    if(snapshot.empty){

      postsContainer.innerHTML = `
        <div class="empty-posts">
          No posts yet. Share something with the community! 🐉
        </div>
      `;

      return;

    }


    const posts = [];


    snapshot.forEach(
      (postDoc) => {

        posts.push({
          id:
            postDoc.id,

          ...postDoc.data()

        });

      }
    );


    /* NEWEST FIRST */

    posts.sort(
      (a,b) => {

        const timeA =
          a.createdAt?.seconds || 0;

        const timeB =
          b.createdAt?.seconds || 0;

        return timeB - timeA;

      }
    );


    posts.forEach(
      (post) => {

        const postElement =
          document.createElement(
            "article"
          );


        postElement.className =
          "my-post";


        const username =
          post.authorName ||
          document.getElementById(
            "profileUsername"
          ).textContent ||
          "Member";


        let postTime =
          "Community post";


        if(post.createdAt){

          try{

            const date =
              post.createdAt.toDate();


            postTime =
              date.toLocaleDateString(
                "en-IN",
                {
                  day:
                    "numeric",

                  month:
                    "short",

                  year:
                    "numeric"
                }
              );


          }catch(error){

            postTime =
              "Community post";

          }

        }


        postElement.innerHTML = `

          <div class="my-post-header">

            <div class="my-post-avatar">

              ${escapeHTML(
                username
                  .charAt(0)
                  .toUpperCase()
              )}

            </div>


            <div>

              <div class="my-post-name">

                ${escapeHTML(
                  username
                )}

              </div>


              <div class="my-post-date">

                ${postTime}

              </div>

            </div>

          </div>


          <div class="my-post-text">

            ${escapeHTML(
              post.text || ""
            )}

          </div>

        `;


        postsContainer.appendChild(
          postElement
        );

      }
    );


  }catch(error){

    console.error(
      "My posts error:",
      error
    );


    postsContainer.innerHTML = `
      <div class="empty-posts">
        Could not load your posts.
      </div>
    `;

  }

}


/* ================================
   SAFE HTML
================================ */

function escapeHTML(text){

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text;

  return div.innerHTML;

}


/* ================================
   EDIT PROFILE
================================ */

document
  .getElementById(
    "editProfileButton"
  )
  .addEventListener(
    "click",
    () => {

      const editor =
        document.getElementById(
          "profileEditor"
        );


      editor.style.display =
        editor.style.display === "block"
          ? "none"
          : "block";

    }
  );


/* ================================
   SAVE USERNAME
================================ */

document
  .getElementById(
    "saveUsernameButton"
  )
  .addEventListener(
    "click",
    async () => {

      if(!currentUser){

        alert(
          "Please sign in first."
        );

        return;

      }


      const input =
        document.getElementById(
          "usernameInput"
        );


      const username =
        input.value.trim();


      if(username.length < 3){

        alert(
          "Username must be at least 3 characters."
        );

        return;

      }


      try{

        await setDoc(
          doc(
            db,
            "users",
            currentUser.uid
          ),
          {

            username:
              username,

            updatedAt:
              serverTimestamp()

          },
          {
            merge:true
          }
        );


        document.getElementById(
          "profileUsername"
        ).textContent =
          username;


        document.getElementById(
          "profileAvatar"
        ).textContent =
          username
            .charAt(0)
            .toUpperCase();


        document.getElementById(
          "profileEditor"
        ).style.display =
          "none";


        alert(
          "Username updated! 🐉"
        );


        await loadMyPosts();


      }catch(error){

        console.error(
          "Username update error:",
          error
        );


        alert(
          error.code +
          ": " +
          error.message
        );

      }

    }
  );


/* ================================
   LOGOUT
================================ */

document
  .getElementById(
    "logoutButton"
  )
  .addEventListener(
    "click",
    async () => {

      try{

        await signOut(
          auth
        );


        window.location.href =
          "index.html";


      }catch(error){

        console.error(
          "Logout error:",
          error
        );

      }

    }
  );


/* ================================
   BACK BUTTON
================================ */

document
  .getElementById(
    "backButton"
  )
  .addEventListener(
    "click",
    () => {

      window.location.href =
        "community.html";

    }
  );

</script>

</body>
</html>
