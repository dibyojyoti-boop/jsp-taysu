<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile • JSP TAYSU</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  color:#171717;
  padding:14px 12px 35px;
}

/* TOP BAR */

.top-bar{
  max-width:600px;
  margin:0 auto 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.back-button{
  border:1px solid #ddd;
  background:white;
  color:#333;
  padding:9px 14px;
  border-radius:12px;
  cursor:pointer;
  font-size:13px;
  transition:.2s;
}

.back-button:hover{
  background:#f0f0f0;
}

.brand{
  font-weight:800;
  font-size:15px;
  letter-spacing:.5px;
}

/* PROFILE */

.profile-card{
  max-width:600px;
  margin:auto;
  padding:28px 20px 22px;
  border-radius:22px;
  text-align:center;
  background:white;
  border:1px solid #e5e5e5;
  box-shadow:0 5px 22px rgba(0,0,0,.06);
}

/* AVATAR */

.avatar{
  width:92px;
  height:92px;
  margin:0 auto 13px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;

  background:#171717;
  color:white;

  font-size:34px;
  font-weight:800;

  border:4px solid #eeeeee;
}

/* USERNAME */

.username{
  font-size:24px;
  font-weight:800;
  margin-bottom:4px;
}

.email{
  color:#888;
  font-size:12px;
  margin-bottom:20px;
  word-break:break-word;
}

/* STATS */

.stats{
  display:flex;
  justify-content:center;
  border-top:1px solid #eee;
  border-bottom:1px solid #eee;
  padding:15px 0;
  margin-bottom:18px;
}

.stat{
  width:130px;
  display:flex;
  flex-direction:column;
  gap:3px;
}

.stat strong{
  font-size:20px;
}

.stat span{
  color:#888;
  font-size:11px;
}

/* EDIT */

.edit-button{
  border:1px solid #d7d7d7;
  padding:9px 17px;
  border-radius:12px;
  background:#f7f7f7;
  color:#333;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
}

.edit-button:hover{
  background:#ededed;
}

.editor{
  display:none;
  margin-top:15px;
  padding-top:15px;
  border-top:1px solid #eee;
}

.editor input{
  width:100%;
  max-width:300px;
  padding:11px 12px;
  border:1px solid #d8d8d8;
  border-radius:11px;
  outline:none;
  font-size:14px;
}

.editor input:focus{
  border-color:#777;
}

.save-button{
  margin-top:8px;
  border:0;
  padding:10px 18px;
  border-radius:11px;
  background:#171717;
  color:white;
  font-weight:700;
  cursor:pointer;
}

/* POSTS */

.posts-section{
  max-width:600px;
  margin:22px auto 0;
}

.posts-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:0 3px 10px;
}

.posts-header h3{
  font-size:18px;
}

.posts-header span{
  font-size:18px;
}

/* POST CARD */

.my-post{
  background:white;
  border:1px solid #e5e5e5;
  border-radius:17px;
  padding:15px;
  margin-bottom:10px;
  box-shadow:0 2px 12px rgba(0,0,0,.04);
}

.my-post-header{
  display:flex;
  align-items:center;
  gap:9px;
  margin-bottom:9px;
}

.post-avatar{
  width:40px;
  height:40px;
  flex-shrink:0;
  border-radius:50%;
  background:#171717;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  font-size:14px;
}

.post-author{
  font-size:14px;
  font-weight:800;
}

.post-date{
  color:#999;
  font-size:10px;
  margin-top:2px;
}

.post-content{
  font-size:15px;
  line-height:1.45;
  color:#302f2f;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.empty-posts{
  padding:28px 18px;
  border-radius:17px;
  text-align:center;
  background:white;
  border:1px solid #e5e5e5;
  color:#888;
  font-size:13px;
}

/* LOGOUT */

.logout-wrapper{
  text-align:center;
}

.logout{
  margin-top:20px;
  padding:9px 19px;
  border:1px solid #ddd;
  border-radius:12px;
  background:white;
  color:#777;
  cursor:pointer;
  font-size:12px;
}

.logout:hover{
  background:#f1f1f1;
}

/* MOBILE */

@media(max-width:500px){

  body{
    padding:10px 10px 30px;
  }

  .profile-card{
    padding:25px 16px 20px;
    border-radius:20px;
  }

  .avatar{
    width:84px;
    height:84px;
    font-size:31px;
  }

  .username{
    font-size:22px;
  }

  .stat{
    width:110px;
  }

  .my-post{
    padding:14px;
  }
}
</style>
</head>

<body>

<!-- TOP BAR -->

<div class="top-bar">

  <button class="back-button" id="backButton">
    ← Back
  </button>

  <div class="brand">
    🐉 JSP TAYSU
  </div>

</div>


<!-- PROFILE -->

<main class="profile-card">

  <div class="avatar" id="profileAvatar">
    M
  </div>

  <h1 class="username" id="profileUsername">
    Member
  </h1>

  <p class="email" id="profileEmail">
    Loading profile...
  </p>


  <!-- STATS -->

  <div class="stats">

    <div class="stat">
      <strong id="followersCount">0</strong>
      <span>Followers</span>
    </div>

    <div class="stat">
      <strong id="followingCount">0</strong>
      <span>Following</span>
    </div>

  </div>


  <!-- EDIT -->

  <button class="edit-button" id="editProfileButton">
    ✏️ Edit Profile
  </button>


  <div class="editor" id="profileEditor">

    <input
      type="text"
      id="usernameInput"
      placeholder="Choose username"
      maxlength="20"
    >

    <br>

    <button
      class="save-button"
      id="saveUsernameButton">
      Save Username
    </button>

  </div>

</main>


<!-- POSTS -->

<section class="posts-section">

  <div class="posts-header">

    <h3>My Posts</h3>

    <span>📝</span>

  </div>

  <div id="myPosts">

    <div class="empty-posts">
      Loading your posts...
    </div>

  </div>

</section>


<!-- LOGOUT -->

<div class="logout-wrapper">

  <button class="logout" id="logoutButton">
    Sign out
  </button>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut,
  setPersistence,
  browserLocalPersistence
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  collection,
  getDocs,
  query,
  where,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ================================
   FIREBASE
================================ */

const firebaseConfig = {

  apiKey:
    "AIzaSyDpv2vqAZbCFgT_XJ4u-KB0AeZWVB2GIUs",

  authDomain:
    "jsp-taysu.firebaseapp.com",

  projectId:
    "jsp-taysu",

  storageBucket:
    "jsp-taysu.firebasestorage.app",

  messagingSenderId:
    "280992025632",

  appId:
    "1:280992025632:web:48efa21208a78be9a78045"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);

let currentUser = null;


/* ================================
   KEEP LOGIN
================================ */

await setPersistence(
  auth,
  browserLocalPersistence
);


/* ================================
   AUTH STATE
================================ */

onAuthStateChanged(
  auth,
  async (user) => {

    if(!user){

      currentUser = null;

      document.getElementById(
        "profileUsername"
      ).textContent =
        "Please sign in";

      document.getElementById(
        "profileEmail"
      ).textContent =
        "";

      document.getElementById(
        "myPosts"
      ).innerHTML = `
        <div class="empty-posts">
          Please sign in to view your posts.
        </div>
      `;

      return;

    }


    currentUser = user;


    document.getElementById(
      "profileEmail"
    ).textContent =
      user.email || "";


    try{

      /* LOAD PROFILE */

      const profileRef =
        doc(
          db,
          "users",
          user.uid
        );

      const profileSnap =
        await getDoc(profileRef);


      let username =
        user.displayName ||
        "Member";


      if(
        profileSnap.exists()
      ){

        const data =
          profileSnap.data();

        if(data.username){

          username =
            data.username;

        }

      }


      /* SHOW USERNAME */

      document.getElementById(
        "profileUsername"
      ).textContent =
        username;


      document.getElementById(
        "usernameInput"
      ).value =
        username;


      document.getElementById(
        "profileAvatar"
      ).textContent =
        username
          .charAt(0)
          .toUpperCase();


      /* FOLLOW */

      await loadFollowCounts();


      /* POSTS */

      await loadMyPosts();


    }catch(error){

      console.error(
        "Profile loading error:",
        error
      );

    }

  }
);


/* ================================
   FOLLOW COUNTS
================================ */

async function loadFollowCounts(){

  if(!currentUser) return;


  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "follows"
        )
      );


    let followers = 0;
    let following = 0;


    snapshot.forEach(
      (followDoc) => {

        const data =
          followDoc.data();


        if(
          data.followingId ===
          currentUser.uid
        ){

          followers++;

        }


        if(
          data.followerId ===
          currentUser.uid
        ){

          following++;

        }

      }
    );


    document.getElementById(
      "followersCount"
    ).textContent =
      followers;


    document.getElementById(
      "followingCount"
    ).textContent =
      following;


  }catch(error){

    console.error(
      "Follow count error:",
      error
    );

  }

}


/* ================================
   MY POSTS
================================ */

async function loadMyPosts(){

  const container =
    document.getElementById(
      "myPosts"
    );


  if(!currentUser) return;


  try{

    const postsQuery =
      query(
        collection(
          db,
          "posts"
        ),
        where(
          "authorId",
          "==",
          currentUser.uid
        )
      );


    const snapshot =
      await getDocs(
        postsQuery
      );


    if(snapshot.empty){

      container.innerHTML = `
        <div class="empty-posts">
          🐉<br><br>
          No posts yet.<br>
          Share something with the community!
        </div>
      `;

      return;

    }


    const posts = [];


    snapshot.forEach(
      (postDoc) => {

        posts.push({

          id:
            postDoc.id,

          ...postDoc.data()

        });

      }
    );


    /* NEWEST FIRST */

    posts.sort(
      (a,b) => {

        const timeA =
          a.createdAt?.seconds || 0;

        const timeB =
          b.createdAt?.seconds || 0;

        return timeB - timeA;

      }
    );


    container.innerHTML =
      "";


    posts.forEach(
      (post) => {

        const article =
          document.createElement(
            "article"
          );


        article.className =
          "my-post";


        const username =
          post.authorName ||
          document.getElementById(
            "profileUsername"
          ).textContent ||
          "Member";


        let dateText =
          "Community post";


        if(post.createdAt){

          try{

            dateText =
              post.createdAt
                .toDate()
                .toLocaleDateString(
                  "en-IN",
                  {
                    day:"numeric",
                    month:"short",
                    year:"numeric"
                  }
                );

          }catch(error){}

        }


        article.innerHTML = `

          <div class="my-post-header">

            <div class="post-avatar">

              ${escapeHTML(
                username
                  .charAt(0)
                  .toUpperCase()
              )}

            </div>

            <div>

              <div class="post-author">
                ${escapeHTML(username)}
              </div>

              <div class="post-date">
                ${dateText}
              </div>

            </div>

          </div>


          <div class="post-content">

            ${escapeHTML(
              post.text || ""
            )}

          </div>

        `;


        container.appendChild(
          article
        );

      }
    );


  }catch(error){

    console.error(
      "My posts error:",
      error
    );


    container.innerHTML = `
      <div class="empty-posts">
        ⚠️<br><br>
        Couldn't load your posts.<br>
        Please refresh the page.
      </div>
    `;

  }

}


/* ================================
   SAFE HTML
================================ */

function escapeHTML(text){

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text;

  return div.innerHTML;

}


/* ================================
   EDIT PROFILE
================================ */

document.getElementById(
  "editProfileButton"
).addEventListener(
  "click",
  () => {

    const editor =
      document.getElementById(
        "profileEditor"
      );


    editor.style.display =
      editor.style.display === "block"
        ? "none"
        : "block";

  }
);


/* ================================
   SAVE USERNAME
================================ */

document.getElementById(
  "saveUsernameButton"
).addEventListener(
  "click",
  async () => {

    if(!currentUser){

      alert(
        "Please sign in first."
      );

      return;

    }


    const input =
      document.getElementById(
        "usernameInput"
      );


    const username =
      input.value.trim();


    if(username.length < 3){

      alert(
        "Username must be at least 3 characters."
      );

      return;

    }


    try{

      await setDoc(
        doc(
          db,
          "users",
          currentUser.uid
        ),
        {

          username:
            username,

          updatedAt:
            serverTimestamp()

        },
        {
          merge:true
        }
      );


      document.getElementById(
        "profileUsername"
      ).textContent =
        username;


      document.getElementById(
        "profileAvatar"
      ).textContent =
        username
          .charAt(0)
          .toUpperCase();


      document.getElementById(
        "profileEditor"
      ).style.display =
        "none";


      await loadMyPosts();


      alert(
        "Username updated! 🐉"
      );


    }catch(error){

      console.error(
        "Username update error:",
        error
      );


      alert(
        error.code +
        ": " +
        error.message
      );

    }

  }
);


/* ================================
   LOGOUT
================================ */

document.getElementById(
  "logoutButton"
).addEventListener(
  "click",
  async () => {

    try{

      await signOut(auth);

      window.location.href =
        "index.html";

    }catch(error){

      console.error(
        "Logout error:",
        error
      );

    }

  }
);


/* ================================
   BACK
================================ */

document.getElementById(
  "backButton"
).addEventListener(
  "click",
  () => {

    window.location.href =
      "community.html";

  }
);

</script>

</body>
</html>
