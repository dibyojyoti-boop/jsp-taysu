<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile | JSP TAYSU</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#0b0d12;
  color:#f5f5f7;
  min-height:100vh;
  padding-bottom:75px;
}

/* ================================
   TOP BAR
================================ */

.topbar{
  height:62px;
  border-bottom:1px solid #282b33;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(11,13,18,.96);
  backdrop-filter:blur(12px);
}

.top-left,
.top-right{
  width:45px;
}

.top-left button,
.top-right button{
  border:0;
  background:none;
  color:#f5f5f7;
  cursor:pointer;
}

.top-left button{
  font-size:34px;
  line-height:1;
}

.top-right{
  text-align:right;
}

.more-icon{
  font-size:25px;
  letter-spacing:3px;
}

.top-title{
  font-size:19px;
  font-weight:800;
}

/* ================================
   PROFILE
================================ */

.profile{
  max-width:700px;
  margin:auto;
  padding:25px 20px 0;
}

.profile-main{
  display:flex;
  align-items:center;
  gap:25px;
}

.profile-photo{
  width:104px;
  height:104px;
  min-width:104px;
  border-radius:50%;
  overflow:hidden;
  background:#075947;
  border:4px solid #252934;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:40px;
  font-weight:500;
}

.profile-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:none;
}

.profile-photo img.loaded{
  display:block;
}

.profile-photo span{
  display:block;
}

.profile-photo img.loaded + span{
  display:none;
}

/* STATS */

.stats{
  flex:1;
  display:flex;
  justify-content:space-between;
  text-align:center;
  gap:10px;
}

.stat{
  min-width:65px;
}

.stat strong{
  display:block;
  font-size:20px;
  font-weight:800;
  color:#f5f5f7;
}

.stat span{
  display:block;
  margin-top:7px;
  color:#979aa5;
  font-size:13px;
}

/* PROFILE INFO */

.profile-info{
  margin-top:24px;
}

.profile-name{
  font-size:22px;
  font-weight:800;
  margin-bottom:8px;
}

.profile-bio{
  color:#d4d5da;
  font-size:15px;
  line-height:1.45;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.profile-subtitle{
  color:#989ba5;
  font-size:14px;
  margin-top:7px;
}

/* BUTTONS */

.profile-buttons{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.profile-button{
  flex:1;
  height:43px;
  border:1px solid #30343e;
  border-radius:12px;
  background:#1b1e26;
  color:#f5f5f7;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
}

.profile-button:hover{
  background:#242832;
}

.profile-button.primary{
  background:#f5f5f7;
  color:#111318;
  border-color:#f5f5f7;
}

/* ================================
   POSTS HEADER
================================ */

.posts-section{
  margin-top:28px;
  border-top:1px solid #282b33;
}

.posts-heading{
  height:55px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid #282b33;
  position:relative;
}

.posts-heading::after{
  content:"";
  position:absolute;
  bottom:-1px;
  left:0;
  width:100%;
  height:2px;
  background:#f5f5f7;
}

.posts-heading svg{
  width:23px;
  height:23px;
  stroke:#f5f5f7;
  fill:none;
  stroke-width:2;
}

/* ================================
   POSTS
================================ */

#posts{
  min-height:250px;
}

.post{
  padding:15px 18px;
  border-bottom:1px solid #20232a;
  transition:.18s;
}

.post:hover{
  background:#101218;
}

.post-top{
  display:flex;
  align-items:center;
  gap:10px;
}

.post-avatar{
  width:38px;
  height:38px;
  min-width:38px;
  border-radius:50%;
  overflow:hidden;
  background:#075947;
  border:2px solid #282c35;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-weight:800;
  font-size:16px;
}

.post-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:none;
}

.post-avatar img.loaded{
  display:block;
}

.post-avatar img.loaded + span{
  display:none;
}

.post-user-info{
  min-width:0;
  flex:1;
}

.post-author{
  font-size:14px;
  font-weight:800;
  color:#f5f5f7;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.post-time{
  color:#858995;
  font-size:11px;
  margin-top:3px;
}

.post-menu{
  border:0;
  background:none;
  color:#858995;
  font-size:20px;
  cursor:pointer;
  padding:5px;
}

/* THE IMPORTANT PART:
   ONE LINE ONLY */

.post-text{
  margin:9px 0 0 48px;
  font-size:14px;
  color:#e5e5e8;
  line-height:1.4;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  max-width:calc(100% - 48px);
}

/* DELETE */

.delete-button{
  border:0;
  background:none;
  color:#ff6674;
  font-size:12px;
  cursor:pointer;
  padding:5px 0;
  margin-left:48px;
  margin-top:4px;
  display:none;
}

.post.show-delete .delete-button{
  display:block;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:70px 20px;
  color:#858995;
}

.empty-icon{
  margin-bottom:14px;
}

.empty-icon svg{
  width:38px;
  height:38px;
  stroke:#656a76;
  fill:none;
  stroke-width:1.8;
}

.empty h3{
  color:#d9dbe0;
  font-size:16px;
  margin-bottom:6px;
}

.empty p{
  font-size:13px;
}

/* ================================
   BOTTOM NAV
================================ */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:70px;
  background:rgba(11,13,18,.97);
  backdrop-filter:blur(14px);
  border-top:1px solid #282b33;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:200;
}

.nav-item{
  flex:1;
  height:100%;
  border:0;
  background:none;
  color:#858995;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
}

.nav-item svg{
  width:24px;
  height:24px;
  stroke:currentColor;
  fill:none;
  stroke-width:2;
}

.nav-item span{
  font-size:10px;
}

.nav-item.active{
  color:#f5f5f7;
}

.nav-item.create svg{
  width:27px;
  height:27px;
}

/* ================================
   LOADING
================================ */

.loading{
  text-align:center;
  padding:65px 20px;
  color:#858995;
  font-size:13px;
}

/* ================================
   MOBILE
================================ */

@media(max-width:500px){

  .profile{
    padding:23px 15px 0;
  }

  .profile-main{
    gap:17px;
  }

  .profile-photo{
    width:94px;
    height:94px;
    min-width:94px;
  }

  .stats{
    gap:5px;
  }

  .stat strong{
    font-size:19px;
  }

  .stat span{
    font-size:12px;
  }

  .profile-name{
    font-size:21px;
  }

  .profile-bio{
    font-size:14px;
  }

  .post{
    padding:14px 15px;
  }

  .post-text{
    margin-left:48px;
  }

  .topbar{
    padding:0 14px;
  }

}

</style>

</head>

<!-- ================================
     FIREBASE
================================ -->

<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {

  getAuth,
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence

}

from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {

  getFirestore,
  doc,
  getDoc,
  collection,
  getDocs,
  deleteDoc

}

from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ================================
   FIREBASE CONFIG
================================ */

const firebaseConfig = {

  apiKey:
    "AIzaSyDpv2vqAZbCFgT_XJ4u-KB0AeZWVB2GIUs",

  authDomain:
    "jsp-taysu.firebaseapp.com",

  projectId:
    "jsp-taysu",

  storageBucket:
    "jsp-taysu.firebasestorage.app",

  messagingSenderId:
    "280992025632",

  appId:
    "1:280992025632:web:48efa21208a78be9a78045"

};


const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);


const db =
  getFirestore(app);


let currentUser = null;


/* ================================
   ELEMENTS
================================ */

const profileName =
  document.getElementById("profileName");

const profileBio =
  document.getElementById("profileBio");

const profileImage =
  document.getElementById("profileImage");

const profileInitial =
  document.getElementById("profileInitial");

const postCount =
  document.getElementById("postCount");

const followersCount =
  document.getElementById("followersCount");

const followingCount =
  document.getElementById("followingCount");

const postsContainer =
  document.getElementById("posts");


/* ================================
   LOGIN PERSISTENCE
================================ */

await setPersistence(
  auth,
  browserLocalPersistence
);


/* ================================
   AUTH STATE
================================ */

onAuthStateChanged(
  auth,
  async (user) => {

    if(!user){

      window.location.href =
        "community.html";

      return;

    }


    currentUser =
      user;


    await loadProfile();

    await loadPosts();

    await loadFollowStats();

  }
);


/* ================================
   LOAD PROFILE
================================ */

async function loadProfile(){

  let username =
    currentUser.displayName ||
    "Member";


  let bio =
    "Building and preserving our heritage.";


  /* GOOGLE PHOTO */

  if(currentUser.photoURL){

    profileImage.src =
      currentUser.photoURL;

    profileImage.classList.add(
      "loaded"
    );

  }


  try{

    const profileRef =
      doc(
        db,
        "users",
        currentUser.uid
      );


    const profileSnap =
      await getDoc(
        profileRef
      );


    if(profileSnap.exists()){

      const data =
        profileSnap.data();


      if(data.username){

        username =
          data.username;

      }


      if(
        data.bio !== undefined &&
        data.bio !== null
      ){

        bio =
          data.bio;

      }


      if(data.photoURL){

        profileImage.src =
          data.photoURL;

        profileImage.classList.add(
          "loaded"
        );

      }

    }

  }catch(error){

    console.error(
      "Profile error:",
      error
    );

  }


  profileName.textContent =
    username;


  profileBio.textContent =
    bio;


  profileInitial.textContent =
    username
      .charAt(0)
      .toUpperCase();

}


/* ================================
   LOAD POSTS
================================ */

async function loadPosts(){

  postsContainer.innerHTML =
    `
      <div class="loading">
        Loading posts...
      </div>
    `;


  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "posts"
        )
      );


    const posts = [];


    snapshot.forEach(
      postDoc => {

        const data =
          postDoc.data();


        /*
          ONLY SHOW CURRENT
          USER'S POSTS
        */

        if(
          data.authorId ===
          currentUser.uid
        ){

          posts.push({

            id:
              postDoc.id,

            ...data

          });

        }

      }
    );


    /* NEWEST FIRST */

    posts.sort(
      (a,b) => {

        const timeA =
          a.createdAt?.seconds || 0;

        const timeB =
          b.createdAt?.seconds || 0;

        return timeB - timeA;

      }
    );


    postCount.textContent =
      posts.length;


    if(posts.length === 0){

      postsContainer.innerHTML =
        `

        <div class="empty">

          <div class="empty-icon">

            <svg viewBox="0 0 24 24">

              <rect
                x="3"
                y="3"
                width="18"
                height="18"
                rx="3"/>

              <path d="M8 12h8"/>
              <path d="M12 8v8"/>

            </svg>

          </div>


          <h3>
            No posts yet
          </h3>


          <p>
            Your posts will appear here.
          </p>

        </div>

        `;

      return;

    }


    postsContainer.innerHTML =
      "";


    posts.forEach(
      post => {

        createPostElement(
          post
        );

      }
    );


  }catch(error){

    console.error(
      "Posts error:",
      error
    );


    postsContainer.innerHTML =
      `

      <div class="empty">

        <h3>
          Couldn't load posts
        </h3>

        <p>
          Please refresh the page.
        </p>

      </div>

      `;

  }

}


/* ================================
   CREATE POST ELEMENT
================================ */

function createPostElement(post){

  const article =
    document.createElement(
      "article"
    );


  article.className =
    "post";


  const username =
    post.authorName ||
    "Member";


  const initial =
    username
      .charAt(0)
      .toUpperCase();


  const time =
    formatTime(
      post.createdAt
    );


  article.innerHTML =
    `

      <div class="post-top">


        <div class="post-avatar">

          <img
            class="post-author-image"
            alt="">

          <span>
            ${escapeHTML(initial)}
          </span>

        </div>


        <div class="post-user-info">

          <div class="post-author">

            ${escapeHTML(username)}

          </div>


          <div class="post-time">

            ${time}

          </div>

        </div>


        <button
          class="post-menu"
          type="button"
          aria-label="Post options">

          ···

        </button>

      </div>


      <div
        class="post-text"
        title="${escapeHTML(post.text || "")}">

        ${escapeHTML(post.text || "")}

      </div>


      <button
        class="delete-button"
        type="button">

        Delete post

      </button>

    `;


  postsContainer.appendChild(
    article
  );


  /* ================================
     PROFILE PHOTO ON POST
  ================================= */

  const postImage =
    article.querySelector(
      ".post-author-image"
    );


  if(currentUser.photoURL){

    postImage.src =
      currentUser.photoURL;

    postImage.classList.add(
      "loaded"
    );

  }


  /* ================================
     OPTIONS
  ================================= */

  const menu =
    article.querySelector(
      ".post-menu"
    );


  menu.addEventListener(
    "click",
    () => {

      article.classList.toggle(
        "show-delete"
      );

    }
  );


  /* ================================
     DELETE
  ================================= */

  const deleteButton =
    article.querySelector(
      ".delete-button"
    );


  deleteButton.addEventListener(
    "click",
    async () => {

      const confirmDelete =
        confirm(
          "Delete this post?"
        );


      if(!confirmDelete){

        return;

      }


      try{

        deleteButton.textContent =
          "Deleting...";


        deleteButton.disabled =
          true;


        await deleteDoc(
          doc(
            db,
            "posts",
            post.id
          )
        );


        await loadPosts();


      }catch(error){

        console.error(
          "Delete post error:",
          error
        );


        alert(
          error.code +
          ": " +
          error.message
        );


        deleteButton.textContent =
          "Delete post";


        deleteButton.disabled =
          false;

      }

    }
  );

}


/* ================================
   FOLLOW STATS
================================ */

async function loadFollowStats(){

  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "follows"
        )
      );


    let followers =
      0;

    let following =
      0;


    snapshot.forEach(
      followDoc => {

        const data =
          followDoc.data();


        if(
          data.followingId ===
          currentUser.uid
        ){

          followers++;

        }


        if(
          data.followerId ===
          currentUser.uid
        ){

          following++;

        }

      }
    );


    followersCount.textContent =
      followers;


    followingCount.textContent =
      following;


  }catch(error){

    console.error(
      "Follow stats error:",
      error
    );

  }

}


/* ================================
   FORMAT TIME
================================ */

function formatTime(timestamp){

  if(!timestamp){

    return "now";

  }


  try{

    const date =
      timestamp.toDate
        ? timestamp.toDate()
        : new Date(
            timestamp.seconds * 1000
          );


    const now =
      new Date();


    const seconds =
      Math.floor(
        (now - date) / 1000
      );


    if(seconds < 60){

      return "now";

    }


    const minutes =
      Math.floor(
        seconds / 60
      );


    if(minutes < 60){

      return minutes + "m ago";

    }


    const hours =
      Math.floor(
        minutes / 60
      );


    if(hours < 24){

      return hours + "h ago";

    }


    const days =
      Math.floor(
        hours / 24
      );


    if(days < 7){

      return days + "d ago";

    }


    return date.toLocaleDateString(
      undefined,
      {
        day:"numeric",
        month:"short"
      }
    );

  }catch(error){

    return "now";

  }

}


/* ================================
   SAFE HTML
================================ */

function escapeHTML(text){

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    String(text);


  return div.innerHTML;

}

document.getElementById(
  "shareProfileButton"
).addEventListener(
  "click",
  async () => {

    const username =
      profileName.textContent;


    const shareData = {

      title:
        username + " | JSP TAYSU",

      text:
        "Check out " +
        username +
        "'s profile on JSP TAYSU.",

      url:
        window.location.href

    };


    try{

      if(navigator.share){

        await navigator.share(
          shareData
        );

      }else{

        await navigator.clipboard.writeText(
          window.location.href
        );


        alert(
          "Profile link copied! 🔗"
        );

      }

    }catch(error){

      console.log(
        "Share cancelled."
      );

    }

  }
);
