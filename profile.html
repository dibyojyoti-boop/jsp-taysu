<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Profile • JSP TAYSU</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#0b0d12;
  color:#f5f5f5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  padding-bottom:76px;
}

/* ================= TOP BAR ================= */

.topbar{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  border-bottom:1px solid #252832;
  position:sticky;
  top:0;
  background:rgba(11,13,18,.96);
  backdrop-filter:blur(15px);
  z-index:50;
}

.back{
  width:42px;
  font-size:31px;
  cursor:pointer;
  color:#fff;
  line-height:1;
}

.username-title{
  font-size:18px;
  font-weight:750;
  max-width:230px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.more{
  width:42px;
  text-align:right;
  font-size:22px;
  letter-spacing:2px;
  cursor:pointer;
}

/* ================= PROFILE ================= */

.profile{
  padding:18px 16px 0;
}

.profile-top{
  display:flex;
  align-items:center;
  gap:18px;
}

.avatar{
  width:88px;
  height:88px;
  min-width:88px;
  border-radius:50%;
  background:#006b57;
  border:2px solid #292d37;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  font-weight:600;
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.stats{
  flex:1;
  display:flex;
  justify-content:space-between;
  text-align:center;
}

.stat{
  min-width:65px;
  cursor:pointer;
}

.stat strong{
  display:block;
  font-size:18px;
  font-weight:750;
}

.stat span{
  display:block;
  margin-top:4px;
  color:#979ba6;
  font-size:12px;
}

/* ================= INFO ================= */

.info{
  margin-top:17px;
}

.name{
  font-size:19px;
  font-weight:750;
}

.bio{
  margin-top:5px;
  color:#d3d5da;
  font-size:14px;
  line-height:1.4;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.org{
  margin-top:6px;
  color:#858995;
  font-size:12px;
}

/* ================= BUTTONS ================= */

.buttons{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.btn{
  flex:1;
  height:40px;
  border:0;
  border-radius:9px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  opacity:.6;
  cursor:default;
}

.edit,
.follow{
  background:#f1f1f3;
  color:#111318;
}

.following{
  background:#1b1e26;
  color:#fff;
  border:1px solid #30343e;
}

/* ================= POSTS HEADER ================= */

.post-header{
  height:52px;
  margin-top:19px;
  border-top:1px solid #252832;
  border-bottom:1px solid #252832;
  display:flex;
  align-items:center;
  justify-content:center;
}

.post-icon{
  font-size:23px;
}

/* ================= POSTS ================= */

.posts{
  padding-bottom:25px;
}

.my-post{
  position:relative;
  padding:13px 16px 14px;
  border-bottom:1px solid #252832;
}

.my-post-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:2px;
}

.my-post-user{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}

.small-avatar{
  width:29px;
  height:29px;
  border-radius:50%;
  background:#006b57;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:700;
  flex-shrink:0;
  overflow:hidden;
}

.small-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.my-post-meta{
  min-width:0;
}

.my-post-name{
  font-size:13px;
  font-weight:750;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.my-post-time{
  color:#777c88;
  font-size:10px;
  margin-top:1px;
}

.my-post-text{
  margin-top:2px;
  padding:0;
  color:#e5e6e9;
  font-size:14px;
  line-height:1.45;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.post-menu-button{
  border:0;
  background:none;
  color:#999da7;
  font-size:19px;
  letter-spacing:2px;
  padding:4px;
  cursor:pointer;
}

/* ================= POST MENU ================= */

.post-menu{
  display:none;
  position:absolute;
  top:45px;
  right:13px;
  width:125px;
  background:#1b1e26;
  border:1px solid #30343f;
  border-radius:11px;
  overflow:hidden;
  z-index:20;
  box-shadow:0 10px 30px rgba(0,0,0,.45);
}

.post-menu button{
  width:100%;
  border:0;
  background:none;
  color:#ff6574;
  text-align:left;
  padding:12px 14px;
  font-size:13px;
  cursor:pointer;
}

/* ================= EMPTY ================= */

.empty{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#888d98;
  text-align:center;
  padding:42px 20px;
}

.empty-icon{
  font-size:32px;
  margin-bottom:8px;
}

.empty h3{
  color:#d7d8dc;
  font-size:15px;
  margin-bottom:4px;
}

.empty p{
  font-size:12px;
}

/* ================= TOP MENU ================= */

.menu{
  display:none;
  position:fixed;
  top:65px;
  right:12px;
  width:145px;
  background:#1b1e26;
  border:1px solid #303541;
  border-radius:12px;
  overflow:hidden;
  z-index:100;
  box-shadow:0 12px 35px rgba(0,0,0,.5);
}

.menu button{
  width:100%;
  padding:13px;
  border:0;
  background:none;
  color:#fff;
  text-align:left;
  font-size:14px;
  cursor:pointer;
}

.signout{
  color:#ff5d6c !important;
}

/* ================= MODAL ================= */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  z-index:200;
  align-items:flex-end;
}

.modal{
  width:100%;
  background:#171a21;
  border-radius:23px 23px 0 0;
  padding:22px 18px 32px;
  border-top:1px solid #30343e;
}

.modal-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:19px;
}

.modal-title h2{
  font-size:20px;
}

.close{
  font-size:27px;
  color:#aaa;
  cursor:pointer;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  color:#999da8;
  font-size:12px;
  margin-bottom:6px;
}

.field input,
.field textarea{
  width:100%;
  background:#0e1015;
  border:1px solid #30343e;
  color:#fff;
  border-radius:11px;
  padding:12px;
  font-size:14px;
  outline:none;
}

.field textarea{
  min-height:85px;
  resize:none;
}

.save{
  width:100%;
  height:46px;
  border:0;
  border-radius:11px;
  background:#f2f2f4;
  color:#111;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}

.status{
  text-align:center;
  margin-top:8px;
  font-size:12px;
  color:#aaa;
}

/* ================= USER SHEET ================= */

.sheet-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.68);
  z-index:300;
  align-items:flex-end;
}

.sheet{
  width:100%;
  max-height:72vh;
  background:#15181f;
  border-radius:23px 23px 0 0;
  overflow:hidden;
  border-top:1px solid #30343e;
  animation:sheetUp .22s ease;
}

@keyframes sheetUp{
  from{
    transform:translateY(100%);
  }
  to{
    transform:translateY(0);
  }
}

.sheet-head{
  height:57px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid #292d36;
  position:relative;
}

.sheet-head:before{
  content:"";
  position:absolute;
  top:8px;
  width:38px;
  height:4px;
  border-radius:10px;
  background:#555a66;
}

.sheet-head h3{
  font-size:16px;
}

.sheet-close{
  position:absolute;
  right:17px;
  top:17px;
  color:#aaa;
  font-size:22px;
  cursor:pointer;
}

.user-list{
  overflow-y:auto;
  max-height:calc(72vh - 57px);
  padding:5px 0 20px;
}

.user-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 17px;
  cursor:pointer;
}

.user-row:active{
  background:#20232b;
}

.list-avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#006b57;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  overflow:hidden;
  flex-shrink:0;
}

.list-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.list-info{
  min-width:0;
}

.list-name{
  font-size:14px;
  font-weight:700;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.list-bio{
  color:#858995;
  font-size:11px;
  margin-top:2px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.sheet-empty{
  text-align:center;
  padding:45px 20px;
  color:#858995;
  font-size:13px;
}

/* ================= LOADING ================= */

.loading{
  position:fixed;
  inset:0;
  background:#0b0d12;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:500;
}

.loader{
  width:28px;
  height:28px;
  border:3px solid #333743;
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* ================= NAV ================= */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:70px;
  background:rgba(11,13,18,.97);
  backdrop-filter:blur(12px);
  border-top:1px solid #252832;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:100;
}

.nav-item{
  flex:1;
  max-width:100px;
  border:0;
  background:none;
  color:#858995;
  text-align:center;
  font-size:10px;
  cursor:pointer;
}

.nav-item .icon{
  display:block;
  font-size:23px;
  margin-bottom:3px;
}

.nav-item.active{
  color:#fff;
}

.create-icon{
  font-size:29px !important;
}

/* ================= DESKTOP ================= */

@media(min-width:700px){

  body{
    max-width:650px;
    margin:auto;
  }

  .bottom-nav{
    max-width:650px;
    margin:auto;
  }

}

</style>
</head>

<body>

  <div class="loader"></div>
</div>

<header class="topbar">

  <div class="back" onclick="goBack()">‹</div>

    Profile
  </div>

    •••
  </div>

<div class="menu" id="topMenu">

<main class="profile">

  <section class="profile-top">

      <div class="stat"

  <button class="nav-item active">

<div class="overlay" id="editOverlay">

  <div class="modal">

    <div class="modal-title">

      <h2>Edit profile</h2>

      <div class="close" onclick="closeEdit()">

    <div class="field">

        id="editBio"

      Save changes

  </div>

</div>

<div class="sheet-overlay" id="sheetOverlay">

  <div class="sheet">

    <div class="sheet-head">

      <h3 id="sheetTitle">
        Followers
      </h3>

      <div class="sheet-close" onclick="closeUserList()">
        ×
      </div>

    </div>

      <div class="sheet-empty">

      </div>

    </div>

  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyDpv2vqAZbCFgT_XJ4u-KB0AeZWVB2GIUs",

  authDomain:
    "jsp-taysu.firebaseapp.com",

  projectId:
    "jsp-taysu",

  storageBucket:
    "jsp-taysu.firebasestorage.app",

  messagingSenderId:
    "280992025632",

  appId:
    "1:280992025632:web:48efa21208a78be9a78045"

};

firebase.initializeApp(firebaseConfig);

const auth =
  firebase.auth();

const db =
  firebase.firestore();


/* =====================================================
   ELEMENTS
===================================================== */

const loading =
  document.getElementById("loading");

const avatar =
  document.getElementById("avatar");

const profileName =
  document.getElementById("profileName");

const profileBio =
  document.getElementById("profileBio");

const topUsername =
  document.getElementById("topUsername");

const postCount =
  document.getElementById("postCount");

const followersCount =
  document.getElementById("followersCount");

const followingCount =
  document.getElementById("followingCount");

const postsContainer =
  document.getElementById("posts");

const profileButtons =
  document.getElementById("profileButtons");

const topMenu =
  document.getElementById("topMenu");

const editOverlay =
  document.getElementById("editOverlay");

const editUsername =
  document.getElementById("editUsername");

const editBio =
  document.getElementById("editBio");

const saveStatus =
  document.getElementById("saveStatus");

const sheetOverlay =
  document.getElementById("sheetOverlay");

const sheetTitle =
  document.getElementById("sheetTitle");

const userList =
  document.getElementById("userList");


/* =====================================================
   GLOBAL STATE
===================================================== */

let currentUser = null;
let profileUserData = null;
let profileUserId = null;


/* =====================================================
   GET PROFILE UID
===================================================== */

function getProfileUid(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("uid");

}


/* =====================================================
   AUTH
===================================================== */

auth.onAuthStateChanged(
  async user => {

    if(!user){

      window.location.href =
        "index.html";

      return;

    }

    currentUser =
      user;

    profileUserId =
      getProfileUid() ||
      user.uid;

    try{

      await loadProfile();

      await loadPosts();

    }catch(error){

      console.error(
        "PROFILE LOAD ERROR:",
        error
      );

      showProfileError();

    }

    loading.style.display =
      "none";

  }
);


/* =====================================================
   LOAD PROFILE
===================================================== */

async function loadProfile(){

  const ref =
    db.collection("users")
      .doc(profileUserId);

  const snap =
    await ref.get();

  if(!snap.exists){

    if(
      profileUserId ===
      currentUser.uid
    ){

      const username =
        currentUser.displayName ||
        currentUser.email?.split("@")[0] ||
        "Member";

      const newData = {

        username:username,

        bio:
          "Building and preserving our heritage.",

        email:
          currentUser.email || "",

        createdAt:
          firebase.firestore
            .FieldValue
            .serverTimestamp()

      };

      await ref.set(
        newData,
        {merge:true}
      );

      profileUserData =
        newData;

    }else{

      showProfileNotFound();

      return;

    }

  }else{

    profileUserData =
      snap.data();

  }


  const username =
    profileUserData.username ||
    "Member";

  const bio =
    profileUserData.bio ||
    "Building and preserving our heritage.";

  displayProfile(
    username,
    bio
  );


  /* IMPORTANT:
     Followers/following now come
     from the follows collection.
  */

  await refreshRelationshipData();

  await renderProfileButtons();

}


/* =====================================================
   RELATIONSHIP DATA
   USING follows COLLECTION
===================================================== */

async function refreshRelationshipData(){

  if(!profileUserId){
    return;
  }

  try{

    /* Followers:
       Someone is following this profile.
    */

    const followersSnap =
      await db
        .collection("follows")
        .where(
          "followingId",
          "==",
          profileUserId
        )
        .get();


    /* Following:
       This profile is following someone.
    */

    const followingSnap =
      await db
        .collection("follows")
        .where(
          "followerId",
          "==",
          profileUserId
        )
        .get();


    const followers =
      followersSnap.docs
        .map(
          doc =>
            doc.data().followerId
        )
        .filter(Boolean);


    const following =
      followingSnap.docs
        .map(
          doc =>
            doc.data().followingId
        )
        .filter(Boolean);


    profileUserData.followers =
      followers;

    profileUserData.following =
      following;


    followersCount.textContent =
      followers.length;

    followingCount.textContent =
      following.length;


  }catch(error){

    console.error(
      "RELATIONSHIP COUNT ERROR:",
      error
    );

    followersCount.textContent =
      "0";

    followingCount.textContent =
      "0";

  }

}


/* =====================================================
   DISPLAY PROFILE
===================================================== */

function displayProfile(
  username,
  bio
){

  profileName.textContent =
    username;

  topUsername.textContent =
    username;

  profileBio.textContent =
    bio;

  const photo =
    profileUserData?.photoURL ||
    profileUserData?.photoUrl ||
    null;

  if(photo){

    avatar.innerHTML =
      `<img src="${escapeAttribute(photo)}" alt="">`;

  }else{

    const letter =
      username
        .trim()
        .charAt(0)
        .toUpperCase() ||
        "M";

    avatar.textContent =
      letter;

  }

}


/* =====================================================
   LOAD POSTS
   UNCHANGED
===================================================== */

async function loadPosts(){

  postsContainer.innerHTML = `

    <div class="empty">

      <div class="empty-icon">
        ◌
      </div>

      <h3>
        Loading posts...
      </h3>

      <p>
        Please wait a moment.
      </p>

    </div>

  `;

  try{

    const snapshot =
      await db
        .collection("posts")
        .where(
          "authorId",
          "==",
          profileUserId
        )
        .get();

    const posts = [];

    snapshot.forEach(
      doc => {

        posts.push({

          id:doc.id,

          ...doc.data()

        });

      }
    );


    posts.sort(
      (a,b) => {

        const aTime =
          a.createdAt?.seconds || 0;

        const bTime =
          b.createdAt?.seconds || 0;

        return bTime - aTime;

      }
    );


    postCount.textContent =
      posts.length;

    postsContainer.innerHTML =
      "";


    if(posts.length === 0){

      postsContainer.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            ✦
          </div>

          <h3>
            No posts yet
          </h3>

          <p>
            Posts will appear here.
          </p>

        </div>

      `;

      return;

    }


    posts.forEach(
      post => {

        renderPost(post);

      }
    );


  }catch(error){

    console.error(
      "Posts error:",
      error
    );

    postsContainer.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          ⚠️
        </div>

        <h3>
          Couldn't load posts
        </h3>

        <p>
          Please refresh the page.
        </p>

      </div>

    `;

  }

}


/* =====================================================
   RENDER POST
   UNCHANGED
===================================================== */

function renderPost(post){

  const username =
    post.authorName ||
    profileUserData.username ||
    "Member";

  const article =
    document.createElement("article");

  article.className =
    "my-post";


  const isOwnPost =
    currentUser &&
    post.authorId ===
    currentUser.uid;


  const photo =
    profileUserData.photoURL ||
    profileUserData.photoUrl ||
    "";


  const cleanPostText =
    String(
      post.text || ""
    ).trim();


  article.innerHTML = `

    <div class="my-post-top">

      <div class="my-post-user">

        <div class="small-avatar">

          ${
            photo

            ?

            `<img
              src="${escapeAttribute(photo)}"
              alt="">`

            :

            escapeHTML(
              username
                .charAt(0)
                .toUpperCase()
            )
          }

        </div>


        <div class="my-post-meta">

          <div class="my-post-name">
            ${escapeHTML(username)}
          </div>

          <div class="my-post-time">
            ${formatPostTime(post.createdAt)}
          </div>

        </div>

      </div>


      ${
        isOwnPost

        ?

        `
          <button
            class="post-menu-button"
            type="button"
            aria-label="Post options">

            •••

          </button>
        `

        :

        ""

      }

    </div>


    <div class="my-post-text">${
      escapeHTML(cleanPostText)
    }</div>


    ${
      isOwnPost

      ?

      `
        <div class="post-menu">

          <button
            type="button"
            class="delete-post-button">

            Delete post

          </button>

        </div>
      `

      :

      ""

    }

  `;


  postsContainer.appendChild(
    article
  );


  if(!isOwnPost){
    return;
  }


  const menuButton =
    article.querySelector(
      ".post-menu-button"
    );

  const postMenu =
    article.querySelector(
      ".post-menu"
    );


  menuButton.addEventListener(
    "click",
    event => {

      event.stopPropagation();

      document
        .querySelectorAll(
          ".post-menu"
        )
        .forEach(
          otherMenu => {

            if(
              otherMenu !==
              postMenu
            ){

              otherMenu.style.display =
                "none";

            }

          }
        );


      postMenu.style.display =
        postMenu.style.display ===
        "block"
          ?
        "none"
          :
        "block";

    }
  );


  const deleteButton =
    article.querySelector(
      ".delete-post-button"
    );


  deleteButton.addEventListener(
    "click",
    async () => {

      const confirmed =
        confirm(
          "Delete this post?"
        );


      if(!confirmed){
        return;
      }


      deleteButton.disabled =
        true;

      deleteButton.textContent =
        "Deleting...";


      try{

        await db
          .collection("posts")
          .doc(post.id)
          .delete();


        article.remove();


        postCount.textContent =
          Math.max(
            0,
            Number(
              postCount.textContent
            ) - 1
          );


        if(
          postsContainer
            .querySelectorAll(
              ".my-post"
            )
            .length === 0
        ){

          postsContainer.innerHTML = `

            <div class="empty">

              <div class="empty-icon">
                ✦
              </div>

              <h3>
                No posts yet
              </h3>

              <p>
                Posts will appear here.
              </p>

            </div>

          `;

        }


      }catch(error){

        console.error(
          "Delete error:",
          error
        );

        alert(
          error.code +
          ": " +
          error.message
        );

        deleteButton.disabled =
          false;

        deleteButton.textContent =
          "Delete post";

      }

    }
  );

}


/* =====================================================
   FOLLOW STATUS
   USING follows DOCUMENT
===================================================== */

async function isFollowing(){

  if(
    !currentUser ||
    !profileUserId ||
    profileUserId ===
    currentUser.uid
  ){

    return false;

  }


  const followId =
    currentUser.uid +
    "_" +
    profileUserId;


  try{

    const snap =
      await db
        .collection("follows")
        .doc(followId)
        .get();


    return snap.exists;

  }catch(error){

    console.error(
      "FOLLOW STATUS ERROR:",
      error
    );

    return false;

  }

}


/* =====================================================
   PROFILE BUTTONS
===================================================== */

async function renderProfileButtons(){

  profileButtons.innerHTML =
    "";


  if(
    !currentUser ||
    profileUserId ===
    currentUser.uid
  ){

    profileButtons.innerHTML = `

      <button
        class="btn edit"
        onclick="openEdit()">

        Edit profile

      </button>


      <button
        class="btn following"
        onclick="shareProfile()">

        Share profile

      </button>

    `;

    return;

  }


  const following =
    await isFollowing();


  profileButtons.innerHTML = `

    <button
      id="followButton"
      class="btn ${
        following
          ? "following"
          : "follow"
      }"
      onclick="toggleFollow()">

      ${
        following
          ? "Following"
          : "Follow"
      }

    </button>


    <button
      class="btn following"
      onclick="shareProfile()">

      Share profile

    </button>

  `;

}


/* =====================================================
   FOLLOW / UNFOLLOW
   USING follows COLLECTION
===================================================== */

async function toggleFollow(){

  if(
    !currentUser ||
    !profileUserId ||
    profileUserId ===
    currentUser.uid
  ){

    return;

  }


  const button =
    document.getElementById(
      "followButton"
    );


  if(!button){
    return;
  }


  button.disabled =
    true;


  const followId =
    currentUser.uid +
    "_" +
    profileUserId;


  const followRef =
    db
      .collection("follows")
      .doc(followId);


  try{

    const snap =
      await followRef.get();


    if(snap.exists){

      /* UNFOLLOW */

      await followRef.delete();

    }else{

      /* FOLLOW */

      await followRef.set({

        followerId:
          currentUser.uid,

        followingId:
          profileUserId,

        createdAt:
          firebase.firestore
            .FieldValue
            .serverTimestamp()

      });

    }


    /* Refresh counts */

    await refreshRelationshipData();

    await renderProfileButtons();


  }catch(error){

    console.error(
      "FOLLOW ERROR:",
      error
    );


    alert(
      "Could not update follow status.\n\n" +
      (error.message || "")
    );


    button.disabled =
      false;

  }

}


/* =====================================================
   FOLLOWERS / FOLLOWING LIST
   USING follows COLLECTION
===================================================== */

async function openUserList(type){

  if(!profileUserId){
    return;
  }


  sheetOverlay.style.display =
    "flex";


  sheetTitle.textContent =
    type === "followers"
      ? "Followers"
      : "Following";


  userList.innerHTML = `

    <div class="sheet-empty">
      Loading...
    </div>

  `;


  try{

    let snapshot;


    if(type === "followers"){

      snapshot =
        await db
          .collection("follows")
          .where(
            "followingId",
            "==",
            profileUserId
          )
          .get();

    }else{

      snapshot =
        await db
          .collection("follows")
          .where(
            "followerId",
            "==",
            profileUserId
          )
          .get();

    }


    const ids =
      snapshot.docs
        .map(
          doc => {

            const data =
              doc.data() || {};

            return type === "followers"
              ? data.followerId
              : data.followingId;

          }
        )
        .filter(Boolean);


    /* Keep counts synced */

    if(type === "followers"){

      followersCount.textContent =
        ids.length;

    }else{

      followingCount.textContent =
        ids.length;

    }


    if(ids.length === 0){

      userList.innerHTML = `

        <div class="sheet-empty">

          ${
            type === "followers"

              ?

            "No followers yet."

              :

            "Not following anyone yet."

          }

        </div>

      `;

      return;

    }


    const users = [];


    const snapshots =
      await Promise.all(
        ids.map(
          uid =>
            db
              .collection("users")
              .doc(uid)
              .get()
        )
      );


    snapshots.forEach(
      (snap,index) => {

        if(snap.exists){

          users.push({

            uid:
              ids[index],

            ...snap.data()

          });

        }

      }
    );


    userList.innerHTML =
      "";


    users.forEach(
      user => {

        renderUserRow(user);

      }
    );


    if(users.length === 0){

      userList.innerHTML = `

        <div class="sheet-empty">
          No users found.
        </div>

      `;

    }


  }catch(error){

    console.error(
      "USER LIST ERROR:",
      error
    );


    userList.innerHTML = `

      <div class="sheet-empty">
        Couldn't load users.
      </div>

    `;

  }

}

function openEdit(){

    profileUserId !==
    currentUser.uid

    return;

  }


  editUsername.value =
    profileName.textContent;


  editBio.value =
    profileBio.textContent;

    "flex";

}

/* =====================================================
   SAVE PROFILE
===================================================== */

async function saveProfile(){

  if(!currentUser){
    return;
  }


  const username =
    editUsername.value.trim();


  const bio =
    editBio.value.trim();


  if(!username){

    saveStatus.textContent =
      "Username cannot be empty.";

    return;

  }


  saveStatus.textContent =
    "Saving...";


  try{

    await db
      .collection("users")
      .doc(currentUser.uid)
      .set({

        username:
          username,

        bio:
          bio,

        updatedAt:
          firebase.firestore
            .FieldValue
            .serverTimestamp()

      },{

        merge:true

      });


    await currentUser.updateProfile({

      displayName:
        username

    });


    profileUserData.username =
      username;

    profileUserData.bio =
      bio;


    displayProfile(
      username,
      bio
    );


    saveStatus.textContent =
      "Saved ✓";


    setTimeout(
      closeEdit,
      600
    );


  }catch(error){

    console.error(
      "SAVE PROFILE ERROR:",
      error
    );


    saveStatus.textContent =
      "Could not save profile.";

  }

}

async function shareProfile(){

    title:
      "JSP TAYSU • " +
      profileName.textContent,

    text:

    url:
      window.location.href

  try{

    if(navigator.share){

    console.log(

}

/* =====================================================
   TIME
===================================================== */

function formatPostTime(timestamp){

  if(!timestamp){

    return "Just now";

  }


  const date =
    timestamp.toDate
      ?
    timestamp.toDate()
      :
    new Date(timestamp);


  const diff =
    Date.now() -
    date.getTime();


  const seconds =
    Math.floor(
      diff / 1000
    );


  if(seconds < 60){

    return "Just now";

  }


  const minutes =
    Math.floor(
      seconds / 60
    );


  if(minutes < 60){

    return minutes + "m";

  }


  const hours =
    Math.floor(
      minutes / 60
    );


  if(hours < 24){

    return hours + "h";

  }


  const days =
    Math.floor(
      hours / 24
    );


  if(days < 7){

    return days + "d";

  }


  return date.toLocaleDateString(
    undefined,
    {
      day:"numeric",
      month:"short"
    }
  );

}


/* =====================================================
   SECURITY
===================================================== */

function escapeHTML(text){

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text == null
      ? ""
      : String(text);


  return div.innerHTML;

}


function escapeAttribute(text){

  return String(text)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    );

}
