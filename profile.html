<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile • JSP TAYSU</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#0b0d12;
  color:#f5f5f5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  padding-bottom:75px;
}

/* TOP BAR */

.topbar{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid #252832;
  position:sticky;
  top:0;
  background:#0b0d12;
  z-index:20;
}

.back{
  font-size:31px;
  cursor:pointer;
}

.username-title{
  font-size:21px;
  font-weight:700;
}

.more{
  font-size:27px;
  letter-spacing:3px;
  cursor:pointer;
}

/* PROFILE */

.profile{
  padding:18px 20px 0;
}

.profile-top{
  display:flex;
  align-items:center;
  gap:25px;
}

.avatar{
  width:110px;
  height:110px;
  border-radius:50%;
  background:#006b57;
  border:4px solid #20242e;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:52px;
  font-weight:400;
  overflow:hidden;
  flex-shrink:0;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.stats{
  flex:1;
  display:flex;
  justify-content:space-between;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:22px;
  font-weight:700;
}

.stat span{
  color:#9da1ac;
  font-size:15px;
  margin-top:5px;
  display:block;
}

/* INFO */

.info{
  margin-top:28px;
}

.name{
  font-size:25px;
  font-weight:750;
}

.bio{
  margin-top:8px;
  color:#d5d6da;
  font-size:18px;
  line-height:1.4;
}

.org{
  margin-top:8px;
  color:#9699a4;
  font-size:16px;
}

/* BUTTONS */

.buttons{
  display:flex;
  gap:12px;
  margin-top:20px;
}

.btn{
  flex:1;
  height:50px;
  border:none;
  border-radius:13px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.edit{
  background:#f1f1f3;
  color:#111318;
}

.share{
  background:#1d212a;
  color:white;
  border:1px solid #2b303b;
}

/* HIGHLIGHTS */

.highlights{
  display:flex;
  gap:22px;
  margin-top:27px;
  overflow-x:auto;
  padding-bottom:23px;
}

.highlight{
  min-width:72px;
  text-align:center;
  color:#b7b9c1;
  font-size:14px;
}

.highlight-circle{
  width:70px;
  height:70px;
  border-radius:50%;
  border:3px solid #292e39;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:auto;
  font-size:29px;
  background:#151820;
}

.highlight-name{
  margin-top:8px;
}

/* POST HEADER */

.post-header{
  height:58px;
  border-top:1px solid #272b34;
  border-bottom:1px solid #272b34;
  display:flex;
  align-items:center;
  justify-content:center;
}

.post-icon{
  font-size:25px;
  color:white;
}

/* POSTS */

.posts{
  min-height:430px;
  padding-bottom:20px;
}

.empty{
  height:390px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#d5d6dc;
  font-size:17px;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:72px;
  background:#0b0d12;
  border-top:1px solid #252832;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:30;
}

.nav-item{
  color:#858995;
  text-align:center;
  font-size:13px;
  cursor:pointer;
}

.nav-item .icon{
  font-size:27px;
  display:block;
  margin-bottom:3px;
}

.nav-item.active{
  color:white;
}

.create-icon{
  font-size:34px !important;
}

/* MENU */

.menu{
  display:none;
  position:fixed;
  top:68px;
  right:14px;
  width:150px;
  background:#1b1e26;
  border:1px solid #303541;
  border-radius:13px;
  overflow:hidden;
  z-index:100;
  box-shadow:0 12px 35px rgba(0,0,0,.5);
}

.menu button{
  width:100%;
  padding:15px;
  border:0;
  background:none;
  color:#fff;
  text-align:left;
  font-size:15px;
  cursor:pointer;
}

.menu button:hover{
  background:#272b34;
}

.signout{
  color:#ff5d6c !important;
}

/* MODAL */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  z-index:200;
  align-items:flex-end;
}

.modal{
  width:100%;
  background:#171a21;
  border-radius:24px 24px 0 0;
  padding:24px 20px 35px;
  border-top:1px solid #30343e;
}

.modal-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px;
}

.modal-title h2{
  font-size:22px;
}

.close{
  font-size:27px;
  color:#aaa;
  cursor:pointer;
}

.field{
  margin-bottom:17px;
}

.field label{
  display:block;
  color:#999da8;
  font-size:14px;
  margin-bottom:7px;
}

.field input,
.field textarea{
  width:100%;
  background:#0e1015;
  border:1px solid #30343e;
  color:white;
  border-radius:12px;
  padding:14px;
  font-size:16px;
  outline:none;
}

.field textarea{
  min-height:100px;
  resize:none;
}

.field input:focus,
.field textarea:focus{
  border-color:#777d8b;
}

.save{
  width:100%;
  height:50px;
  border:0;
  border-radius:13px;
  background:#f2f2f4;
  color:#111;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.status{
  text-align:center;
  margin-top:10px;
  font-size:14px;
  color:#aaa;
}

/* LOADING */

.loading{
  position:fixed;
  inset:0;
  background:#0b0d12;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:500;
}

.loader{
  width:30px;
  height:30px;
  border:3px solid #333743;
  border-top-color:white;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

@media(min-width:700px){
  body{
    max-width:650px;
    margin:auto;
  }

  .bottom-nav{
    max-width:650px;
    margin:auto;
  }
}
</style>
</head>

<body>

<!-- LOADING -->

<div class="loading" id="loading">
  <div class="loader"></div>
</div>

<!-- TOP BAR -->

<header class="topbar">

  <div class="back" onclick="goHome()">‹</div>

  <div class="username-title" id="topUsername">
    Profile
  </div>

  <div class="more" onclick="toggleMenu()">
    •••
  </div>

</header>

<!-- MENU -->

<div class="menu" id="menu">

  <button class="signout" onclick="signOut()">
    Sign out
  </button>

</div>

<!-- PROFILE -->

<main class="profile">

  <section class="profile-top">

    <div class="avatar" id="avatar">
      D
    </div>

    <div class="stats">

      <div class="stat">
        <strong id="postCount">0</strong>
        <span>posts</span>
      </div>

      <div class="stat">
        <strong>0</strong>
        <span>followers</span>
      </div>

      <div class="stat">
        <strong>0</strong>
        <span>following</span>
      </div>

    </div>

  </section>

  <section class="info">

    <div class="name" id="profileName">
      Tsao khun Tonmoy
    </div>

    <div class="bio" id="profileBio">
      Building and preserving our heritage.
    </div>

    <div class="org">
      JSP TAYSU • Tai Ahom Youth & Students Union
    </div>

  </section>

  <!-- BUTTONS -->

  <div class="buttons">

    <button class="btn edit" onclick="openEdit()">
      Edit profile
    </button>

    <button class="btn share" onclick="shareProfile()">
      Share profile
    </button>

  </div>

  <!-- HIGHLIGHTS -->

  <div class="highlights">

    <div class="highlight">
      <div class="highlight-circle">+</div>
      <div class="highlight-name">New</div>
    </div>

    <div class="highlight">
      <div class="highlight-circle">🐉</div>
      <div class="highlight-name">Heritage</div>
    </div>

    <div class="highlight">
      <div class="highlight-circle">✦</div>
      <div class="highlight-name">Culture</div>
    </div>

    <div class="highlight">
      <div class="highlight-circle">T</div>
      <div class="highlight-name">Community</div>
    </div>

  </div>

</main>

<!-- POSTS -->

<section class="post-header">

  <div class="post-icon">
    ▦
  </div>

</section>

<section class="posts">

  <div class="empty" id="emptyPosts">
    No posts yet 🌙
  </div>

</section>

<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <div class="nav-item" onclick="goHome()">
    <span class="icon">⌂</span>
    Home
  </div>

  <div class="nav-item" onclick="goExplore()">
    <span class="icon">⌕</span>
    Explore
  </div>

  <div class="nav-item" onclick="goCreate()">
    <span class="icon create-icon">＋</span>
    Create
  </div>

  <div class="nav-item" onclick="goAlerts()">
    <span class="icon">♧</span>
    Alerts
  </div>

  <div class="nav-item active">
    <span class="icon">♙</span>
    Profile
  </div>

</nav>

<!-- EDIT PROFILE MODAL -->

<div class="overlay" id="editOverlay">

  <div class="modal">

    <div class="modal-title">

      <h2>Edit profile</h2>

      <div class="close" onclick="closeEdit()">×</div>

    </div>

    <div class="field">

      <label>Username</label>

      <input
        type="text"
        id="editUsername"
        maxlength="40"
        placeholder="Enter username"
      >

    </div>

    <div class="field">

      <label>Bio</label>

      <textarea
        id="editBio"
        maxlength="160"
        placeholder="Write something about yourself..."
      ></textarea>

    </div>

    <button class="save" onclick="saveProfile()">
      Save changes
    </button>

    <div class="status" id="saveStatus"></div>

  </div>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

/* =====================================================
   FIREBASE CONFIG
   ===================================================== */

const firebaseConfig = {

  apiKey: "YOUR_API_KEY",

  authDomain: "YOUR_PROJECT.firebaseapp.com",

  projectId: "YOUR_PROJECT_ID",

  storageBucket: "YOUR_PROJECT.appspot.com",

  messagingSenderId: "YOUR_MESSAGING_SENDER_ID",

  appId: "YOUR_APP_ID"

};


/* =====================================================
   FIREBASE INIT
   ===================================================== */

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();


/* =====================================================
   ELEMENTS
   ===================================================== */

const loading = document.getElementById("loading");

const profileName = document.getElementById("profileName");
const profileBio = document.getElementById("profileBio");
const topUsername = document.getElementById("topUsername");
const avatar = document.getElementById("avatar");

const editOverlay = document.getElementById("editOverlay");

const editUsername = document.getElementById("editUsername");
const editBio = document.getElementById("editBio");

const saveStatus = document.getElementById("saveStatus");

const menu = document.getElementById("menu");


/* =====================================================
   AUTH STATE
   ===================================================== */

auth.onAuthStateChanged(async user => {

  if(!user){

    window.location.href = "index.html";

    return;
  }

  await loadProfile(user);

  loading.style.display = "none";

});


/* =====================================================
   LOAD PROFILE
   ===================================================== */

async function loadProfile(user){

  try{

    const ref = db.collection("users").doc(user.uid);

    const snap = await ref.get();

    let username =
      user.displayName ||
      user.email?.split("@")[0] ||
      "Member";

    let bio =
      "Building and preserving our heritage.";

    if(snap.exists){

      const data = snap.data();

      if(data.username){
        username = data.username;
      }

      if(data.bio){
        bio = data.bio;
      }

    }else{

      await ref.set({

        username: username,
        bio: bio,
        email: user.email || "",
        createdAt: firebase.firestore.FieldValue.serverTimestamp()

      }, {merge:true});

    }

    displayProfile(username,bio);

  }catch(error){

    console.error(error);

    displayProfile(
      user.displayName || "Member",
      "Building and preserving our heritage."
    );

  }

}


/* =====================================================
   DISPLAY PROFILE
   ===================================================== */

function displayProfile(username,bio){

  profileName.textContent = username;

  topUsername.textContent = username;

  profileBio.textContent = bio;

  const firstLetter =
    username.trim().charAt(0).toUpperCase() || "D";

  avatar.innerHTML = firstLetter;

}


/* =====================================================
   EDIT PROFILE
   ===================================================== */

function openEdit(){

  editUsername.value =
    profileName.textContent;

  editBio.value =
    profileBio.textContent;

  saveStatus.textContent = "";

  editOverlay.style.display = "flex";

}


function closeEdit(){

  editOverlay.style.display = "none";

}


/* =====================================================
   SAVE PROFILE
   ===================================================== */

async function saveProfile(){

  const user = auth.currentUser;

  if(!user){

    saveStatus.textContent =
      "Please sign in again.";

    return;

  }

  const username =
    editUsername.value.trim();

  const bio =
    editBio.value.trim();

  if(!username){

    saveStatus.textContent =
      "Username cannot be empty.";

    return;

  }

  saveStatus.textContent =
    "Saving...";

  try{

    await db.collection("users")
      .doc(user.uid)
      .set({

        username: username,

        bio: bio,

        updatedAt:
          firebase.firestore.FieldValue.serverTimestamp()

      }, {merge:true});


    /* Update Firebase Auth display name */

    await user.updateProfile({

      displayName: username

    });


    displayProfile(username,bio);

    saveStatus.textContent =
      "Saved ✓";

    setTimeout(() => {

      closeEdit();

    },700);


  }catch(error){

    console.error(error);

    saveStatus.textContent =
      "Could not save. Check Firestore rules.";

  }

}


/* =====================================================
   THREE DOT MENU
   ===================================================== */

function toggleMenu(){

  if(menu.style.display === "block"){

    menu.style.display = "none";

  }else{

    menu.style.display = "block";

  }

}


/* CLOSE MENU WHEN CLICKING OUTSIDE */

document.addEventListener("click",function(event){

  if(
    !event.target.closest(".more") &&
    !event.target.closest(".menu")
  ){

    menu.style.display = "none";

  }

});


/* =====================================================
   SIGN OUT
   ===================================================== */

async function signOut(){

  try{

    await auth.signOut();

    window.location.href = "index.html";

  }catch(error){

    console.error(error);

    alert("Sign out failed. Please try again.");

  }

}


/* =====================================================
   SHARE PROFILE
   ===================================================== */

async function shareProfile(){

  const shareData = {

    title: "JSP TAYSU",

    text:
      "Check out this profile on JSP TAYSU.",

    url:
      window.location.href

  };

  try{

    if(navigator.share){

      await navigator.share(shareData);

    }else{

      await navigator.clipboard.writeText(
        window.location.href
      );

      alert("Profile link copied!");

    }

  }catch(error){

    console.log(error);

  }

}


/* =====================================================
   NAVIGATION
   ===================================================== */

function goHome(){

  window.location.href = "community.html";

}

function goExplore(){

  window.location.href = "explore.html";

}

function goCreate(){

  window.location.href = "create.html";

}

function goAlerts(){

  window.location.href = "alerts.html";

}


/* =====================================================
   CLOSE MODAL WHEN CLICKING BACKDROP
   ===================================================== */

editOverlay.addEventListener("click",function(event){

  if(event.target === editOverlay){

    closeEdit();

  }

});

</script>

</body>
</html>
