<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Profile • JSP TAYSU</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#0b0d12;
  color:#f5f5f5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  padding-bottom:30px;
}

/* ================= TOP BAR ================= */

.topbar{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  border-bottom:1px solid #252832;
  position:sticky;
  top:0;
  background:rgba(11,13,18,.96);
  backdrop-filter:blur(15px);
  z-index:50;
}

.back{
  width:42px;
  font-size:31px;
  cursor:pointer;
  color:#fff;
  line-height:1;
}

.username-title{
  font-size:18px;
  font-weight:750;
  max-width:230px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.more{
  width:42px;
  text-align:right;
  font-size:22px;
  letter-spacing:2px;
  cursor:pointer;
}

/* ================= PROFILE ================= */

.profile{
  padding:18px 16px 0;
}

.profile-top{
  display:flex;
  align-items:center;
  gap:20px;
}

.avatar{
  width:88px;
  height:88px;
  min-width:88px;
  border-radius:50%;
  background:#006b57;
  border:2px solid #292d37;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  font-weight:650;
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.stats{
  flex:1;
  display:flex;
  justify-content:space-between;
  text-align:center;
}

.stat{
  min-width:65px;
  cursor:pointer;
}

.stat strong{
  display:block;
  font-size:18px;
  font-weight:750;
}

.stat span{
  display:block;
  margin-top:4px;
  color:#979ba6;
  font-size:12px;
}

.info{
  margin-top:17px;
}

.name{
  font-size:19px;
  font-weight:750;
}

.bio{
  margin-top:5px;
  color:#d3d5da;
  font-size:14px;
  line-height:1.4;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

/* ================= BUTTONS ================= */

.buttons{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.btn{
  flex:1;
  height:40px;
  border:0;
  border-radius:9px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  opacity:.6;
  cursor:default;
}

.edit,
.follow{
  background:#f1f1f3;
  color:#111318;
}

.following{
  background:#1b1e26;
  color:#fff;
  border:1px solid #30343e;
}

.message-btn{
  background:#1b1e26;
  color:#fff;
  border:1px solid #30343e;
}

/* ================= POSTS HEADER ================= */

.post-header{
  height:52px;
  margin-top:19px;
  border-top:1px solid #252832;
  border-bottom:1px solid #252832;
  display:flex;
  align-items:center;
  justify-content:center;
}

.post-icon{
  font-size:23px;
}

/* ================= MEDIA GRID ================= */

.posts{
  padding-bottom:25px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:2px;
}

.media-tile{
  position:relative;
  width:100%;
  aspect-ratio:1/1;
  background:#15181f;
  overflow:hidden;
  cursor:pointer;
}

.media-tile img,
.media-tile video{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

.media-tile video{
  pointer-events:none;
}

.reel-badge{
  position:absolute;
  right:7px;
  top:7px;
  background:rgba(0,0,0,.68);
  color:#fff;
  border-radius:7px;
  padding:4px 6px;
  font-size:10px;
  font-weight:750;
}

/* ================= EMPTY ================= */

.empty{
  grid-column:1/-1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#888d98;
  text-align:center;
  padding:42px 20px;
}

.empty-icon{
  font-size:32px;
  margin-bottom:8px;
}

.empty h3{
  color:#d7d8dc;
  font-size:15px;
  margin-bottom:4px;
}

.empty p{
  font-size:12px;
}

/* ================= TOP MENU ================= */

.menu{
  display:none;
  position:fixed;
  top:65px;
  right:12px;
  width:145px;
  background:#1b1e26;
  border:1px solid #303541;
  border-radius:12px;
  overflow:hidden;
  z-index:100;
  box-shadow:0 12px 35px rgba(0,0,0,.5);
}

.menu button{
  width:100%;
  padding:13px;
  border:0;
  background:none;
  color:#fff;
  text-align:left;
  font-size:14px;
  cursor:pointer;
}

.signout{
  color:#ff5d6c !important;
}

/* ================= EDIT MODAL ================= */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  z-index:200;
  align-items:flex-end;
}

.modal{
  width:100%;
  background:#171a21;
  border-radius:23px 23px 0 0;
  padding:22px 18px 32px;
  border-top:1px solid #30343e;
}

.modal-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:19px;
}

.modal-title h2{
  font-size:20px;
}

.close{
  font-size:27px;
  color:#aaa;
  cursor:pointer;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  color:#999da8;
  font-size:12px;
  margin-bottom:6px;
}

.field input,
.field textarea{
  width:100%;
  background:#0e1015;
  border:1px solid #30343e;
  color:#fff;
  border-radius:11px;
  padding:12px;
  font-size:14px;
  outline:none;
}

.field textarea{
  min-height:85px;
  resize:none;
}

/* ================= PROFILE PHOTO EDIT ================= */

.profile-photo-field{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:18px;
}

.edit-photo-preview{
  width:62px;
  height:62px;
  min-width:62px;
  border-radius:50%;
  background:#006b57;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  font-weight:700;
}

.edit-photo-preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.photo-picker{
  flex:1;
}

.photo-picker-title{
  color:#999da8;
  font-size:12px;
  margin-bottom:8px;
}

.edit-dp-button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  height:36px;
  padding:0 15px;
  border-radius:9px;
  background:#242833;
  border:1px solid #383d49;
  color:#fff;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
}

.edit-dp-button:active{
  transform:scale(.98);
}

.dp-file-input{
  display:none;
}

.dp-progress-wrap{
  display:none;
  margin-top:10px;
}

.dp-progress-track{
  width:100%;
  height:5px;
  background:#2a2e38;
  border-radius:10px;
  overflow:hidden;
}

.dp-progress-bar{
  width:0%;
  height:100%;
  background:#f1f1f3;
  border-radius:10px;
  transition:width .12s linear;
}

.dp-progress-text{
  margin-top:5px;
  color:#a8acb6;
  font-size:11px;
}

.save{
  width:100%;
  height:46px;
  border:0;
  border-radius:11px;
  background:#f2f2f4;
  color:#111;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}

.status{
  text-align:center;
  margin-top:8px;
  font-size:12px;
  color:#aaa;
}

/* ================= USER SHEET ================= */

.sheet-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.68);
  z-index:300;
  align-items:flex-end;
}

.sheet{
  width:100%;
  max-height:72vh;
  background:#15181f;
  border-radius:23px 23px 0 0;
  overflow:hidden;
  border-top:1px solid #30343e;
  animation:sheetUp .22s ease;
}

@keyframes sheetUp{
  from{transform:translateY(100%);}
  to{transform:translateY(0);}
}

.sheet-head{
  height:57px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid #292d36;
  position:relative;
}

.sheet-head:before{
  content:"";
  position:absolute;
  top:8px;
  width:38px;
  height:4px;
  border-radius:10px;
  background:#555a66;
}

.sheet-head h3{
  font-size:16px;
}

.sheet-close{
  position:absolute;
  right:17px;
  top:17px;
  color:#aaa;
  font-size:22px;
  cursor:pointer;
}

.user-list{
  overflow-y:auto;
  max-height:calc(72vh - 57px);
  padding:5px 0 20px;
}

.user-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 17px;
  cursor:pointer;
}

.user-row:active{
  background:#20232b;
}

.list-avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#006b57;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  overflow:hidden;
  flex-shrink:0;
}

.list-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.list-info{
  min-width:0;
}

.list-name{
  font-size:14px;
  font-weight:700;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.list-bio{
  color:#858995;
  font-size:11px;
  margin-top:2px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.sheet-empty{
  text-align:center;
  padding:45px 20px;
  color:#858995;
  font-size:13px;
}

/* ================= NORMAL POST VIEW ================= */

.post-viewer{
  display:none;
  position:fixed;
  inset:0;
  background:#0b0d12;
  z-index:600;
  overflow-y:auto;
}

.post-viewer-head{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px 0 16px;
  position:sticky;
  top:0;
  background:rgba(11,13,18,.96);
  backdrop-filter:blur(15px);
  border-bottom:1px solid #252832;
  z-index:20;
}

.post-viewer-left{
  display:flex;
  align-items:center;
  min-width:0;
}

.post-viewer-close{
  font-size:30px;
  line-height:1;
  cursor:pointer;
  margin-right:12px;
}

.post-viewer-title{
  font-size:16px;
  font-weight:700;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  max-width:210px;
}

.post-viewer-more{
  width:42px;
  height:42px;
  border:0;
  background:none;
  color:#fff;
  font-size:22px;
  letter-spacing:2px;
  cursor:pointer;
  display:none;
}

.post-viewer-content{
  width:100%;
  max-width:650px;
  margin:auto;
  padding-bottom:35px;
}

.post-author{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px 15px;
}

.post-author-avatar{
  width:38px;
  height:38px;
  min-width:38px;
  border-radius:50%;
  background:#006b57;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:700;
}

.post-author-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.post-author-info{
  min-width:0;
}

.post-author-name{
  font-size:14px;
  font-weight:750;
}

.post-time{
  color:#777c88;
  font-size:10px;
  margin-top:2px;
}

.post-media{
  width:100%;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:260px;
}

.post-media img,
.post-media video{
  width:100%;
  max-height:72vh;
  display:block;
  object-fit:contain;
}

.post-media video{
  background:#000;
}

.post-caption{
  padding:13px 15px 5px;
  color:#e4e5e8;
  font-size:14px;
  line-height:1.5;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.post-actions{
  display:flex;
  align-items:center;
  gap:18px;
  padding:10px 15px 4px;
}

.post-action{
  display:flex;
  align-items:center;
  gap:5px;
  border:0;
  background:none;
  color:#fff;
  cursor:pointer;
  font-size:13px;
  padding:4px 0;
}

.post-action-icon{
  width:28px;
  height:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  line-height:1;
}

.post-action.liked{
  color:#ff5368;
}

.post-counts{
  padding:3px 15px 0;
  color:#9296a1;
  font-size:12px;
  font-weight:600;
}

.post-counts span{
  margin-right:13px;
}

.post-divider{
  height:1px;
  background:#252832;
  margin-top:12px;
}

.viewer-post-menu{
  display:none;
  position:fixed;
  top:66px;
  right:13px;
  width:150px;
  background:#1b1e26;
  border:1px solid #303541;
  border-radius:12px;
  overflow:hidden;
  z-index:800;
  box-shadow:0 12px 35px rgba(0,0,0,.55);
}

.viewer-post-menu button{
  width:100%;
  padding:13px;
  border:0;
  background:none;
  color:#fff;
  text-align:left;
  font-size:14px;
  cursor:pointer;
}

.viewer-post-menu .delete-post{
  color:#ff5368;
}

/* ================= COMMENTS ================= */

.comment-backdrop{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.46);
  z-index:700;
}

.comment-sheet{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:46vh;
  max-height:520px;
  background:#15181f;
  border-radius:22px 22px 0 0;
  border-top:1px solid #30343e;
  z-index:701;
  transform:translateY(100%);
  transition:transform .22s ease;
  display:flex;
  flex-direction:column;
}

.comment-sheet.open{
  transform:translateY(0);
}

.comment-sheet-head{
  height:52px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid #292d36;
  position:relative;
  flex-shrink:0;
}

.comment-sheet-head:before{
  content:"";
  position:absolute;
  top:8px;
  width:38px;
  height:4px;
  border-radius:10px;
  background:#555a66;
}

.comment-sheet-head h3{
  font-size:15px;
}

.comment-sheet-close{
  position:absolute;
  right:17px;
  top:14px;
  font-size:22px;
  color:#aaa;
  cursor:pointer;
}

.comment-list-sheet{
  overflow:auto;
  padding:12px 15px;
  flex:1;
}

.comment-row{
  display:flex;
  gap:9px;
  margin-bottom:13px;
}

.comment-row-avatar{
  width:30px;
  height:30px;
  min-width:30px;
  border-radius:50%;
  background:#006b57;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  font-weight:700;
}

.comment-row-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.comment-row-content{
  min-width:0;
  flex:1;
}

.comment-row-name{
  font-size:12px;
  font-weight:750;
}

.comment-row-text{
  font-size:12px;
  color:#d1d3d8;
  line-height:1.4;
  margin-top:2px;
  overflow-wrap:anywhere;
}

.comment-row-meta{
  font-size:10px;
  color:#777c88;
  margin-top:4px;
}

.comment-reply{
  border:0;
  background:none;
  color:#999da8;
  font-size:10px;
  padding:4px 0;
  cursor:pointer;
}

.view-replies{
  border:0;
  background:none;
  color:#aaa;
  font-size:10px;
  padding:4px 0;
  cursor:pointer;
  display:block;
}

.reply-list{
  display:none;
  margin-top:5px;
  padding-left:16px;
}

.reply-list.open{
  display:block;
}

.comment-input-row{
  display:flex;
  gap:7px;
  padding:10px 12px;
  border-top:1px solid #292d36;
  background:#15181f;
}

.sheet-comment-input{
  flex:1;
  min-width:0;
  height:38px;
  background:#0e1015;
  border:1px solid #30343e;
  border-radius:20px;
  color:#fff;
  padding:0 13px;
  outline:none;
  font-size:13px;
}

.sheet-comment-send{
  height:38px;
  padding:0 14px;
  border:0;
  border-radius:20px;
  background:#f1f1f3;
  color:#111;
  font-weight:700;
  cursor:pointer;
}

@media(max-width:420px){

  .profile-top{
    gap:16px;
  }

  .avatar{
    width:84px;
    height:84px;
    min-width:84px;
  }

  .stat strong{
    font-size:17px;
  }

  .post-viewer-title{
    max-width:180px;
  }

  .post-actions{
    gap:15px;
  }

}

@media(min-width:700px){

  body{
    max-width:650px;
    margin:auto;
  }

  .comment-sheet{
    left:50%;
    right:auto;
    width:650px;
    transform:translate(-50%,100%);
  }

  .comment-sheet.open{
    transform:translate(-50%,0);
  }

  .post-viewer{
    left:50%;
    width:650px;
    transform:translateX(-50%);
  }

}
</style>
</head>

<body>

<header class="topbar">

  <div class="back" onclick="goBack()">‹</div>

  <div class="username-title" id="topUsername">
    Profile
  </div>

  <div class="more" onclick="toggleTopMenu()">
    •••
  </div>

</header>

<div class="menu" id="topMenu">

  <button class="signout" onclick="signOut()">
    Sign out
  </button>

</div>

<main class="profile">

  <section class="profile-top">

    <div class="avatar" id="avatar">
      M
    </div>

    <div class="stats">

      <div class="stat">
        <strong id="postCount">0</strong>
        <span>posts</span>
      </div>

      <div class="stat" onclick="openUserList('followers')">
        <strong id="followersCount">0</strong>
        <span>followers</span>
      </div>

      <div class="stat" onclick="openUserList('following')">
        <strong id="followingCount">0</strong>
        <span>following</span>
      </div>

    </div>

  </section>

  <section class="info">

    <div class="name" id="profileName">
      Member
    </div>

    <div class="bio" id="profileBio">
      Building and preserving our heritage.
    </div>

  </section>

  <div class="buttons" id="profileButtons"></div>

</main>

<section class="post-header">
  <div class="post-icon">▦</div>
</section>

<section class="posts" id="posts">

  <div class="empty">

    <div class="empty-icon">◌</div>

    <h3>Loading posts...</h3>

    <p>Please wait a moment.</p>

  </div>

</section>

<!-- ================= EDIT PROFILE ================= -->

<div class="overlay" id="editOverlay">

  <div class="modal">

    <div class="modal-title">

      <h2>Edit profile</h2>

      <div class="close" onclick="closeEdit()">×</div>

    </div>

    <div class="profile-photo-field">

      <div class="edit-photo-preview" id="editPhotoPreview">
        M
      </div>

      <div class="photo-picker">

        <div class="photo-picker-title">
          Profile photo
        </div>

        <label class="edit-dp-button" for="editPhotoInput">
          Edit DP
        </label>

        <input
          class="dp-file-input"
          type="file"
          id="editPhotoInput"
          accept="image/*">

        <div class="dp-progress-wrap" id="dpProgressWrap">

          <div class="dp-progress-track">

            <div
              class="dp-progress-bar"
              id="dpProgressBar">
            </div>

          </div>

          <div class="dp-progress-text" id="dpProgressText">
            0%
          </div>

        </div>

      </div>

    </div>

    <div class="field">

      <label>Username</label>

      <input
        type="text"
        id="editUsername"
        maxlength="40"
        placeholder="Enter username">

    </div>

    <div class="field">

      <label>Bio</label>

      <textarea
        id="editBio"
        maxlength="160"
        placeholder="Write something about yourself..."></textarea>

    </div>

    <button class="save" onclick="saveProfile()">
      Save changes
    </button>

    <div class="status" id="saveStatus"></div>

/* ================= VIDEO OPTIMIZATION ================= */

/*
  ImageKit URLs can automatically use
  suitable format + quality + width.

  Non-ImageKit URLs are returned unchanged.
*/
function getOptimizedVideoUrl(
  url,
  width = 720
){

  if(!url){
    return "";
  }

  try{

    const parsed =
      new URL(url);

    const host =
      parsed.hostname.toLowerCase();

    if(
      !host.includes("imagekit.io")
    ){

      return url;

    }

    const transformation =
      `tr:w-${width},q-auto,f-auto`;

    if(
      parsed.pathname.includes(
        "/tr:"
      )
    ){

      return url;

    }

    parsed.pathname =
      "/tr:" +
      transformation +
      parsed.pathname;

    return parsed.toString();

  }catch(error){

    return url;

  }

}

    window.location.origin +
    window.location.pathname +

    encodeURIComponent(
      post.authorId ||
      profileUserId
    ) +

    encodeURIComponent(
      post.id
    );

    title:
      "JSP TAYSU post",

    text:
      post.caption ||
      post.text ||
      "Check out this post on JSP TAYSU.",

    url:
      shareUrl

  };

  let shared =
    false;

  try{

    if(navigator.share){

      await navigator.share(
        shareData
      );

      shared =
        true;

    }else{

      await navigator.clipboard.writeText(
        shareUrl
      );

      alert(
        "Post link copied!"
      );

      shared =
        true;

    }

  }catch(error){

    console.log(
      "Share cancelled."
    );

    return;

  }

  if(shared){

    try{

      await db
        .collection("posts")
        .doc(post.id)
        .collection("shares")
        .add({

          userId:
            currentUser.uid,

          createdAt:
            firebase.firestore
              .FieldValue
              .serverTimestamp()

        });

      const newCount =
        await getShareCount(
          post.id
        );

      if(activePost?.id === post.id){

        updatePostShareUI(
          newCount
        );

      }

    }catch(error){

      console.error(
        "SHARE COUNT ERROR:",
        error
      );

    }

  }

}

/* ================= DELETE POST ================= */

async function deleteActivePost(){

  if(
    !currentUser ||
    !activePost ||
    activePost.authorId !==
      currentUser.uid
  ){

    return;

  }

  closeViewerPostMenu();

  const postId =
    activePost.id;

  try{

    /*
      Delete ONLY the main post document.

      We intentionally do NOT delete
      likes/comments/shares first because
      doing that can trigger permissions
      on individual child documents.

      Once the parent post is deleted,
      the post disappears from the profile/feed.
    */

    await db
      .collection("posts")
      .doc(postId)
      .delete();

    activePost =
      null;

    closeComments();

    postMedia.innerHTML =
      "";

    postViewer.style.display =
      "none";

    document.body.style.overflow =
      "";

    profilePosts =
      profilePosts.filter(
        post =>
          post.id !== postId
      );

    postCount.textContent =
      profilePosts.length;

    const tile =
      Array.from(
        postsContainer.children
      ).find(
        tile =>
          tile.dataset.postId ===
          postId
      );

    if(tile){
      tile.remove();
    }else{

      await loadPosts();

    }

    if(
      profilePosts.length === 0
    ){

      postsContainer.innerHTML = `

        <div class="empty">

          <div class="empty-icon">✦</div>

          <h3>No posts yet</h3>

          <p>Photos and reels will appear here.</p>

        </div>

      `;

    }

  }catch(error){

    console.error(
      "DELETE POST ERROR:",
      error
    );

    /*
      No popup here.
      Error is logged so the console
      can be checked if Firebase blocks it.
    */

  }

}

/* ================= LOAD COMMENTS ================= */

async function loadSheetComments(
  postId
){

  try{

    const snapshot =
      await db
        .collection("posts")
        .doc(postId)
        .collection("comments")
        .get();

    const comments =
      snapshot.docs.map(
        doc => ({

          id:
            doc.id,

          ...doc.data()

        })
      );

    comments.sort(
      (a,b) => {

        const aTime =
          a.createdAt?.seconds ||
          0;

        const bTime =
          b.createdAt?.seconds ||
          0;

        return aTime - bTime;

      }
    );

    const topLevel =
      comments.filter(
        comment =>
          !comment.parentId
      );

    const replies =
      comments.filter(
        comment =>
          comment.parentId
      );

    commentListSheet.innerHTML =
      "";

    if(topLevel.length === 0){

      commentListSheet.innerHTML = `

        <div class="sheet-empty">
          No comments yet.
        </div>

      `;

      updatePostCommentUI(
        0
      );

      return;

    }

    topLevel.forEach(
      comment => {

        const row =
          createCommentRow(
            comment
          );

        const childReplies =
          replies.filter(
            reply =>
              reply.parentId ===
              comment.id
          );

        if(
          childReplies.length
        ){

          const viewButton =
            document.createElement(
              "button"
            );

          viewButton.className =
            "view-replies";

          viewButton.textContent =
            `View ${childReplies.length} replies`;

          const replyList =
            document.createElement(
              "div"
            );

          replyList.className =
            "reply-list";

          childReplies.forEach(
            reply => {

              replyList.appendChild(
                createCommentRow(
                  reply,
                  true
                )
              );

            }
          );

          viewButton.addEventListener(
            "click",
            () => {

              replyList.classList.toggle(
                "open"
              );

              viewButton.textContent =
                replyList.classList.contains(
                  "open"
                )
                  ? "Hide replies"
                  : `View ${childReplies.length} replies`;

            }
          );

          row
            .querySelector(
              ".comment-row-content"
            )
            .appendChild(
              viewButton
            );

          row
            .querySelector(
              ".comment-row-content"
            )
            .appendChild(
              replyList
            );

        }

        commentListSheet.appendChild(
          row
        );

      }
    );

    updatePostCommentUI(
      comments.length
    );

  }catch(error){

    console.error(
      "COMMENTS LOAD ERROR:",
      error
    );

    commentListSheet.innerHTML = `

      <div class="sheet-empty">
        Couldn't load comments.
      </div>

    `;

  }

}

async function openUserList(

    type === "followers"
      ? "Followers"
      : "Following";

  userList.innerHTML = `

      Loading...
    </div>

  `;

  try{

    let snapshot;

    if(type === "followers"){

      snapshot =
        await db
          .collection("follows")
          .where(
            "followingId",
            "==",
            profileUserId
          )
          .get();

    }else{

      snapshot =
        await db
          .collection("follows")
          .where(
            "followerId",
            "==",
            profileUserId
          )
          .get();

    }

    const ids =
      snapshot.docs
        .map(doc => {

          const data =
            doc.data() || {};

          return type === "followers"
            ? data.followerId
            : data.followingId;

        })
        .filter(Boolean);

    if(type === "followers"){

      followersCount.textContent =
        ids.length;

    }else{

      followingCount.textContent =
        ids.length;

    }

    if(ids.length === 0){

      userList.innerHTML = `

        <div class="sheet-empty">

          ${
            type === "followers"
              ? "No followers yet."
              : "Not following anyone yet."
          }

        </div>

      `;

      return;

    }

    const snapshots =
      await Promise.all(
        ids.map(
          uid =>
            db
              .collection("users")
              .doc(uid)
              .get()
        )
      );

    const users = [];

    snapshots.forEach(
      (snap,index) => {

        if(snap.exists){

          users.push({

            uid:
              ids[index],

            ...snap.data()

          });

        }

      }
    );

    userList.innerHTML =
      "";

    users.forEach(
      user => {

        renderUserRow(
          user
        );

      }
    );

  }catch(error){

    console.error(
      "USER LIST ERROR:",
      error
    );

    userList.innerHTML = `

      <div class="sheet-empty">
        Couldn't load users.
      </div>

    `;

  }

}

/* ================= IMAGEKIT UPLOAD ================= */

function uploadProfilePhoto(
  file,
  onProgress
){

  return new Promise(
    async (resolve,reject) => {

      try{

        if(!file){

          resolve(null);
          return;

        }

        if(
          !file.type.startsWith("image/")
        ){

          reject(
            new Error(
              "Please select an image file."
            )
          );

          return;

        }

        if(
          file.size >
          25 * 1024 * 1024
        ){

          reject(
            new Error(
              "Profile photo must be 25MB or smaller."
            )
          );

          return;

        }

        const authResponse =
          await fetch(
            IMAGEKIT_AUTH_URL
          );

        if(!authResponse.ok){

          reject(
            new Error(
              "ImageKit authentication failed."
            )
          );

          return;

        }

        const authData =
          await authResponse.json();

        const safeName =
          file.name.replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );

        const formData =
          new FormData();

        formData.append(
          "file",
          file
        );

        formData.append(
          "fileName",
          Date.now() +
          "_" +
          safeName
        );

        formData.append(
          "publicKey",
          IMAGEKIT_PUBLIC_KEY
        );

        formData.append(
          "signature",
          authData.signature
        );

        formData.append(
          "expire",
          String(authData.expire)
        );

        formData.append(
          "token",
          authData.token
        );

        formData.append(
          "useUniqueFileName",
          "true"
        );

        formData.append(
          "folder",
          "profile/" +
          currentUser.uid
        );

        const xhr =
          new XMLHttpRequest();

        xhr.open(
          "POST",
          IMAGEKIT_UPLOAD_URL
        );

        xhr.upload.onprogress =
          event => {

            if(event.lengthComputable){

              const percent =
                Math.round(
                  event.loaded /
                  event.total *
                  100
                );

              if(onProgress){
                onProgress(percent);
              }

            }

          };

        xhr.onload =
          () => {

            if(
              xhr.status < 200 ||
              xhr.status >= 300
            ){

              reject(
                new Error(
                  "ImageKit upload failed."
                )
              );

              return;

            }

            try{

              const result =
                JSON.parse(
                  xhr.responseText
                );

              if(!result.url){

                reject(
                  new Error(
                    "ImageKit did not return a photo URL."
                  )
                );

                return;

              }

              resolve(
                result.url
              );

            }catch(error){

              reject(
                new Error(
                  "Invalid ImageKit response."
                )
              );

            }

          };

        xhr.onerror =
          () => {

            reject(
              new Error(
                "Network error while uploading photo."
              )
            );

          };

        xhr.send(
          formData
        );

      }catch(error){

        reject(error);

      }

    }
  );

}

/* ================= SAVE PROFILE ================= */

async function saveProfile(){

  if(!currentUser){
    return;
  }

  const username =
    editUsername.value.trim();

  const bio =
    editBio.value.trim();

  const photoFile =
    editPhotoInput.files?.[0] ||
    null;

  if(!username){

    saveStatus.textContent =
      "Username cannot be empty.";

    return;

  }

  saveStatus.textContent =
    photoFile
      ? "Uploading photo..."
      : "Saving...";

  try{

    let photoURL =
      profileUserData?.photoURL ||
      profileUserData?.photoUrl ||
      currentUser.photoURL ||
      "";

    if(photoFile){

      dpProgressWrap.style.display =
        "block";

      photoURL =
        await uploadProfilePhoto(
          photoFile,
          percent => {

            dpProgressBar.style.width =
              percent + "%";

            dpProgressText.textContent =
              percent + "%";

          }
        );

    }

    await db
      .collection("users")
      .doc(currentUser.uid)
      .set({

        username:
          username,

        bio:
          bio,

        photoURL:
          photoURL,

        updatedAt:
          firebase.firestore
            .FieldValue
            .serverTimestamp()

      },{
        merge:true
      });

    await currentUser.updateProfile({

      displayName:
        username,

      photoURL:
        photoURL || null

    });

    profileUserData.username =
      username;

    profileUserData.bio =
      bio;

    profileUserData.photoURL =
      photoURL;

    displayProfile(
      username,
      bio
    );

    updateEditPhotoPreview();

    saveStatus.textContent =
      "Saved";

    setTimeout(
      closeEdit,
      600
    );

  }catch(error){

    console.error(
      "SAVE PROFILE ERROR:",
      error
    );

    saveStatus.textContent =
      error.message ||
      "Could not save profile.";

  }

}

/* ================= TIME ================= */

function formatPostTime(
  timestamp
){

  if(!timestamp){
    return "Just now";
  }

  const date =
    timestamp.toDate
      ?
      timestamp.toDate()
      :
      new Date(timestamp);

  const diff =
    Date.now() -
    date.getTime();

  const seconds =
    Math.floor(
      diff / 1000
    );

  if(seconds < 60){
    return "Just now";
  }

  const minutes =
    Math.floor(
      seconds / 60
    );

  if(minutes < 60){
    return minutes + "m";
  }

  const hours =
    Math.floor(
      minutes / 60
    );

  if(hours < 24){
    return hours + "h";
  }

  const days =
    Math.floor(
      hours / 24
    );

  if(days < 7){
    return days + "d";
  }

  return date.toLocaleDateString(
    undefined,
    {
      day:"numeric",
      month:"short"
    }
  );

}

/* ================= ESCAPE ================= */

function escapeHTML(
  text
){

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text == null
      ? ""
      : String(text);

  return div.innerHTML;

}

function escapeAttribute(
  text
){

  return String(text)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    );

}
