<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JSP TAYSU Community</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f7f4ed;
  color:#211c17;
  padding-bottom:82px;
}

/* ================================
   TOP BAR
================================ */

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  background:#4a392b;
  color:#fffdf9;
  padding:14px 16px;
  box-shadow:0 3px 15px rgba(64,48,32,.16);
}

.topbar-inner{
  max-width:720px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:17px;
  font-weight:800;
  letter-spacing:.4px;
}

.profile{
  max-width:170px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:13px;
  color:#eadfc9;
}

/* ================================
   CONTAINER
================================ */

.container{
  max-width:720px;
  margin:auto;
  padding:18px 14px 30px;
}

/* ================================
   WELCOME
================================ */

.welcome{
  padding:4px 4px 17px;
}

.welcome h1{
  font-size:26px;
  margin-bottom:6px;
  color:#211c17;
}

.welcome p{
  color:#81776b;
  font-size:13px;
}

/* ================================
   SEARCH
================================ */

.search-box{
  display:flex;
  gap:8px;
  margin-bottom:10px;
}

#userSearchInput{
  flex:1;
  padding:12px 14px;
  border:1px solid #ddd3c5;
  border-radius:14px;
  background:#fffdf9;
  color:#211c17;
  font-size:14px;
  outline:none;
}

#userSearchInput:focus{
  border-color:#ad8d5c;
}

#userSearchButton{
  border:0;
  border-radius:14px;
  padding:12px 15px;
  background:#4a392b;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

#userSearchButton:hover{
  background:#382b20;
}

#searchResults{
  margin-bottom:17px;
}

.search-result{
  background:#fffdf9;
  border:1px solid #e8e0d3;
  padding:12px 13px;
  border-radius:14px;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 3px 12px rgba(64,48,32,.04);
}

.search-result-user{
  font-weight:bold;
  color:#30251d;
}

.follow-button{
  border:0;
  border-radius:18px;
  padding:8px 14px;
  background:#4a392b;
  color:white;
  cursor:pointer;
  font-weight:700;
}

.follow-button:disabled{
  opacity:.6;
  cursor:default;
}

/* ================================
   CREATE POST
================================ */

.create-post{
  background:#fffdf9;
  border:1px solid #e8e0d3;
  border-radius:21px;
  padding:17px;
  margin-bottom:24px;
  box-shadow:0 7px 24px rgba(64,48,32,.06);
}

.composer-header{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:13px;
}

.avatar{
  width:44px;
  height:44px;
  flex-shrink:0;
  border-radius:50%;
  background:#4a392b;
  color:#f7e9c8;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  border:2px solid #eadfc9;
}

.composer-header strong{
  font-size:15px;
  color:#30251d;
}

.composer-header small{
  display:block;
  color:#8a8177;
  margin-top:3px;
  font-size:12px;
}

#postText{
  width:100%;
  min-height:95px;
  resize:vertical;
  border:1px solid #ddd3c5;
  border-radius:15px;
  padding:13px;
  font-family:inherit;
  font-size:15px;
  outline:none;
  background:#faf7f1;
  color:#211c17;
}

#postText:focus{
  background:#fff;
  border-color:#ad8d5c;
}

.post-options{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:12px;
}

.media-buttons{
  display:flex;
  gap:6px;
}

.media-buttons button{
  border:1px solid #e3dbcf;
  background:#f5eee4;
  color:#66594c;
  padding:8px 10px;
  border-radius:18px;
  cursor:pointer;
  font-size:12px;
}

.media-buttons button:hover{
  background:#eee4d4;
}

.post-btn{
  border:0;
  background:#4a392b;
  color:white;
  padding:10px 19px;
  border-radius:20px;
  font-weight:bold;
  cursor:pointer;
}

.post-btn:hover{
  background:#382b20;
}

/* ================================
   FEED TITLE
================================ */

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:0 3px 11px;
}

.section-title h2{
  font-size:19px;
  color:#493a2d;
}

.section-title span{
  font-size:19px;
}

/* ================================
   POSTS
================================ */

.post{
  background:#fffdf9;
  border:1px solid #e8e0d3;
  border-radius:18px;
  padding:15px 16px;
  margin-bottom:12px;
  box-shadow:0 5px 18px rgba(64,48,32,.05);
}

.post-header{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}

.post-author{
  font-size:14px;
  font-weight:800;
  color:#30251d;
}

.post-time{
  color:#8a8177;
  font-size:11px;
  margin-top:2px;
}

.post-text{
  line-height:1.55;
  margin-bottom:10px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  color:#302820;
  font-size:15px;
}

.actions{
  border-top:1px solid #eee6da;
  padding-top:7px;
  display:flex;
  gap:4px;
}

.action{
  border:0;
  background:none;
  color:#766b60;
  padding:7px 10px;
  border-radius:17px;
  cursor:pointer;
  font-size:12px;
}

.action:hover{
  background:#f3ede4;
  color:#493a2d;
}

.action:disabled{
  cursor:default;
  opacity:.65;
}

/* ================================
   EMPTY
================================ */

.empty{
  background:#fffdf9;
  border:1px solid #e8e0d3;
  border-radius:19px;
  text-align:center;
  padding:42px 20px;
  color:#81776b;
  box-shadow:0 5px 18px rgba(64,48,32,.04);
}

.empty-icon{
  font-size:34px;
  margin-bottom:8px;
}

.empty h3{
  color:#493a2d;
  margin-bottom:6px;
  font-size:17px;
}

.empty p{
  font-size:13px;
}

/* ================================
   LOGIN
================================ */

#communityLogin{
  background:#fffdf9;
  border:1px solid #e8e0d3;
  border-radius:18px;
  text-align:center;
  padding:20px;
  margin-bottom:15px;
  box-shadow:0 5px 18px rgba(64,48,32,.05);
}

/* ================================
   BOTTOM NAV
================================ */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:68px;
  z-index:200;

  background:rgba(255,253,249,.97);
  backdrop-filter:blur(10px);

  border-top:1px solid #e3dbcf;

  display:flex;
  justify-content:center;
  gap:4px;
  padding:7px 10px;
  box-shadow:0 -4px 18px rgba(64,48,32,.06);
}

.nav-item{
  flex:1;
  max-width:110px;
  border:0;
  background:none;
  color:#8a8177;
  cursor:pointer;
  border-radius:13px;
  font-size:18px;
  transition:.2s;
}

.nav-item span{
  display:block;
  font-size:10px;
  margin-top:3px;
}

.nav-item:hover{
  background:#f3ede4;
  color:#493a2d;
}

.nav-item.active{
  color:#4a392b;
  font-weight:bold;
}

/* ================================
   MOBILE
================================ */

@media(max-width:500px){

  .container{
    padding:15px 10px 25px;
  }

  .topbar{
    padding:13px 14px;
  }

  .logo{
    font-size:15px;
  }

  .profile{
    max-width:130px;
  }

  .welcome h1{
    font-size:23px;
  }

  .create-post{
    padding:14px;
    border-radius:19px;
  }

  .media-buttons button{
    padding:7px 8px;
    font-size:11px;
  }

  .post-btn{
    padding:9px 16px;
  }

  .post{
    padding:14px;
  }

  .bottom-nav{
    height:65px;
  }
}

</style>
</head>

<body>

<header class="topbar">

  <div class="topbar-inner">

    <div class="logo">
      🐉 JSP TAYSU
    </div>

    <div class="profile" id="profileName">
      Member
    </div>

  </div>

</header>


<main class="container">


  <!-- LOGIN -->

  <div id="communityLogin" style="display:none;">

    <p style="margin-bottom:12px;">
      Sign in to join the community 🐉
    </p>

    <button
      id="communityGoogleLogin"
      class="post-btn">

      Continue with Google

    </button>

  </div>


  <!-- WELCOME -->

  <section class="welcome">

    <h1 id="welcomeText">
      Welcome 👋
    </h1>

    <p>
      Connect. Share. Preserve our heritage.
    </p>

  </section>


  <!-- SEARCH -->

  <div class="search-box">

    <input
      type="text"
      id="userSearchInput"
      placeholder="Search members..."
      maxlength="30"
    >

    <button id="userSearchButton">
      🔎 Search
    </button>

  </div>


  <div id="searchResults"></div>


  <!-- CREATE POST -->

  <section class="create-post">

    <div class="composer-header">

      <div
        class="avatar"
        id="composerAvatar">

        M

      </div>

      <div>

        <strong id="composerName">
          Member
        </strong>

        <small>
          Share with the community
        </small>

      </div>

    </div>


    <textarea
      id="postText"
      placeholder="What's on your mind?"
    ></textarea>


    <div class="post-options">

      <div class="media-buttons">

        <button type="button">
          📷 Photo
        </button>

        <button type="button">
          🎥 Video
        </button>

      </div>


      <button
        class="post-btn"
        id="postButton">

        Post

      </button>

    </div>

  </section>


  <!-- COMMUNITY FEED -->

  <div class="section-title">

    <h2>
      Community Feed
    </h2>

    <span>
      🐉
    </span>

  </div>


  <section id="posts">

    <div class="empty">

      <div class="empty-icon">
        🐉
      </div>

      <h3>
        Loading community...
      </h3>

      <p>
        Please wait a moment.
      </p>

    </div>

  </section>

</main>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <button class="nav-item active">
    🏠
    <span>Home</span>
  </button>

  <button class="nav-item">
    🔥
    <span>Explore</span>
  </button>

  <button class="nav-item">
    ➕
    <span>Create</span>
  </button>

  <button class="nav-item">
    🔔
    <span>Alerts</span>
  </button>

  <button
    class="nav-item"
    id="profileNavButton">

    👤
    <span>Profile</span>

  </button>

</nav>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  GoogleAuthProvider,
  signInWithRedirect,
  setPersistence,
  browserLocalPersistence
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  serverTimestamp,
  doc,
  setDoc,
  getDoc,
    deleteDoc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ================================
   FIREBASE
================================ */

const firebaseConfig = {

  apiKey:
    "AIzaSyDpv2vqAZbCFgT_XJ4u-KB0AeZWVB2GIUs",

  authDomain:
    "jsp-taysu.firebaseapp.com",

  projectId:
    "jsp-taysu",

  storageBucket:
    "jsp-taysu.firebasestorage.app",

  messagingSenderId:
    "280992025632",

  appId:
    "1:280992025632:web:48efa21208a78be9a78045"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);

let currentUser = null;


/* ================================
   KEEP LOGIN
================================ */

await setPersistence(
  auth,
  browserLocalPersistence
);


/* ================================
   GOOGLE LOGIN
================================ */

const provider =
  new GoogleAuthProvider();

const communityLogin =
  document.getElementById(
    "communityLogin"
  );

const communityGoogleLogin =
  document.getElementById(
    "communityGoogleLogin"
  );


communityGoogleLogin.addEventListener(
  "click",
  async () => {

    try{

      await signInWithRedirect(
        auth,
        provider
      );

    }catch(error){

      console.error(error);

      alert(
        error.code +
        ": " +
        error.message
      );

    }

  }
);


/* ================================
   AUTH STATE
================================ */

onAuthStateChanged(
  auth,
  async (user) => {

    if(!user){

      currentUser = null;

      document.getElementById(
        "profileName"
      ).textContent =
        "Please sign in";

      communityLogin.style.display =
        "block";

      return;

    }


    currentUser =
      user;

    communityLogin.style.display =
      "none";


    let username =
      "Member";


    /* LOAD USERNAME */

    try{

      const profileRef =
        doc(
          db,
          "users",
          user.uid
        );


      const profileSnap =
        await getDoc(
          profileRef
        );


      if(
        profileSnap.exists() &&
        profileSnap.data().username
      ){

        username =
          profileSnap.data().username;

      }else if(user.displayName){

        username =
          user.displayName;

      }

    }catch(error){

      console.error(
        "Username loading error:",
        error
      );


      if(user.displayName){

        username =
          user.displayName;

      }

    }


    /* DISPLAY USER */

    document.getElementById(
      "profileName"
    ).textContent =
      username;


    document.getElementById(
      "composerName"
    ).textContent =
      username;


    document.getElementById(
      "composerAvatar"
    ).textContent =
      username
        .charAt(0)
        .toUpperCase();


    document.getElementById(
      "welcomeText"
    ).textContent =
      "Welcome, " +
      username +
      " 👋";


    await loadPosts();

  }
);


/* ================================
   CREATE POST
================================ */

document.getElementById(
  "postButton"
).addEventListener(
  "click",
  async () => {

    if(!currentUser){

      alert(
        "Please sign in first."
      );

      return;

    }


    const text =
      document.getElementById(
        "postText"
      ).value.trim();


    if(!text){

      alert(
        "Write something first!"
      );

      return;

    }


    const username =
      document.getElementById(
        "composerName"
      ).textContent ||
      "Member";


    try{

      await addDoc(
        collection(
          db,
          "posts"
        ),
        {

          text:
            text,

          authorId:
            currentUser.uid,

          authorName:
            username,

          createdAt:
            serverTimestamp()

        }
      );


      document.getElementById(
        "postText"
      ).value =
        "";


      await loadPosts();


      alert(
        "Post published! 🐉"
      );


    }catch(error){

      console.error(
        "Post error:",
        error
      );


      alert(
        error.code +
        ": " +
        error.message
      );

    }

  }
);


/* ================================
   LOAD POSTS
================================ */

async function loadPosts(){

  const postsContainer =
    document.getElementById("posts");

  try{

    const snapshot =
      await getDocs(
        collection(db, "posts")
      );

    postsContainer.innerHTML = "";

    if(snapshot.empty){

      postsContainer.innerHTML = `
        <div class="empty">
          <div class="empty-icon">🐉</div>
          <h3>No posts yet</h3>
          <p>Be the first to share something with the community.</p>
        </div>
      `;

      return;
    }

    const posts = [];

    snapshot.forEach((postDoc) => {

      posts.push({
        id: postDoc.id,
        ...postDoc.data()
      });

    });

    /* NEWEST FIRST */

    posts.sort((a,b) => {

      const timeA =
        a.createdAt?.seconds || 0;

      const timeB =
        b.createdAt?.seconds || 0;

      return timeB - timeA;

    });


    for(const post of posts){

      const postElement =
        document.createElement("article");

      postElement.className = "post";

      const username =
        post.authorName || "Member";


      /* ================================
         GET LIKE COUNT
      ================================= */

      let likeCount = 0;
      let alreadyLiked = false;

      try{

        const likesSnapshot =
          await getDocs(
            collection(
              db,
              "posts",
              post.id,
              "likes"
            )
          );

        likeCount =
          likesSnapshot.size;

        if(currentUser){

          alreadyLiked =
            likesSnapshot.docs.some(
              likeDoc =>
                likeDoc.id === currentUser.uid
            );

        }

      }catch(error){

        console.error(
          "Like loading error:",
          error
        );

      }


      /* ================================
         GET COMMENT COUNT
      ================================= */

      let commentCount = 0;

      try{

        const commentsSnapshot =
          await getDocs(
            collection(
              db,
              "posts",
              post.id,
              "comments"
            )
          );

        commentCount =
          commentsSnapshot.size;

      }catch(error){

        console.error(
          "Comment count error:",
          error
        );

      }


      /* ================================
         POST HTML
      ================================= */

      postElement.innerHTML = `

        <div class="post-header">

          <div class="avatar">

            ${escapeHTML(
              username
                .charAt(0)
                .toUpperCase()
            )}

          </div>

          <div>

            <div class="post-author">

              ${escapeHTML(username)}

            </div>

            <div class="post-time">

              Community member

            </div>

          </div>

        </div>


        <div class="post-text">

          ${escapeHTML(
            post.text || ""
          )}

        </div>


        <div class="actions">

          <button
            class="action like-button"
            type="button">

            ❤️
            <span>
              ${alreadyLiked ? "Unlike" : "Like"}
            </span>

            <b class="like-count">
              ${likeCount}
            </b>

          </button>


          <button
            class="action comment-button"
            type="button">

            💬
            <span>Comment</span>

            <b class="comment-count">
              ${commentCount}
            </b>

          </button>


          <button
            class="action share-button"
            type="button">

            ↗️
            <span>Share</span>

          </button>

        </div>


        <!-- COMMENTS -->

        <div
          class="comments-area"
          style="display:none; margin-top:10px;">

          <div
            class="comments-list"
            style="margin-bottom:8px;">
          </div>


          <div
            style="
              display:flex;
              gap:7px;
            ">

            <input
              class="comment-input"
              type="text"
              placeholder="Write a comment..."
              maxlength="300"
              style="
                flex:1;
                padding:9px 11px;
                border:1px solid #ddd3c5;
                border-radius:12px;
                outline:none;
                background:#faf7f1;
                color:#211c17;
              "
            >

            <button
              class="comment-send"
              type="button"
              style="
                border:0;
                border-radius:12px;
                padding:9px 13px;
                background:#4a392b;
                color:white;
                font-weight:700;
                cursor:pointer;
              ">

              Send

            </button>

          </div>

        </div>

      `;


      postsContainer.appendChild(
        postElement
      );


      /* ================================
         LIKE / UNLIKE
      ================================= */

      const likeButton =
        postElement.querySelector(
          ".like-button"
        );

      const likeCountElement =
        postElement.querySelector(
          ".like-count"
        );

      const likeText =
        likeButton.querySelector(
          "span"
        );


      likeButton.addEventListener(
        "click",
        async () => {

          if(!currentUser){

            alert(
              "Please sign in first."
            );

            return;

          }


          try{

            const likeRef =
              doc(
                db,
                "posts",
                post.id,
                "likes",
                currentUser.uid
              );


            const likeSnap =
              await getDoc(likeRef);


            if(likeSnap.exists()){

              /* UNLIKE */

              await deleteDoc(
                likeRef
              );

              likeText.textContent =
                "Like";

              let count =
                Number(
                  likeCountElement.textContent
                ) || 0;

              count =
                Math.max(
                  0,
                  count - 1
                );

              likeCountElement.textContent =
                count;

            }else{

              /* LIKE */

              await setDoc(
                likeRef,
                {

                  userId:
                    currentUser.uid,

                  createdAt:
                    serverTimestamp()

                }
              );


              likeText.textContent =
                "Unlike";


              let count =
                Number(
                  likeCountElement.textContent
                ) || 0;


              count++;


              likeCountElement.textContent =
                count;

            }

          }catch(error){

            console.error(
              "Like error:",
              error
            );

            alert(
              error.code +
              ": " +
              error.message
            );

          }

        }
      );


      /* ================================
         COMMENTS
      ================================= */

      const commentButton =
        postElement.querySelector(
          ".comment-button"
        );

      const commentsArea =
        postElement.querySelector(
          ".comments-area"
        );

      const commentsList =
        postElement.querySelector(
          ".comments-list"
        );

      const commentInput =
        postElement.querySelector(
          ".comment-input"
        );

      const commentSend =
        postElement.querySelector(
          ".comment-send"
        );

      const commentCountElement =
        postElement.querySelector(
          ".comment-count"
        );


      commentButton.addEventListener(
        "click",
        async () => {

          if(!currentUser){

            alert(
              "Please sign in first."
            );

            return;

          }


          if(
            commentsArea.style.display ===
            "none"
          ){

            commentsArea.style.display =
              "block";

            await loadComments(
              post.id,
              commentsList
            );

          }else{

            commentsArea.style.display =
              "none";

          }

        }
      );


      /* SEND COMMENT */

      commentSend.addEventListener(
        "click",
        async () => {

          if(!currentUser){

            alert(
              "Please sign in first."
            );

            return;

          }


          const text =
            commentInput.value.trim();


          if(!text){

            return;

          }


          const commenterName =
            document.getElementById(
              "composerName"
            ).textContent ||
            "Member";


          try{

            await addDoc(
              collection(
                db,
                "posts",
                post.id,
                "comments"
              ),
              {

                text:
                  text,

                userId:
                  currentUser.uid,

                username:
                  commenterName,

                createdAt:
                  serverTimestamp()

              }
            );


            commentInput.value =
              "";


            let count =
              Number(
                commentCountElement.textContent
              ) || 0;


            count++;


            commentCountElement.textContent =
              count;


            await loadComments(
              post.id,
              commentsList
            );


          }catch(error){

            console.error(
              "Comment error:",
              error
            );

            alert(
              error.code +
              ": " +
              error.message
            );

          }

        }
      );


      /* ENTER TO COMMENT */

      commentInput.addEventListener(
        "keydown",
        (event) => {

          if(
            event.key === "Enter"
          ){

            event.preventDefault();

            commentSend.click();

          }

        }
      );


      /* ================================
         SHARE
      ================================= */

      const shareButton =
        postElement.querySelector(
          ".share-button"
        );


      shareButton.addEventListener(
        "click",
        async () => {

          const shareText =
            `${username} shared a post on JSP TAYSU Community 🐉`;


          try{

            if(
              navigator.share
            ){

              await navigator.share({

                title:
                  "JSP TAYSU Community",

                text:
                  shareText,

                url:
                  window.location.href

              });

            }else{

              await navigator.clipboard.writeText(
                window.location.href
              );

              alert(
                "Community link copied! 🔗"
              );

            }

          }catch(error){

            console.log(
              "Share cancelled."
            );

          }

        }
      );

    }

  }catch(error){

    console.error(
      "Load posts error:",
      error
    );


    postsContainer.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          ⚠️
        </div>

        <h3>
          Couldn't load posts
        </h3>

        <p>
          Please refresh the page.
        </p>

      </div>

    `;

  }

}


/* ================================
   LOAD COMMENTS
================================ */

async function loadComments(
  postId,
  commentsList
){

  commentsList.innerHTML =
    "";


  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "posts",
          postId,
          "comments"
        )
      );


    if(snapshot.empty){

      commentsList.innerHTML = `

        <div style="
          color:#8a8177;
          font-size:12px;
          padding:5px 2px;
        ">

          No comments yet.

        </div>

      `;

      return;

    }


    const comments = [];


    snapshot.forEach(
      (commentDoc) => {

        comments.push({

          id:
            commentDoc.id,

          ...commentDoc.data()

        });

      }
    );


    comments.sort(
      (a,b) => {

        const timeA =
          a.createdAt?.seconds || 0;

        const timeB =
          b.createdAt?.seconds || 0;

        return timeA - timeB;

      }
    );


    comments.forEach(
      (comment) => {

        const commentElement =
          document.createElement(
            "div"
          );


        commentElement.style.cssText = `
          background:#f7f1e8;
          border:1px solid #eee4d5;
          border-radius:12px;
          padding:9px 11px;
          margin-bottom:6px;
        `;


        commentElement.innerHTML = `

  <div style="
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:3px;
  ">

    <div style="
      font-size:12px;
      font-weight:800;
      color:#493a2d;
    ">
      ${escapeHTML(
        comment.username || "Member"
      )}
    </div>

    ${
      currentUser &&
      comment.userId === currentUser.uid
        ? `
          <button
            class="delete-comment"
            type="button"
            style="
              border:0;
              background:none;
              color:#9a5d4b;
              font-size:11px;
              cursor:pointer;
            "
          >
            Delete
          </button>
        `
        : ""
    }

  </div>

  <div style="
    font-size:13px;
    line-height:1.4;
    color:#302820;
    overflow-wrap:anywhere;
  ">
    ${escapeHTML(comment.text || "")}
  </div>

`;

        commentsList.appendChild(
          commentElement
        );
const deleteButton =
  commentElement.querySelector(
    ".delete-comment"
  );

if(deleteButton){

  deleteButton.addEventListener(
    "click",
    async () => {

      if(!currentUser) return;

      try{

        await deleteDoc(
          doc(
            db,
            "posts",
            postId,
            "comments",
            comment.id
          )
        );

        await loadComments(
          postId,
          commentsList
        );

      }catch(error){

        console.error(
          "Delete comment error:",
          error
        );

        alert(
          error.code +
          ": " +
          error.message
        );

      }

    }
  );

}
      }
    );


  }catch(error){

    console.error(
      "Comments loading error:",
      error
    );


    commentsList.innerHTML = `

      <div style="
        color:#9a5d4b;
        font-size:12px;
      ">

        Couldn't load comments.

      </div>

    `;

  }

}



/* ================================
   SAFE HTML
================================ */

function escapeHTML(text){

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text;

  return div.innerHTML;

}


/* ================================
   SEARCH MEMBERS
================================ */

const userSearchButton =
  document.getElementById("userSearchButton");

const userSearchInput =
  document.getElementById("userSearchInput");

const searchResults =
  document.getElementById("searchResults");


userSearchButton.addEventListener(
  "click",
  async () => {

    const searchText =
      userSearchInput.value
        .trim()
        .toLowerCase();


    if(!searchText){

      searchResults.innerHTML =
        "<p style='color:#81776b;font-size:13px;'>Enter a username to search.</p>";

      return;

    }


    if(!currentUser){

      alert("Please sign in first.");

      return;

    }


    try{

      const usersSnapshot =
        await getDocs(
          collection(db, "users")
        );


      searchResults.innerHTML = "";

      let found = false;


      usersSnapshot.forEach(
        (userDoc) => {

          const user =
            userDoc.data();


          const username =
            (user.username || "")
              .toLowerCase();


          if(
            username.includes(searchText) &&
            userDoc.id !== currentUser.uid
          ){

            found = true;


            const result =
              document.createElement("div");


            result.className =
              "search-result";


            result.innerHTML = `

              <div class="search-result-user">
                ${escapeHTML(
                  user.username || "Member"
                )}
              </div>

              <button
                class="follow-button"
                type="button">

                Follow

              </button>

            `;


            const followButton =
              result.querySelector(
                ".follow-button"
              );


            const followId =
              currentUser.uid +
              "_" +
              userDoc.id;


            /* CHECK FOLLOW STATUS */

            try{

              const followSnap =
                await getDoc(
                  doc(
                    db,
                    "follows",
                    followId
                  )
                );


              if(followSnap.exists()){

                followButton.textContent =
                  "Following";

                followButton.disabled =
                  true;

              }

            }catch(error){

              console.error(
                "Follow status error:",
                error
              );

            }


            /* FOLLOW */

            followButton.addEventListener(
              "click",
              async () => {

                if(!currentUser){

                  alert(
                    "Please sign in again."
                  );

                  return;

                }


                try{

                  await setDoc(
                    doc(
                      db,
                      "follows",
                      followId
                    ),
                    {

                      followerId:
                        currentUser.uid,

                      followingId:
                        userDoc.id,

                      createdAt:
                        serverTimestamp()

                    }
                  );


                  followButton.textContent =
                    "Following";

                  followButton.disabled =
                    true;


                }catch(error){

                  console.error(
                    "Follow error:",
                    error
                  );

                  alert(
                    error.code +
                    ": " +
                    error.message
                  );

                }

              }
            );


            searchResults.appendChild(
              result
            );

          }

        }
      );


      if(!found){

        searchResults.innerHTML =
          "<p style='color:#81776b;font-size:13px;'>No members found.</p>";

      }


    }catch(error){

      console.error(
        "Search error:",
        error
      );


      alert(
        error.code +
        ": " +
        error.message
      );

    }

  }
);
