<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSP TAYSU Community</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html{scroll-behavior:smooth}

body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#0b0d10;
  color:#f5f5f5;
  padding-bottom:78px
}

button,input,textarea{font-family:inherit}

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(11,13,16,.92);
  backdrop-filter:blur(18px);
  border-bottom:1px solid #25282d
}

.topbar-inner{
  max-width:720px;
  margin:auto;
  height:64px;
  padding:0 16px;
  display:flex;
  align-items:center;
  justify-content:space-between
}

.logo{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:18px;
  font-weight:800;
  letter-spacing:-.4px
}

.logo-dragon{font-size:23px}

.profile-name{
  max-width:170px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:#aeb3bb;
  font-size:13px
}

.container{
  max-width:720px;
  margin:auto;
  padding:17px 14px 30px
}

.page-section{display:none}
.page-section.active{display:block}

.feed-heading{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:5px 4px 10px
}

.feed-heading h2{
  font-size:21px;
  letter-spacing:-.5px
}

.feed-heading-right{
  display:flex;
  align-items:center;
  gap:7px
}

.feed-search-button{
  width:34px;
  height:34px;
  border:0;
  border-radius:10px;
  background:#171a1f;
  color:#d7bd8c;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer
}

.feed-search-button svg{
  width:19px;
  height:19px
}

.feed-search-box{
  display:none;
  margin-bottom:9px
}

.feed-search-box.show{display:flex}

#feedSearchInput{
  width:100%;
  padding:11px 13px;
  border:1px solid #292d33;
  border-radius:12px;
  background:#15181d;
  color:#fff;
  outline:none;
  font-size:14px
}

/* =========================
   HOME POSTS
========================= */

#posts{
  display:flex;
  flex-direction:column;
  gap:0
}

.post{
  background:transparent;
  border-bottom:1px solid #20252c;
  padding:13px 9px 9px
}

.post:first-child{
  border-top:1px solid #20252c
}

.post-layout{
  display:grid;
  grid-template-columns:43px minmax(0,1fr);
  gap:10px
}

.post-avatar{
  width:43px;
  height:43px;
  border-radius:50%;
  background:linear-gradient(145deg,#26384b,#171b21);
  border:1px solid #46515e;
  display:grid;
  place-items:center;
  font-weight:850;
  color:#e9edf2;
  overflow:hidden;
  flex-shrink:0
}

.post-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block
}

.post-main{min-width:0}

.post-header{
  min-width:0;
  cursor:pointer
}

.author-wrap{
  min-width:0;
  width:100%
}

.author-line{
  display:flex;
  align-items:center;
  gap:5px;
  min-width:0;
  line-height:1.2
}

.author{
  font-size:15px;
  font-weight:800;
  max-width:none;
  overflow:visible;
  text-overflow:clip;
  white-space:normal;
  overflow-wrap:anywhere;
  word-break:break-word
}

.verified{
  color:#4da3ff;
  font-size:12px;
  flex:0 0 auto
}

.handle{
  color:#747d88;
  font-size:12px;
  margin-top:2px;
  white-space:normal;
  overflow-wrap:anywhere
}

.more{
  color:#68717c;
  margin-left:auto;
  padding:3px 5px;
  background:none;
  border:0;
  flex:0 0 auto;
  cursor:pointer
}

.post-text{
  font-size:14px;
  line-height:1.44;
  color:#f1f3f5;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  word-break:normal;
  margin:6px 0 8px
}

.post-media,
.post-video{
  display:block;
  width:100%;
  margin:6px 0 8px;
  border:1px solid #252b32;
  border-radius:14px;
  max-height:560px;
  object-fit:cover;
  background:#050608
}

.actions{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0;
  margin:0
}

.action{
  border:0;
  background:transparent;
  color:#7d8792;
  display:flex;
  align-items:center;
  gap:5px;
  padding:6px 7px;
  border-radius:10px;
  cursor:pointer;
  font-size:12px;
  transition:.18s
}

.action:hover{
  background:#171b20;
  color:#fff
}

.action svg{
  width:18px;
  height:18px;
  stroke-width:1.8
}

.action.like-button.liked{color:#ff5d6c}
.action.comment-button.active{color:#8b7cff}
.action.share-button.active{color:#54c78a}

.action.like-button.liked svg{
  fill:currentColor
}

.action b{
  font-weight:600
}

.comments-area{
  display:none;
  margin-top:7px;
  padding-top:7px;
  border-top:1px solid #25282d
}

.comments-list{margin-bottom:8px}

.comment{
  background:#15181d;
  border:1px solid #282c32;
  border-radius:11px;
  padding:8px 10px;
  margin-bottom:5px
}

.comment-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:3px
}

.comment-user{
  font-size:12px;
  font-weight:800
}

.comment-text{
  color:#c8ccd1;
  font-size:13px;
  line-height:1.4;
  overflow-wrap:anywhere
}

.delete-comment{
  border:0;
  background:none;
  color:#8e7272;
  font-size:10px;
  cursor:pointer
}

.comment-form{
  display:flex;
  gap:7px
}

.comment-input{
  flex:1;
  min-width:0;
  padding:9px 11px;
  border:1px solid #2a2e34;
  border-radius:11px;
  background:#15181d;
  color:white;
  outline:none
}

.comment-send{
  border:0;
  padding:0 13px;
  border-radius:11px;
  background:#f1f1f1;
  color:#0b0d10;
  font-weight:700;
  cursor:pointer
}

/* =========================
   EMPTY
========================= */

.empty{
  text-align:center;
  padding:45px 20px;
  color:#858c95
}

.empty-icon{
  width:50px;
  height:50px;
  margin:0 auto 13px;
  border-radius:15px;
  background:#191c21;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#d7bd8c
}

.empty-icon svg{
  width:26px;
  height:26px
}

.empty h3{
  color:#e7e9ec;
  margin-bottom:5px;
  font-size:16px
}

.empty p{font-size:13px}

/* =========================
   CREATE
========================= */

.create-page-title{
  padding:6px 3px 14px
}

.create-page-title h1,
.explore-title h1,
.alert-title h1{
  font-size:27px;
  letter-spacing:-1px
}

.create-page-title p,
.explore-title p{
  color:#858c95;
  font-size:13px;
  margin-top:4px
}

.create-card{
  background:#111419;
  border:1px solid #292d33;
  border-radius:18px;
  padding:14px
}

.composer-header{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:7px
}

.composer-name{
  font-size:15px;
  font-weight:800
}

.composer-sub{
  color:#777f89;
  font-size:12px;
  margin-top:2px
}

#postText{
  width:100%;
  min-height:62px;
  height:62px;
  resize:vertical;
  border:0;
  outline:none;
  border-radius:12px;
  padding:10px;
  background:#181b20;
  color:#f4f4f4;
  font-family:inherit;
  font-size:15px;
  line-height:1.45
}

#postText::placeholder{color:#6f7680}

.create-media-preview{
  display:none;
  margin-top:8px;
  position:relative
}

.create-media-preview img,
.create-media-preview video{
  width:100%;
  max-height:400px;
  object-fit:cover;
  border-radius:14px;
  background:#08090b
}

.remove-media{
  position:absolute;
  right:8px;
  top:8px;
  width:31px;
  height:31px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.75);
  color:#fff;
  cursor:pointer;
  font-size:17px
}

.create-options{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-top:8px
}

.media-buttons{
  display:flex;
  gap:6px
}

.media-button{
  border:1px solid #30343a;
  background:#181b20;
  color:#b9bec5;
  padding:8px 10px;
  border-radius:11px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:5px;
  font-size:12px;
  font-weight:600
}

.media-button svg{
  width:15px;
  height:15px
}

.post-btn{
  border:0;
  background:#f1f1f1;
  color:#0b0d10;
  padding:9px 17px;
  border-radius:12px;
  font-weight:800;
  cursor:pointer
}

.post-btn:disabled{
  opacity:.5;
  cursor:default
}

/* =========================
   EXPLORE
========================= */

.explore-title{
  padding:7px 3px 15px
}

.search-box{
  display:flex;
  gap:8px;
  margin-bottom:13px
}

#userSearchInput{
  flex:1;
  min-width:0;
  padding:13px 15px;
  border:1px solid #292d33;
  border-radius:14px;
  background:#15181d;
  color:#fff;
  font-size:14px;
  outline:none
}

.search-button{
  width:48px;
  border:0;
  border-radius:14px;
  background:#f1f1f1;
  color:#0b0d10;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer
}

.search-button svg{
  width:20px;
  height:20px
}

#searchResults{
  margin-bottom:18px
}

.search-result{
  background:#15181d;
  border:1px solid #292d33;
  border-radius:15px;
  padding:12px;
  margin-bottom:7px;
  display:flex;
  align-items:center;
  justify-content:space-between
}

.search-user{
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
  min-width:0
}

.search-avatar{
  width:39px;
  height:39px;
  flex-shrink:0;
  border-radius:50%;
  background:linear-gradient(145deg,#26384b,#171b21);
  display:grid;
  place-items:center;
  font-weight:800;
  color:#ead9b8;
  border:1px solid #46515e;
  overflow:hidden
}

.search-avatar img{
  width:100%;
  height:100%;
  object-fit:cover
}

.search-username{
  font-size:14px;
  font-weight:700;
  overflow-wrap:anywhere
}

.follow-button{
  border:0;
  padding:8px 14px;
  border-radius:10px;
  background:#1d9bf0;
  color:white;
  font-weight:700;
  cursor:pointer;
  flex-shrink:0
}

.follow-button.following{
  background:#164d73;
  color:#9acfff
}

.follow-button:disabled{
  cursor:default
}

/* Explore tabs */

.explore-tabs{
  display:flex;
  border-bottom:1px solid #252a30;
  margin:3px 0 0
}

.explore-tab{
  flex:1;
  border:0;
  background:transparent;
  color:#777f89;
  padding:12px 6px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  position:relative
}

.explore-tab.active{
  color:#f4f5f6
}

.explore-tab.active::after{
  content:"";
  position:absolute;
  left:25%;
  right:25%;
  bottom:-1px;
  height:2px;
  border-radius:5px;
  background:#f1f1f1
}

.explore-media-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:3px;
  margin-top:8px
}

.explore-media-tile{
  aspect-ratio:1/1;
  background:#101318;
  overflow:hidden;
  position:relative;
  border-radius:2px;
  cursor:pointer
}

.explore-media-tile img,
.explore-media-tile video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block
}

.video-badge{
  position:absolute;
  right:7px;
  top:7px;
  width:27px;
  height:27px;
  border-radius:50%;
  background:rgba(0,0,0,.65);
  display:grid;
  place-items:center
}

.video-badge svg{
  width:13px;
  height:13px
}

/* Explore text feed */

.explore-text-feed{
  margin-top:8px
}

.explore-text-post{
  width:100%;
  background:transparent;
  border-top:1px solid #20252c;
  border-bottom:1px solid #20252c;
  padding:13px 9px 9px;
  cursor:pointer
}

.explore-text-layout{
  display:grid;
  grid-template-columns:40px minmax(0,1fr);
  gap:9px
}

.explore-text-avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:linear-gradient(145deg,#26384b,#171b21);
  border:1px solid #46515e;
  display:grid;
  place-items:center;
  font-size:14px;
  font-weight:850;
  overflow:hidden
}

.explore-text-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block
}

.explore-text-main{
  min-width:0
}

.explore-text-author-line{
  display:flex;
  align-items:center;
  gap:5px;
  min-width:0
}

.explore-text-author{
  font-size:15px;
  font-weight:800;
  white-space:normal;
  overflow-wrap:anywhere;
  word-break:break-word
}

.explore-text-meta{
  color:#747d88;
  font-size:12px;
  margin-top:2px;
  overflow-wrap:anywhere
}

.explore-text-content{
  font-size:14px;
  line-height:1.44;
  margin-top:6px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  color:#f1f3f5
}

.explore-text-actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:7px;
  color:#727c88
}

.explore-text-actions .action{
  padding:5px 7px
}

/* =========================
   ALERTS
========================= */

.alert-title{
  padding:7px 3px 15px;
  display:flex;
  justify-content:space-between;
  align-items:center
}

.alert-heading-actions{
  display:flex;
  align-items:center;
  gap:8px
}

.mark-read{
  border:1px solid #30343a;
  background:#15181d;
  color:#aeb4bd;
  border-radius:10px;
  padding:7px 10px;
  font-size:11px;
  cursor:pointer
}

.alert-list{
  display:flex;
  flex-direction:column;
  gap:7px
}

.notification{
  display:flex;
  align-items:center;
  gap:11px;
  padding:12px;
  background:#111419;
  border:1px solid #292d33;
  border-radius:15px;
  cursor:pointer;
  transition:.18s
}

.notification:hover{
  background:#191c21
}

.notification.unread{
  background:#15181d;
  border-color:#3a3f47
}

.notification-icon{
  width:40px;
  height:40px;
  flex-shrink:0;
  border-radius:50%;
  background:#1b1e23;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#d7bd8c
}

.notification-icon svg{
  width:19px;
  height:19px
}

.notification.like-alert .notification-icon{color:#ff5d6c}
.notification.comment-alert .notification-icon{color:#8b7cff}
.notification.follow-alert .notification-icon{color:#1d9bf0}

.notification-text{
  font-size:13px;
  line-height:1.4;
  color:#dfe2e6
}

.notification-time{
  color:#777f89;
  font-size:10px;
  margin-top:3px
}

.alert-empty{
  text-align:center;
  padding:50px 20px;
  color:#858c95
}

.alert-empty svg{
  width:36px;
  height:36px;
  color:#d7bd8c;
  margin-bottom:10px
}

.alert-empty h3{
  color:#e7e9ec;
  margin-bottom:5px
}

.alert-empty p{font-size:13px}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:72px;
  z-index:200;
  background:rgba(11,13,16,.96);
  backdrop-filter:blur(20px);
  border-top:1px solid #292d33;
  display:flex;
  justify-content:center;
  padding:6px 8px;
  box-shadow:0 -10px 30px rgba(0,0,0,.2)
}

.nav-item{
  flex:1;
  max-width:115px;
  border:0;
  background:none;
  color:#727983;
  cursor:pointer;
  border-radius:13px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  transition:.18s;
  position:relative
}

.nav-item svg{
  width:21px;
  height:21px;
  stroke-width:1.8
}

.nav-item span{font-size:10px}

.nav-item:hover{
  color:#dfe2e6;
  background:#15181d
}

.nav-item.active{color:#fff}
.nav-item.create-active{color:#d7bd8c}

.create-plus{
  width:32px;
  height:32px;
  border:1px solid #555b63;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center
}

.create-plus svg{
  width:18px;
  height:18px
}

.hidden-file{display:none}
.profile-link{cursor:pointer}

.alert-badge{
  position:absolute;
  top:8px;
  right:calc(50% - 19px);
  min-width:16px;
  height:16px;
  padding:0 4px;
  border-radius:20px;
  background:#ff3b52;
  color:#fff;
  font-size:9px;
  font-weight:800;
  display:none;
  align-items:center;
  justify-content:center;
  border:2px solid #0b0d10
}

.alert-badge.show{display:flex}

/* =========================
   MOBILE
========================= */

@media(max-width:500px){

  .container{
    padding:15px 10px 25px
  }

  .topbar-inner{
    height:61px;
    padding:0 13px
  }

  .logo{font-size:16px}

  .profile-name{
    max-width:130px
  }

  .post{
    padding:12px 7px 8px
  }

  .post-layout{
    grid-template-columns:40px minmax(0,1fr);
    gap:9px
  }

  .post-avatar{
    width:40px;
    height:40px
  }

  .author{font-size:14.5px}

  .handle{font-size:11.5px}

  .post-text{
    font-size:14px;
    line-height:1.44;
    margin:6px 0 8px
  }

  .post-media,
  .post-video{
    width:100%;
    margin:6px 0 8px;
    border-radius:13px
  }

  .actions{
    width:100%
  }

  .action{
    padding:7px 5px
  }

  .action span{display:none}

  .action svg{
    width:19px;
    height:19px
  }

  .create-card{
    border-radius:17px;
    padding:13px
  }

  #postText{
    min-height:62px;
    height:62px
  }

  .media-button{
    padding:8px 9px
  }

  .post-btn{
    padding:9px 14px
  }

  .bottom-nav{height:68px}

  .explore-text-post{
    padding:12px 7px 8px
  }

  .explore-text-layout{
    grid-template-columns:39px minmax(0,1fr);
    gap:8px
  }

  .explore-text-avatar{
    width:39px;
    height:39px
  }

  .explore-text-author{font-size:14.5px}

  .explore-text-content{font-size:14px}

  .follow-button{
    padding:8px 12px
  }

  .explore-media-grid{gap:2px}
}
</style>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="logo">
      <span class="logo-dragon">🐉</span>
      <span>JSP TAYSU</span>
    </div>
    <div class="profile-name" id="profileName">Member</div>
  </div>
</header>

<main class="container">

<!-- ================= HOME ================= -->

<section id="homeSection" class="page-section active">

  <div class="feed-heading">
    <h2>Community Feed</h2>

    <div class="feed-heading-right">
      <button id="feedSearchButton" class="feed-search-button" type="button" aria-label="Search posts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-4-4"></path>
        </svg>
      </button>
    </div>
  </div>

  <div id="feedSearchBox" class="feed-search-box">
    <input id="feedSearchInput" type="text" placeholder="Search posts or topics..." maxlength="100">
  </div>

  <section id="posts">
    <div class="empty">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">

<script type="module">

/* =========================================================
   FIREBASE — KEPT INTACT
========================================================= */

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  serverTimestamp,
  doc,
  setDoc,
  getDoc,
  deleteDoc,
  query,
  where,
  onSnapshot
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";


const firebaseConfig={
  apiKey:"AIzaSyDpv2vqAZbCFgT_XJ4u-KB0AeZWVB2GIUs",
  authDomain:"jsp-taysu.firebaseapp.com",
  projectId:"jsp-taysu",
  storageBucket:"jsp-taysu.firebasestorage.app",
  messagingSenderId:"280992025632",
  appId:"1:280992025632:web:48efa21208a78be9a78045"
};


const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const storage=getStorage(app);


/* =========================================================
   GLOBAL STATE
========================================================= */

let currentUser=null;
let selectedMediaFile=null;
let selectedMediaType=null;
let currentUsername="Member";

let allPosts=[];
let allMembers=[];

let profileCache={};

let currentExploreMode="all";
let notificationUnsubscribe=null;


/* =========================================================
   DOM
========================================================= */

const profileName=document.getElementById("profileName");
const composerName=document.getElementById("composerName");
const composerAvatar=document.getElementById("composerAvatar");
const alertList=document.getElementById("alertList");
const postsContainer=document.getElementById("posts");

const alertBadge=document.getElementById("alertBadge");

const exploreMediaGrid=document.getElementById("exploreMediaGrid");
const exploreTextFeed=document.getElementById("exploreTextFeed");


/* =========================================================
   AUTH — DO NOT CHANGE
========================================================= */

onAuthStateChanged(auth,async user=>{

  currentUser=user;

  if(!user){

    profileName.textContent="Please sign in";
    composerName.textContent="Member";

    composerAvatar.innerHTML="M";

    currentUsername="Member";

    return;
  }

  let username=user.displayName||"Member";
  let photoURL=user.photoURL||"";

  try{

    const profileSnap=await getDoc(
      doc(db,"users",user.uid)
    );

    if(profileSnap.exists()){

      const data=profileSnap.data();

      if(data.username){
        username=data.username;
      }

      photoURL=
        data.photoURL||
        data.photoUrl||
        data.avatar||
        data.profilePhoto||
        data.profilePic||
        photoURL;
    }

  }catch(error){

    console.error("Profile error:",error);

  }

  currentUsername=username;

  profileName.textContent=username;
  composerName.textContent=username;

  if(photoURL){

    composerAvatar.innerHTML=
      `<img src="${escapeAttribute(photoURL)}" alt="Profile">`;

  }else{

    composerAvatar.textContent=
      username.charAt(0).toUpperCase();

  }

  await loadPosts();
  subscribeNotifications();

});


/* =========================================================
   NAVIGATION
========================================================= */

const sections={
  homeSection:document.getElementById("homeSection"),
  createSection:document.getElementById("createSection"),
  exploreSection:document.getElementById("exploreSection"),
  alertsSection:document.getElementById("alertsSection")
};


function showSection(sectionId){

  Object.values(sections).forEach(section=>{
    section.classList.remove("active");
  });

  if(sections[sectionId]){
    sections[sectionId].classList.add("active");
  }

  document.querySelectorAll(".nav-item").forEach(button=>{
    button.classList.remove("active");
    button.classList.remove("create-active");
  });

  const matchingButton=
    document.querySelector(`[data-section="${sectionId}"]`);

  if(matchingButton){
    matchingButton.classList.add("active");
  }

  if(sectionId==="createSection"){
    document.getElementById("createNav")
      .classList.add("create-active");
  }

  if(sectionId==="exploreSection"){

    loadMembers();
    loadExploreGrid();

  }

  if(sectionId==="alertsSection"&&currentUser){

    subscribeNotifications();

  }

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


document
  .querySelectorAll(".nav-item[data-section]")
  .forEach(button=>{

    button.addEventListener(
      "click",
      ()=>showSection(button.dataset.section)
    );

  });


document
  .getElementById("createNav")
  .addEventListener(
    "click",
    ()=>showSection("createSection")
  );


document
  .getElementById("profileNavButton")
  .addEventListener("click",()=>{

    if(!currentUser){

      alert("Please sign in first.");
      return;

    }

    openProfile(currentUser.uid);

  });


function openProfile(uid){

  if(uid){

    window.location.href=
      "profile.html?uid="+
      encodeURIComponent(uid);

  }

}


/* =========================================================
   FEED SEARCH
========================================================= */

const feedSearchButton=
  document.getElementById("feedSearchButton");

const feedSearchBox=
  document.getElementById("feedSearchBox");

const feedSearchInput=
  document.getElementById("feedSearchInput");


feedSearchButton.addEventListener("click",()=>{

  feedSearchBox.classList.toggle("show");

  if(feedSearchBox.classList.contains("show")){

    feedSearchInput.focus();

  }else{

    feedSearchInput.value="";
    renderFilteredPosts("");

  }

});


feedSearchInput.addEventListener(
  "input",
  ()=>renderFilteredPosts(feedSearchInput.value)
);


/* =========================================================
   CREATE POST
========================================================= */

const photoButton=
  document.getElementById("photoButton");

const videoButton=
  document.getElementById("videoButton");

const photoInput=
  document.getElementById("photoInput");

const videoInput=
  document.getElementById("videoInput");


photoButton.addEventListener("click",()=>{

  if(!currentUser){

    alert("Please sign in first.");
    return;

  }

  photoInput.click();

});


videoButton.addEventListener("click",()=>{

  if(!currentUser){

    alert("Please sign in first.");
    return;

  }

  videoInput.click();

});


photoInput.addEventListener("change",()=>{

  const file=photoInput.files[0];

  if(file){

    selectedMediaFile=file;
    selectedMediaType="image";

    showMediaPreview(
      file,
      "image"
    );

  }

});


videoInput.addEventListener("change",()=>{

  const file=videoInput.files[0];

  if(file){

    selectedMediaFile=file;
    selectedMediaType="video";

    showMediaPreview(
      file,
      "video"
    );

  }

});


function showMediaPreview(file,type){

  const preview=
    document.getElementById("createMediaPreview");

  const content=
    document.getElementById("mediaPreviewContent");

  const url=URL.createObjectURL(file);

  content.innerHTML=
    type==="image"
      ? `<img src="${url}" alt="Selected photo">`
      : `<video src="${url}" controls></video>`;

  preview.style.display="block";

}


document
  .getElementById("removeMediaButton")
  .addEventListener("click",()=>{

    selectedMediaFile=null;
    selectedMediaType=null;

    photoInput.value="";
    videoInput.value="";

    document.getElementById(
      "createMediaPreview"
    ).style.display="none";

    document.getElementById(
      "mediaPreviewContent"
    ).innerHTML="";

  });


document
  .getElementById("postButton")
  .addEventListener("click",async()=>{

    if(!currentUser){

      alert("Please sign in first.");
      return;

    }

    const text=
      document.getElementById("postText")
        .value.trim();

    if(!text&&!selectedMediaFile){

      alert(
        "Write something or select a photo/video."
      );

      return;

    }

    const button=
      document.getElementById("postButton");

    button.disabled=true;
    button.textContent="Posting...";

    try{

      let mediaUrl="";
      let mediaType="";

      if(selectedMediaFile){

        const file=selectedMediaFile;

        const safeName=
          file.name.replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );

        const filePath=
          "posts/"+
          currentUser.uid+
          "/"+
          Date.now()+
          "_"+
          safeName;

        const uploadResult=
          await uploadBytes(
            ref(storage,filePath),
            file
          );

        mediaUrl=
          await getDownloadURL(
            uploadResult.ref
          );

        mediaType=selectedMediaType;

      }

      await addDoc(
        collection(db,"posts"),
        {
          text,
          authorId:currentUser.uid,
          authorName:currentUsername,
          mediaUrl,
          mediaType,
          createdAt:serverTimestamp()
        }
      );

      document.getElementById(
        "postText"
      ).value="";

      selectedMediaFile=null;
      selectedMediaType=null;

      photoInput.value="";
      videoInput.value="";

      document.getElementById(
        "createMediaPreview"
      ).style.display="none";

      document.getElementById(
        "mediaPreviewContent"
      ).innerHTML="";

      await loadPosts();

      showSection("homeSection");

    }catch(error){

      console.error("Post error:",error);

      alert(
        (error.code||"Error")+
        ": "+
        error.message
      );

    }finally{

      button.disabled=false;
      button.textContent="Post";

    }

  });


/* =========================================================
   LOAD POSTS
========================================================= */

async function loadPosts(){

  try{

    const snapshot=
      await getDocs(
        collection(db,"posts")
      );

    allPosts=[];

    snapshot.forEach(postDoc=>{

      allPosts.push({
        id:postDoc.id,
        ...postDoc.data()
      });

    });

    allPosts.sort(
      (a,b)=>
        (b.createdAt?.seconds||0)-
        (a.createdAt?.seconds||0)
    );

    renderFilteredPosts(
      feedSearchInput.value
    );

    renderExplore();

  }catch(error){

    console.error(
      "Load posts error:",
      error
    );

    postsContainer.innerHTML=`
      <div class="empty">
        <div class="empty-icon">⚠️</div>
        <h3>Couldn't load posts</h3>
        <p>Please refresh the page.</p>
      </div>
    `;

  }

}


async function renderFilteredPosts(searchText){

  const queryText=
    String(searchText||"")
      .trim()
      .toLowerCase();

  const filtered=
    allPosts.filter(post=>
      !queryText||
      String(post.text||"")
        .toLowerCase()
        .includes(queryText)||
      String(post.authorName||"")
        .toLowerCase()
        .includes(queryText)
    );

  postsContainer.innerHTML="";

  if(filtered.length===0){

    postsContainer.innerHTML=`
      <div class="empty">
        <div class="empty-icon">🔍</div>
        <h3>No matching posts</h3>
        <p>Try another topic or keyword.</p>
      </div>
    `;

    return;

  }

  /*
    Promise.all keeps the original feed order even though
    likes/comments/profile data load asynchronously.
  */

  const elements=
    await Promise.all(
      filtered.map(
        post=>buildPostElement(post)
      )
    );

  elements.forEach(element=>{
    postsContainer.appendChild(element);
  });

}


/* =========================================================
   PROFILE CACHE
========================================================= */

async function getUserProfile(uid){

  if(!uid){
    return {};
  }

  if(profileCache[uid]){
    return profileCache[uid];
  }

  try{

    const snap=
      await getDoc(
        doc(db,"users",uid)
      );

    if(snap.exists()){

      const data=snap.data();

      profileCache[uid]=data;

      return data;

    }

  }catch(error){

    console.error(
      "Profile fetch error:",
      error
    );

  }

  profileCache[uid]={};

  return {};

}


function getPhotoURL(profile){

  return (
    profile.photoURL||
    profile.photoUrl||
    profile.avatar||
    profile.profilePhoto||
    profile.profilePic||
    ""
  );

}


/* =========================================================
   BUILD HOME POST
========================================================= */

async function buildPostElement(post){

  const postElement=
    document.createElement("article");

  postElement.className="post";

  const username=
    post.authorName||"Member";

  const profile=
    await getUserProfile(
      post.authorId
    );

  const photoURL=
    getPhotoURL(profile);

  let likeCount=0;
  let alreadyLiked=false;

  try{

    const likesSnapshot=
      await getDocs(
        collection(
          db,
          "posts",
          post.id,
          "likes"
        )
      );

    likeCount=likesSnapshot.size;

    if(currentUser){

      alreadyLiked=
        likesSnapshot.docs.some(
          likeDoc=>
            likeDoc.id===currentUser.uid
        );

    }

  }catch(error){

    console.error(
      "Like loading error:",
      error
    );

  }


  let commentCount=0;

  try{

    commentCount=
      (
        await getDocs(
          collection(
            db,
            "posts",
            post.id,
            "comments"
          )
        )
      ).size;

  }catch(error){

    console.error(
      "Comment loading error:",
      error
    );

  }


  let avatarHTML="";

  if(photoURL){

    avatarHTML=
      `<img src="${escapeAttribute(photoURL)}" alt="Profile">`;

  }else{

    avatarHTML=
      escapeHTML(
        username
          .charAt(0)
          .toUpperCase()
      );

  }


  let mediaHTML="";

  if(
    post.mediaUrl&&
    post.mediaType==="image"
  ){

    mediaHTML=`
      <img
        class="post-media"
        src="${escapeAttribute(post.mediaUrl)}"
        alt="Community post image"
        loading="lazy"
      >
    `;

  }


  if(
    post.mediaUrl&&
    post.mediaType==="video"
  ){

    mediaHTML=`
      <video
        class="post-video"
        controls
        preload="metadata"
      >
        <source
          src="${escapeAttribute(post.mediaUrl)}"
        >
      </video>
    `;

  }


  postElement.innerHTML=`

    <div class="post-layout">

      <div class="post-avatar">
        ${avatarHTML}
      </div>

      <div class="post-main">

        <div
          class="post-header"
          data-profile-id="${escapeAttribute(post.authorId||"")}"
        >

          <div class="author-wrap">

            <div class="author-line">

              <span class="author">
                ${escapeHTML(username)}
              </span>

              ${
                profile.verified===true
                  ? `<span class="verified">✓</span>`
                  : ""
              }

              <button
                class="more"
                type="button"
                aria-label="More"
              >
                •••
              </button>

            </div>

            <div class="handle">
              @${escapeHTML(makeHandle(username))}
              ·
              ${formatTime(post.createdAt)}
            </div>

          </div>

        </div>


        ${
          post.text
            ? `
              <div class="post-text">
                ${escapeHTML(
                  normalizePostText(post.text)
                )}
              </div>
            `
            : ""
        }

        ${mediaHTML}


        <div class="actions">

          <button
            class="action like-button ${
              alreadyLiked?"liked":""
            }"
            type="button"
          >

            <svg
              viewBox="0 0 24 24"
              fill="${alreadyLiked?"currentColor":"none"}"
              stroke="currentColor"
            >
              <path d="M20.8 8.7 C20.8 13.7 12 20 12 20 S3.2 13.7 3.2 8.7 C3.2 5.7 5.4 3.7 8.1 3.7 C9.8 3.7 11.3 4.6 12 5.9 C12.7 4.6 14.2 3.7 15.9 3.7 C18.6 3.7 20.8 5.7 20.8 8.7Z"></path>
            </svg>

            <span>
              ${alreadyLiked?"Unlike":"Like"}
            </span>

            <b class="like-count">
              ${likeCount}
            </b>

          </button>


          <button
            class="action comment-button"
            type="button"
          >

            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
            >
              <path d="M20 11.5 a7.5 7.5 0 0 1-7.5 7.5 H8l-4 2 1.5-4 A7.5 7.5 0 1 1 20 11.5Z"></path>
            </svg>

            <span>Comment</span>

            <b class="comment-count">
              ${commentCount}
            </b>

          </button>


          <button
            class="action share-button"
            type="button"
          >

            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
            >
              <path d="M12 16V4"></path>
              <path d="m7 9 5-5 5 5"></path>
              <path d="M5 13v5 a2 2 0 0 0 2 2h10 a2 2 0 0 0 2-2v-5"></path>
            </svg>

            <span>Share</span>

          </button>

        </div>


        <div class="comments-area">

          <div class="comments-list"></div>

          <div class="comment-form">

            <input
              class="comment-input"
              type="text"
              maxlength="300"
              placeholder="Write a comment..."
            >

            <button
              class="comment-send"
              type="button"
            >
              Send
            </button>

          </div>

        </div>

      </div>

    </div>
  `;


  /* Profile */

  postElement
    .querySelector(".post-header")
    .addEventListener(
      "click",
      ()=>{

        if(post.authorId){
          openProfile(post.authorId);
        }

      }
    );


  /* More */

  postElement
    .querySelector(".more")
    .addEventListener(
      "click",
      event=>{
        event.stopPropagation();
      }
    );


  /* Like */

  const likeButton=
    postElement.querySelector(
      ".like-button"
    );

  const likeCountElement=
    postElement.querySelector(
      ".like-count"
    );

  const likeText=
    likeButton.querySelector("span");


  likeButton.addEventListener(
    "click",
    async()=>{

      if(!currentUser){

        alert("Please sign in first.");
        return;

      }

      likeButton.disabled=true;

      try{

        const likeRef=
          doc(
            db,
            "posts",
            post.id,
            "likes",
            currentUser.uid
          );

        const likeSnap=
          await getDoc(likeRef);

        let count=
          Number(
            likeCountElement.textContent
          )||0;

        if(likeSnap.exists()){

          await deleteDoc(likeRef);

          count=Math.max(
            0,
            count-1
          );

          likeText.textContent="Like";

          likeButton.classList.remove(
            "liked"
          );

          likeButton
            .querySelector("svg")
            .setAttribute(
              "fill",
              "none"
            );

        }else{

          await setDoc(
            likeRef,
            {
              userId:currentUser.uid,
              createdAt:serverTimestamp()
            }
          );

          count++;

          likeText.textContent="Unlike";

          likeButton.classList.add(
            "liked"
          );

          likeButton
            .querySelector("svg")
            .setAttribute(
              "fill",
              "currentColor"
            );

          if(
            post.authorId&&
            post.authorId!==currentUser.uid
          ){

            await createNotification({

              recipientId:post.authorId,
              senderId:currentUser.uid,
              senderName:currentUsername,
              type:"like",
              postId:post.id

            });

          }

        }

        likeCountElement.textContent=count;

      }catch(error){

        console.error(
          "Like error:",
          error
        );

        alert(
          (error.code||"Error")+
          ": "+
          error.message
        );

      }finally{

        likeButton.disabled=false;

      }

    }
  );


  /* Comments */

  const commentButton=
    postElement.querySelector(
      ".comment-button"
    );

  const commentsArea=
    postElement.querySelector(
      ".comments-area"
    );

  const commentsList=
    postElement.querySelector(
      ".comments-list"
    );

  const commentInput=
    postElement.querySelector(
      ".comment-input"
    );

  const commentSend=
    postElement.querySelector(
      ".comment-send"
    );

  const commentCountElement=
    postElement.querySelector(
      ".comment-count"
    );


  commentButton.addEventListener(
    "click",
    async()=>{

      if(!currentUser){

        alert("Please sign in first.");
        return;

      }

      if(
        commentsArea.style.display==="block"
      ){

        commentsArea.style.display="none";

        commentButton.classList.remove(
          "active"
        );

      }else{

        commentsArea.style.display="block";

        commentButton.classList.add(
          "active"
        );

        await loadComments(
          post.id,
          commentsList
        );

      }

    }
  );


  async function sendComment(){

    if(!currentUser){

      alert("Please sign in first.");
      return;

    }

    const text=
      commentInput.value.trim();

    if(!text)return;

    commentSend.disabled=true;

    try{

      await addDoc(
        collection(
          db,
          "posts",
          post.id,
          "comments"
        ),
        {
          text,
          userId:currentUser.uid,
          username:currentUsername,
          createdAt:serverTimestamp()
        }
      );

      commentInput.value="";

      commentCountElement.textContent=
        (
          Number(
            commentCountElement.textContent
          )||0
        )+1;

      await loadComments(
        post.id,
        commentsList
      );

      if(
        post.authorId&&
        post.authorId!==currentUser.uid
      ){

        await createNotification({

          recipientId:post.authorId,
          senderId:currentUser.uid,
          senderName:currentUsername,
          type:"comment",
          postId:post.id,
          commentText:text

        });

      }

    }catch(error){

      console.error(
        "Comment error:",
        error
      );

      alert(
        (error.code||"Error")+
        ": "+
        error.message
      );

    }finally{

      commentSend.disabled=false;

    }

  }


  commentSend.addEventListener(
    "click",
    sendComment
  );


  commentInput.addEventListener(
    "keydown",
    event=>{

      if(event.key==="Enter"){

        event.preventDefault();
        sendComment();

      }

    }
  );


  /* Share */

  postElement
    .querySelector(".share-button")
    .addEventListener(
      "click",
      async()=>{

        const shareButton=
          postElement.querySelector(
            ".share-button"
          );

        try{

          if(navigator.share){

            await navigator.share({

              title:
                "JSP TAYSU Community",

              text:
                `${username} shared a post on JSP TAYSU Community 🐉`,

              url:
                window.location.href

            });

          }else{

            await navigator.clipboard.writeText(
              window.location.href
            );

            alert(
              "Community link copied! 🔗"
            );

          }

          shareButton.classList.add(
            "active"
          );

          setTimeout(
            ()=>shareButton.classList.remove("active"),
            1200
          );

        }catch(error){

          console.log(
            "Share cancelled."
          );

        }

      }
    );


  return postElement;

}

   COMMENTS

async function loadComments(
  postId,
  commentsList
){

  commentsList.innerHTML="";

  try{

    const snapshot=
      await getDocs(
        collection(
          db,
          "posts",
          postId,
          "comments"
        )
      );

    if(snapshot.empty){

      commentsList.innerHTML=`
        <div style="color:#777f89;font-size:12px;padding:4px 2px;">
          No comments yet.
        </div>
      `;

      return;

    }

    const comments=[];

    snapshot.forEach(commentDoc=>{

      comments.push({
        id:commentDoc.id,
        ...commentDoc.data()
      });

    });

    comments.sort(
      (a,b)=>
        (a.createdAt?.seconds||0)-
        (b.createdAt?.seconds||0)
    );


    comments.forEach(comment=>{

      const element=
        document.createElement("div");

      element.className="comment";

      element.innerHTML=`

        <div class="comment-top">

          <div class="comment-user">
            ${escapeHTML(
              comment.username||"Member"
            )}
          </div>

          ${
            currentUser&&
            comment.userId===currentUser.uid
              ? `<button class="delete-comment" type="button">
                   Delete
                 </button>`
              : ""
          }

        </div>

        <div class="comment-text">
          ${escapeHTML(
            comment.text||""
          )}
        </div>
      `;


      commentsList.appendChild(element);


      const deleteButton=
        element.querySelector(
          ".delete-comment"
        );


      if(deleteButton){

        deleteButton.addEventListener(
          "click",
          async()=>{

            try{

              await deleteDoc(
                doc(
                  db,
                  "posts",
                  postId,
                  "comments",
                  comment.id
                )
              );

              await loadComments(
                postId,
                commentsList
              );

            }catch(error){

              console.error(error);

              alert(
                (error.code||"Error")+
                ": "+
                error.message
              );

            }

          }
        );

      }

    });

  }catch(error){

    console.error(
      "Comments error:",
      error
    );

    commentsList.innerHTML=`
      <div style="color:#9c7373;font-size:12px;">
        Couldn't load comments.
      </div>
    `;

  }

}

async function loadMembers(){

  try{

    if(allMembers.length===0){

      const snapshot=
        await getDocs(
          collection(db,"users")
        );

      allMembers=[];

      snapshot.forEach(userDoc=>{

        allMembers.push({
          id:userDoc.id,
          ...userDoc.data()
        });

      });

    }

    searchMembers();

  }catch(error){

    console.error(
      "Members error:",
      error
    );

  }

}


const userSearchButton=
  document.getElementById(
    "userSearchButton"
  );

const userSearchInput=
  document.getElementById(
    "userSearchInput"
  );

const searchResults=
  document.getElementById(
    "searchResults"
  );


userSearchButton.addEventListener(
  "click",
  searchMembers
);

userSearchInput.addEventListener(
  "input",
  searchMembers
);

userSearchInput.addEventListener(
  "keydown",
  event=>{

    if(event.key==="Enter"){
      searchMembers();
    }

  }
);


async function searchMembers(){

  const searchText=
    userSearchInput.value
      .trim()
      .toLowerCase();

  if(!currentUser)return;

  if(allMembers.length===0){

    await loadMembers();
    return;

  }

  searchResults.innerHTML="";

  if(!searchText){

    searchResults.innerHTML=`
      <p style="color:#777f89;font-size:13px;padding:5px;">
        Start typing a member's name.
      </p>
    `;

    return;

  }


  const matches=
    allMembers

      .filter(
        user=>user.id!==currentUser.uid
      )

      .filter(
        user=>
          String(
            user.username||
            user.displayName||
            ""
          )
          .toLowerCase()
          .includes(searchText)
      )

      .sort(
        (a,b)=>
          String(
            a.username||
            a.displayName||
            ""
          ).localeCompare(
            String(
              b.username||
              b.displayName||
              ""
            )
          )
      )

      .slice(0,20);


  if(matches.length===0){

    searchResults.innerHTML=`
      <p style="color:#777f89;font-size:13px;padding:5px;">
        No members found.
      </p>
    `;

    return;

  }


  /*
    Render search results in correct order.
  */

  const results=
    await Promise.all(
      matches.map(
        user=>buildMemberSearchResult(user)
      )
    );

  results.forEach(
    result=>searchResults.appendChild(result)
  );

}


async function buildMemberSearchResult(user){

  const result=
    document.createElement("div");

  result.className="search-result";

  const name=
    user.username||
    user.displayName||
    "Member";

  const photoURL=
    getPhotoURL(user);


  const avatarHTML=
    photoURL
      ? `<img src="${escapeAttribute(photoURL)}" alt="Profile">`
      : escapeHTML(
          name.charAt(0).toUpperCase()
        );


  result.innerHTML=`

    <div class="search-user">

      <div class="search-avatar">
        ${avatarHTML}
      </div>

      <div class="search-username">
        ${escapeHTML(name)}
      </div>

    </div>

    <button
      class="follow-button"
      type="button"
    >
      Follow
    </button>

  `;


  result
    .querySelector(".search-user")
    .addEventListener(
      "click",
      ()=>openProfile(user.id)
    );


  const followButton=
    result.querySelector(
      ".follow-button"
    );

  const followId=
    currentUser.uid+
    "_"+
    user.id;


  try{

    const followSnap=
      await getDoc(
        doc(
          db,
          "follows",
          followId
        )
      );

    if(followSnap.exists()){

      followButton.textContent=
        "Following";

      followButton.classList.add(
        "following"
      );

    }

  }catch(error){

    console.error(
      "Follow check:",
      error
    );

  }


  followButton.addEventListener(
    "click",
    async event=>{

      event.stopPropagation();

      if(!currentUser)return;

      followButton.disabled=true;

      try{

        const followRef=
          doc(
            db,
            "follows",
            followId
          );

        const existing=
          await getDoc(followRef);


        if(existing.exists()){

          /*
            Following state stays stable.
            This avoids accidental duplicate follow notifications.
          */

          followButton.textContent=
            "Following";

          followButton.classList.add(
            "following"
          );

          return;

        }


        await setDoc(
          followRef,
          {
            followerId:currentUser.uid,
            followingId:user.id,
            createdAt:serverTimestamp()
          }
        );


        followButton.textContent=
          "Following";

        followButton.classList.add(
          "following"
        );


        await createNotification({

          recipientId:user.id,
          senderId:currentUser.uid,
          senderName:currentUsername,
          type:"follow"

        });


      }catch(error){

        console.error(
          "Follow error:",
          error
        );

        followButton.disabled=false;

        alert(
          (error.code||"Error")+
          ": "+
          error.message
        );

      }

    }
  );


  return result;

}

document
  .querySelectorAll(".explore-tab")
  .forEach(tab=>{

    tab.addEventListener(
      "click",
      ()=>{

        document
          .querySelectorAll(".explore-tab")
          .forEach(button=>{
            button.classList.remove("active");
          });

        tab.classList.add("active");

        currentExploreMode=
          tab.dataset.exploreMode;

        renderExplore();

      }
    );

  });


async function loadExploreGrid(){

  if(allPosts.length===0){

    await loadPosts();

  }else{

    renderExplore();

  }

}


async function renderExplore(){

  exploreMediaGrid.innerHTML="";
  exploreTextFeed.innerHTML="";


  const posts=
    [...allPosts].sort(
      (a,b)=>
        (b.createdAt?.seconds||0)-
        (a.createdAt?.seconds||0)
    );


  if(
    currentExploreMode==="all"
  ){

    const mediaPosts=
      posts.filter(
        post=>
          post.mediaUrl&&
          (
            post.mediaType==="image"||
            post.mediaType==="video"
          )
      );

    const textPosts=
      posts.filter(
        post=>
          !post.mediaUrl&&
          String(post.text||"").trim()
      );


    renderExploreMediaTiles(
      mediaPosts
    );

    const elements=
      await Promise.all(
        textPosts.map(
          post=>buildExploreTextPost(post)
        )
      );

    elements.forEach(
      element=>
        exploreTextFeed.appendChild(element)
    );

    return;

  }


  if(
    currentExploreMode==="photos"
  ){

    const photoPosts=
      posts.filter(
        post=>
          post.mediaUrl&&
          post.mediaType==="image"
      );

    renderExploreMediaTiles(
      photoPosts
    );

    return;

  }


  if(
    currentExploreMode==="reels"
  ){

    const videoPosts=
      posts.filter(
        post=>
          post.mediaUrl&&
          post.mediaType==="video"
      );

    renderExploreMediaTiles(
      videoPosts
    );

  }

}


function renderExploreMediaTiles(posts){

  if(posts.length===0){

    exploreMediaGrid.innerHTML=`
      <div style="
        grid-column:1/-1;
        text-align:center;
        padding:45px 15px;
        color:#777f89;
        font-size:13px;
      ">
        Nothing here yet.
      </div>
    `;

    return;

  }


  posts.forEach(post=>{

    const tile=
      document.createElement("div");

    tile.className=
      "explore-media-tile";


    if(post.mediaType==="image"){

      tile.innerHTML=`
        <img
          src="${escapeAttribute(post.mediaUrl)}"
          alt="Community photo"
          loading="lazy"
        >
      `;

    }else{

      tile.innerHTML=`

        <video
          src="${escapeAttribute(post.mediaUrl)}"
          muted
          preload="metadata"
        ></video>

        <span class="video-badge">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
          >
            <path
              d="m9 7 8 5-8 5z"
              fill="currentColor"
            ></path>
          </svg>

        </span>

      `;

    }


    /*
      Clicking a media tile opens Home and focuses
      the actual post instead of simply doing nothing.
    */

    tile.addEventListener(
      "click",
      async()=>{

        showSection("homeSection");

        await renderFilteredPosts("");

        const homePosts=
          [...postsContainer.querySelectorAll(".post")];

        const index=
          allPosts.findIndex(
            item=>item.id===post.id
          );

        if(
          index>=0&&
          homePosts[index]
        ){

          homePosts[index].scrollIntoView({
            behavior:"smooth",
            block:"center"
          });

          homePosts[index].animate(
            [
              {opacity:.45},
              {opacity:1}
            ],
            {
              duration:450
            }
          );

        }

      }
    );


    exploreMediaGrid.appendChild(tile);

  });

}

      }

      showSection("homeSection");

      renderFilteredPosts("").then(()=>{

        const homePosts=
          [...postsContainer.querySelectorAll(".post")];

        const index=
          allPosts.findIndex(
            item=>item.id===post.id
          );

        if(
          index>=0&&
          homePosts[index]
        ){

          homePosts[index].scrollIntoView({
            behavior:"smooth",
            block:"center"
          });

        }

      });

    }
  );


  return article;

}


/* =========================================================
   NOTIFICATIONS
========================================================= */

async function createNotification(data){

  try{

    if(
      !data.recipientId||
      !data.senderId
    ){
      return;
    }


    await addDoc(
      collection(
        db,
        "notifications"
      ),
      {
        recipientId:data.recipientId,
        senderId:data.senderId,
        senderName:
          data.senderName||
          "Member",
        type:data.type,
        postId:data.postId||"",
        commentText:
          data.commentText||
          "",
        createdAt:serverTimestamp(),
        read:false
      }
    );

  }catch(error){

    console.error(
      "Notification error:",
      error
    );

  }

}


/*
  Realtime listener.

  No limit(100), so older notifications are not
  silently excluded anymore.
*/

function subscribeNotifications(){

  if(!currentUser)return;

  if(notificationUnsubscribe){

    notificationUnsubscribe();

    notificationUnsubscribe=null;

  }


  const q=
    query(
      collection(
        db,
        "notifications"
      ),
      where(
        "recipientId",
        "==",
        currentUser.uid
      )
    );


  notificationUnsubscribe=
    onSnapshot(
      q,
      snapshot=>{

        const notifications=[];

        snapshot.forEach(
          notificationDoc=>{

            notifications.push({
              id:notificationDoc.id,
              ...notificationDoc.data()
            });

          }
        );


        notifications.sort(
          (a,b)=>
            (b.createdAt?.seconds||0)-
            (a.createdAt?.seconds||0)
        );


        renderNotifications(
          notifications
        );

      },
      error=>{

        console.error(
          "Notifications listener:",
          error
        );

        alertList.innerHTML=`
          <div class="alert-empty">
            <h3>Couldn't load alerts</h3>
            <p>Please try again later.</p>
          </div>
        `;

      }
    );

}


function renderNotifications(
  notifications
){

  const unreadCount=
    notifications.filter(
      item=>item.read!==true
    ).length;


  if(unreadCount>0){

    alertBadge.textContent=
      unreadCount>99
        ? "99+"
        : unreadCount;

    alertBadge.classList.add(
      "show"
    );

  }else{

    alertBadge.classList.remove(
      "show"
    );

  }


  if(notifications.length===0){

    alertList.innerHTML=`
      <div class="alert-empty">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
        >
          <path d="M18 8 a6 6 0 0 0-12 0 c0 7-3 7-3 9h18 c0-2-3-2-3-9"></path>
          <path d="M10 21h4"></path>
        </svg>

        <h3>No new alerts</h3>

        <p>
          Your community notifications will appear here.
        </p>

      </div>
    `;

    return;

  }


  alertList.innerHTML="";


  notifications.forEach(
    notification=>{

      const element=
        document.createElement("div");


      let message="";
      let icon="";
      let alertClass="";


      if(
        notification.type==="like"
      ){

        alertClass="like-alert";

        message=
          `<b>${escapeHTML(
            notification.senderName||
            "Member"
          )}</b> liked your post.`;

        icon=`
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
          >
            <path d="M20.8 8.7 C20.8 13.7 12 20 12 20 S3.2 13.7 3.2 8.7 C3.2 5.7 5.4 3.7 8.1 3.7 C9.8 3.7 11.3 4.6 12 5.9 C12.7 4.6 14.2 3.7 15.9 3.7 C18.6 3.7 20.8 5.7 20.8 8.7Z"></path>
          </svg>
        `;

      }else if(
        notification.type==="comment"
      ){

        alertClass="comment-alert";

        message=
          `<b>${escapeHTML(
            notification.senderName||
            "Member"
          )}</b> commented on your post.`;

        icon=`
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
          >
            <path d="M20 11.5 a7.5 7.5 0 0 1-7.5 7.5 H8l-4 2 1.5-4 A7.5 7.5 0 1 1 20 11.5Z"></path>
          </svg>
        `;

      }else if(
        notification.type==="follow"
      ){

        alertClass="follow-alert";

        message=
          `<b>${escapeHTML(
            notification.senderName||
            "Member"
          )}</b> started following you.`;

        icon=`
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
          >
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M4 21 c0-4 3.5-7 8-7 s8 3 8 7"></path>
          </svg>
        `;

      }else{

        message=
          `<b>${escapeHTML(
            notification.senderName||
            "Member"
          )}</b> sent you a notification.`;

        icon=`
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
          >
            <path d="M18 8 a6 6 0 0 0-12 0 c0 7-3 7-3 9h18 c0-2-3-2-3-9"></path>
            <path d="M10 21h4"></path>
          </svg>
        `;

      }


      element.className=
        "notification "+
        alertClass+
        (
          notification.read===true
            ? ""
            : " unread"
        );


      element.innerHTML=`

        <div class="notification-icon">
          ${icon}
        </div>

        <div style="flex:1;min-width:0;">

          <div class="notification-text">
            ${message}
          </div>

          <div class="notification-time">
            ${formatTime(
              notification.createdAt
            )}
          </div>

        </div>

      `;


      element.addEventListener(
        "click",
        async()=>{

          try{

            if(
              notification.read!==true
            ){

              await setDoc(
                doc(
                  db,
                  "notifications",
                  notification.id
                ),
                {
                  read:true
                },
                {
                  merge:true
                }
              );

            }


            if(notification.postId){

              showSection(
                "homeSection"
              );

              await renderFilteredPosts(
                ""
              );

              const homePosts=
                [
                  ...postsContainer
                    .querySelectorAll(".post")
                ];

              const index=
                allPosts.findIndex(
                  item=>
                    item.id===
                    notification.postId
                );


              if(
                index>=0&&
                homePosts[index]
              ){

                homePosts[index].scrollIntoView({
                  behavior:"smooth",
                  block:"center"
                });

              }

            }

          }catch(error){

            console.error(
              "Read notification error:",
              error
            );

          }

        }
      );


      alertList.appendChild(
        element
      );

    }
  );

}


/* =========================================================
   MARK ALL READ
========================================================= */

document
  .getElementById("markReadButton")
  .addEventListener(
    "click",
    async()=>{

      if(!currentUser)return;

      try{

        const q=
          query(
            collection(
              db,
              "notifications"
            ),
            where(
              "recipientId",
              "==",
              currentUser.uid
            )
          );


        const snapshot=
          await getDocs(q);


        const updates=[];


        snapshot.forEach(
          notificationDoc=>{

            const data=
              notificationDoc.data();

            if(data.read!==true){

              updates.push(
                setDoc(
                  doc(
                    db,
                    "notifications",
                    notificationDoc.id
                  ),
                  {
                    read:true
                  },
                  {
                    merge:true
                  }
                )
              );

            }

          }
        );


        await Promise.all(
          updates
        );

      }catch(error){

        console.error(
          "Mark read error:",
          error
        );

      }

    }
  );


/* =========================================================
   HELPERS
========================================================= */

function normalizePostText(text){

  return String(text)
    .replace(/[ \t]+\n/g,"\n")
    .replace(/\n[ \t]+/g,"\n");

}


function makeHandle(name){

  return String(name||"Member")
    .trim()
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,"")
    .slice(0,24)||"member";

}


function escapeHTML(text){

  const div=
    document.createElement("div");

  div.textContent=
    String(text);

  return div.innerHTML;

}


function escapeAttribute(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}


function formatTime(timestamp){

  /*
    Firestore serverTimestamp can temporarily
    be unavailable immediately after creation.
    In that case "Just now" is intentional.
  */

  if(
    !timestamp||
    !timestamp.seconds
  ){

    return "Just now";

  }


  const date=
    new Date(
      timestamp.seconds*1000
    );

  const now=
    new Date();

  const diff=
    Math.floor(
      (now-date)/1000
    );


  if(diff<60)
    return "Just now";

  if(diff<3600)
    return Math.floor(
      diff/60
    )+"m ago";

  if(diff<86400)
    return Math.floor(
      diff/3600
    )+"h ago";

  if(diff<604800)
    return Math.floor(
      diff/86400
    )+"d ago";


  return date.toLocaleDateString(
    "en-IN",
    {
      day:"numeric",
      month:"short"
    }
  );

}
