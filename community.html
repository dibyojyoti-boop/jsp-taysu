<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JSP TAYSU Community</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#0b0d10;
  color:#f5f5f5;
  padding-bottom:78px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(11,13,16,.92);
  backdrop-filter:blur(18px);
  border-bottom:1px solid #25282d;
}

.topbar-inner{
  max-width:720px;
  margin:auto;
  height:64px;
  padding:0 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:18px;
  font-weight:800;
  letter-spacing:-.4px;
}

.logo-dragon{
  font-size:23px;
}

.profile-name{
  max-width:170px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:#aeb3bb;
  font-size:13px;
}

.container{
  max-width:720px;
  margin:auto;
  padding:17px 14px 30px;
}

.page-section{
  display:none;
}

.page-section.active{
  display:block;
}

.feed-heading{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:5px 4px 10px;
}

.feed-heading h2{
  font-size:21px;
  letter-spacing:-.5px;
}

.feed-heading-right{
  display:flex;
  align-items:center;
  gap:7px;
}

.feed-search-button{
  width:34px;
  height:34px;
  border:0;
  border-radius:10px;
  background:#171a1f;
  color:#d7bd8c;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.feed-search-button svg{
  width:19px;
  height:19px;
}

.feed-search-box{
  display:none;
  margin-bottom:9px;
}

.feed-search-box.show{
  display:flex;
}

#feedSearchInput{
  width:100%;
  padding:11px 13px;
  border:1px solid #292d33;
  border-radius:12px;
  background:#15181d;
  color:#fff;
  outline:none;
  font-size:14px;
}

#posts{
  display:flex;
  flex-direction:column;
  gap:0;
}

.post{
  background:#111419;
  border:1px solid #292d33;
  border-radius:18px;
  padding:12px 14px;
  margin-bottom:7px;
  box-shadow:0 8px 24px rgba(0,0,0,.13);
  scroll-margin-top:80px;
}

.post.highlighted{
  border-color:#d7bd8c;
  box-shadow:0 0 0 1px rgba(215,189,140,.25),
             0 8px 28px rgba(0,0,0,.2);
}

.post-header{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:5px;
  cursor:pointer;
}

.avatar{
  width:42px;
  height:42px;
  flex-shrink:0;
  border-radius:50%;
  background:#33271f;
  color:#ead9b8;
  border:2px solid #554438;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:800;
}

.post-author{
  font-size:14px;
  font-weight:800;
}

.post-time{
  color:#777f89;
  font-size:11px;
  margin-top:1px;
}

.post-text{
  color:#eceef1;
  font-size:15px;
  line-height:1.42;
  white-space:pre-line;
  overflow-wrap:anywhere;
  word-break:normal;
  margin:0;
  padding:0;
}

.post-media{
  width:100%;
  border-radius:14px;
  margin:4px 0 5px;
  display:block;
  max-height:520px;
  object-fit:cover;
  background:#08090b;
}

.post-video{
  width:100%;
  border-radius:14px;
  background:#08090b;
  margin:4px 0 5px;
  max-height:520px;
}

.actions{
  border-top:1px solid #25282d;
  padding-top:4px;
  display:flex;
  align-items:center;
  gap:2px;
}

.action{
  border:0;
  background:transparent;
  color:#9299a2;
  display:flex;
  align-items:center;
  gap:5px;
  padding:6px 8px;
  border-radius:10px;
  cursor:pointer;
  font-size:12px;
  transition:.18s;
}

.action:hover{
  background:#1b1e23;
  color:#fff;
}

.action svg{
  width:18px;
  height:18px;
  stroke-width:1.8;
}

.action.liked{
  color:#ff5d6c;
}

.action b{
  font-weight:600;
}

.comments-area{
  display:none;
  margin-top:7px;
  padding-top:7px;
  border-top:1px solid #25282d;
}

.comments-list{
  margin-bottom:8px;
}

.comment{
  background:#181b20;
  border:1px solid #282c32;
  border-radius:11px;
  padding:8px 10px;
  margin-bottom:5px;
}

.comment-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:3px;
}

.comment-user{
  font-size:12px;
  font-weight:800;
}

.comment-text{
  color:#c8ccd1;
  font-size:13px;
  line-height:1.4;
  overflow-wrap:anywhere;
}

.delete-comment{
  border:0;
  background:none;
  color:#8e7272;
  font-size:10px;
  cursor:pointer;
}

.comment-form{
  display:flex;
  gap:7px;
}

.comment-input{
  flex:1;
  min-width:0;
  padding:9px 11px;
  border:1px solid #2a2e34;
  border-radius:11px;
  background:#15181d;
  color:white;
  outline:none;
}

.comment-send{
  border:0;
  padding:0 13px;
  border-radius:11px;
  background:#f1f1f1;
  color:#0b0d10;
  font-weight:700;
  cursor:pointer;
}

.empty{
  text-align:center;
  background:#111419;
  border:1px solid #292d33;
  border-radius:18px;
  padding:45px 20px;
  color:#858c95;
}

.empty-icon{
  width:50px;
  height:50px;
  margin:0 auto 13px;
  border-radius:15px;
  background:#191c21;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#d7bd8c;
}

.empty-icon svg{
  width:26px;
  height:26px;
}

.empty h3{
  color:#e7e9ec;
  margin-bottom:5px;
  font-size:16px;
}

.empty p{
  font-size:13px;
}

.create-page-title{
  padding:6px 3px 14px;
}

.create-page-title h1{
  font-size:27px;
  letter-spacing:-1px;
}

.create-page-title p{
  color:#858c95;
  font-size:13px;
  margin-top:4px;
}

.create-card{
  background:#111419;
  border:1px solid #292d33;
  border-radius:18px;
  padding:14px;
}

.composer-header{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:7px;
}

.composer-name{
  font-size:15px;
  font-weight:800;
}

.composer-sub{
  color:#777f89;
  font-size:12px;
  margin-top:2px;
}

#postText{
  width:100%;
  min-height:62px;
  height:62px;
  resize:vertical;
  border:0;
  outline:none;
  border-radius:12px;
  padding:10px;
  background:#181b20;
  color:#f4f4f4;
  font-family:inherit;
  font-size:15px;
  line-height:1.45;
}

#postText::placeholder{
  color:#6f7680;
}

.create-media-preview{
  display:none;
  margin-top:8px;
  position:relative;
}

.create-media-preview img,
.create-media-preview video{
  width:100%;
  max-height:400px;
  object-fit:cover;
  border-radius:14px;
  background:#08090b;
}

.remove-media{
  position:absolute;
  right:8px;
  top:8px;
  width:31px;
  height:31px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.75);
  color:#fff;
  cursor:pointer;
  font-size:17px;
}

.create-options{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-top:8px;
}

.media-buttons{
  display:flex;
  gap:6px;
}

.media-button{
  border:1px solid #30343a;
  background:#181b20;
  color:#b9bec5;
  padding:8px 10px;
  border-radius:11px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:5px;
  font-size:12px;
  font-weight:600;
}

.media-button svg{
  width:15px;
  height:15px;
}

.post-btn{
  border:0;
  background:#f1f1f1;
  color:#0b0d10;
  padding:9px 17px;
  border-radius:12px;
  font-weight:800;
  cursor:pointer;
}

.post-btn:disabled{
  opacity:.5;
  cursor:default;
}

.explore-title{
  padding:7px 3px 15px;
}

.explore-title h1{
  font-size:27px;
  letter-spacing:-1px;
}

.explore-title p{
  color:#858c95;
  font-size:13px;
  margin-top:4px;
}

.search-box{
  display:flex;
  gap:8px;
  margin-bottom:13px;
}

#userSearchInput{
  flex:1;
  min-width:0;
  padding:13px 15px;
  border:1px solid #292d33;
  border-radius:14px;
  background:#15181d;
  color:#fff;
  font-size:14px;
  outline:none;
}

.search-button{
  width:48px;
  border:0;
  border-radius:14px;
  background:#f1f1f1;
  color:#0b0d10;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.search-button svg{
  width:20px;
  height:20px;
}

#searchResults{
  margin-bottom:18px;
}

.search-result{
  background:#15181d;
  border:1px solid #292d33;
  border-radius:15px;
  padding:12px;
  margin-bottom:7px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.search-user{
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
  min-width:0;
}

.search-avatar{
  width:39px;
  height:39px;
  flex-shrink:0;
  border-radius:50%;
  background:#30251f;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  color:#ead9b8;
  border:1px solid #5a4739;
}

.search-username{
  font-size:14px;
  font-weight:700;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.follow-button{
  border:0;
  padding:8px 14px;
  border-radius:10px;
  background:#f1f1f1;
  color:#0b0d10;
  font-weight:700;
  cursor:pointer;
}

.follow-button:disabled{
  background:#292d33;
  color:#aaa;
}

.alert-title{
  padding:7px 3px 15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.alert-title h1{
  font-size:27px;
  letter-spacing:-1px;
}

.alert-mark-read{
  border:1px solid #30343a;
  background:#15181d;
  color:#aeb3bb;
  padding:8px 11px;
  border-radius:10px;
  font-size:11px;
  cursor:pointer;
}

.alert-mark-read:hover{
  background:#1b1e23;
  color:#fff;
}

.alert-list{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.notification{
  position:relative;
  display:flex;
  align-items:center;
  gap:11px;
  padding:12px;
  background:#111419;
  border:1px solid #292d33;
  border-radius:15px;
  cursor:pointer;
  transition:.18s;
}

.notification:hover{
  background:#181b20;
}

.notification.unread{
  background:#15181d;
  border-color:#343941;
}

.notification.unread::after{
  content:"";
  position:absolute;
  right:12px;
  top:14px;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#d7bd8c;
}

.notification-icon{
  width:40px;
  height:40px;
  flex-shrink:0;
  border-radius:50%;
  background:#1b1e23;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#d7bd8c;
}

.notification-icon svg{
  width:19px;
  height:19px;
}

.notification-text{
  padding-right:12px;
  font-size:13px;
  line-height:1.4;
  color:#dfe2e6;
}

.notification-text b{
  color:#fff;
}

.notification-time{
  color:#777f89;
  font-size:10px;
  margin-top:3px;
}

.alert-empty{
  text-align:center;
  padding:50px 20px;
  color:#858c95;
}

.alert-empty svg{
  width:36px;
  height:36px;
  color:#d7bd8c;
  margin-bottom:10px;
}

.alert-empty h3{
  color:#e7e9ec;
  margin-bottom:5px;
}

.alert-empty p{
  font-size:13px;
}

.alert-loading{
  text-align:center;
  padding:35px;
  color:#777f89;
  font-size:13px;
}

.alert-badge{
  position:absolute;
  top:7px;
  right:calc(50% - 17px);
  min-width:15px;
  height:15px;
  padding:0 4px;
  border-radius:8px;
  background:#d7bd8c;
  color:#0b0d10;
  font-size:9px;
  font-weight:800;
  display:none;
  align-items:center;
  justify-content:center;
  border:2px solid #0b0d10;
}

.nav-item{
  position:relative;
  flex:1;
  max-width:115px;
  border:0;
  background:none;
  color:#727983;
  cursor:pointer;
  border-radius:13px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  transition:.18s;
}

.nav-item svg{
  width:21px;
  height:21px;
  stroke-width:1.8;
}

.nav-item span{
  font-size:10px;
}

.nav-item:hover{
  color:#dfe2e6;
  background:#15181d;
}

.nav-item.active{
  color:#fff;
}

.nav-item.create-active{
  color:#d7bd8c;
}

.create-plus{
  width:32px;
  height:32px;
  border:1px solid #555b63;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.create-plus svg{
  width:18px;
  height:18px;
}

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:72px;
  z-index:200;
  background:rgba(11,13,16,.96);
  backdrop-filter:blur(20px);
  border-top:1px solid #292d33;
  display:flex;
  justify-content:center;
  padding:6px 8px;
  box-shadow:0 -10px 30px rgba(0,0,0,.2);
}

.hidden-file{
  display:none;
}

.profile-link{
  cursor:pointer;
}

@media(max-width:500px){

  .container{
    padding:15px 10px 25px;
  }

  .topbar-inner{
    height:61px;
    padding:0 13px;
  }

  .logo{
    font-size:16px;
  }

  .profile-name{
    max-width:130px;
  }

  .post{
    border-radius:16px;
    padding:11px 12px;
  }

  .post-text{
    font-size:15px;
    margin:0;
    padding:0;
  }

  .action{
    padding:7px 6px;
  }

  .action span{
    display:none;
  }

  .action svg{
    width:19px;
    height:19px;
  }

  .create-card{
    border-radius:17px;
    padding:13px;
  }

  #postText{
    min-height:62px;
    height:62px;
  }

  .media-button{
    padding:8px 9px;
  }

  .post-btn{
    padding:9px 14px;
  }

  .bottom-nav{
    height:68px;
  }

}

</style>
</head>

<body>

<header class="topbar">

  <div class="topbar-inner">

    <div class="logo">
      <span class="logo-dragon">🐉</span>
      <span>JSP TAYSU</span>
    </div>

    <div
      class="profile-name"
      id="profileName">
      Member
    </div>

  </div>

</header>


<main class="container">


<!-- HOME -->

<section
  id="homeSection"
  class="page-section active">

  <div class="feed-heading">

    <h2>
      Community Feed
    </h2>

    <div class="feed-heading-right">

      <button
        id="feedSearchButton"
        class="feed-search-button"
        type="button"
        aria-label="Search posts">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor">

          <circle
            cx="11"
            cy="11"
            r="7">
          </circle>

          <path
            d="m20 20-4-4">
          </path>

        </svg>

      </button>

    </div>

  </div>


  <div
    id="feedSearchBox"
    class="feed-search-box">

    <input
      id="feedSearchInput"
      type="text"
      placeholder="Search posts or topics..."
      maxlength="100">

  </div>


  <section id="posts">

    <div class="empty">

      <div class="empty-icon">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor">

          <circle
            cx="12"
            cy="12"
            r="8">
          </circle>

          <path
            d="M8 12h8">
          </path>

        </svg>

      </div>

      <h3>
        Loading community...
      </h3>

      <p>
        Please wait a moment.
      </p>

    </div>

  </section>

</section>


<!-- CREATE -->

<section
  id="createSection"
  class="page-section">

  <div class="create-page-title">

    <h1>
      Create
    </h1>

    <p>
      Share something with the JSP TAYSU community.
    </p>

  </div>


  <div class="create-card">

    <div class="composer-header">

      <div
        class="avatar"
        id="composerAvatar">
        M
      </div>

      <div>

        <div
          class="composer-name"
          id="composerName">
          Member
        </div>

        <div class="composer-sub">
          Share with the community
        </div>

      </div>

    </div>


    <textarea
      id="postText"
      maxlength="5000"
      placeholder="What's on your mind?"></textarea>


    <div
      id="createMediaPreview"
      class="create-media-preview">

      <button
        id="removeMediaButton"
        class="remove-media"
        type="button">
        ×
      </button>

      <div id="mediaPreviewContent"></div>

    </div>


    <div class="create-options">

      <div class="media-buttons">

        <button
          class="media-button"
          id="photoButton"
          type="button">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor">

            <rect
              x="3"
              y="4"
              width="18"
              height="16"
              rx="3">
            </rect>

            <circle
              cx="8.5"
              cy="9"
              r="1.5">
            </circle>

            <path
              d="m5 17 4-4 3 3 2-2 5 5">
            </path>

          </svg>

          Photo

        </button>


        <button
          class="media-button"
          id="videoButton"
          type="button">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor">

            <rect
              x="3"
              y="5"
              width="13"
              height="14"
              rx="3">
            </rect>

            <path
              d="m16 10 5-3v10l-5-3z">
            </path>

          </svg>

          Video

        </button>


        <input
          type="file"
          id="photoInput"
          class="hidden-file"
          accept="image/*">

        <input
          type="file"
          id="videoInput"
          class="hidden-file"
          accept="video/*">

      </div>


      <button
        class="post-btn"
        id="postButton"
        type="button">

        Post

      </button>

    </div>

  </div>

</section>


<!-- EXPLORE -->

<section
  id="exploreSection"
  class="page-section">

  <div class="explore-title">

    <h1>
      Explore
    </h1>

    <p>
      Discover members and connect with the community.
    </p>

  </div>


  <div class="search-box">

    <input
      type="text"
      id="userSearchInput"
      placeholder="Search members..."
      maxlength="30"
      autocomplete="off">

    <button
      id="userSearchButton"
      class="search-button"
      aria-label="Search"
      type="button">

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor">

        <circle
          cx="11"
          cy="11"
          r="7">
        </circle>

        <path
          d="m20 20-4-4">
        </path>

      </svg>

    </button>

  </div>


  <div id="searchResults"></div>

</section>


<!-- ALERTS -->

<section
  id="alertsSection"
  class="page-section">

  <div class="alert-title">

    <h1>
      Alerts
    </h1>

    <button
      id="markAllReadButton"
      class="alert-mark-read"
      type="button">

      Mark all read

    </button>

  </div>


  <div
    id="alertList"
    class="alert-list">

    <div class="alert-loading">
      Loading alerts...
    </div>

  </div>

</section>

            );

/*
 * NOTIFY FOLLOWERS
 *
 * Finds every document in:
 *
 * follows
 *
 * where:
 * followingId == current user's UID
 *
 * Then creates an alert for each follower.
 */

async function notifyFollowersAboutPost(
  postId
){

  if(!currentUser){

    return;

  }


  try{

    const followersQuery =
      query(
        collection(
          db,
          "follows"
        ),
        where(
          "followingId",
          "==",
          currentUser.uid
        )
      );


    const snapshot =
      await getDocs(
        followersQuery
      );


    if(snapshot.empty){

      return;

    }


    const notificationPromises = [];


    snapshot.forEach(
      followDoc => {

        const data =
          followDoc.data();


        const followerId =
          data.followerId;


        if(
          !followerId ||
          followerId ===
          currentUser.uid
        ){

          return;

        }


        notificationPromises.push(
          addDoc(
            collection(
              db,
              "notifications"
            ),
            {

              recipientId:
                followerId,

              senderId:
                currentUser.uid,

              senderName:
                currentUsername,

              type:
                "new_post",

              postId:
                postId,

              commentText:
                "",

              createdAt:
                serverTimestamp(),

              read:
                false

            }
          )
        );

      }
    );


    await Promise.all(
      notificationPromises
    );


  }catch(error){

    console.error(
      "Follower post notification error:",
      error
    );

  }

}


/* LOAD POSTS */

async function loadPosts(){

  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "posts"
        )
      );


    allPosts = [];


    snapshot.forEach(
      postDoc => {

        allPosts.push({

          id:
            postDoc.id,

          ...postDoc.data()

        });

      }
    );


    allPosts.sort(
      (a,b) => {

        const aTime =
          a.createdAt?.seconds || 0;

        const bTime =
          b.createdAt?.seconds || 0;

        return bTime - aTime;

      }
    );


    renderFilteredPosts(
      feedSearchInput.value
    );


  }catch(error){

    console.error(
      "Load posts error:",
      error
    );


    postsContainer.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          ⚠️
        </div>

        <h3>
          Couldn't load posts
        </h3>

        <p>
          Please refresh the page.
        </p>

      </div>

    `;

  }

}


/* FILTER POSTS */

async function renderFilteredPosts(
  searchText
){

  const queryText =
    String(searchText || "")
      .trim()
      .toLowerCase();


  const filtered =
    allPosts.filter(post => {

      if(!queryText){

        return true;

      }


      const text =
        String(
          post.text || ""
        ).toLowerCase();


      const author =
        String(
          post.authorName || ""
        ).toLowerCase();


      return (
        text.includes(queryText) ||
        author.includes(queryText)
      );

    });


  postsContainer.innerHTML = "";


  if(filtered.length === 0){

    postsContainer.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          🔍
        </div>

        <h3>
          No matching posts
        </h3>

        <p>
          Try another topic or keyword.
        </p>

      </div>

    `;

    return;

  }


  for(
    const post of filtered
  ){

    await renderPost(
      post,
      postsContainer
    );

  }

}


/* RENDER POST */

async function renderPost(
  post,
  postsContainer
){

  const postElement =
    document.createElement("article");


  postElement.className =
    "post";

  postElement.dataset.postId =
    post.id;


  const username =
    post.authorName ||
    "Member";


  let likeCount = 0;
  let alreadyLiked = false;


  try{

    const likesSnapshot =
      await getDocs(
        collection(
          db,
          "posts",
          post.id,
          "likes"
        )
      );


    likeCount =
      likesSnapshot.size;


    if(currentUser){

      alreadyLiked =
        likesSnapshot.docs.some(
          likeDoc =>
            likeDoc.id ===
            currentUser.uid
        );

    }

  }catch(error){

    console.error(
      "Like loading error:",
      error
    );

  }


  let commentCount = 0;


  try{

    const commentsSnapshot =
      await getDocs(
        collection(
          db,
          "posts",
          post.id,
          "comments"
        )
      );


    commentCount =
      commentsSnapshot.size;

  }catch(error){

    console.error(
      "Comment loading error:",
      error
    );

  }


  let mediaHTML = "";


  if(
    post.mediaUrl &&
    post.mediaType === "image"
  ){

    mediaHTML = `

      <img
        class="post-media"
        src="${escapeAttribute(post.mediaUrl)}"
        alt="Community post image"
        loading="lazy">

    `;

  }


  if(
    post.mediaUrl &&
    post.mediaType === "video"
  ){

    mediaHTML = `

      <video
        class="post-video"
        controls
        preload="metadata">

        <source
          src="${escapeAttribute(post.mediaUrl)}">

      </video>

    `;

  }


  postElement.innerHTML = `

    <div
      class="post-header"
      data-profile-id="${escapeAttribute(
        post.authorId || ""
      )}">

      <div class="avatar">

        ${escapeHTML(
          username
            .charAt(0)
            .toUpperCase()
        )}

      </div>

      <div>

        <div class="post-author">
          ${escapeHTML(username)}
        </div>

        <div class="post-time">
          ${formatTime(post.createdAt)}
        </div>

      </div>

    </div>


    ${
      post.text
      ?
      `<div class="post-text">${escapeHTML(
        String(post.text)
          .replace(/[ \t]+\n/g, "\n")
          .replace(/\n[ \t]+/g, "\n")
      )}</div>`
      :
      ""
    }


    ${mediaHTML}


    <div class="actions">

      <button
        class="action like-button ${alreadyLiked ? "liked" : ""}"
        type="button">

        <svg
          viewBox="0 0 24 24"
          fill="${alreadyLiked ? "currentColor" : "none"}"
          stroke="currentColor">

          <path
            d="M20.8 8.7
               C20.8 13.7 12 20 12 20
               S3.2 13.7 3.2 8.7
               C3.2 5.7 5.4 3.7 8.1 3.7
               C9.8 3.7 11.3 4.6 12 5.9
               C12.7 4.6 14.2 3.7 15.9 3.7
               C18.6 3.7 20.8 5.7 20.8 8.7Z">
          </path>

        </svg>

        <span>
          ${alreadyLiked ? "Unlike" : "Like"}
        </span>

        <b class="like-count">
          ${likeCount}
        </b>

      </button>


      <button
        class="action comment-button"
        type="button">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor">

          <path
            d="M20 11.5
               a7.5 7.5 0 0 1-7.5 7.5
               H8l-4 2 1.5-4
               A7.5 7.5 0 1 1 20 11.5Z">
          </path>

        </svg>

        <span>
          Comment
        </span>

        <b class="comment-count">
          ${commentCount}
        </b>

      </button>


      <button
        class="action share-button"
        type="button">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor">

          <path d="M12 16V4"></path>
          <path d="m7 9 5-5 5 5"></path>

          <path
            d="M5 13v5
               a2 2 0 0 0 2 2h10
               a2 2 0 0 0 2-2v-5">
          </path>

        </svg>

        <span>
          Share
        </span>

      </button>

    </div>


    <div class="comments-area">

      <div class="comments-list"></div>

      <div class="comment-form">

        <input
          class="comment-input"
          type="text"
          maxlength="300"
          placeholder="Write a comment...">

        <button
          class="comment-send"
          type="button">
          Send
        </button>

      </div>

    </div>

  `;


  postsContainer.appendChild(
    postElement
  );


  /* PROFILE CLICK */

  const postHeader =
    postElement.querySelector(
      ".post-header"
    );


  postHeader.addEventListener(
    "click",
    () => {

      if(post.authorId){

        openProfile(
          post.authorId
        );

      }

    }
  );


  /* LIKE */

  const likeButton =
    postElement.querySelector(
      ".like-button"
    );

  const likeCountElement =
    postElement.querySelector(
      ".like-count"
    );

  const likeText =
    likeButton.querySelector(
      "span"
    );


  likeButton.addEventListener(
    "click",
    async () => {

      if(!currentUser){

        alert(
          "Please sign in first."
        );

        return;

      }


      likeButton.disabled = true;


      try{

        const likeRef =
          doc(
            db,
            "posts",
            post.id,
            "likes",
            currentUser.uid
          );


        const likeSnap =
          await getDoc(
            likeRef
          );


        let count =
          Number(
            likeCountElement.textContent
          ) || 0;


        if(likeSnap.exists()){

          await deleteDoc(
            likeRef
          );

          count =
            Math.max(
              0,
              count - 1
            );

          likeText.textContent =
            "Like";

          likeButton.classList
            .remove("liked");

          likeButton
            .querySelector("svg")
            .setAttribute(
              "fill",
              "none"
            );

        }else{

          await setDoc(
            likeRef,
            {

              userId:
                currentUser.uid,

              createdAt:
                serverTimestamp()

            }
          );

          count++;

          likeText.textContent =
            "Unlike";

          likeButton.classList
            .add("liked");

          likeButton
            .querySelector("svg")
            .setAttribute(
              "fill",
              "currentColor"
            );


          if(
            post.authorId &&
            post.authorId !==
            currentUser.uid
          ){

            await createNotification({

              recipientId:
                post.authorId,

              senderId:
                currentUser.uid,

              senderName:
                currentUsername,

              type:
                "like",

              postId:
                post.id

            });

          }

        }


        likeCountElement.textContent =
          count;


      }catch(error){

        console.error(
          "Like error:",
          error
        );

        alert(
          error.code +
          ": " +
          error.message
        );

      }finally{

        likeButton.disabled =
          false;

      }

    }
  );


  /* COMMENTS */

  const commentButton =
    postElement.querySelector(
      ".comment-button"
    );

  const commentsArea =
    postElement.querySelector(
      ".comments-area"
    );

  const commentsList =
    postElement.querySelector(
      ".comments-list"
    );

  const commentInput =
    postElement.querySelector(
      ".comment-input"
    );

  const commentSend =
    postElement.querySelector(
      ".comment-send"
    );

  const commentCountElement =
    postElement.querySelector(
      ".comment-count"
    );


  commentButton.addEventListener(
    "click",
    async () => {

      if(!currentUser){

        alert(
          "Please sign in first."
        );

        return;

      }


      const open =
        commentsArea.style.display ===
        "block";


      if(open){

        commentsArea.style.display =
          "none";

      }else{

        commentsArea.style.display =
          "block";

        await loadComments(
          post.id,
          commentsList
        );

      }

    }
  );


  async function sendComment(){

    if(!currentUser){

      alert(
        "Please sign in first."
      );

      return;

    }


    const text =
      commentInput.value.trim();


    if(!text){

      return;

    }


    commentSend.disabled =
      true;


    try{

      await addDoc(
        collection(
          db,
          "posts",
          post.id,
          "comments"
        ),
        {

          text:
            text,

          userId:
            currentUser.uid,

          username:
            currentUsername,

          createdAt:
            serverTimestamp()

        }
      );


      commentInput.value = "";


      let count =
        Number(
          commentCountElement.textContent
        ) || 0;


      count++;

      commentCountElement.textContent =
        count;


      await loadComments(
        post.id,
        commentsList
      );


      if(
        post.authorId &&
        post.authorId !==
        currentUser.uid
      ){

        await createNotification({

          recipientId:
            post.authorId,

          senderId:
            currentUser.uid,

          senderName:
            currentUsername,

          type:
            "comment",

          postId:
            post.id,

          commentText:
            text

        });

      }


    }catch(error){

      console.error(
        "Comment error:",
        error
      );

      alert(
        error.code +
        ": " +
        error.message
      );

    }finally{

      commentSend.disabled =
        false;

    }

  }


  commentSend.addEventListener(
    "click",
    sendComment
  );


  commentInput.addEventListener(
    "keydown",
    event => {

      if(event.key === "Enter"){

        event.preventDefault();

        sendComment();

      }

    }
  );


  /* SHARE */

  const shareButton =
    postElement.querySelector(
      ".share-button"
    );


  shareButton.addEventListener(
    "click",
    async () => {

      try{

        if(navigator.share){

          await navigator.share({

            title:
              "JSP TAYSU Community",

            text:
              `${username} shared a post on JSP TAYSU Community 🐉`,

            url:
              window.location.href

          });

        }else{

          await navigator.clipboard
            .writeText(
              window.location.href
            );

          alert(
            "Community link copied! 🔗"
          );

        }

      }catch(error){

        console.log(
          "Share cancelled."
        );

      }

    }
  );

}


/* COMMENTS */

async function loadComments(
  postId,
  commentsList
){

  commentsList.innerHTML = "";


  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "posts",
          postId,
          "comments"
        )
      );


    if(snapshot.empty){

      commentsList.innerHTML = `

        <div
          style="
            color:#777f89;
            font-size:12px;
            padding:4px 2px;
          ">

          No comments yet.

        </div>

      `;

      return;

    }


    const comments = [];


    snapshot.forEach(
      commentDoc => {

        comments.push({

          id:
            commentDoc.id,

          ...commentDoc.data()

        });

      }
    );


    comments.sort(
      (a,b) => {

        const aTime =
          a.createdAt?.seconds || 0;

        const bTime =
          b.createdAt?.seconds || 0;

        return aTime - bTime;

      }
    );


    comments.forEach(
      comment => {

        const element =
          document.createElement("div");


        element.className =
          "comment";


        element.innerHTML = `

          <div class="comment-top">

            <div class="comment-user">
              ${escapeHTML(
                comment.username ||
                "Member"
              )}
            </div>

            ${
              currentUser &&
              comment.userId ===
              currentUser.uid
              ?
              `
                <button
                  class="delete-comment"
                  type="button">
                  Delete
                </button>
              `
              :
              ""
            }

          </div>


          <div class="comment-text">
            ${escapeHTML(
              comment.text ||
              ""
            )}
          </div>

        `;


        commentsList.appendChild(
          element
        );


        const deleteButton =
          element.querySelector(
            ".delete-comment"
          );


        if(deleteButton){

          deleteButton.addEventListener(
            "click",
            async () => {

              try{

                await deleteDoc(
                  doc(
                    db,
                    "posts",
                    postId,
                    "comments",
                    comment.id
                  )
                );


                await loadComments(
                  postId,
                  commentsList
                );


              }catch(error){

                console.error(
                  error
                );

                alert(
                  error.code +
                  ": " +
                  error.message
                );

              }

            }
          );

        }

      }
    );


  }catch(error){

    console.error(
      "Comments error:",
      error
    );


    commentsList.innerHTML = `

      <div
        style="
          color:#9c7373;
          font-size:12px;
        ">

        Couldn't load comments.

      </div>

    `;

  }

}


/* LOAD MEMBERS */

async function loadMembers(){

  if(
    allMembers.length > 0
  ){

    searchMembers();

    return;

  }


  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "users"
        )
      );


    allMembers = [];


    snapshot.forEach(
      userDoc => {

        const data =
          userDoc.data();


        allMembers.push({

          id:
            userDoc.id,

          ...data

        });

      }
    );


    searchMembers();

  }catch(error){

    console.error(
      "Members error:",
      error
    );

  }

}


/* MEMBER SEARCH */

const userSearchButton =
  document.getElementById(
    "userSearchButton"
  );

const userSearchInput =
  document.getElementById(
    "userSearchInput"
  );

const searchResults =
  document.getElementById(
    "searchResults"
  );


userSearchButton.addEventListener(
  "click",
  searchMembers
);


userSearchInput.addEventListener(
  "input",
  searchMembers
);


userSearchInput.addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){

      searchMembers();

    }

  }
);


async function searchMembers(){

  const searchText =
    userSearchInput.value
      .trim()
      .toLowerCase();


  if(!currentUser){

    return;

  }


  if(
    allMembers.length === 0
  ){

    await loadMembers();

    return;

  }


  searchResults.innerHTML = "";


  if(!searchText){

    searchResults.innerHTML = `

      <p
        style="
          color:#777f89;
          font-size:13px;
          padding:5px;
        ">

        Start typing a member's name.

      </p>

    `;

    return;

  }


  const matches =
    allMembers
      .filter(user => {

        if(
          user.id ===
          currentUser.uid
        ){

          return false;

        }


        const username =
          String(
            user.username ||
            user.displayName ||
            ""
          ).toLowerCase();


        return username.includes(
          searchText
        );

      })
      .sort(
        (a,b) => {

          const aName =
            String(
              a.username ||
              a.displayName ||
              ""
            ).toLowerCase();

          const bName =
            String(
              b.username ||
              b.displayName ||
              ""
            ).toLowerCase();


          const aStarts =
            aName.startsWith(
              searchText
            );

          const bStarts =
            bName.startsWith(
              searchText
            );


          if(
            aStarts !==
            bStarts
          ){

            return aStarts
              ? -1
              : 1;

          }


          return aName.localeCompare(
            bName
          );

        }
      )
      .slice(
        0,
        20
      );


  if(matches.length === 0){

    searchResults.innerHTML = `

      <p
        style="
          color:#777f89;
          font-size:13px;
          padding:5px;
        ">

        No members found.

      </p>

    `;

    return;

  }


  for(
    const user of matches
  ){

    await renderMemberSearchResult(
      user
    );

  }

}

          doc(
            db,

              currentUser.uid,

            followingId:
              user.id,

        });

          "Follow error:",

        );

/* CREATE NOTIFICATION */

async function createNotification(data){

  try{

    if(
      !data.recipientId ||
      !data.senderId
    ){

      return;

    }


    await addDoc(
      collection(
        db,
        "notifications"
      ),
      {

        recipientId:
          data.recipientId,

        senderId:
          data.senderId,

        senderName:
          data.senderName ||
          "Member",

        type:
          data.type,

        postId:
          data.postId ||
          "",

        commentText:
          data.commentText ||
          "",

        createdAt:
          serverTimestamp(),

        read:
          false

      }
    );


    /*
     * If the current user is the recipient,
     * refresh the badge immediately.
     */

    if(
      currentUser &&
      data.recipientId ===
      currentUser.uid
    ){

      await loadNotifications();

    }


  }catch(error){

    console.error(
      "Notification error:",
      error
    );

  }

}


/* LOAD NOTIFICATIONS */

async function loadNotifications(){

  if(!currentUser){

    return;

  }


  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "notifications"
        )
      );


    const notifications = [];


    snapshot.forEach(
      notificationDoc => {

        const data =
          notificationDoc.data();


        if(
          data.recipientId ===
          currentUser.uid
        ){

          notifications.push({

            id:
              notificationDoc.id,

            ...data

          });

        }

      }
    );


    notifications.sort(
      (a,b) => {

        const aTime =
          a.createdAt?.seconds || 0;

        const bTime =
          b.createdAt?.seconds || 0;

        return bTime - aTime;

      }
    );


    notificationCache =
      notifications;


    const unreadCount =
      notifications.filter(
        notification =>
          notification.read !== true
      ).length;


    updateAlertBadge(
      unreadCount
    );


    renderNotifications(
      notifications
    );


  }catch(error){

    console.error(
      "Notifications error:",
      error
    );


    alertList.innerHTML = `

      <div class="alert-empty">

        <h3>
          Couldn't load alerts
        </h3>

        <p>
          Please refresh the page.
        </p>

      </div>

    `;

  }

}


/* RENDER NOTIFICATIONS */

function renderNotifications(
  notifications
){

  if(
    notifications.length === 0
  ){

    alertList.innerHTML = `

      <div class="alert-empty">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor">

          <path
            d="M18 8
               a6 6 0 0 0-12 0
               c0 7-3 7-3 9h18
               c0-2-3-2-3-9">
          </path>

          <path d="M10 21h4"></path>

        </svg>

        <h3>
          No new alerts
        </h3>

        <p>
          Your community notifications will appear here.
        </p>

      </div>

    `;

    return;

  }


  alertList.innerHTML = "";


  notifications.forEach(
    notification => {

      const element =
        document.createElement(
          "div"
        );


      element.className =
        "notification";


      if(
        notification.read !== true
      ){

        element.classList.add(
          "unread"
        );

      }


      let message = "";
      let icon = "";


      if(
        notification.type ===
        "like"
      ){

        message =
          `<b>${escapeHTML(
            notification.senderName ||
            "Member"
          )}</b> liked your post.`;

        icon = `
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor">

            <path
              d="M20.8 8.7
                 C20.8 13.7 12 20 12 20
                 S3.2 13.7 3.2 8.7
                 C3.2 5.7 5.4 3.7 8.1 3.7
                 C9.8 3.7 11.3 4.6 12 5.9
                 C12.7 4.6 14.2 3.7 15.9 3.7
                 C18.6 3.7 20.8 5.7 20.8 8.7Z">
            </path>

          </svg>
        `;

      }


      if(
        notification.type ===
        "comment"
      ){

        message =
          `<b>${escapeHTML(
            notification.senderName ||
            "Member"
          )}</b> commented on your post.`;

        icon = `
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor">

            <path
              d="M20 11.5
                 a7.5 7.5 0 0 1-7.5 7.5
                 H8l-4 2 1.5-4
                 A7.5 7.5 0 1 1 20 11.5Z">
            </path>

          </svg>
        `;

      }


      if(
        notification.type ===
        "follow"
      ){

        message =
          `<b>${escapeHTML(
            notification.senderName ||
            "Member"
          )}</b> started following you.`;

        icon = `
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor">

            <circle
              cx="12"
              cy="8"
              r="4">
            </circle>

            <path
              d="M4 21
                 c0-4 3.5-7 8-7
                 s8 3 8 7">
            </path>

          </svg>
        `;

      }


      if(
        notification.type ===
        "new_post"
      ){

        message =
          `<b>${escapeHTML(
            notification.senderName ||
            "Member"
          )}</b> shared a new post.`;

        icon = `
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor">

            <path
              d="M4 5
                 a2 2 0 0 1 2-2h8l6 6v10
                 a2 2 0 0 1-2 2H6
                 a2 2 0 0 1-2-2Z">
            </path>

            <path
              d="M14 3v6h6">
            </path>

            <path
              d="M8 13h8">
            </path>

            <path
              d="M8 17h5">
            </path>

          </svg>
        `;

      }


      /*
       * Fallback in case an old/unknown
       * notification type exists.
       */

      if(!message){

        message =
          `<b>${escapeHTML(
            notification.senderName ||
            "Member"
          )}</b> sent you a notification.`;

        icon = `
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor">

            <path
              d="M18 8
                 a6 6 0 0 0-12 0
                 c0 7-3 7-3 9h18
                 c0-2-3-2-3-9">
            </path>

            <path d="M10 21h4"></path>

          </svg>
        `;

      }


      element.innerHTML = `

        <div class="notification-icon">
          ${icon}
        </div>

        <div>

          <div class="notification-text">
            ${message}
          </div>

          <div class="notification-time">
            ${formatTime(
              notification.createdAt
            )}
          </div>

        </div>

      `;


      element.addEventListener(
        "click",
        async () => {

          await markSingleNotificationRead(
            notification.id
          );


          /*
           * If notification is from a post,
           * open the post in Home.
           */

          if(
            notification.postId
          ){

            await openPostFromNotification(
              notification.postId
            );

            return;

          }


          /*
           * Follow notification:
           * open sender's profile.
           */

          if(
            notification.senderId
          ){

            openProfile(
              notification.senderId
            );

          }

        }
      );


      alertList.appendChild(
        element
      );

    }
  );

}


/* UPDATE BADGE */

function updateAlertBadge(
  count
){

  const safeCount =
    Math.max(
      0,
      Number(count) || 0
    );


  if(safeCount === 0){

    alertBadge.style.display =
      "none";

    alertBadge.textContent =
      "0";

    return;

  }


  alertBadge.style.display =
    "flex";


  alertBadge.textContent =
    safeCount > 99
      ? "99+"
      : String(safeCount);

}


/* MARK ONE READ */

async function markSingleNotificationRead(
  notificationId
){

  if(!currentUser){

    return;

  }


  try{

    await updateDoc(
      doc(
        db,
        "notifications",
        notificationId
      ),
      {

        read:
          true

      }
    );


    const cached =
      notificationCache.find(
        item =>
          item.id ===
          notificationId
      );


    if(cached){

      cached.read =
        true;

    }


    const unreadCount =
      notificationCache.filter(
        notification =>
          notification.read !== true
      ).length;


    updateAlertBadge(
      unreadCount
    );


  }catch(error){

    console.error(
      "Mark notification read error:",
      error
    );

  }

}


/* MARK ALL READ */

async function markNotificationsAsRead(){

  if(!currentUser){

    return;

  }


  try{

    const unread =
      notificationCache.filter(
        notification =>
          notification.read !== true
      );


    if(unread.length === 0){

      updateAlertBadge(0);

      return;

    }


    const promises =
      unread.map(
        notification =>
          updateDoc(
            doc(
              db,
              "notifications",
              notification.id
            ),
            {

              read:
                true

            }
          )
      );


    await Promise.all(
      promises
    );


    notificationCache.forEach(
      notification => {

        notification.read =
          true;

      }
    );


    updateAlertBadge(0);


    renderNotifications(
      notificationCache
    );


  }catch(error){

    console.error(
      "Mark all notifications read error:",
      error
    );

  }

}


/* MARK ALL READ BUTTON */

document
  .getElementById(
    "markAllReadButton"
  )
  .addEventListener(
    "click",
    async event => {

      event.stopPropagation();

      await markNotificationsAsRead();

    }
  );


/* OPEN POST FROM ALERT */

async function openPostFromNotification(
  postId
){

  if(!postId){

    return;

  }


  /*
   * Make sure posts are available.
   */

  if(
    allPosts.length === 0
  ){

    await loadPosts();

  }


  showSection(
    "homeSection"
  );


  /*
   * Give the DOM a moment to render.
   */

  setTimeout(
    () => {

      const postElement =
        document.querySelector(
          `[data-post-id="${CSS.escape(postId)}"]`
        );


      if(!postElement){

        /*
         * Post may not be present because
         * the feed was filtered.
         */

        feedSearchInput.value =
          "";

        renderFilteredPosts("");


        setTimeout(
          () => {

            const retryElement =
              document.querySelector(
                `[data-post-id="${CSS.escape(postId)}"]`
              );


            if(retryElement){

              highlightPost(
                retryElement
              );

            }else{

              alert(
                "This post is no longer available."
              );

            }

          },
          150
        );

        return;

      }


      highlightPost(
        postElement
      );

    },
    150
  );

}


/* HIGHLIGHT POST */

function highlightPost(
  postElement
){

  postElement.scrollIntoView({
    behavior:"smooth",
    block:"center"
  });


  postElement.classList.add(
    "highlighted"
  );


  setTimeout(
    () => {

      postElement.classList.remove(
        "highlighted"
      );

    },
    2200
  );

}


/* HELPERS */

function escapeHTML(text){

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    String(text);

  return div.innerHTML;

}


function escapeAttribute(text){

  return String(text)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    );

}


function formatTime(timestamp){

  if(
    !timestamp ||
    !timestamp.seconds
  ){

    return "Just now";

  }


  const date =
    new Date(
      timestamp.seconds *
      1000
    );


  const now =
    new Date();


  const diff =
    Math.floor(
      (now - date) /
      1000
    );


  if(diff < 60){

    return "Just now";

  }


  if(diff < 3600){

    return (
      Math.floor(
        diff / 60
      ) +
      "m ago"
    );

  }


  if(diff < 86400){

    return (
      Math.floor(
        diff / 3600
      ) +
      "h ago"
    );

  }


  if(diff < 604800){

    return (
      Math.floor(
        diff / 86400
      ) +
      "d ago"
    );

  }


  return date.toLocaleDateString(
    "en-IN",
    {
      day:"numeric",
      month:"short"
    }
  );

}
