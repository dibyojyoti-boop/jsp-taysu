<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSP TAYSU Community</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html{scroll-behavior:smooth}

body{
font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
background:#0b0d10;
color:#f5f5f5;
padding-bottom:78px
}

/* ================= TOP BAR ================= */

.topbar{
position:sticky;
top:0;
z-index:100;
background:rgba(11,13,16,.88);
backdrop-filter:blur(18px)
}

.topbar-inner{
max-width:720px;
margin:auto;
height:58px;
padding:0 16px;
display:flex;
align-items:center;
justify-content:flex-end;
position:relative
}

/* Instagram-style centered logo */
.logo{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
display:flex;
align-items:center;
gap:9px;
font-size:18px;
font-weight:800;
letter-spacing:-.4px;
white-space:nowrap
}

.logo-dragon{font-size:23px}

.top-actions{
display:flex;
align-items:center;
gap:12px
}

.top-icon{
position:relative;
width:38px;
height:38px;
border:0;
background:transparent;
color:#f1f2f4;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer
}

.top-icon svg{
width:22px;
height:22px;
stroke-width:1.9
}

.profile-name{
max-width:170px;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
color:#aeb3bb;
font-size:13px
}

/* ================= MAIN ================= */

.container{
max-width:720px;
margin:auto;
padding:17px 14px 30px
}

.page-section{display:none}
.page-section.active{display:block}

/* ================= HOME ================= */

.feed-heading{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
padding:5px 4px 10px
}

.feed-heading h2{
font-size:21px;
letter-spacing:-.5px;
font-weight:800
}

.feed-heading-right{
display:flex;
align-items:center;
gap:7px
}

.feed-search-button{
width:34px;
height:34px;
border:0;
border-radius:50%;
background:transparent;
color:#d7bd8c;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer
}

.feed-search-button svg{
width:19px;
height:19px
}

.feed-search-box{
display:none;
margin-bottom:9px
}

.feed-search-box.show{
display:flex
}

#feedSearchInput{
width:100%;
padding:11px 13px;
border:0;
border-radius:12px;
background:#15181d;
color:#fff;
outline:none;
font-size:14px
}

#posts{
display:flex;
flex-direction:column;
gap:0
}

/* Clean Instagram-style post */
.post{
background:transparent;
border:0;
border-radius:0;
padding:16px 0;
margin-bottom:0;
box-shadow:none
}

.post-header{
display:flex;
align-items:center;
gap:10px;
margin-bottom:5px;
cursor:pointer
}

.avatar{
width:42px;
height:42px;
flex-shrink:0;
border-radius:50%;
background:#33271f;
color:#ead9b8;
display:flex;
align-items:center;
justify-content:center;
font-size:15px;
font-weight:800
}

.post-author{
font-size:14px;
font-weight:800
}

.post-time{
color:#777f89;
font-size:11px;
margin-top:1px
}

.post-text{
color:#eceef1;
font-size:15px;
line-height:1.42;
white-space:pre-line;
overflow-wrap:anywhere;
word-break:normal;
margin:0;
padding:0
}

.post-media{
width:100%;
border-radius:14px;
margin:4px 0 5px;
display:block;
max-height:520px;
object-fit:cover;
background:#08090b
}

.post-video{
width:100%;
border-radius:14px;
background:#08090b;
margin:4px 0 5px;
max-height:520px
}

.actions{
padding-top:6px;
display:flex;
align-items:center;
gap:2px
}

.action{
border:0;
background:transparent;
color:#9299a2;
display:flex;
align-items:center;
gap:5px;
padding:6px 8px;
border-radius:10px;
cursor:pointer;
font-size:12px;
transition:.18s
}

.action:hover{
color:#fff
}

.action svg{
width:18px;
height:18px;
stroke-width:1.8
}

.action.liked{
color:#ff5d6c
}

.action b{
font-weight:600
}

/* ================= EMPTY ================= */

.empty{
text-align:center;
background:transparent;
border:0;
border-radius:0;
padding:45px 20px;
color:#858c95
}

.empty-icon{
width:50px;
height:50px;
margin:0 auto 13px;
border-radius:15px;
background:#191c21;
display:flex;
align-items:center;
justify-content:center;
color:#d7bd8c
}

.empty-icon svg{
width:26px;
height:26px
}

.empty h3{
color:#e7e9ec;
margin-bottom:5px;
font-size:16px
}

.empty p{
font-size:13px
}

/* ================= CREATE ================= */

.create-page-title{
padding:6px 3px 14px
}

.create-page-title h1,
.explore-title h1,
.alert-title h1{
font-size:27px;
letter-spacing:-1px;
font-weight:850
}

.create-page-title p,
.explore-title p{
color:#858c95;
font-size:13px;
margin-top:4px
}

.create-card{
background:transparent;
border:0;
border-radius:0;
padding:0
}

.composer-header{
display:flex;
align-items:center;
gap:10px;
margin-bottom:7px
}

.composer-name{
font-size:15px;
font-weight:800
}

.composer-sub{
color:#777f89;
font-size:12px;
margin-top:2px
}

#postText{
width:100%;
min-height:62px;
height:62px;
resize:vertical;
border:0;
outline:none;
border-radius:12px;
padding:10px;
background:#181b20;
color:#f4f4f4;
font-family:inherit;
font-size:15px;
line-height:1.45
}

#postText::placeholder{
color:#6f7680
}

.create-media-preview{
display:none;
margin-top:8px;
position:relative
}

.create-media-preview img,
.create-media-preview video{
width:100%;
max-height:400px;
object-fit:cover;
border-radius:14px;
background:#08090b
}

.remove-media{
position:absolute;
right:8px;
top:8px;
width:31px;
height:31px;
border:0;
border-radius:50%;
background:rgba(0,0,0,.75);
color:#fff;
cursor:pointer;
font-size:17px
}

.create-options{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin-top:8px
}

.media-buttons{
display:flex;
gap:6px
}

.media-button{
border:0;
background:#181b20;
color:#b9bec5;
padding:8px 10px;
border-radius:999px;
cursor:pointer;
display:flex;
align-items:center;
gap:5px;
font-size:12px;
font-weight:600
}

.media-button svg{
width:15px;
height:15px
}

.post-btn{
border:0;
background:#f1f1f1;
color:#0b0d10;
padding:9px 17px;
border-radius:999px;
font-weight:800;
cursor:pointer
}

.post-btn:disabled{
opacity:.5;
cursor:default
}

/* ================= EXPLORE ================= */

.explore-title{
padding:7px 3px 15px
}

.search-box{
display:flex;
gap:8px;
margin-bottom:13px
}

#userSearchInput{
flex:1;
min-width:0;
padding:13px 15px;
border:0;
border-radius:14px;
background:#15181d;
color:#fff;
font-size:14px;
outline:none
}

.search-button{
width:48px;
border:0;
border-radius:14px;
background:#f1f1f1;
color:#0b0d10;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer
}

.search-button svg{
width:20px;
height:20px
}

#searchResults{
margin-bottom:18px
}

/* Clean member row — no card */
.search-result{
background:transparent;
border:0;
border-radius:0;
padding:12px 2px;
margin-bottom:0;
display:flex;
align-items:center;
justify-content:space-between
}

.search-user{
display:flex;
align-items:center;
gap:10px;
cursor:pointer;
min-width:0
}

.search-avatar{
width:39px;
height:39px;
flex-shrink:0;
border-radius:50%;
background:#30251f;
display:flex;
align-items:center;
justify-content:center;
font-weight:800;
color:#ead9b8
}

.search-username{
font-size:14px;
font-weight:700;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap
}

.follow-button{
border:0;
padding:8px 15px;
border-radius:999px;
background:#0095f6;
color:#fff;
font-weight:700;
cursor:pointer
}

.follow-button:disabled{
background:#292d33;
color:#aaa
}

/* ================= ALERTS ================= */

.alert-title{
padding:7px 3px 15px
}

.alert-list{
display:flex;
flex-direction:column;
gap:0
}

/* Clean notification row */
.notification{
position:relative;
display:flex;
align-items:center;
gap:11px;
padding:14px 2px;
background:transparent;
border:0;
border-radius:0;
cursor:pointer;
transition:.18s
}

.notification:hover{
background:transparent
}

.notification.unread{
background:transparent
}

.notification-avatar{
width:40px;
height:40px;
flex-shrink:0;
border-radius:50%;
background:#1b1e23;
display:flex;
align-items:center;
justify-content:center;
color:#d7bd8c;
font-size:14px;
font-weight:800;
overflow:hidden
}

.notification-avatar img{
width:100%;
height:100%;
object-fit:cover;
display:block
}

.notification-text{
font-size:13px;
line-height:1.4;
color:#dfe2e6;
padding-right:20px
}

.notification-time{
color:#777f89;
font-size:10px;
margin-top:3px
}

/* unread red dot */
.notification-dot{
position:absolute;
right:4px;
top:50%;
transform:translateY(-50%);
width:7px;
height:7px;
border-radius:50%;
background:#ff3040
}

.alert-empty{
text-align:center;
padding:50px 20px;
color:#858c95
}

.alert-empty svg{
width:36px;
height:36px;
color:#d7bd8c;
margin-bottom:10px
}

.alert-empty h3{
color:#e7e9ec;
margin-bottom:5px
}

.alert-empty p{
font-size:13px
}

/* Bottom-nav alert unread dot */
.nav-alert-wrap{
position:relative;
display:flex;
align-items:center;
justify-content:center
}

.alert-nav-dot{
position:absolute;
width:7px;
height:7px;
border-radius:50%;
background:#ff3040;
right:-5px;
top:-2px;
display:none
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
position:fixed;
left:0;
right:0;
bottom:0;
height:72px;
z-index:200;
background:rgba(11,13,16,.96);
backdrop-filter:blur(20px);
border-top:0;
display:flex;
justify-content:center;
padding:6px 8px;
box-shadow:0 -10px 30px rgba(0,0,0,.2)
}

.nav-item{
flex:1;
max-width:115px;
border:0;
background:none;
color:#727983;
cursor:pointer;
border-radius:13px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:4px;
transition:.18s
}

.nav-item svg{
width:21px;
height:21px;
stroke-width:1.8
}

.nav-item span{
font-size:10px
}

.nav-item:hover{
color:#dfe2e6;
background:transparent
}

.nav-item.active{
color:#fff
}

.nav-item.create-active{
color:#d7bd8c
}

.create-plus{
width:32px;
height:32px;
border:0;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center
}

.create-plus svg{
width:18px;
height:18px
}

.hidden-file{
display:none
}

.profile-link{
cursor:pointer
}

/* ================= COMMENTS BOTTOM SHEET ================= */

.comments-backdrop{
position:fixed;
inset:0;
z-index:450;
background:rgba(0,0,0,.58);
opacity:0;
visibility:hidden;
transition:.25s ease
}

.comments-backdrop.open{
opacity:1;
visibility:visible
}

.comments-sheet{
position:fixed;
left:50%;
bottom:0;
z-index:460;
width:min(720px,100%);
max-height:78vh;
transform:translate(-50%,100%);
background:#111419;
border:0;
border-radius:24px 24px 0 0;
display:flex;
flex-direction:column;
padding:8px 14px calc(12px + env(safe-area-inset-bottom));
box-shadow:0 -20px 60px rgba(0,0,0,.45);
transition:transform .28s cubic-bezier(.22,.61,.36,1)
}

.comments-sheet.open{
transform:translate(-50%,0)
}

.comments-handle{
width:42px;
height:4px;
border-radius:999px;
background:#444a52;
margin:3px auto 10px
}

.comments-sheet-header{
display:flex;
align-items:center;
justify-content:space-between;
padding:4px 2px 12px
}

.comments-sheet-header h3{
font-size:16px;
font-weight:800
}

.close-comments{
width:34px;
height:34px;
border:0;
background:transparent;
color:#c8ccd1;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer
}

.close-comments svg{
width:20px;
height:20px
}

.sheet-comments-list{
flex:1;
overflow-y:auto;
min-height:120px;
padding:4px 2px 12px
}

.sheet-comments-list .comment{
background:transparent;
border:0;
border-radius:0;
padding:10px 0;
margin-bottom:2px
}

.sheet-comments-list .comment-top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:3px
}

.comment-user{
font-size:12px;
font-weight:800
}

.comment-text{
color:#c8ccd1;
font-size:13px;
line-height:1.4;
overflow-wrap:anywhere
}

.delete-comment{
border:0;
background:none;
color:#8e7272;
font-size:10px;
cursor:pointer
}

.sheet-comment-form{
display:flex;
gap:7px;
padding-top:8px
}

.sheet-comment-input{
flex:1;
min-width:0;
padding:11px 13px;
border:0;
border-radius:999px;
background:#1a1d22;
color:white;
outline:none
}

.sheet-comment-send{
border:0;
padding:0 15px;
border-radius:999px;
background:#0095f6;
color:#fff;
font-weight:700;
cursor:pointer
}

/* ================= RESPONSIVE ================= */

@media(max-width:500px){

.topbar-inner{
height:56px;
padding:0 12px
}

.logo{
font-size:17px
}

.logo-dragon{
font-size:21px
}

.top-actions{
gap:7px
}

.profile-name{
max-width:105px
}

.container{
padding-left:12px;
padding-right:12px
}

.post{
padding:14px 0
}

.post-text{
font-size:15px
}

.comments-sheet{
max-height:82vh;
border-radius:22px 22px 0 0
}

}
</style>
</head>

<body>

<!-- ================= TOP BAR ================= -->

<header class="topbar">

<div class="topbar-inner">

<div class="logo">
<span class="logo-dragon">🐉</span>
<span>JSP TAYSU</span>
</div>

<div class="top-actions">

<div class="profile-name" id="profileName">Member</div>

<button class="top-icon" id="messagesButton" type="button" aria-label="Messages" title="Messages">

<svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
<path d="M21 11.5a8.4 8.4 0 0 1-9 8.5 9.2 9.2 0 0 1-4.1-1L3 20l1.8-4.1A8.2 8.2 0 0 1 3 11.5 8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5Z"/>
</svg>

</button>

</div>

</div>
</header>


<!-- ================= MAIN ================= -->

<main class="container">

<!-- HOME -->

<section id="homeSection" class="page-section active">

<div class="feed-heading">

<h2>Community</h2>

<div class="feed-heading-right">

<button class="feed-search-button" id="feedSearchButton" aria-label="Search posts">

<svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
<circle cx="11" cy="11" r="7"/>
<path d="m20 20-4-4"/>
</svg>

</button>

</div>
</div>

<div class="feed-search-box" id="feedSearchBox">

<input
id="feedSearchInput"
type="search"
placeholder="Search posts..."
autocomplete="off"
>

</div>

<div id="posts"></div>

</section>


<!-- CREATE -->

<section id="createSection" class="page-section">

<div class="create-page-title">

<h1>Create</h1>

<p>Share your thoughts with the community.</p>

</div>

<div class="create-card">

<div class="composer-header">

<div class="avatar" id="composerAvatar">M</div>

<div>

<div class="composer-name" id="composerName">Member</div>

<div class="composer-sub">Create a post</div>

</div>

</div>

<textarea
id="postText"
placeholder="What's on your mind?"
></textarea>

<div class="create-media-preview" id="createMediaPreview">

<img id="previewImage" alt="" style="display:none">

<video id="previewVideo" controls style="display:none"></video>

<button class="remove-media" id="removeMedia" type="button">×</button>

</div>

<div class="create-options">

<div class="media-buttons">

<button class="media-button" id="photoButton" type="button">

<svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
<rect x="3" y="3" width="18" height="18" rx="3"/>
<circle cx="8.5" cy="8.5" r="1.5"/>
<path d="m21 15-5-5L5 21"/>
</svg>

Photo

</button>

<button class="media-button" id="videoButton" type="button">

<svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
<rect x="3" y="4" width="18" height="16" rx="3"/>
<path d="m10 9 5 3-5 3V9Z"/>
</svg>

Video

</button>

<input
class="hidden-file"
type="file"
id="photoInput"
accept="image/*"
>

<input
class="hidden-file"
type="file"
id="videoInput"
accept="video/*"
>

</div>

<button class="post-btn" id="postButton" type="button">
Post
</button>

</div>

</div>

</section>


<!-- EXPLORE -->

<section id="exploreSection" class="page-section">

<div class="explore-title">

<h1>Explore</h1>

<p>Discover members and connect with the community.</p>

</div>

<div class="search-box">

<input
id="userSearchInput"
type="search"
placeholder="Search members..."
autocomplete="off"
>

<button class="search-button" id="userSearchButton" type="button">

<svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
<circle cx="11" cy="11" r="7"/>
<path d="m20 20-4-4"/>
</svg>

</button>

</div>

<div id="searchResults"></div>

</section>


<!-- ALERTS -->

<section id="alertsSection" class="page-section">

<div class="alert-title">

<h1>Alerts</h1>

</div>

<div class="alert-list" id="alertList"></div>

</section>

</main>


<!-- ================= COMMENTS SHEET ================= -->

<div class="comments-backdrop" id="commentsBackdrop"></div>

<section class="comments-sheet" id="commentsSheet" aria-hidden="true">

<div class="comments-handle"></div>

<div class="comments-sheet-header">

<h3>Comments</h3>

<button class="close-comments" id="closeCommentsButton" type="button">

<svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
<path d="M6 6l12 12M18 6 6 18"/>
</svg>

</button>

</div>

<div class="sheet-comments-list" id="sheetCommentsList"></div>

<div class="sheet-comment-form">

<input
class="sheet-comment-input"
id="sheetCommentInput"
type="text"
placeholder="Add a comment..."
autocomplete="off"
>

<button
class="sheet-comment-send"
id="sheetCommentSend"
type="button"
>
Send
</button>

</div>

</section>


<!-- ================= BOTTOM NAV ================= -->

<nav class="bottom-nav">

<button class="nav-item active" data-section="homeSection">

<svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V10Z"/>
</svg>

<span>Home</span>

</button>


<button class="nav-item" data-section="exploreSection">

<svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
<circle cx="11" cy="11" r="7"/>
<path d="m20 20-4-4"/>
</svg>

<span>Explore</span>

</button>


<button class="nav-item create-active" data-section="createSection">

<div class="create-plus">

<svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
<path d="M12 5v14M5 12h14"/>
</svg>

</div>

<span>Create</span>

</button>


<button class="nav-item" data-section="alertsSection">

<div class="nav-alert-wrap">

<svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
<path d="M10 21h4"/>
</svg>

<span class="alert-nav-dot" id="alertNavDot"></span>

</div>

<span>Alerts</span>

</button>


<button class="nav-item" id="profileNav">

<svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
<circle cx="12" cy="8" r="4"/>
<path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/>
</svg>

<span>Profile</span>

</button>

</nav>


<!-- ================= FIREBASE ================= -->

<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

async function loadPosts(){

if(!currentUser)return;

try{

const snapshot=
await getDocs(collection(db,"posts"));

allPosts=[];

snapshot.forEach(item=>{

allPosts.push({
id:item.id,
...item.data()
});

});


allPosts.sort((a,b)=>{

const aTime=a.createdAt?.seconds||0;

const bTime=b.createdAt?.seconds||0;

return bTime-aTime;

});

(post.authorName||"").toLowerCase().includes(value)

/* ================= ESCAPE ================= */

function escapeHTML(value){

return String(value||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function escapeAttribute(value){

return escapeHTML(value);

}

/* ================= LOAD COMMENTS ================= */

async function loadComments(
postId,
container
){

try{

const snapshot=
await getDocs(
collection(
db,
"posts",
postId,
"comments"
)
);


const comments=[];


snapshot.forEach(item=>{

comments.push({
id:item.id,
...item.data()
});

});


comments.sort((a,b)=>{

const aTime=a.createdAt?.seconds||0;

const bTime=b.createdAt?.seconds||0;

return aTime-bTime;

});


if(!comments.length){

container.innerHTML=`

div.innerHTML=`

${escapeHTML(comment.username||"Member")}

${

comment.userId===currentUser.uid
?
`<button class="delete-comment" type="button">Delete</button>`
:
""
}

</div>

<div class="comment-text">
${escapeHTML(comment.text||"")}
</div>

div.querySelector(".delete-comment");

"click",

doc(

/* ================= NOTIFICATION LISTENER ================= */

function startNotificationsListener(){

if(!currentUser)return;


if(notificationsUnsubscribe){

notificationsUnsubscribe();

}


const notificationsQuery=
query(
collection(db,"notifications"),
where(
"recipientId",
"==",
currentUser.uid
),
limit(100)
);


notificationsUnsubscribe=
onSnapshot(
notificationsQuery,
async snapshot=>{

const notifications=[];


snapshot.forEach(item=>{

notifications.push({
id:item.id,
...item.data()
});

});


notifications.sort((a,b)=>{

const aTime=a.createdAt?.seconds||0;

const bTime=b.createdAt?.seconds||0;

return bTime-aTime;

});


notificationsCache=notifications;

updateUnreadAlertDot(
notifications
);

await renderNotifications(
notifications
);

},
error=>{

console.error(error);

}
);

}


async function loadNotifications(){

if(!currentUser)return;

if(!notificationsUnsubscribe){

startNotificationsListener();

}

}


/* ================= ALERT DOT ================= */

function updateUnreadAlertDot(
notifications
){

const unread=
notifications.some(
item=>item.read!==true
);


alertNavDot.style.display=
unread ? "block" : "none";

}

async function getMemberProfile(
userId,
fallbackName
){

if(!userId){

return{
name:fallbackName||"Member",
photoURL:""
};

}


if(avatarCache.has(userId)){

return avatarCache.get(userId);

}


let profile={
name:fallbackName||"Member",
photoURL:""
};


try{

const snap=
await getDoc(
doc(db,"users",userId)
);


if(snap.exists()){

const data=snap.data();


profile.name=
data.username||
data.displayName||
profile.name;


profile.photoURL=
data.photoURL||
data.profilePhotoURL||
data.profilePhoto||
data.photo||
data.avatarUrl||
"";

}

}catch(error){

console.error(error);

}


avatarCache.set(
userId,
profile
);


return profile;

}

async function renderNotifications(
notifications
){

if(!notifications.length){

alertList.innerHTML=`
<div class="alert-empty">

<svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
<path d="M10 21h4"/>

<h3>No alerts yet</h3>

</div>
`;

}

for(const notification of notifications){

await getMemberProfile(
notification.senderId,
notification.senderName
);


const row=
document.createElement("div");


row.className=
"notification"+
(
notification.read!==true

:
""
);

(

profile.name||

.charAt(0)

`

>

escapeHTML(fallbackInitial);

<b>${escapeHTML(notification.senderName||"Someone")}</b>

`;

row.innerHTML=`

</div>

</div>

</div>

notification.read!==true
?

}

row.addEventListener(

async()=>{

db,

),

},
{
merge:true
}
);

row.querySelector(
".notification-dot"
);

}


updateUnreadAlertDot(
notificationsCache
);

showSection("homeSection");

}

});

}

}


/* ================= TIME ================= */

function formatTime(timestamp){

if(!timestamp)return"Just now";


const date=
timestamp.toDate
?
timestamp.toDate()
:
new Date(timestamp);


const diff=
Date.now()-date.getTime();


const seconds=
Math.floor(diff/1000);


if(seconds<60){

return"Just now";

}


const minutes=
Math.floor(seconds/60);


if(minutes<60){

return`${minutes}m`;

}


const hours=
Math.floor(minutes/60);


if(hours<24){

return`${hours}h`;

}


const days=
Math.floor(hours/24);


if(days<7){

return`${days}d`;

}


return date.toLocaleDateString(
undefined,
{
day:"numeric",
month:"short"
}
);

}
