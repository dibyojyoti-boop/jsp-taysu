<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSP TAYSU Community</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
background:#0b0d10;color:#f5f5f5;padding-bottom:78px
}

.topbar{
position:sticky;top:0;z-index:100;
background:rgba(11,13,16,.88);
backdrop-filter:blur(18px)
}
.topbar-inner{
max-width:720px;margin:auto;height:58px;padding:0 16px;
display:flex;align-items:center;justify-content:space-between
}
.top-actions{display:flex;align-items:center;gap:4px}
.top-icon{
position:relative;width:38px;height:38px;border:0;background:transparent;
color:#f1f2f4;display:flex;align-items:center;justify-content:center;
cursor:pointer
}
.top-icon svg{width:22px;height:22px;stroke-width:1.8}
.top-icon:active{transform:scale(.94)}
.top-dot{
display:none;position:absolute;top:5px;right:5px;width:7px;height:7px;
border-radius:50%;background:#ff3040
}
.top-dot.show{display:block}

.container{
max-width:720px;margin:auto;padding:17px 14px 30px
}
.page-section{display:none}
.page-section.active{display:block}

/* FEED */
.feed-heading{
display:flex;justify-content:space-between;align-items:center;
gap:10px;padding:5px 4px 10px
}
.feed-heading h2{font-size:21px;letter-spacing:-.5px}
.feed-search-button{
width:34px;height:34px;border:0;border-radius:50%;
background:transparent;color:#d7bd8c;
display:flex;align-items:center;justify-content:center;cursor:pointer
}
.feed-search-button svg{width:19px;height:19px}
.feed-search-box{display:none;margin-bottom:9px}
.feed-search-box.show{display:flex}
#feedSearchInput{
width:100%;padding:11px 2px;border:0;
border-bottom:1px solid #30343a;background:transparent;
color:#fff;outline:none;font-size:14px
}

#posts{display:flex;flex-direction:column;gap:0}
.post{
background:transparent;border:0;border-radius:0;
padding:17px 0;margin-bottom:0
}
.post-header{
display:flex;align-items:center;gap:10px;
margin-bottom:5px;cursor:pointer
}
.avatar{
width:42px;height:42px;flex-shrink:0;border-radius:50%;
background:#33271f;color:#ead9b8;border:2px solid #554438;
display:flex;align-items:center;justify-content:center;
font-size:15px;font-weight:800
}
.post-author{font-size:14px;font-weight:800}
.post-time{color:#777f89;font-size:11px;margin-top:1px}

.post-text{
color:#eceef1;font-size:15px;line-height:1.42;
white-space:pre-line;overflow-wrap:anywhere;
word-break:normal;margin:0;padding:0
}

.post-media{
width:100%;border-radius:14px;margin:4px 0 5px;
display:block;max-height:520px;object-fit:cover;background:#08090b
}
.post-video{
width:100%;border-radius:14px;background:#08090b;
margin:4px 0 5px;max-height:520px
}

.actions{
padding-top:5px;display:flex;align-items:center;gap:2px
}
.action{
border:0;background:transparent;color:#9299a2;
display:flex;align-items:center;gap:5px;padding:6px 8px;
border-radius:10px;cursor:pointer;font-size:12px
}
.action:hover{color:#fff}
.action svg{width:18px;height:18px;stroke-width:1.8}
.action.liked{color:#ff5d6c}
.action b{font-weight:600}

.empty{
text-align:center;background:transparent;border:0;
padding:55px 20px;color:#858c95
}
.empty-icon{
width:50px;height:50px;margin:0 auto 13px;
display:flex;align-items:center;justify-content:center;color:#d7bd8c
}
.empty-icon svg{width:26px;height:26px}
.empty h3{color:#e7e9ec;margin-bottom:5px;font-size:16px}
.empty p{font-size:13px}

/* CREATE */
.create-page-title{
padding:0 3px 14px
}
.create-page-title h1{
font-size:27px;letter-spacing:-1px
}
.create-page-title p{
color:#858c95;font-size:13px;margin-top:4px
}

.create-card{
background:transparent;border:0;padding:0
}

/* MAIN PHOTO / VIDEO CHOICES */
.create-media-choice{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin:6px 0 18px
}
.create-choice{
border:1px solid #292e35;
background:#14171c;
color:#f1f2f4;
border-radius:16px;
padding:18px 14px;
display:flex;
align-items:center;
gap:12px;
text-align:left;
cursor:pointer
}
.create-choice:active{transform:scale(.98)}
.choice-icon{
width:42px;height:42px;border-radius:12px;
background:#20242a;
display:flex;align-items:center;
justify-content:center;color:#d7bd8c;
flex-shrink:0
}
.choice-icon svg{width:21px;height:21px}
.create-choice strong{display:block;font-size:14px}
.create-choice span{
display:block;color:#777f89;font-size:11px;margin-top:2px
}

/* COMPOSER */
.composer-header{
display:flex;align-items:center;gap:10px;margin-bottom:7px
}
.composer-name{font-size:15px;font-weight:800}
.composer-sub{color:#777f89;font-size:12px;margin-top:2px}

#postText{
width:100%;min-height:62px;height:62px;resize:vertical;
border:0;outline:none;padding:10px 0;
background:transparent;border-bottom:1px solid #30343a;
color:#f4f4f4;font-family:inherit;font-size:15px;line-height:1.45
}
#postText::placeholder{color:#6f7680}

.create-media-preview{
display:none;margin-top:8px;position:relative
}
.create-media-preview img,
.create-media-preview video{
width:100%;max-height:400px;object-fit:cover;
border-radius:14px;background:#08090b
}
.remove-media{
position:absolute;right:8px;top:8px;width:31px;height:31px;
border:0;border-radius:50%;background:rgba(0,0,0,.75);
color:#fff;cursor:pointer;font-size:17px
}

.create-options{
display:flex;justify-content:space-between;
align-items:center;gap:10px;margin-top:8px
}
.media-buttons{display:flex;gap:6px}
.media-button{
border:0;background:transparent;color:#b9bec5;
padding:8px 10px;border-radius:11px;cursor:pointer;
display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600
}
.media-button svg{width:15px;height:15px}
.post-btn{
border:0;background:#f1f1f1;color:#0b0d10;
padding:9px 17px;border-radius:12px;font-weight:800;cursor:pointer
}
.post-btn:disabled{opacity:.5}

.hidden-file{display:none}

/* EXPLORE */
.explore-title{padding:7px 3px 15px}
.explore-title h1{font-size:27px;letter-spacing:-1px}
.explore-title p{
color:#858c95;font-size:13px;margin-top:4px
}
.search-box{display:flex;gap:8px;margin-bottom:13px}
#userSearchInput{
flex:1;min-width:0;padding:13px 15px;
border:1px solid #292d33;border-radius:14px;
background:#15181d;color:#fff;font-size:14px;outline:none
}
.search-button{
width:48px;border:0;border-radius:14px;
background:#f1f1f1;color:#0b0d10;
display:flex;align-items:center;justify-content:center;cursor:pointer
}
.search-button svg{width:20px;height:20px}
.search-result{
padding:12px 0;display:flex;
align-items:center;justify-content:space-between
}
.search-user{
display:flex;align-items:center;gap:10px;
cursor:pointer;min-width:0
}
.search-avatar{
width:42px;height:42px;flex-shrink:0;border-radius:50%;
background:#30251f;display:flex;align-items:center;
justify-content:center;font-weight:800;color:#ead9b8;
overflow:hidden
}
.search-avatar img{
width:100%;height:100%;object-fit:cover
}
.search-username{
font-size:14px;font-weight:700;
overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.follow-button{
border:0;padding:8px 15px;border-radius:10px;
background:#1683ff;color:#fff;font-weight:700;cursor:pointer
}
.follow-button:disabled{
background:#292d33;color:#aaa
}

/* BACK BUTTON */
.section-back{
display:flex;align-items:center;gap:6px;
border:0;background:transparent;color:#b9bec5;
padding:4px 2px 13px;font-size:13px;
font-weight:600;cursor:pointer
}
.section-back svg{width:19px;height:19px}

/* ALERTS */
.alert-title{
padding:0 3px 15px
}
.alert-title h1{
font-size:27px;letter-spacing:-1px
}
.alert-list{display:flex;flex-direction:column;gap:7px}
.notification{
display:flex;align-items:center;gap:11px;
padding:13px 0;background:transparent;
border:0;border-radius:0;cursor:pointer
}
.notification-icon{
width:42px;height:42px;flex-shrink:0;border-radius:50%;
background:#1b1e23;display:flex;align-items:center;
justify-content:center;color:#d7bd8c;overflow:hidden
}
.notification-icon img{
width:100%;height:100%;object-fit:cover
}
.notification-unread-dot{
width:7px;height:7px;border-radius:50%;
background:#ff3040;flex-shrink:0;margin-left:auto
}
.notification-text{
font-size:13px;line-height:1.4;color:#dfe2e6
}
.notification-time{
color:#777f89;font-size:10px;margin-top:3px
}
.alert-empty{
text-align:center;padding:50px 20px;color:#858c95
}
.alert-empty svg{
width:36px;height:36px;color:#d7bd8c;margin-bottom:10px
}
.alert-empty h3{
color:#e7e9ec;margin-bottom:5px
}
.alert-empty p{font-size:13px}

/* REELS */
.reels-placeholder{
text-align:center;padding:80px 20px;color:#858c95
}
.reels-placeholder-icon{
width:58px;height:58px;margin:0 auto 14px;
display:flex;align-items:center;justify-content:center;color:#d7bd8c
}
.reels-placeholder-icon svg{width:40px;height:40px}
.reels-placeholder h2{
color:#e7e9ec;font-size:21px;margin-bottom:5px
}
.reels-placeholder p{font-size:13px}

/* BOTTOM NAV */
.bottom-nav{
position:fixed;left:0;right:0;bottom:0;height:72px;
z-index:200;background:rgba(11,13,16,.96);
backdrop-filter:blur(20px);
display:flex;justify-content:center;padding:6px 8px
}
.nav-item{
position:relative;flex:1;max-width:115px;border:0;
background:none;color:#727983;cursor:pointer;
display:flex;align-items:center;justify-content:center
}
.nav-item svg{width:24px;height:24px;stroke-width:1.8}
.nav-item.active{color:#fff}

/* COMMENTS */
.comments-backdrop{
position:fixed;inset:0;background:rgba(0,0,0,.58);
opacity:0;visibility:hidden;transition:.25s;z-index:450
}
.comments-backdrop.show{
opacity:1;visibility:visible
}
.comments-sheet{
position:fixed;left:0;right:0;bottom:0;z-index:500;
height:min(78vh,650px);background:#111419;
border-radius:24px 24px 0 0;
transform:translateY(105%);
transition:transform .28s cubic-bezier(.2,.8,.2,1);
display:flex;flex-direction:column;
padding:10px 16px calc(12px + env(safe-area-inset-bottom));
box-shadow:0 -18px 50px rgba(0,0,0,.35)
}
.comments-sheet.open{transform:translateY(0)}
.sheet-handle{
width:38px;height:4px;border-radius:99px;
background:#444a52;margin:0 auto 10px
}
.sheet-header{
display:flex;align-items:center;justify-content:space-between;
padding:4px 0 12px
}
.sheet-header h3{font-size:17px;font-weight:800}
.sheet-close{
width:34px;height:34px;border:0;background:transparent;
color:#aeb3bb;display:flex;align-items:center;
justify-content:center;cursor:pointer
}
.sheet-close svg{width:20px;height:20px}
.sheet-comments-list{
flex:1;overflow:auto;padding-right:3px
}
.sheet-comment-form{
display:flex;gap:8px;padding-top:10px
}
.sheet-comment-form .comment-input{
background:#181b20;border:0;border-radius:20px;
padding:10px 14px
}
.sheet-comment-form .comment-send{
border-radius:20px
}
.sheet-open{overflow:hidden}

.comment{
padding:9px 0;margin-bottom:2px
}
.comment-top{
display:flex;justify-content:space-between;
align-items:center;margin-bottom:3px
}
.comment-user{font-size:12px;font-weight:800}
.comment-text{
color:#c8ccd1;font-size:13px;line-height:1.4;
overflow-wrap:anywhere
}
.delete-comment{
border:0;background:none;color:#8e7272;
font-size:10px;cursor:pointer
}
.comment-input{
flex:1;min-width:0;padding:9px 11px;
border:1px solid #2a2e34;border-radius:11px;
background:#15181d;color:white;outline:none
}
.comment-send{
border:0;padding:0 13px;border-radius:11px;
background:#f1f1f1;color:#0b0d10;
font-weight:700;cursor:pointer
}

@media(max-width:500px){
.container{padding:15px 10px 25px}
.topbar-inner{height:61px;padding:0 13px}
.post{padding:16px 0}
.post-text{font-size:15px}
.action{padding:7px 6px}
.action span{display:none}
.action svg{width:19px;height:19px}
.create-card{padding:0}
.create-media-choice{gap:8px}
.create-choice{padding:16px 11px}
#postText{min-height:62px;height:62px}
.media-button{padding:8px 9px}
.post-btn{padding:9px 14px}
.bottom-nav{height:68px}
}
</style>
</head>

<body>

<header class="topbar">
<div class="topbar-inner">

<button id="createTopButton" class="top-icon" type="button" aria-label="Create">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
<path d="M12 5v14"></path>
<path d="M5 12h14"></path>
</svg>
</button>

<div class="top-actions">

<button id="alertsTopButton" class="top-icon" type="button" aria-label="Alerts">
<span id="alertTopDot" class="top-dot"></span>
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
<path d="M10 21h4"></path>
</svg>
</button>

</div>
</div>
</header>

<main class="container">

<div class="feed-heading">

<svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
<circle cx="11" cy="11" r="7"></circle>
<path d="m20 20-4-4"></path>
</svg>
</button>
</div>

<div id="feedSearchBox" class="feed-search-box">
<input id="feedSearchInput" type="text" placeholder="Search posts or topics..." maxlength="100">
</div>

<section id="posts"></section>

</section>


<section id="createSection" class="page-section">

<button class="section-back" id="createBackButton" type="button">

<path d="m15 18-6-6 6-6"></path>
</svg>
Back
</button>

<div class="create-page-title">

</div>

<div class="create-card">

<div class="create-media-choice">

<button class="create-choice" id="choosePhotoButton" type="button">

</svg>
</div>

<div>

</button>

<div>

<div id="mediaPreviewContent"></div>

</div>


<div class="create-options">

<div class="media-buttons">

<button class="media-button" id="photoButton" type="button">
Photo
</button>

<button class="media-button" id="videoButton" type="button">
Video
</button>

<input type="file" id="photoInput" class="hidden-file" accept="image/*">
<input type="file" id="videoInput" class="hidden-file" accept="video/*">

</div>

<button class="post-btn" id="postButton" type="button">Post</button>

</div>

</div>

</section>


<section id="exploreSection" class="page-section">

<div class="explore-title">
<h1>Explore</h1>
<p>Discover members and connect with the community.</p>
</div>

<div class="search-box">

<input type="text" id="userSearchInput" placeholder="Search members..." maxlength="30">

<button id="userSearchButton" class="search-button" type="button">

<svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
<circle cx="11" cy="11" r="7"></circle>
<path d="m20 20-4-4"></path>
</svg>

</button>

</div>

<div id="searchResults"></div>

</section>


<section id="reelsSection" class="page-section">

<div class="reels-placeholder-icon">

<path d="M9 3l3 5M15 3l3 5M3 9h18"></path>
<path d="m10 13 5 3-5 3z" fill="currentColor" stroke="none"></path>
</svg>

</div>

<h2>Reels</h2>

</div>

</section>


<section id="alertsSection" class="page-section">

<button class="section-back" id="alertsBackButton" type="button">

<svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
<path d="m15 18-6-6 6-6"></path>
</svg>

Back
</button>

<div class="alert-title">
<h1>Alerts</h1>
</div>

<div id="alertList" class="alert-list"></div>

</section>

</main>


<nav class="bottom-nav">

<button class="nav-item active" data-section="homeSection" aria-label="Home">

<svg viewBox="0 0 24 24" fill="none" stroke="currentColor">

</svg>

</button>


<button class="nav-item" data-section="exploreSection" aria-label="Explore">

<svg viewBox="0 0 24 24" fill="none" stroke="currentColor">

<path d="m20 20-4-4"></path>
</svg>

</button>


<button class="nav-item" id="messagesNavButton" aria-label="Messages">

<svg viewBox="0 0 24 24" fill="none" stroke="currentColor">

<path d="M8 11.5h.01M12 11.5h.01M16 11.5h.01"></path>
</svg>

</button>


<button class="nav-item" data-section="reelsSection" aria-label="Reels">

<svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
<rect x="3" y="3" width="18" height="18" rx="4"></rect>
<path d="M9 3l3 5M15 3l3 5M3 9h18"></path>
<path d="m10 13 5 3-5 3z" fill="currentColor" stroke="none"></path>
</svg>

</button>


<button class="nav-item" id="profileNavButton" aria-label="Profile">

<svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
<circle cx="12" cy="8" r="4"></circle>
<path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"></path>
</svg>

</button>

</nav>


<div id="commentsBackdrop" class="comments-backdrop"></div>

<section id="commentsSheet" class="comments-sheet" aria-hidden="true">

<div class="sheet-header">

<h3>Comments</h3>

<button id="closeCommentsButton" class="sheet-close" type="button">

<svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
<path d="m6 6 12 12M18 6 6 18"></path>
</svg>

</button>

</div>

<div id="sheetCommentsList" class="sheet-comments-list"></div>

<div class="sheet-comment-form">

<button id="sheetCommentSend" class="comment-send" type="button">Send</button>

</div>

</section>

let currentUser=null;
let selectedMediaFile=null;
let selectedMediaType=null;
let currentUsername="Member";
let allPosts=[];
let allMembers=[];
let notificationsUnsubscribe=null;
let notificationAvatarCache=new Map();


const sections={
homeSection:document.getElementById("homeSection"),
createSection:document.getElementById("createSection"),
exploreSection:document.getElementById("exploreSection"),
reelsSection:document.getElementById("reelsSection"),
alertsSection:document.getElementById("alertsSection")
};


const composerName=document.getElementById("composerName");
const composerAvatar=document.getElementById("composerAvatar");
const alertList=document.getElementById("alertList");
const postsContainer=document.getElementById("posts");


function showSection(sectionId){

Object.values(sections).forEach(section=>{
section.classList.remove("active");
});

if(sections[sectionId]){
sections[sectionId].classList.add("active");
}


document.querySelectorAll(".nav-item").forEach(button=>{
button.classList.remove("active");
});


const matchingButton=document.querySelector(
`[data-section="${sectionId}"]`
);

if(matchingButton){
matchingButton.classList.add("active");
}


window.scrollTo({
top:0,
behavior:"smooth"
});

}


function openCreate(){

if(!currentUser){
alert("Please sign in first.");
return;
}

showSection("createSection");

}


function openAlerts(){

if(!currentUser){
alert("Please sign in first.");
return;
}

showSection("alertsSection");
loadNotifications();

}


document.getElementById("createTopButton")
.addEventListener("click",openCreate);


document.getElementById("alertsTopButton")
.addEventListener("click",openAlerts);


document.getElementById("createBackButton")
.addEventListener("click",()=>{
showSection("homeSection");
});


document.getElementById("alertsBackButton")
.addEventListener("click",()=>{
showSection("homeSection");
});


document.querySelectorAll(".nav-item[data-section]")
.forEach(button=>{
button.addEventListener("click",()=>{
showSection(button.dataset.section);
});
});


document.getElementById("messagesNavButton")
.addEventListener("click",()=>{

if(!currentUser){
alert("Please sign in first.");
return;
}

window.location.href="messages.html";

});


document.getElementById("profileNavButton")
.addEventListener("click",()=>{

if(!currentUser){
alert("Please sign in first.");
return;
}

openProfile(currentUser.uid);

});


function openProfile(uid){

if(uid){
window.location.href=
"profile.html?uid="+encodeURIComponent(uid);
}

}


onAuthStateChanged(auth,async user=>{

currentUser=user;

if(!user){

if(notificationsUnsubscribe){
notificationsUnsubscribe();
notificationsUnsubscribe=null;
}

document.getElementById("alertTopDot")
.classList.remove("show");

composerName.textContent="Member";
composerAvatar.textContent="M";
currentUsername="Member";

return;

}


let username=user.displayName||"Member";


try{

const profileSnap=
await getDoc(doc(db,"users",user.uid));

if(
profileSnap.exists()&&
profileSnap.data().username
){
username=profileSnap.data().username;
}

}catch(error){

console.error("Profile error:",error);

}


currentUsername=username;

composerName.textContent=username;
composerAvatar.textContent=
username.charAt(0).toUpperCase();

await loadPosts();
loadNotifications();

});


/* FEED SEARCH */

const feedSearchButton=
document.getElementById("feedSearchButton");

const feedSearchBox=
document.getElementById("feedSearchBox");

const feedSearchInput=
document.getElementById("feedSearchInput");


feedSearchButton.addEventListener("click",()=>{

feedSearchBox.classList.toggle("show");

if(feedSearchBox.classList.contains("show")){
feedSearchInput.focus();
}else{
feedSearchInput.value="";
renderFilteredPosts("");
}

});

/* CREATE */

const choosePhotoButton=
document.getElementById("choosePhotoButton");

const chooseVideoButton=
document.getElementById("chooseVideoButton");

const photoButton=
document.getElementById("photoButton");

const videoButton=
document.getElementById("videoButton");

const photoInput=
document.getElementById("photoInput");

const videoInput=
document.getElementById("videoInput");


choosePhotoButton.addEventListener("click",()=>{
photoInput.click();
});


chooseVideoButton.addEventListener("click",()=>{
videoInput.click();
});


photoButton.addEventListener("click",()=>{
photoInput.click();
});


videoButton.addEventListener("click",()=>{
videoInput.click();
});


photoInput.addEventListener("change",()=>{

const file=photoInput.files[0];

if(file){
selectedMediaFile=file;
selectedMediaType="image";
showMediaPreview(file,"image");
}

});


videoInput.addEventListener("change",()=>{

const file=videoInput.files[0];

if(file){
selectedMediaFile=file;
selectedMediaType="video";
showMediaPreview(file,"video");
}

});


function showMediaPreview(file,type){

const preview=
document.getElementById("createMediaPreview");

const content=
document.getElementById("mediaPreviewContent");

const url=URL.createObjectURL(file);


content.innerHTML=
type==="image"
?`<img src="${url}" alt="Selected photo">`
:`<video src="${url}" controls></video>`;


preview.style.display="block";

}


document.getElementById("removeMediaButton")
.addEventListener("click",()=>{

selectedMediaFile=null;
selectedMediaType=null;

photoInput.value="";
videoInput.value="";

document.getElementById("createMediaPreview")
.style.display="none";

document.getElementById("mediaPreviewContent")
.innerHTML="";

});


document.getElementById("postButton")
.addEventListener("click",async()=>{

if(!currentUser){
alert("Please sign in first.");
return;
}


const text=
document.getElementById("postText")
.value.trim();


if(!text&&!selectedMediaFile){
alert("Write something or select a photo/video.");
return;
}


const button=
document.getElementById("postButton");

button.disabled=true;
button.textContent="Posting...";


try{

let mediaUrl="";
let mediaType="";


if(selectedMediaFile){

const file=selectedMediaFile;

const safeName=
file.name.replace(
/[^a-zA-Z0-9._-]/g,
"_"
);

const filePath=
"posts/"+
currentUser.uid+
"/"+
Date.now()+
"_"+safeName;


const uploadResult=
await uploadBytes(
ref(storage,filePath),
file
);


mediaUrl=
await getDownloadURL(uploadResult.ref);

mediaType=selectedMediaType;

}


await addDoc(
collection(db,"posts"),
{
text,
authorId:currentUser.uid,
authorName:currentUsername,
mediaUrl,
mediaType,
createdAt:serverTimestamp()
}
);


document.getElementById("postText").value="";

selectedMediaFile=null;
selectedMediaType=null;

photoInput.value="";
videoInput.value="";

document.getElementById("createMediaPreview")
.style.display="none";

document.getElementById("mediaPreviewContent")
.innerHTML="";


await loadPosts();

showSection("homeSection");


}catch(error){

console.error("Post error:",error);

alert(
(error.code||"Error")+
": "+
error.message
);

}finally{

button.disabled=false;
button.textContent="Post";

}

});


/* POSTS */

async function loadPosts(){

try{

const snapshot=
await getDocs(collection(db,"posts"));

allPosts=[];

snapshot.forEach(postDoc=>{
allPosts.push({
id:postDoc.id,
...postDoc.data()
});
});


allPosts.sort(
(a,b)=>
(b.createdAt?.seconds||0)-
(a.createdAt?.seconds||0)
);


renderFilteredPosts(feedSearchInput.value);


}catch(error){

console.error("Load posts error:",error);

postsContainer.innerHTML=`

<div class="empty">

<div class="empty-icon">
!
</div>

<h3>Couldn't load posts</h3>

<p>Please refresh the page.</p>

</div>
`;

}

}


async function renderFilteredPosts(searchText){

const queryText=
String(searchText||"")
.trim()
.toLowerCase();


const filtered=
allPosts.filter(post=>
!queryText||
String(post.text||"")
.toLowerCase()
.includes(queryText)||
String(post.authorName||"")
.toLowerCase()
.includes(queryText)
);


postsContainer.innerHTML="";


if(filtered.length===0){

postsContainer.innerHTML=`

<div class="empty">

<div class="empty-icon">
⌕
</div>

<h3>No matching posts</h3>

<p>Try another topic or keyword.</p>

</div>
`;

return;

}


for(const post of filtered){
await renderPost(post,postsContainer);
}

}


async function renderPost(post,container){

const postElement=
document.createElement("article");

postElement.className="post";


const username=
post.authorName||"Member";


let likeCount=0;
let alreadyLiked=false;


try{

const likesSnapshot=
await getDocs(
collection(db,"posts",post.id,"likes")
);

likeCount=likesSnapshot.size;

if(currentUser){

alreadyLiked=
likesSnapshot.docs.some(
likeDoc=>
likeDoc.id===currentUser.uid
);

}

}catch(error){

console.error("Like loading error:",error);

}


let commentCount=0;


try{

commentCount=
(
await getDocs(
collection(db,"posts",post.id,"comments")
)
).size;

}catch(error){

console.error("Comment loading error:",error);

}


let mediaHTML="";


if(
post.mediaUrl&&
post.mediaType==="image"
){

mediaHTML=
`
<img
class="post-media"
src="${escapeAttribute(post.mediaUrl)}"
alt="Community post image"
loading="lazy">
`;

}


if(
post.mediaUrl&&
post.mediaType==="video"
){

mediaHTML=
`
<video
class="post-video"
controls
preload="metadata">

<source src="${escapeAttribute(post.mediaUrl)}">

</video>
`;

}


postElement.innerHTML=`

<div class="post-header"
data-profile-id="${escapeAttribute(post.authorId||"")}">

<div class="avatar">
${escapeHTML(
username.charAt(0).toUpperCase()
)}
</div>

<div>

<div class="post-author">
${escapeHTML(username)}
</div>

<div class="post-time">
${formatTime(post.createdAt)}
</div>

</div>

</div>

${post.text
?`<div class="post-text">${escapeHTML(
String(post.text)
.replace(/[ \t]+\n/g,"\n")
.replace(/\n[ \t]+/g,"\n")
)}</div>`
:""}

${mediaHTML}

<div class="actions">

<button
class="action like-button ${alreadyLiked?"liked":""}"
type="button">

<svg
viewBox="0 0 24 24"
fill="${alreadyLiked?"currentColor":"none"}"
stroke="currentColor">

<path d="M20.8 8.7 C20.8 13.7 12 20 12 20 S3.2 13.7 3.2 8.7 C3.2 5.7 5.4 3.7 8.1 3.7 C9.8 3.7 11.3 4.6 12 5.9 C12.7 4.6 14.2 3.7 15.9 3.7 C18.6 3.7 20.8 5.7 20.8 8.7Z"></path>

</svg>

<span>${alreadyLiked?"Unlike":"Like"}</span>

<b class="like-count">
${likeCount}
</b>

</button>


<button
class="action comment-button"
type="button">

<svg
viewBox="0 0 24 24"
fill="none"
stroke="currentColor">

<path d="M20 11.5 a7.5 7.5 0 0 1-7.5 7.5 H8l-4 2 1.5-4 A7.5 7.5 0 1 1 20 11.5Z"></path>

</svg>

<span>Comment</span>

<b class="comment-count">
${commentCount}
</b>

</button>


<button
class="action share-button"
type="button">

<svg
viewBox="0 0 24 24"
fill="none"
stroke="currentColor">

<path d="M12 16V4"></path>
<path d="m7 9 5-5 5 5"></path>
<path d="M5 13v5 a2 2 0 0 0 2 2h10 a2 2 0 0 0 2-2v-5"></path>

</svg>

<span>Share</span>

</button>

</div>
`;


container.appendChild(postElement);


postElement
.querySelector(".post-header")
.addEventListener("click",()=>{

if(post.authorId){
openProfile(post.authorId);
}

});


const likeButton=
postElement.querySelector(".like-button");

const likeCountElement=
postElement.querySelector(".like-count");

const likeText=
likeButton.querySelector("span");


likeButton.addEventListener("click",async()=>{

if(!currentUser){
alert("Please sign in first.");
return;
}

likeButton.disabled=true;


try{

const likeRef=
doc(
db,
"posts",
post.id,
"likes",
currentUser.uid
);


const likeSnap=
await getDoc(likeRef);


let count=
Number(likeCountElement.textContent)||0;


if(likeSnap.exists()){

await deleteDoc(likeRef);

count=Math.max(0,count-1);

likeText.textContent="Like";

likeButton.classList.remove("liked");

likeButton
.querySelector("svg")
.setAttribute("fill","none");


}else{

await setDoc(
likeRef,
{
userId:currentUser.uid,
createdAt:serverTimestamp()
}
);

count++;

likeText.textContent="Unlike";

likeButton.classList.add("liked");

likeButton
.querySelector("svg")
.setAttribute(
"fill",
"currentColor"
);


if(
post.authorId&&
post.authorId!==currentUser.uid
){

await createNotification({

recipientId:post.authorId,
senderId:currentUser.uid,
senderName:currentUsername,
type:"like",
postId:post.id

});

}

}


likeCountElement.textContent=count;


}catch(error){

console.error("Like error:",error);

alert(
(error.code||"Error")+
": "+
error.message
);

}finally{

likeButton.disabled=false;

}

});


postElement
.querySelector(".comment-button")
.addEventListener("click",()=>{

if(!currentUser){
alert("Please sign in first.");
return;
}

openCommentsSheet(
post,
postElement.querySelector(".comment-count")
);

});


postElement
.querySelector(".share-button")
.addEventListener("click",async()=>{

try{

if(navigator.share){

await navigator.share({
title:"JSP TAYSU Community",
text:`${username} shared a post on JSP TAYSU Community`,
url:window.location.href
});

}else{

await navigator.clipboard.writeText(
window.location.href
);

alert("Community link copied!");

}

}catch(error){

console.log("Share cancelled.");

}

});

}


/* MEMBERS */

async function loadMembers(){

if(allMembers.length>0)
return;


try{

const snapshot=
await getDocs(collection(db,"users"));

allMembers=[];

snapshot.forEach(userDoc=>{
allMembers.push({
id:userDoc.id,
...userDoc.data()
});
});


searchMembers();


}catch(error){

console.error("Members error:",error);

}

}


const userSearchButton=
document.getElementById("userSearchButton");

const userSearchInput=
document.getElementById("userSearchInput");

const searchResults=
document.getElementById("searchResults");


userSearchButton.addEventListener(
"click",
searchMembers
);

userSearchInput.addEventListener(
"input",
searchMembers
);


async function searchMembers(){

const searchText=
userSearchInput.value.trim().toLowerCase();


if(!currentUser)
return;


if(allMembers.length===0){

await loadMembers();
return;

}


searchResults.innerHTML="";


if(!searchText){

searchResults.innerHTML=`
<p style="color:#777f89;font-size:13px;padding:5px;">
Start typing a member's name.
</p>
`;

return;

}


const matches=
allMembers
.filter(user=>
user.id!==currentUser.uid
)
.filter(user=>
String(
user.username||user.displayName||""
)
.toLowerCase()
.includes(searchText)
)
.slice(0,20);


if(matches.length===0){

searchResults.innerHTML=`
<p style="color:#777f89;font-size:13px;padding:5px;">
No members found.
</p>
`;

return;

}


for(const user of matches){

const result=
document.createElement("div");

result.className="search-result";


const name=
user.username||
user.displayName||
"Member";


const photo=
user.photoURL||
user.profilePhotoURL||
user.profilePhoto||
user.photo||
user.avatarUrl||
"";


const avatar=
photo
?`<img src="${escapeAttribute(photo)}" alt="">`
:`${escapeHTML(
name.charAt(0).toUpperCase()
)}`;


result.innerHTML=`

<div class="search-user">

<div class="search-avatar">
${avatar}
</div>

<div class="search-username">
${escapeHTML(name)}
</div>

</div>

<button class="follow-button" type="button">
Follow
</button>
`;


result
.querySelector(".search-user")
.addEventListener("click",()=>{
openProfile(user.id);
});


const followButton=
result.querySelector(".follow-button");


const followId=
currentUser.uid+"_"+user.id;


try{

const followSnap=
await getDoc(
doc(db,"follows",followId)
);

if(followSnap.exists()){

followButton.textContent="Following";
followButton.disabled=true;

}

}catch(error){

console.error("Follow check:",error);

}


followButton.addEventListener(
"click",
async event=>{

event.stopPropagation();

followButton.disabled=true;


try{

await setDoc(
doc(db,"follows",followId),
{
followerId:currentUser.uid,
followingId:user.id,
createdAt:serverTimestamp()
}
);


followButton.textContent="Following";


await createNotification({

recipientId:user.id,
senderId:currentUser.uid,
senderName:currentUsername,
type:"follow"

});


}catch(error){

console.error("Follow error:",error);

followButton.disabled=false;

alert(
(error.code||"Error")+
": "+
error.message
);

}

});


searchResults.appendChild(result);

}

}


/* NOTIFICATIONS */

async function createNotification(data){

try{

if(!data.recipientId||!data.senderId)
return;


await addDoc(
collection(db,"notifications"),
{
recipientId:data.recipientId,
senderId:data.senderId,
senderName:data.senderName||"Member",
type:data.type,
postId:data.postId||"",
commentText:data.commentText||"",
createdAt:serverTimestamp(),
read:false
}
);


}catch(error){

console.error(
"Notification error:",
error
);

}

}


async function getSenderProfile(
senderId,
fallbackName
){

if(!senderId){

return {
name:fallbackName||"Member",
photo:""
};

}


if(notificationAvatarCache.has(senderId)){

return notificationAvatarCache.get(
senderId
);

}


let profile={
name:fallbackName||"Member",
photo:""
};


try{

const snap=
await getDoc(
doc(db,"users",senderId)
);


if(snap.exists()){

const data=snap.data();

profile.name=
data.username||
data.displayName||
profile.name;

profile.photo=
data.photoURL||
data.profilePhotoURL||
data.profilePhoto||
data.photo||
data.avatarUrl||
"";

}

}catch(error){

console.error(
"Sender profile error:",
error
);

}


notificationAvatarCache.set(
senderId,
profile
);

return profile;

}


function updateAlertDot(notifications){

const hasUnread=
notifications.some(
notification=>
notification.read!==true
);


document
.getElementById("alertTopDot")
.classList.toggle(
"show",
hasUnread
);

}


async function renderNotifications(
notifications
){

if(notifications.length===0){

alertList.innerHTML=`

<div class="alert-empty">

<svg viewBox="0 0 24 24"
fill="none"
stroke="currentColor">

<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>

<path d="M10 21h4"></path>

</svg>

<h3>No new alerts</h3>

<p>Your community notifications will appear here.</p>

</div>
`;

return;

}


alertList.innerHTML="";


for(const notification of notifications){

const sender=
await getSenderProfile(
notification.senderId,
notification.senderName
);


const element=
document.createElement("div");

element.className="notification";


let message="";


if(notification.type==="like"){

message=
`<b>${escapeHTML(sender.name)}</b> liked your post.`;

}else if(notification.type==="comment"){

message=
`<b>${escapeHTML(sender.name)}</b> commented on your post.`;

}else if(notification.type==="follow"){

message=
`<b>${escapeHTML(sender.name)}</b> started following you.`;

}else{

message=
`<b>${escapeHTML(sender.name)}</b> sent you a notification.`;

}


const avatar=
sender.photo
?`<img src="${escapeAttribute(sender.photo)}" alt="">`
:`<span>${escapeHTML(
sender.name.charAt(0).toUpperCase()
)}</span>`;


element.innerHTML=`

<div class="notification-icon">
${avatar}
</div>

<div style="flex:1;min-width:0;">

<div class="notification-text">
${message}
</div>

<div class="notification-time">
${formatTime(notification.createdAt)}
</div>

</div>

${
notification.read!==true
?'<span class="notification-unread-dot"></span>'
:""
}

`;


element.addEventListener(
"click",
async()=>{

try{

if(notification.read!==true){

await setDoc(
doc(
db,
"notifications",
notification.id
),
{read:true},
{merge:true}
);

notification.read=true;

element
.querySelector(
".notification-unread-dot"
)
?.remove();

}


updateAlertDot(
notifications
);


}catch(error){

console.error(
"Read notification error:",
error
);

}

});


alertList.appendChild(element);

}

}


function loadNotifications(){

if(!currentUser)
return;


if(notificationsUnsubscribe)
return;


const q=
query(
collection(db,"notifications"),
where(
"recipientId",
"==",
currentUser.uid
),
limit(100)
);


notificationsUnsubscribe=
onSnapshot(
q,
async snapshot=>{

const notifications=[];


snapshot.forEach(
notificationDoc=>{
notifications.push({
id:notificationDoc.id,
...notificationDoc.data()
});
});


notifications.sort(
(a,b)=>
(b.createdAt?.seconds||0)-
(a.createdAt?.seconds||0)
);


updateAlertDot(
notifications
);


await renderNotifications(
notifications
);

},
error=>{

console.error(
"Notifications error:",
error
);

alertList.innerHTML=`

<div class="alert-empty">

<h3>Couldn't load alerts</h3>

<p>Please try again later.</p>

</div>

`;

}

);

}


/* COMMENTS */

let activeCommentPost=null;
let activeCommentCountElement=null;


const commentsSheet=
document.getElementById("commentsSheet");

const commentsBackdrop=
document.getElementById("commentsBackdrop");

const sheetCommentsList=
document.getElementById("sheetCommentsList");

const sheetCommentInput=
document.getElementById("sheetCommentInput");

const sheetCommentSend=
document.getElementById("sheetCommentSend");


async function openCommentsSheet(
post,
countElement
){

activeCommentPost=post;
activeCommentCountElement=countElement;


commentsSheet.classList.add("open");
commentsBackdrop.classList.add("show");

commentsSheet.setAttribute(
"aria-hidden",
"false"
);

document.body.classList.add(
"sheet-open"
);

sheetCommentInput.value="";
sheetCommentInput.focus();


await loadComments(
post.id,
sheetCommentsList
);

}


function closeCommentsSheet(){

commentsSheet.classList.remove("open");
commentsBackdrop.classList.remove("show");

commentsSheet.setAttribute(
"aria-hidden",
"true"
);

document.body.classList.remove(
"sheet-open"
);

activeCommentPost=null;
activeCommentCountElement=null;

}


document
.getElementById("closeCommentsButton")
.addEventListener(
"click",
closeCommentsSheet
);


commentsBackdrop.addEventListener(
"click",
closeCommentsSheet
);


async function loadComments(
postId,
commentsList
){

commentsList.innerHTML="";


try{

const snapshot=
await getDocs(
collection(
db,
"posts",
postId,
"comments"
)
);


if(snapshot.empty){

commentsList.innerHTML=`
<div style="color:#777f89;font-size:12px;padding:4px 2px;">
No comments yet.
</div>
`;

return;

}


const comments=[];


snapshot.forEach(commentDoc=>{
comments.push({
id:commentDoc.id,
...commentDoc.data()
});
});


comments.sort(
(a,b)=>
(a.createdAt?.seconds||0)-
(b.createdAt?.seconds||0)
);


comments.forEach(comment=>{

const element=
document.createElement("div");

element.className="comment";


element.innerHTML=`

<div class="comment-top">

<div class="comment-user">
${escapeHTML(
comment.username||"Member"
)}
</div>

${
currentUser&&
comment.userId===currentUser.uid
?`<button class="delete-comment" type="button">
Delete
</button>`
:""
}

</div>

<div class="comment-text">
${escapeHTML(comment.text||"")}
</div>

`;


commentsList.appendChild(element);


const deleteButton=
element.querySelector(
".delete-comment"
);


if(deleteButton){

deleteButton.addEventListener(
"click",
async()=>{

try{

await deleteDoc(
doc(
db,
"posts",
postId,
"comments",
comment.id
)
);


await loadComments(
postId,
commentsList
);


}catch(error){

console.error(error);

alert(
(error.code||"Error")+
": "+
error.message
);

}

});

}

});

}catch(error){

console.error(
"Comments error:",
error
);

commentsList.innerHTML=`
<div style="color:#9c7373;font-size:12px;">
Couldn't load comments.
</div>
`;

}

}


async function sendSheetComment(){

if(!currentUser||!activeCommentPost)
return;


const text=
sheetCommentInput.value.trim();


if(!text)
return;


sheetCommentSend.disabled=true;


try{

await addDoc(
collection(
db,
"posts",
activeCommentPost.id,
"comments"
),
{
text,
userId:currentUser.uid,
username:currentUsername,
createdAt:serverTimestamp()
}
);


sheetCommentInput.value="";


if(activeCommentCountElement){

activeCommentCountElement.textContent=
(Number(
activeCommentCountElement.textContent
)||0)+1;

}


await loadComments(
activeCommentPost.id,
sheetCommentsList
);


if(
activeCommentPost.authorId&&
activeCommentPost.authorId!==currentUser.uid
){

await createNotification({

recipientId:
activeCommentPost.authorId,

senderId:
currentUser.uid,

senderName:
currentUsername,

type:"comment",

postId:
activeCommentPost.id,

commentText:text

});

}


}catch(error){

console.error(
"Comment error:",
error
);

alert(
(error.code||"Error")+
": "+
error.message
);

}finally{

sheetCommentSend.disabled=false;

}

}


document
.getElementById("sheetCommentSend")
.addEventListener(
"click",
sendSheetComment
);


sheetCommentInput.addEventListener(
"keydown",
event=>{

if(event.key==="Enter"){

event.preventDefault();
sendSheetComment();

}

});


/* HELPERS */

function escapeHTML(text){

const div=
document.createElement("div");

div.textContent=String(text);

return div.innerHTML;

}


function escapeAttribute(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/"/g,"&quot;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;");

}


function formatTime(timestamp){

if(!timestamp||!timestamp.seconds)
return "Just now";


const date=
new Date(timestamp.seconds*1000);

const now=new Date();

const diff=
Math.floor(
(now-date)/1000
);


if(diff<60)
return "Just now";

if(diff<3600)
return Math.floor(diff/60)+"m ago";

if(diff<86400)
return Math.floor(diff/3600)+"h ago";

if(diff<604800)
return Math.floor(diff/86400)+"d ago";


return date.toLocaleDateString(
"en-IN",
{
day:"numeric",
month:"short"
}
);

}
