<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JSP TAYSU Community</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  color:#171717;
  padding-bottom:80px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  background:#111;
  color:white;
  padding:14px 18px;
  box-shadow:0 2px 12px rgba(0,0,0,.15);
}

.topbar-inner{
  max-width:720px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:18px;
  font-weight:800;
}

.profile{
  max-width:160px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:13px;
  color:#ddd;
}

.container{
  max-width:720px;
  margin:auto;
  padding:14px 14px 30px;
}

.welcome{
  padding:8px 4px 12px;
}

.welcome h1{
  font-size:25px;
  margin-bottom:5px;
}

.welcome p{
  color:#777;
  font-size:13px;
}

/* SEARCH */

.search-box{
  display:flex;
  gap:8px;
  margin:0 0 16px;
}

#userSearchInput{
  flex:1;
  padding:12px 14px;
  border:1px solid #ddd;
  border-radius:14px;
  background:white;
  font-size:14px;
  outline:none;
}

#userSearchButton{
  border:0;
  border-radius:14px;
  padding:12px 16px;
  background:#151515;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

#searchResults{
  margin-bottom:16px;
}

.search-result{
  background:white;
  padding:13px;
  border-radius:14px;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.search-result-user{
  font-weight:bold;
}

.follow-button{
  border:0;
  border-radius:18px;
  padding:8px 14px;
  background:#111;
  color:white;
  cursor:pointer;
}

/* CREATE POST */

.create-post{
  background:white;
  border-radius:18px;
  padding:16px;
  margin-bottom:20px;
  box-shadow:0 3px 15px rgba(0,0,0,.06);
}

.composer-header{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:13px;
}

.avatar{
  width:44px;
  height:44px;
  flex-shrink:0;
  border-radius:50%;
  background:#171717;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.composer-header strong{
  font-size:15px;
}

.composer-header small{
  display:block;
  color:#888;
  margin-top:3px;
  font-size:12px;
}

#postText{
  width:100%;
  min-height:90px;
  resize:vertical;
  border:1px solid #ddd;
  border-radius:14px;
  padding:13px;
  font-family:inherit;
  font-size:15px;
  outline:none;
  background:#fafafa;
}

#postText:focus{
  background:white;
  border-color:#999;
}

.post-options{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:12px;
}

.media-buttons{
  display:flex;
  gap:5px;
}

.media-buttons button{
  border:0;
  background:#f1f1f1;
  padding:8px 10px;
  border-radius:18px;
  cursor:pointer;
  font-size:12px;
}

.post-btn{
  border:0;
  background:#111;
  color:white;
  padding:10px 19px;
  border-radius:20px;
  font-weight:bold;
  cursor:pointer;
}

/* FEED */

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:0 3px 10px;
}

.section-title h2{
  font-size:19px;
}

.section-title span{
  font-size:18px;
}

.post{
  background:white;
  border-radius:17px;
  padding:16px;
  margin-bottom:11px;
  box-shadow:0 3px 14px rgba(0,0,0,.05);
}

.post-header{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:11px;
}

.post-author{
  font-size:14px;
  font-weight:700;
}

.post-time{
  color:#888;
  font-size:11px;
  margin-top:3px;
}

.post-text{
  line-height:1.55;
  font-size:14px;
  margin-bottom:12px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.actions{
  border-top:1px solid #eee;
  padding-top:9px;
  display:flex;
  gap:5px;
}

.action{
  border:0;
  background:none;
  color:#555;
  padding:7px 10px;
  border-radius:17px;
  cursor:pointer;
  font-size:12px;
}

.action:hover{
  background:#f2f2f2;
}

.empty{
  background:white;
  border-radius:17px;
  text-align:center;
  padding:40px 20px;
  color:#777;
}

.empty-icon{
  font-size:34px;
  margin-bottom:7px;
}

.empty h3{
  color:#333;
  margin-bottom:5px;
}

.empty p{
  font-size:13px;
}

/* LOGIN */

#communityLogin{
  background:white;
  border-radius:17px;
  text-align:center;
  padding:20px;
  margin-bottom:15px;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:65px;
  z-index:200;
  background:rgba(255,255,255,.97);
  border-top:1px solid #e5e5e5;
  display:flex;
  justify-content:center;
  gap:5px;
  padding:7px 10px;
}

.nav-item{
  flex:1;
  max-width:100px;
  border:0;
  background:none;
  color:#777;
  cursor:pointer;
  border-radius:12px;
  font-size:18px;
}

.nav-item span{
  display:block;
  font-size:10px;
  margin-top:3px;
}

.nav-item.active{
  color:#111;
  font-weight:bold;
}

@media(max-width:500px){

  .container{
    padding:12px 10px 25px;
  }

  .welcome h1{
    font-size:23px;
  }

  .create-post{
    padding:14px;
  }

  .media-buttons button{
    padding:7px 8px;
    font-size:11px;
  }

  .post-btn{
    padding:9px 16px;
  }
}
</style>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="logo">🐉 JSP TAYSU</div>
    <div class="profile" id="profileName">Member</div>
  </div>
</header>

<main class="container">

  <div id="communityLogin" style="display:none;">
    <p style="margin-bottom:12px;">
      Sign in to join the community 🐉
    </p>

    <button id="communityGoogleLogin" class="post-btn">
      Continue with Google
    </button>
  </div>

  <section class="welcome">
    <h1 id="welcomeText">Welcome 👋</h1>
    <p>Connect. Share. Preserve our heritage.</p>
  </section>

  <!-- SEARCH AT TOP -->

  <div class="search-box">

    <input
      type="text"
      id="userSearchInput"
      placeholder="Search members..."
      maxlength="30"
    >

    <button id="userSearchButton">
      🔎 Search
    </button>

  </div>

  <div id="searchResults"></div>

  <!-- CREATE POST -->

  <section class="create-post">

    <div class="composer-header">

      <div class="avatar" id="composerAvatar">
        M
      </div>

      <div>
        <strong id="composerName">
          Member
        </strong>

        <small>
          Share with the community
        </small>
      </div>

    </div>

    <textarea
      id="postText"
      placeholder="What's on your mind?"
    ></textarea>

    <div class="post-options">

      <div class="media-buttons">
        <button type="button">
          📷 Photo
        </button>

        <button type="button">
          🎥 Video
        </button>
      </div>

      <button
        class="post-btn"
        id="postButton">
        Post
      </button>

    </div>

  </section>

  <!-- COMMUNITY FEED -->

  <div class="section-title">

    <h2>
      Community Feed
    </h2>

    <span>
      🐉
    </span>

  </div>

  <section id="posts">

    <div class="empty">

      <div class="empty-icon">
        🐉
      </div>

      <h3>
        Loading community...
      </h3>

      <p>
        Please wait a moment.
      </p>

    </div>

  </section>

</main>

<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <button class="nav-item active">
    🏠
    <span>Home</span>
  </button>

  <button class="nav-item">
    🔥
    <span>Explore</span>
  </button>

  <button class="nav-item">
    ➕
    <span>Create</span>
  </button>

  <button class="nav-item">
    🔔
    <span>Alerts</span>
  </button>

  <button
    class="nav-item"
    id="profileNavButton">

    👤
    <span>Profile</span>

  </button>

</nav>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut,
  GoogleAuthProvider,
  signInWithRedirect,
  setPersistence,
  browserLocalPersistence
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  serverTimestamp,
  doc,
  setDoc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig = {

  apiKey:
    "AIzaSyDpv2vqAZbCFgT_XJ4u-KB0AeZWVB2GIUs",

  authDomain:
    "jsp-taysu.firebaseapp.com",

  projectId:
    "jsp-taysu",

  storageBucket:
    "jsp-taysu.firebasestorage.app",

  messagingSenderId:
    "280992025632",

  appId:
    "1:280992025632:web:48efa21208a78be9a78045"

};

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

await setPersistence(
  auth,
  browserLocalPersistence
);

const db =
  getFirestore(app);

let currentUser = null;


/* LOGIN */

const provider =
  new GoogleAuthProvider();

const communityLogin =
  document.getElementById(
    "communityLogin"
  );

const communityGoogleLogin =
  document.getElementById(
    "communityGoogleLogin"
  );

communityGoogleLogin.addEventListener(
  "click",
  async () => {

    try {

      await signInWithRedirect(
        auth,
        provider
      );

    } catch(error) {

      console.error(error);

      alert(
        error.code +
        ": " +
        error.message
      );

    }

  }
);


/* LOAD USER */

onAuthStateChanged(
  auth,
  async (user) => {

    if(!user){

      currentUser = null;

      document.getElementById(
        "profileName"
      ).textContent =
        "Please sign in";

      communityLogin.style.display =
        "block";

      return;

    }

    currentUser = user;

    communityLogin.style.display =
      "none";

    let username =
      user.displayName ||
      "Member";


    try{

      const profileRef =
        doc(
          db,
          "users",
          user.uid
        );

      const profileSnap =
        await getDoc(profileRef);


      if(profileSnap.exists()){

        const profileData =
          profileSnap.data();

        if(profileData.username){

          username =
            profileData.username;

        }

      }


    }catch(error){

      console.error(
        "Profile loading error:",
        error
      );

    }


    /* SHOW USERNAME EVERYWHERE */

    document.getElementById(
      "profileName"
    ).textContent =
      username;

    document.getElementById(
      "composerName"
    ).textContent =
      username;

    document.getElementById(
      "composerAvatar"
    ).textContent =
      username
        .charAt(0)
        .toUpperCase();

    document.getElementById(
      "welcomeText"
    ).textContent =
      "Welcome, " +
      username +
      " 👋";


    /* LOAD POSTS AFTER AUTH */

    await loadPosts();

  }
);


/* CREATE POST */

document.getElementById(
  "postButton"
).addEventListener(
  "click",
  async () => {

    if(!currentUser){

      alert(
        "Please sign in first."
      );

      return;

    }


    const text =
      document.getElementById(
        "postText"
      ).value.trim();


    if(!text){

      alert(
        "Write something first!"
      );

      return;

    }


    const username =
      document.getElementById(
        "composerName"
      ).textContent ||
      "Member";


    try{

      await addDoc(
        collection(
          db,
          "posts"
        ),
        {

          text:
            text,

          authorId:
            currentUser.uid,

          authorName:
            username,

          createdAt:
            serverTimestamp()

        }
      );


      document.getElementById(
        "postText"
      ).value =
        "";


      await loadPosts();


      alert(
        "Post published! 🐉"
      );


    }catch(error){

      console.error(
        "Post error:",
        error
      );

      alert(
        error.code +
        ": " +
        error.message
      );

    }

  }
);


/* LOAD POSTS */

async function loadPosts(){

  const postsContainer =
    document.getElementById(
      "posts"
    );


  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "posts"
        )
      );


    postsContainer.innerHTML =
      "";


    if(snapshot.empty){

      postsContainer.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            🐉
          </div>

          <h3>
            No posts yet
          </h3>

          <p>
            Be the first to share something with the community.
          </p>

        </div>

      `;

      return;

    }


    snapshot.forEach(
      (postDoc) => {

        const post =
          postDoc.data();

        const postId =
          postDoc.id;


        const postElement =
          document.createElement(
            "article"
          );


        postElement.className =
          "post";


        postElement.innerHTML = `

          <div class="post-header">

            <div class="avatar">

              ${(post.authorName || "M")
                .charAt(0)
                .toUpperCase()}

            </div>

            <div>

              <div class="post-author">
                ${post.authorName || "Member"}
              </div>

              <div class="post-time">
                Community member
              </div>

            </div>

          </div>


          <div class="post-text">
            ${post.text || ""}
          </div>


          <div class="actions">

            <button
              class="action like-button">

              ❤️ <span>Like</span>

            </button>

            <button class="action">
              💬 Comment
            </button>

            <button class="action">
              ↗️ Share
            </button>

          </div>

        `;


        postsContainer.appendChild(
          postElement
        );


        /* LIKE */

        const likeButton =
          postElement.querySelector(
            ".like-button"
          );


        likeButton.addEventListener(
          "click",
          async () => {

            if(!currentUser){

              alert(
                "Please sign in again."
              );

              return;

            }


            try{

              const likeRef =
                doc(
                  db,
                  "posts",
                  postId,
                  "likes",
                  currentUser.uid
                );


              const likeSnap =
                await getDoc(
                  likeRef
                );


              if(
                likeSnap.exists()
              ){

                alert(
                  "Already liked ❤️"
                );

                return;

              }


              await setDoc(
                likeRef,
                {

                  userId:
                    currentUser.uid,

                  createdAt:
                    serverTimestamp()

                }
              );


              likeButton
                .querySelector(
                  "span"
                )
                .textContent =
                "Liked";


              likeButton.disabled =
                true;


            }catch(error){

              console.error(
                "Like error:",
                error
              );

              alert(
                error.code +
                ": " +
                error.message
              );

            }

          }
        );

      }
    );


  }catch(error){

    console.error(
      "Load posts error:",
      error
    );


    postsContainer.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          ⚠️
        </div>

        <h3>
          Couldn't load posts
        </h3>

        <p>
          Please refresh the page.
        </p>

      </div>

    `;

  }

}


/* SEARCH MEMBERS */

const userSearchButton =
  document.getElementById(
    "userSearchButton"
  );

const userSearchInput =
  document.getElementById(
    "userSearchInput"
  );

const searchResults =
  document.getElementById(
    "searchResults"
  );


userSearchButton.addEventListener(
  "click",
  async () => {

    const searchText =
      userSearchInput.value
        .trim()
        .toLowerCase();


    if(!searchText){

      searchResults.innerHTML =
        "<p>Enter a username to search.</p>";

      return;

    }


    try{

      const usersSnapshot =
        await getDocs(
          collection(
            db,
            "users"
          )
        );


      searchResults.innerHTML =
        "";

      let found =
        false;


      usersSnapshot.forEach(
        (userDoc) => {

          const user =
            userDoc.data();


          const username =
            (
              user.username ||
              ""
            ).toLowerCase();


          if(
            username.includes(
              searchText
            ) &&
            userDoc.id !==
            currentUser?.uid
          ){

            found =
              true;


            const result =
              document.createElement(
                "div"
              );


            result.className =
              "search-result";


            result.innerHTML = `

              <div class="search-result-user">
                ${user.username}
              </div>

              <button class="follow-button">
                Follow
              </button>

            `;


            const followButton =
              result.querySelector(
                ".follow-button"
              );


            followButton.addEventListener(
              "click",
              async () => {

                if(!currentUser){

                  alert(
                    "Please sign in again."
                  );

                  return;

                }


                try{

                  const followId =
                    currentUser.uid +
                    "_" +
                    userDoc.id;


                  await setDoc(
                    doc(
                      db,
                      "follows",
                      followId
                    ),
                    {

                      followerId:
                        currentUser.uid,

                      followingId:
                        userDoc.id,

                      createdAt:
                        serverTimestamp()

                    }
                  );


                  followButton.textContent =
                    "Following";

                  followButton.disabled =
                    true;


                }catch(error){

                  console.error(
                    error
                  );

                  alert(
                    error.code +
                    ": " +
                    error.message
                  );

                }

              }
            );


            searchResults.appendChild(
              result
            );

          }

        }
      );


      if(!found){

        searchResults.innerHTML =
          "<p>No members found.</p>";

      }


    }catch(error){

      console.error(
        "Search error:",
        error
      );

      alert(
        error.code +
        ": " +
        error.message
      );

    }

  }
);


/* PROFILE BUTTON */

const profileNavButton =
  document.getElementById(
    "profileNavButton"
  );


if(profileNavButton){

  profileNavButton.addEventListener(
    "click",
    () => {

      window.location.href =
        "profile.html";

    }
  );

}


/* INITIAL LOAD */

loadPosts();

</script>

</body>
</html>
