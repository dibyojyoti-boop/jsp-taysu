<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JSP TAYSU Community</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f7f4ed;
  color:#211c17;
  padding-bottom:78px;
}

button,input,textarea{
  font-family:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

/* TOP BAR */

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  background:#4a392b;
  color:#fffdf9;
  padding:13px 15px;
  box-shadow:0 3px 15px rgba(64,48,32,.16);
}

.topbar-inner{
  max-width:720px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.logo{
  font-size:17px;
  font-weight:800;
  letter-spacing:.4px;
}

.profile{
  max-width:180px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:13px;
  color:#eadfc9;
}

/* CONTAINER */

.container{
  max-width:720px;
  margin:auto;
  padding:15px 12px 30px;
}

/* SEARCH */

.search-box{
  display:flex;
  gap:7px;
  margin-bottom:8px;
}

#userSearchInput{
  flex:1;
  min-width:0;
  padding:12px 14px;
  border:1px solid #ddd3c5;
  border-radius:15px;
  background:#fffdf9;
  color:#211c17;
  font-size:14px;
  outline:none;
}

#userSearchInput:focus{
  border-color:#ad8d5c;
}

#userSearchButton{
  border:0;
  border-radius:15px;
  padding:12px 14px;
  background:#4a392b;
  color:white;
  font-weight:700;
  cursor:pointer;
}

#searchResults{
  margin-bottom:13px;
}

.search-result{
  background:#fffdf9;
  border:1px solid #e8e0d3;
  padding:11px 12px;
  border-radius:14px;
  margin-bottom:7px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.search-result-user{
  font-weight:700;
  font-size:14px;
}

.follow-button{
  border:0;
  border-radius:18px;
  padding:7px 13px;
  background:#4a392b;
  color:white;
  cursor:pointer;
  font-weight:700;
}

.follow-button.following{
  background:#eee6da;
  color:#4a392b;
}

/* WELCOME */

.welcome{
  padding:4px 3px 13px;
}

.welcome h1{
  font-size:25px;
  margin-bottom:5px;
}

.welcome p{
  color:#81776b;
  font-size:13px;
}

/* LOGIN */

#communityLogin{
  background:#fffdf9;
  border:1px solid #e8e0d3;
  border-radius:18px;
  text-align:center;
  padding:19px;
  margin-bottom:14px;
  box-shadow:0 5px 18px rgba(64,48,32,.05);
}

/* CREATE */

.create-post{
  background:#fffdf9;
  border:1px solid #e8e0d3;
  border-radius:20px;
  padding:15px;
  margin-bottom:21px;
  box-shadow:0 7px 24px rgba(64,48,32,.06);
}

.composer-header{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:11px;
}

.avatar{
  width:43px;
  height:43px;
  flex-shrink:0;
  border-radius:50%;
  background:#4a392b;
  color:#f7e9c8;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  border:2px solid #eadfc9;
}

.composer-info strong{
  font-size:15px;
}

.composer-info small{
  display:block;
  color:#8a8177;
  margin-top:3px;
  font-size:12px;
}

#postText{
  width:100%;
  min-height:78px;
  resize:vertical;
  border:0;
  border-radius:14px;
  padding:10px 2px;
  font-family:inherit;
  font-size:16px;
  outline:none;
  background:transparent;
  color:#211c17;
}

#postText::placeholder{
  color:#978d81;
}

/* SELECTED MEDIA */

.media-preview{
  display:none;
  position:relative;
  margin:7px 0 11px;
  border-radius:15px;
  overflow:hidden;
  background:#f0ebe3;
  border:1px solid #e3dbcf;
}

.media-preview img,
.media-preview video{
  display:block;
  width:100%;
  max-height:380px;
  object-fit:contain;
  background:#eee9e1;
}

.remove-media{
  position:absolute;
  right:8px;
  top:8px;
  border:0;
  width:30px;
  height:30px;
  border-radius:50%;
  background:rgba(40,32,25,.75);
  color:white;
  cursor:pointer;
  font-size:16px;
}

.post-options{
  border-top:1px solid #eee6da;
  padding-top:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.media-buttons{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.media-buttons button{
  border:1px solid #e3dbcf;
  background:#f5eee4;
  color:#66594c;
  padding:8px 10px;
  border-radius:18px;
  cursor:pointer;
  font-size:12px;
  font-weight:600;
}

.media-buttons button:hover{
  background:#eee4d4;
}

.post-btn{
  border:0;
  background:#4a392b;
  color:white;
  padding:10px 18px;
  border-radius:20px;
  font-weight:bold;
  cursor:pointer;
}

.post-btn:disabled{
  opacity:.6;
  cursor:default;
}

/* FEED TITLE */

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:0 3px 10px;
}

.section-title h2{
  font-size:19px;
  color:#493a2d;
}

/* POSTS */

.post{
  background:#fffdf9;
  border:1px solid #e8e0d3;
  border-radius:18px;
  padding:14px 15px;
  margin-bottom:11px;
  box-shadow:0 5px 18px rgba(64,48,32,.05);
}

.post-header{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:9px;
}

.post-author{
  font-size:14px;
  font-weight:800;
  color:#30251d;
}

.post-time{
  color:#8a8177;
  font-size:11px;
  margin-top:2px;
}

.post-text{
  line-height:1.55;
  margin-bottom:10px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  color:#302820;
  font-size:15px;
}

.post-media{
  margin:9px 0 11px;
  border-radius:15px;
  overflow:hidden;
  background:#eee9e1;
}

.post-media img{
  display:block;
  width:100%;
  max-height:500px;
  object-fit:cover;
}

.post-media video{
  display:block;
  width:100%;
  max-height:500px;
  background:#000;
}

.actions{
  border-top:1px solid #eee6da;
  padding-top:7px;
  display:flex;
  gap:2px;
}

.action{
  border:0;
  background:none;
  color:#766b60;
  padding:7px 9px;
  border-radius:17px;
  cursor:pointer;
  font-size:12px;
}

.action:hover{
  background:#f3ede4;
  color:#493a2d;
}

.action.liked{
  color:#9a5d4b;
  font-weight:700;
}

.action:disabled{
  cursor:default;
  opacity:.65;
}

/* COMMENTS */

.comments-area{
  display:none;
  margin-top:10px;
}

.comments-list{
  margin-bottom:8px;
}

.comment{
  background:#f7f1e8;
  border:1px solid #eee4d5;
  border-radius:12px;
  padding:9px 10px;
  margin-bottom:6px;
}

.comment-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:3px;
}

.comment-user{
  font-size:12px;
  font-weight:800;
  color:#493a2d;
}

.comment-text{
  font-size:13px;
  line-height:1.4;
  overflow-wrap:anywhere;
}

.delete-comment{
  border:0;
  background:none;
  color:#9a5d4b;
  font-size:11px;
  cursor:pointer;
}

.comment-compose{
  display:flex;
  gap:6px;
}

.comment-input{
  flex:1;
  min-width:0;
  padding:9px 11px;
  border:1px solid #ddd3c5;
  border-radius:12px;
  outline:none;
  background:#faf7f1;
  color:#211c17;
}

.comment-send{
  border:0;
  border-radius:12px;
  padding:9px 13px;
  background:#4a392b;
  color:white;
  font-weight:700;
  cursor:pointer;
}

/* EMPTY */

.empty{
  background:#fffdf9;
  border:1px solid #e8e0d3;
  border-radius:19px;
  text-align:center;
  padding:40px 20px;
  color:#81776b;
}

.empty-icon{
  font-size:33px;
  margin-bottom:7px;
}

.empty h3{
  color:#493a2d;
  margin-bottom:6px;
  font-size:17px;
}

.empty p{
  font-size:13px;
}

/* ALERTS */

.alert-panel{
  display:none;
  background:#fffdf9;
  border:1px solid #e8e0d3;
  border-radius:18px;
  padding:15px;
  margin-bottom:15px;
}

.alert-item{
  padding:11px 3px;
  border-bottom:1px solid #eee6da;
  font-size:13px;
}

.alert-item:last-child{
  border-bottom:0;
}

.alert-empty{
  text-align:center;
  color:#81776b;
  padding:20px;
  font-size:13px;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:67px;
  z-index:200;
  background:rgba(255,253,249,.97);
  backdrop-filter:blur(10px);
  border-top:1px solid #e3dbcf;
  display:flex;
  justify-content:center;
  gap:4px;
  padding:6px 8px;
  box-shadow:0 -4px 18px rgba(64,48,32,.06);
}

.nav-item{
  flex:1;
  max-width:110px;
  border:0;
  background:none;
  color:#8a8177;
  cursor:pointer;
  border-radius:13px;
  font-size:18px;
  transition:.2s;
}

.nav-item span{
  display:block;
  font-size:10px;
  margin-top:3px;
}

.nav-item:hover{
  background:#f3ede4;
}

.nav-item.active{
  color:#4a392b;
  font-weight:bold;
}

.hidden-file{
  display:none;
}

@media(max-width:500px){

  .container{
    padding:13px 9px 25px;
  }

  .topbar{
    padding:12px 13px;
  }

  .logo{
    font-size:15px;
  }

  .profile{
    max-width:130px;
  }

  .welcome h1{
    font-size:23px;
  }

  .create-post{
    padding:14px;
  }

  .media-buttons button{
    padding:7px 8px;
    font-size:11px;
  }

  .post-btn{
    padding:9px 15px;
  }

  .post{
    padding:13px;
  }

  .action{
    padding:7px 7px;
  }

}
</style>

<!-- REMOVE THESE TWO ERUDA LINES WHEN SITE IS READY -->
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>
eruda.init();
</script>

</head>

<body>

<header class="topbar">
  <div class="topbar-inner">

    <div class="logo">
      🐉 JSP TAYSU
    </div>

    <div class="profile" id="profileName">
      Please sign in
    </div>

  </div>
</header>


<main class="container">

  <!-- LOGIN -->

  <div id="communityLogin" style="display:none;">

    <p style="margin-bottom:12px;">
      Sign in to join the community 🐉
    </p>

    <button
      id="communityGoogleLogin"
      class="post-btn">
      Continue with Google
    </button>

  </div>


  <!-- WELCOME -->

  <section class="welcome">

    <h1 id="welcomeText">
      Welcome 👋
    </h1>

    <p>
      Connect. Share. Preserve our heritage.
    </p>

  </section>


  <!-- SEARCH -->

  <div class="search-box">

    <input
      type="text"
      id="userSearchInput"
      placeholder="Search members..."
      maxlength="30"
    >

    <button id="userSearchButton">
      🔎
    </button>

  </div>

  <div id="searchResults"></div>


  <!-- ALERTS -->

  <section
    id="alertsPanel"
    class="alert-panel">

    <h3 style="margin-bottom:8px;color:#493a2d;">
      🔔 Alerts
    </h3>

    <div id="alertsList">
      <div class="alert-empty">
        No alerts yet.
      </div>
    </div>

  </section>


  <!-- CREATE POST -->

  <section
    class="create-post"
    id="createPostSection">

    <div class="composer-header">

      <div
        class="avatar"
        id="composerAvatar">
        M
      </div>

      <div class="composer-info">

        <strong id="composerName">
          Member
        </strong>

        <small>
          Share with the community
        </small>

      </div>

    </div>


    <textarea
      id="postText"
      maxlength="2000"
      placeholder="What's on your mind?">
    </textarea>


    <!-- SELECTED MEDIA -->

    <div
      class="media-preview"
      id="mediaPreview">

      <img
        id="imagePreview"
        style="display:none;"
        alt="Selected image">

      <video
        id="videoPreview"
        style="display:none;"
        controls>
      </video>

      <button
        type="button"
        class="remove-media"
        id="removeMedia">
        ×
      </button>

    </div>


    <input
      type="file"
      id="photoInput"
      class="hidden-file"
      accept="image/*">

    <input
      type="file"
      id="videoInput"
      class="hidden-file"
      accept="video/*">


    <div class="post-options">

      <div class="media-buttons">

        <button
          type="button"
          id="photoButton">
          📷 Photo
        </button>

        <button
          type="button"
          id="videoButton">
          🎥 Video
        </button>

      </div>


      <button
        class="post-btn"
        id="postButton">
        Post
      </button>

    </div>

  </section>


  <!-- FEED -->

  <div class="section-title">

    <h2>
      Community Feed
    </h2>

    <span>
      🐉
    </span>

  </div>


  <section id="posts">

    <div class="empty">

      <div class="empty-icon">
        🐉
      </div>

      <h3>
        Loading community...
      </h3>

      <p>
        Please wait a moment.
      </p>

    </div>

  </section>

</main>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <button
    class="nav-item active"
    id="homeNav">

    🏠
    <span>Home</span>

  </button>


  <button
    class="nav-item"
    id="exploreNav">

    🔥
    <span>Explore</span>

  </button>


  <button
    class="nav-item"
    id="createNav">

    ➕
    <span>Create</span>

  </button>


  <button
    class="nav-item"
    id="alertsNav">

    🔔
    <span>Alerts</span>

  </button>


  <button
    class="nav-item"
    id="profileNavButton">

    👤
    <span>Profile</span>

  </button>

</nav>


<script type="module">

/* =========================================================
   FIREBASE IMPORTS
========================================================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  GoogleAuthProvider,
  signInWithRedirect,
  getRedirectResult,
  setPersistence,
  browserLocalPersistence
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  serverTimestamp,
  doc,
  setDoc,
  getDoc,
  deleteDoc,
  query,
  orderBy,
  limit
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";


/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyDpv2vqAZbCFgT_XJ4u-KB0AeZWVB2GIUs",

  authDomain:
    "jsp-taysu.firebaseapp.com",

  projectId:
    "jsp-taysu",

  storageBucket:
    "jsp-taysu.firebasestorage.app",

  messagingSenderId:
    "280992025632",

  appId:
    "1:280992025632:web:48efa21208a78be9a78045"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);

const storage =
  getStorage(app);

let currentUser = null;
let currentUsername = "Member";


/* =========================================================
   ELEMENTS
========================================================= */

const communityLogin =
  document.getElementById("communityLogin");

const communityGoogleLogin =
  document.getElementById("communityGoogleLogin");

const profileName =
  document.getElementById("profileName");

const composerName =
  document.getElementById("composerName");

const composerAvatar =
  document.getElementById("composerAvatar");

const welcomeText =
  document.getElementById("welcomeText");

const postText =
  document.getElementById("postText");

const postButton =
  document.getElementById("postButton");

const photoButton =
  document.getElementById("photoButton");

const videoButton =
  document.getElementById("videoButton");

const photoInput =
  document.getElementById("photoInput");

const videoInput =
  document.getElementById("videoInput");

const mediaPreview =
  document.getElementById("mediaPreview");

const imagePreview =
  document.getElementById("imagePreview");

const videoPreview =
  document.getElementById("videoPreview");

const removeMedia =
  document.getElementById("removeMedia");

let selectedFile = null;
let selectedType = null;


/* =========================================================
   FIREBASE AUTH PERSISTENCE
========================================================= */

await setPersistence(
  auth,
  browserLocalPersistence
);


/* =========================================================
   GOOGLE LOGIN
========================================================= */

const provider =
  new GoogleAuthProvider();


communityGoogleLogin.addEventListener(
  "click",
  async () => {

    try{

      await signInWithRedirect(
        auth,
        provider
      );

    }catch(error){

      console.error(error);

      alert(
        error.code +
        ": " +
        error.message
      );

    }

  }
);


/* =========================================================
   REDIRECT RESULT
========================================================= */

try{

  await getRedirectResult(auth);

}catch(error){

  console.error(
    "Redirect login error:",
    error
  );

}


/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(
  auth,
  async (user) => {

    if(!user){

      currentUser = null;

      communityLogin.style.display =
        "block";

      profileName.textContent =
        "Please sign in";

      composerName.textContent =
        "Member";

      composerAvatar.textContent =
        "M";

      welcomeText.textContent =
        "Welcome 👋";

      return;
    }


    currentUser = user;

    communityLogin.style.display =
      "none";


    currentUsername =
      user.displayName ||
      "Member";


    /* LOAD PROFILE */

    try{

      const profileRef =
        doc(
          db,
          "users",
          user.uid
        );

      const profileSnap =
        await getDoc(
          profileRef
        );


      if(
        profileSnap.exists() &&
        profileSnap.data().username
      ){

        currentUsername =
          profileSnap.data().username;

      }

    }catch(error){

      console.error(
        "Profile error:",
        error
      );

    }


    /* SHOW USER */

    profileName.textContent =
      currentUsername;

    composerName.textContent =
      currentUsername;

    composerAvatar.textContent =
      currentUsername
        .charAt(0)
        .toUpperCase();

    welcomeText.textContent =
      "Welcome, " +
      currentUsername +
      " 👋";


    await loadPosts();

  }
);


/* =========================================================
   MEDIA SELECT
========================================================= */

photoButton.addEventListener(
  "click",
  () => {

    if(!currentUser){

      alert(
        "Please sign in first."
      );

      return;

    }

    photoInput.click();

  }
);


videoButton.addEventListener(
  "click",
  () => {

    if(!currentUser){

      alert(
        "Please sign in first."
      );

      return;

    }

    videoInput.click();

  }
);


/* =========================================================
   PHOTO SELECTED
========================================================= */

photoInput.addEventListener(
  "change",
  () => {

    const file =
      photoInput.files[0];

    if(!file) return;


    selectedFile =
      file;

    selectedType =
      "image";


    const url =
      URL.createObjectURL(file);


    imagePreview.src =
      url;

    imagePreview.style.display =
      "block";

    videoPreview.style.display =
      "none";

    mediaPreview.style.display =
      "block";

  }
);


/* =========================================================
   VIDEO SELECTED
========================================================= */

videoInput.addEventListener(
  "change",
  () => {

    const file =
      videoInput.files[0];

    if(!file) return;


    selectedFile =
      file;

    selectedType =
      "video";


    const url =
      URL.createObjectURL(file);


    videoPreview.src =
      url;

    videoPreview.style.display =
      "block";

    imagePreview.style.display =
      "none";

    mediaPreview.style.display =
      "block";

  }
);


/* =========================================================
   REMOVE MEDIA
========================================================= */

removeMedia.addEventListener(
  "click",
  () => {

    selectedFile = null;
    selectedType = null;

    photoInput.value = "";
    videoInput.value = "";

    imagePreview.src = "";
    videoPreview.src = "";

    mediaPreview.style.display =
      "none";

  }
);


/* =========================================================
   UPLOAD MEDIA
========================================================= */

async function uploadMedia(
  file,
  type
){

  if(!currentUser){
    throw new Error(
      "User is not logged in."
    );
  }


  const safeName =
    file.name
      .replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );


  const filePath =
    "posts/" +
    currentUser.uid +
    "/" +
    Date.now() +
    "_" +
    safeName;


  const storageRef =
    ref(
      storage,
      filePath
    );


  await uploadBytes(
    storageRef,
    file
  );


  const downloadURL =
    await getDownloadURL(
      storageRef
    );


  return downloadURL;

}

async function loadPosts(){

  const postsContainer =
    document.getElementById(
      "posts"
    );


  postsContainer.innerHTML = `

    <div class="empty">

      <div class="empty-icon">
        🐉
      </div>

      <h3>
        Loading community...
      </h3>

      <p>
        Please wait a moment.
      </p>

    </div>

  `;


  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "posts"
        )
      );


    if(snapshot.empty){

      postsContainer.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            🐉
          </div>

          <h3>
            No posts yet
          </h3>

          <p>
            Be the first to share something with the community.
          </p>

        </div>

      `;

      return;

    }


    const posts = [];


    snapshot.forEach(
      postDoc => {

        posts.push({

          id:
            postDoc.id,

          ...postDoc.data()

        });

      }
    );


    posts.sort(
      (a,b) => {

        const aTime =
          a.createdAt?.seconds || 0;

        const bTime =
          b.createdAt?.seconds || 0;

        return bTime - aTime;

      }
    );


    postsContainer.innerHTML = "";


    for(
      const post of posts
    ){

      await renderPost(
        post,
        postsContainer
      );

    }


  }catch(error){

    console.error(
      "Load posts error:",
      error
    );


    postsContainer.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          ⚠️
        </div>

        <h3>
          Couldn't load posts
        </h3>

        <p>
          Please refresh the page.
        </p>

      </div>

    `;

  }

}


/* =========================================================
   RENDER POST
========================================================= */

async function renderPost(
  post,
  postsContainer
){

  const postElement =
    document.createElement(
      "article"
    );

  postElement.className =
    "post";


  const username =
    post.authorName ||
    "Member";


  /* LIKE COUNT */

  let likeCount = 0;
  let alreadyLiked = false;


  try{

    const likesSnapshot =
      await getDocs(
        collection(
          db,
          "posts",
          post.id,
          "likes"
        )
      );


    likeCount =
      likesSnapshot.size;


    if(currentUser){

      alreadyLiked =
        likesSnapshot.docs.some(
          likeDoc =>
            likeDoc.id ===
            currentUser.uid
        );

    }

  }catch(error){

    console.error(
      "Like error:",
      error
    );

  }


  /* COMMENT COUNT */

  let commentCount = 0;


  try{

    const commentsSnapshot =
      await getDocs(
        collection(
          db,
          "posts",
          post.id,
          "comments"
        )
      );


    commentCount =
      commentsSnapshot.size;

  }catch(error){

    console.error(
      "Comment count error:",
      error
    );

  }


  /* TIME */

  let postTime =
    "Community member";


  if(post.createdAt){

    try{

      const date =
        new Date(
          post.createdAt.seconds *
          1000
        );

      postTime =
        formatTimeAgo(date);

    }catch(error){

      postTime =
        "Community member";

    }

  }


  let mediaHTML = "";


  if(
    post.mediaURL &&
    post.mediaType === "image"
  ){

    mediaHTML = `

      <div class="post-media">

        <img
          src="${escapeHTML(post.mediaURL)}"
          alt="Community post image"
          loading="lazy">

      </div>

    `;

  }


  if(
    post.mediaURL &&
    post.mediaType === "video"
  ){

    mediaHTML = `

      <div class="post-media">

        <video
          src="${escapeHTML(post.mediaURL)}"
          controls
          preload="metadata">
        </video>

      </div>

    `;

  }


  postElement.innerHTML = `

    <div class="post-header">

      <div class="avatar">

        ${escapeHTML(
          username
            .charAt(0)
            .toUpperCase()
        )}

      </div>

      <div>

        <div class="post-author">
          ${escapeHTML(username)}
        </div>

        <div class="post-time">
          ${escapeHTML(postTime)}
        </div>

      </div>

    </div>


    ${
      post.text
        ? `
          <div class="post-text">
            ${escapeHTML(post.text)}
          </div>
        `
        : ""
    }


    ${mediaHTML}


    <div class="actions">

      <button
        class="action like-button
        ${alreadyLiked ? "liked" : ""}"
        type="button">

        ❤️
        <span>
          ${alreadyLiked ? "Unlike" : "Like"}
        </span>

        <b class="like-count">
          ${likeCount}
        </b>

      </button>


      <button
        class="action comment-button"
        type="button">

        💬
        <span>
          Comment
        </span>

        <b class="comment-count">
          ${commentCount}
        </b>

      </button>


      <button
        class="action share-button"
        type="button">

        ↗️
        <span>
          Share
        </span>

      </button>

    </div>


    <div class="comments-area">

      <div class="comments-list"></div>


      <div class="comment-compose">

        <input
          class="comment-input"
          type="text"
          maxlength="300"
          placeholder="Write a comment...">

        <button
          class="comment-send"
          type="button">
          Send
        </button>

      </div>

    </div>

  `;


  postsContainer.appendChild(
    postElement
  );


  /* =====================================================
     LIKE
  ===================================================== */

  const likeButton =
    postElement.querySelector(
      ".like-button"
    );

  const likeText =
    likeButton.querySelector(
      "span"
    );

  const likeCountElement =
    postElement.querySelector(
      ".like-count"
    );


  likeButton.addEventListener(
    "click",
    async () => {

      if(!currentUser){

        alert(
          "Please sign in first."
        );

        return;

      }


      likeButton.disabled =
        true;


      try{

        const likeRef =
          doc(
            db,
            "posts",
            post.id,
            "likes",
            currentUser.uid
          );


        const likeSnap =
          await getDoc(
            likeRef
          );


        if(
          likeSnap.exists()
        ){

          await deleteDoc(
            likeRef
          );


          likeText.textContent =
            "Like";

          likeButton.classList
            .remove("liked");


          let count =
            Number(
              likeCountElement
                .textContent
            ) || 0;


          count =
            Math.max(
              0,
              count - 1
            );


          likeCountElement
            .textContent =
              count;

        }else{

          await setDoc(
            likeRef,
            {

              userId:
                currentUser.uid,

              createdAt:
                serverTimestamp()

            }
          );


          likeText.textContent =
            "Unlike";

          likeButton.classList
            .add("liked");


          let count =
            Number(
              likeCountElement
                .textContent
            ) || 0;


          count++;


          likeCountElement
            .textContent =
            count;

        }


      }catch(error){

        console.error(
          "Like error:",
          error
        );

        alert(
          error.code +
          ": " +
          error.message
        );

      }finally{

        likeButton.disabled =
          false;

      }

    }
  );


  /* =====================================================
     COMMENTS
  ===================================================== */

  const commentButton =
    postElement.querySelector(
      ".comment-button"
    );

  const commentsArea =
    postElement.querySelector(
      ".comments-area"
    );

  const commentsList =
    postElement.querySelector(
      ".comments-list"
    );

  const commentInput =
    postElement.querySelector(
      ".comment-input"
    );

  const commentSend =
    postElement.querySelector(
      ".comment-send"
    );

  const commentCountElement =
    postElement.querySelector(
      ".comment-count"
    );


  commentButton.addEventListener(
    "click",
    async () => {

      if(!currentUser){

        alert(
          "Please sign in first."
        );

        return;

      }


      if(
        commentsArea.style.display ===
        "block"
      ){

        commentsArea.style.display =
          "none";

        return;

      }


      commentsArea.style.display =
        "block";


      await loadComments(
        post.id,
        commentsList
      );

    }
  );


  /* SEND COMMENT */

  commentSend.addEventListener(
    "click",
    async () => {

      if(!currentUser){

        alert(
          "Please sign in first."
        );

        return;

      }


      const text =
        commentInput.value.trim();


      if(!text) return;


      try{

        commentSend.disabled =
          true;


        await addDoc(
          collection(
            db,
            "posts",
            post.id,
            "comments"
          ),
          {

            text:
              text,

            userId:
              currentUser.uid,

            username:
              currentUsername,

            createdAt:
              serverTimestamp()

          }
        );


        commentInput.value =
          "";


        let count =
          Number(
            commentCountElement
              .textContent
          ) || 0;


        count++;


        commentCountElement
          .textContent =
          count;


        await loadComments(
          post.id,
          commentsList
        );


      }catch(error){

        console.error(
          "Comment error:",
          error
        );

        alert(
          error.code +
          ": " +
          error.message
        );

      }finally{

        commentSend.disabled =
          false;

      }

    }
  );


  commentInput.addEventListener(
    "keydown",
    event => {

      if(
        event.key ===
        "Enter"
      ){

        event.preventDefault();

        commentSend.click();

      }

    }
  );


  /* =====================================================
     SHARE
  ===================================================== */

  const shareButton =
    postElement.querySelector(
      ".share-button"
    );


  shareButton.addEventListener(
    "click",
    async () => {

      const shareText =
        `${username} shared a post on JSP TAYSU Community 🐉`;


      try{

        if(
          navigator.share
        ){

          await navigator.share({

            title:
              "JSP TAYSU Community",

            text:
              shareText,

            url:
              window.location.href

          });

        }else{

          await navigator
            .clipboard
            .writeText(
              window.location.href
            );

          alert(
            "Community link copied! 🔗"
          );

        }

      }catch(error){

        console.log(
          "Share cancelled."
        );

      }

    }
  );

}


/* =========================================================
   LOAD COMMENTS
========================================================= */

async function loadComments(
  postId,
  commentsList
){

  commentsList.innerHTML = "";


  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "posts",
          postId,
          "comments"
        )
      );


    if(snapshot.empty){

      commentsList.innerHTML = `

        <div style="
          color:#8a8177;
          font-size:12px;
          padding:5px 2px;
        ">

          No comments yet.

        </div>

      `;

      return;

    }


    const comments = [];


    snapshot.forEach(
      commentDoc => {

        comments.push({

          id:
            commentDoc.id,

          ...commentDoc.data()

        });

      }
    );


    comments.sort(
      (a,b) => {

        const aTime =
          a.createdAt?.seconds ||
          0;

        const bTime =
          b.createdAt?.seconds ||
          0;

        return aTime - bTime;

      }
    );


    comments.forEach(
      comment => {

        const element =
          document.createElement(
            "div"
          );


        element.className =
          "comment";


        element.innerHTML = `

          <div class="comment-top">

            <div class="comment-user">

              ${escapeHTML(
                comment.username ||
                "Member"
              )}

            </div>

            ${
              currentUser &&
              comment.userId ===
              currentUser.uid
                ? `
                  <button
                    class="delete-comment"
                    type="button">
                    Delete
                  </button>
                `
                : ""
            }

          </div>


          <div class="comment-text">

            ${escapeHTML(
              comment.text ||
              ""
            )}

          </div>

        `;


        commentsList.appendChild(
          element
        );


        const deleteButton =
          element.querySelector(
            ".delete-comment"
          );


        if(deleteButton){

          deleteButton.addEventListener(
            "click",
            async () => {

              if(!currentUser)
                return;


              try{

                await deleteDoc(
                  doc(
                    db,
                    "posts",
                    postId,
                    "comments",
                    comment.id
                  )
                );


                await loadComments(
                  postId,
                  commentsList
                );


              }catch(error){

                console.error(
                  "Delete error:",
                  error
                );

                alert(
                  error.code +
                  ": " +
                  error.message
                );

              }

            }
          );

        }

      }
    );


  }catch(error){

    console.error(
      "Comments error:",
      error
    );


    commentsList.innerHTML = `

      <div style="
        color:#9a5d4b;
        font-size:12px;
        padding:5px;
      ">

        Couldn't load comments.

      </div>

    `;

  }

}

async function searchUsers(){

  const searchText =
    userSearchInput.value
      .trim()
      .toLowerCase();


  if(!searchText){

    searchResults.innerHTML = `

      <p style="
        color:#81776b;
        font-size:13px;
        margin-bottom:10px;
      ">

        Enter a username to search.

      </p>

    `;

    return;

  }


  if(!currentUser){

    alert(
      "Please sign in first."
    );

    return;

  }


  try{

    searchResults.innerHTML = `

      <p style="
        color:#81776b;
        font-size:13px;
        padding:5px;
      ">

        Searching...

      </p>

    `;


    const usersSnapshot =
      await getDocs(
        collection(
          db,
          "users"
        )
      );


    searchResults.innerHTML =
      "";


    let found = false;


    for(
      const userDoc of
      usersSnapshot.docs
    ){

      const user =
        userDoc.data();


      const username =
        (
          user.username ||
          ""
        )
        .toLowerCase();


      if(
        username.includes(
          searchText
        ) &&
        userDoc.id !==
        currentUser.uid
      ){

        found = true;


        const result =
          document.createElement(
            "div"
          );


        result.className =
          "search-result";


        result.innerHTML = `

          <div class="search-result-user">

            ${escapeHTML(
              user.username ||
              "Member"
            )}

          </div>

          <button
            class="follow-button"
            type="button">

            Follow

          </button>

        `;


        const followButton =
          result.querySelector(
            ".follow-button"
          );


        const followId =
          currentUser.uid +
          "_" +
          userDoc.id;


        try{

          const followSnap =
            await getDoc(
              doc(
                db,
                "follows",
                followId
              )
            );


          if(
            followSnap.exists()
          ){

            followButton
              .textContent =
              "Following";

            followButton
              .classList
              .add("following");

            followButton.disabled =
              true;

          }

        }catch(error){

          console.error(
            "Follow check:",
            error
          );

        }


        followButton.addEventListener(
          "click",
          async () => {

            if(!currentUser)
              return;


            try{

              followButton.disabled =
                true;


              await setDoc(
                doc(
                  db,
                  "follows",
                  followId
                ),
                {

                  followerId:
                    currentUser.uid,

                  followingId:
                    userDoc.id,

                  followingName:
                    user.username ||
                    "Member",

                  createdAt:
                    serverTimestamp()

                }
              );


              /* CREATE ALERT */

              try{

                await addDoc(
                  collection(
                    db,
                    "users",
                    userDoc.id,
                    "notifications"
                  ),
                  {

                    type:
                      "follow",

                    fromUserId:
                      currentUser.uid,

                    fromUsername:
                      currentUsername,

                    text:
                      currentUsername +
                      " started following you.",

                    createdAt:
                      serverTimestamp(),

                    read:
                      false

                  }
                );

              }catch(notificationError){

                console.error(
                  "Notification error:",
                  notificationError
                );

              }


              followButton
                .textContent =
                "Following";

              followButton
                .classList
                .add("following");


            }catch(error){

              console.error(
                "Follow error:",
                error
              );

              followButton.disabled =
                false;

              alert(
                error.code +
                ": " +
                error.message
              );

            }

          }
        );


        searchResults.appendChild(
          result
        );

      }

    }


    if(!found){

      searchResults.innerHTML = `

        <p style="
          color:#81776b;
          font-size:13px;
          padding:5px;
        ">

          No members found.

        </p>

      `;

    }

  }catch(error){

    console.error(
      "Search error:",
      error
    );


    alert(
      error.code +
      ": " +
      error.message
    );

  }

}

    window.location.href =
      "profile.html";

  }
);


/* =========================================================
   SAFE HTML
========================================================= */

function escapeHTML(
  text
){

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    String(text);


  return div.innerHTML;

}


/* =========================================================
   TIME FORMAT
========================================================= */

function formatTimeAgo(
  date
){

  const seconds =
    Math.floor(
      (
        Date.now() -
        date.getTime()
      ) / 1000
    );


  if(seconds < 10)
    return "Just now";


  if(seconds < 60)
    return seconds +
      "s ago";


  const minutes =
    Math.floor(
      seconds / 60
    );


  if(minutes < 60)
    return minutes +
      "m ago";


  const hours =
    Math.floor(
      minutes / 60
    );


  if(hours < 24)
    return hours +
      "h ago";


  const days =
    Math.floor(
      hours / 24
    );


  if(days < 7)
    return days +
      "d ago";


  return date.toLocaleDateString();

}
