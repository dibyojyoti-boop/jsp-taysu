<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JSP TAYSU Community</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  color:#171717;
  padding-bottom:80px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  background:#111;
  color:white;
  padding:14px 18px;
  box-shadow:0 2px 12px rgba(0,0,0,.15);
}

.topbar-inner{
  max-width:720px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:18px;
  font-weight:800;
  letter-spacing:.3px;
}

.profile{
  max-width:150px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:13px;
  color:#ddd;
}

.container{
  max-width:720px;
  margin:auto;
  padding:18px 14px 30px;
}

.welcome{
  padding:14px 4px 20px;
}

.welcome h1{
  margin:0 0 7px;
  font-size:28px;
}

.welcome p{
  margin:0;
  color:#737373;
  font-size:14px;
}

.create-post{
  background:white;
  border-radius:18px;
  padding:18px;
  box-shadow:0 4px 20px rgba(0,0,0,.06);
  margin-bottom:24px;
}

.composer-header{
  display:flex;
  align-items:center;
  gap:11px;
  margin-bottom:15px;
}

.avatar{
  width:44px;
  height:44px;
  flex-shrink:0;
  border-radius:50%;
  background:#181818;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.composer-header strong{
  display:block;
  font-size:15px;
}

.composer-header small{
  display:block;
  color:#888;
  margin-top:3px;
  font-size:12px;
}

.create-post textarea{
  width:100%;
  min-height:95px;
  resize:vertical;
  border:1px solid #e2e2e2;
  border-radius:14px;
  padding:14px;
  font-family:inherit;
  font-size:15px;
  outline:none;
  background:#fafafa;
}

.create-post textarea:focus{
  border-color:#999;
  background:white;
}

.post-options{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-top:13px;
}

.media-buttons{
  display:flex;
  gap:5px;
}

.media-buttons button{
  border:0;
  background:#f2f2f2;
  padding:9px 11px;
  border-radius:20px;
  cursor:pointer;
  font-size:13px;
}

.post-btn{
  border:0;
  background:#111;
  color:white;
  padding:10px 20px;
  border-radius:22px;
  font-weight:700;
  cursor:pointer;
}

.post-btn:active{
  transform:scale(.97);
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:0 3px 12px;
}

.section-title h2{
  margin:0;
  font-size:19px;
}

.section-title span{
  font-size:20px;
}

.post{
  background:white;
  border-radius:18px;
  padding:17px;
  margin-bottom:14px;
  box-shadow:0 3px 16px rgba(0,0,0,.06);
}

.post-header{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:13px;
}

.post-author{
  font-weight:700;
  font-size:14px;
}

.post-time{
  color:#8a8a8a;
  font-size:11px;
  margin-top:3px;
}

.post-text{
  line-height:1.55;
  margin-bottom:14px;
  white-space:pre-wrap;
}

.actions{
  border-top:1px solid #eee;
  padding-top:11px;
  display:flex;
  gap:8px;
}

.action{
  border:0;
  background:none;
  padding:8px 12px;
  border-radius:18px;
  cursor:pointer;
  color:#555;
  font-size:13px;
}

.action:hover{
  background:#f2f2f2;
}

.empty{
  background:white;
  border-radius:18px;
  text-align:center;
  padding:45px 20px;
  color:#777;
  box-shadow:0 3px 16px rgba(0,0,0,.05);
}

.empty-icon{
  font-size:38px;
  margin-bottom:8px;
}

.empty h3{
  margin:5px 0;
  color:#333;
}

.empty p{
  margin:7px 0 0;
  font-size:13px;
}

.logout{
  display:block;
  margin:25px auto 10px;
  padding:11px 24px;
  border:1px solid #ddd;
  background:white;
  border-radius:25px;
  cursor:pointer;
}

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:200;
  height:65px;
  background:rgba(255,255,255,.97);
  border-top:1px solid #e5e5e5;
  display:flex;
  justify-content:center;
  gap:8px;
  padding:7px 10px;
}

.nav-item{
  flex:1;
  max-width:100px;
  border:0;
  background:none;
  color:#777;
  cursor:pointer;
  border-radius:12px;
  font-size:18px;
}

.nav-item span{
  display:block;
  font-size:10px;
  margin-top:3px;
}

.nav-item.active{
  color:#111;
  font-weight:700;
}

@media(max-width:500px){

  .container{
    padding:12px 10px 25px;
  }

  .welcome h1{
    font-size:24px;
  }

  .create-post{
    padding:14px;
  }

  .media-buttons button{
    padding:8px 9px;
    font-size:12px;
  }

  .post-btn{
    padding:9px 17px;
  }

  .bottom-nav{
    gap:2px;
  }
}
  .profile-card{
  background:white;
  border-radius:18px;
  padding:22px;
  margin-top:20px;
  text-align:center;
  box-shadow:0 3px 15px rgba(0,0,0,.07);
}

.profile-avatar{
  width:70px;
  height:70px;
  margin:0 auto 12px;
  border-radius:50%;
  background:#151515;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:bold;
}

.profile-card h2{
  margin-bottom:14px;
  font-size:20px;
}

#editProfileButton,
#saveUsernameButton{
  border:0;
  border-radius:22px;
  padding:10px 18px;
  background:#151515;
  color:white;
  cursor:pointer;
  font-weight:bold;
}

#profileEditor{
  margin-top:15px;
}

#usernameInput{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:12px;
  margin-bottom:10px;
  font-size:15px;
  outline:none;
}
</style>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="logo">🐉 JSP TAYSU</div>
    <div class="profile" id="profileName">Member</div>
  </div>
</header>

<main class="container">
<div id="communityLogin" style="display:none; text-align:center; padding:20px;">
  <p style="margin-bottom:12px;">
    Sign in to join the community 🐉
  </p>

  <button id="communityGoogleLogin" class="post-btn">
    Continue with Google
  </button>
</div>
  <section class="welcome">
    <h1 id="welcomeText">Welcome 👋</h1>
    <p>Connect. Share. Preserve our heritage.</p>
  </section>

  <section class="create-post">

    <div class="composer-header">
      <div class="avatar" id="composerAvatar">M</div>

      <div>
        <strong id="composerName">Member</strong>
        <small>Share with the community</small>
      </div>
    </div>

    <textarea
      id="postText"
      placeholder="What's on your mind?"></textarea>

    <div class="post-options">

      <div class="media-buttons">
        <button type="button">📷 Photo</button>
        <button type="button">🎥 Video</button>
      </div>

      <button
        class="post-btn"
        id="postButton">
        Post
      </button>

    </div>

  </section>

  <div class="section-title">
    <h2>Community Feed</h2>
    <span>🐉</span>
  </div>

  <section id="posts">

    <div class="empty">
      <div class="empty-icon">🐉</div>
      <h3>No posts yet</h3>
      <p>Be the first to share something with the community.</p>
    </div>

  </section>
<div class="profile-card">

  <div class="profile-avatar" id="profileAvatar">
    M
  </div>

  <h2 id="profileUsername">Member</h2>

  <button id="editProfileButton">
    Edit Profile
  </button>

  <div id="profileEditor" style="display:none;">

    <input
      type="text"
      id="usernameInput"
      placeholder="Choose a username"
      maxlength="20"
    >

    <button id="saveUsernameButton">
      Save Username
    </button>

  </div>

</div>
  <button
    class="logout"
    id="logoutButton">
    Sign out
  </button>

</main>

<nav class="bottom-nav">

  <button class="nav-item active">
    🏠
    <span>Home</span>
  </button>

  <button class="nav-item">
    🔥
    <span>Explore</span>
  </button>

  <button class="nav-item">
    ➕
    <span>Create</span>
  </button>

  <button class="nav-item">
    🔔
    <span>Alerts</span>
  </button>

  <button class="nav-item">
    👤
    <span>Profile</span>
  </button>

</nav>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signOut,
GoogleAuthProvider,
signInWithRedirect,
getRedirectResult
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {
getFirestore,
collection,
addDoc,
getDocs,
serverTimestamp,
doc,
setDoc,
getDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyDpv2vqAZbCFgT_XJ4u-KB0AeZWVB2GIUs",

  authDomain: "jsp-taysu.firebaseapp.com",

  projectId: "jsp-taysu",

  storageBucket: "jsp-taysu.firebasestorage.app",

  messagingSenderId: "280992025632",

  appId: "1:280992025632:web:48efa21208a78be9a78045"


};


const app =
initializeApp(firebaseConfig);
alert("Community JavaScript is running");
const auth =
getAuth(app);
console.log("Community currentUser:", auth.currentUser);


const db = getFirestore(app);
let currentUser = null;
onAuthStateChanged(auth, (user) => {

   if (!user) {
  document.getElementById("profileName").textContent = "Please sign in";

  document.getElementById("communityLogin").style.display = "block";

  return;
}

  currentUser = user;

const name =
user.displayName || "Member";

document.getElementById(
"profileName"
).textContent = name;

document.getElementById(
"welcomeText"
).textContent =
"Welcome, " + name + " 👋";

});
const communityLogin =
  document.getElementById("communityLogin");

const communityGoogleLogin =
  document.getElementById("communityGoogleLogin");

const provider =
  new GoogleAuthProvider();
getRedirectResult(auth)
  .then((result) => {

    if (result && result.user) {

      currentUser = result.user;

      document.getElementById(
        "communityLogin"
      ).style.display = "none";

      document.getElementById(
        "profileName"
      ).textContent =
        result.user.displayName || "Member";

      document.getElementById(
        "welcomeText"
      ).textContent =
        "Welcome, " +
        (result.user.displayName || "Member") +
        " 👋";
    }

  })
  .catch((error) => {

    console.error(error);

    alert(
      error.code +
      ": " +
      error.message
    );

  });
communityGoogleLogin.addEventListener(
  "click",
  async () => {

    try {
alert("Google popup starting...");
      await signInWithRedirect(auth, provider);

      currentUser = result.user;

      communityLogin.style.display =
        "none";

      document.getElementById(
        "profileName"
      ).textContent =
        currentUser.displayName || "Member";

      document.getElementById(
        "welcomeText"
      ).textContent =
        "Welcome, " +
        (currentUser.displayName || "Member") +
        " 👋";

    } catch (error) {

      console.error(error);

      alert(
        error.code +
        ": " +
        error.message
      );

    }

  }
);

document.getElementById(
"logoutButton"
).addEventListener(
"click",
async ()=>{

await signOut(auth);

window.location.href =
"index.html";

});


document.getElementById(
"postButton"
).addEventListener(
"click",
async ()=>{

const text =
document.getElementById(
"postText"
).value.trim();

if(!text){

alert("Write something first!");

return;

}
if (!currentUser) {
  alert("Please sign in again.");
  return;
}
try {
  await addDoc(collection(db, "posts"), {
    text: text,
    authorId: currentUser.uid,
authorName: currentUser.displayName || "Member",
    createdAt: serverTimestamp()
  });

  document.getElementById("postText").value = "";

  alert("Post published! 🐉");

} catch (error) {

  console.error(error);
alert(error.code + ": " + error.message);
  alert("Post could not be published.");

}

});

async function loadPosts() {

  const postsContainer =
    document.getElementById("posts");

  try {

    const snapshot =
      await getDocs(collection(db, "posts"));

    postsContainer.innerHTML = "";

    if (snapshot.empty) {

      postsContainer.innerHTML = `
        <div class="empty">
          <div class="empty-icon">🐉</div>
          <h3>No posts yet</h3>
          <p>Be the first to share something with the community.</p>
        </div>
      `;

      return;
    }

    snapshot.forEach((doc) => {

      const post = doc.data();

      const postElement =
        document.createElement("article");

      postElement.className = "post";

      postElement.innerHTML = `
        <div class="post-header">

          <div class="avatar">
            ${(post.authorName || "M").charAt(0).toUpperCase()}
          </div>

          <div>
            <div class="post-author">
              ${post.authorName || "Member"}
            </div>

            <div class="post-time">
              Community member
            </div>
          </div>

        </div>

        <div class="post-text">
          ${post.text || ""}
        </div>

        <div class="actions">
          <button class="action">❤️ Like</button>
          <button class="action">💬 Comment</button>
          <button class="action">↗️ Share</button>
        </div>
      `;

      postsContainer.appendChild(postElement);

    });

  } catch (error) {

    console.error("Error loading posts:", error);

  }
}

console.log("PROFILE CODE START");

const editProfileButton =
  document.getElementById("editProfileButton");

const profileEditor =
  document.getElementById("profileEditor");

const usernameInput =
  document.getElementById("usernameInput");

const saveUsernameButton =
  document.getElementById("saveUsernameButton");

const profileUsername =
  document.getElementById("profileUsername");

const profileAvatar =
  document.getElementById("profileAvatar");


if (editProfileButton) {

  editProfileButton.addEventListener("click", function () {

    profileEditor.style.display = "block";

    usernameInput.focus();

  });

}


if (saveUsernameButton) {

  saveUsernameButton.addEventListener("click", async function () {

    if (!currentUser) {
      alert("Please sign in again.");
      return;
    }

    const username =
      usernameInput.value.trim();

    if (username.length < 3) {
      alert("Username must be at least 3 characters.");
      return;
    }

    try {

      await setDoc(
        doc(db, "users", currentUser.uid),
        {
          username: username,
          updatedAt: serverTimestamp()
        },
        { merge: true }
      );

      profileUsername.textContent =
        username;

      profileAvatar.textContent =
        username.charAt(0).toUpperCase();

      profileEditor.style.display =
        "none";

      alert("Username updated! 🐉");

    } catch (error) {

      console.error(error);

      alert(
        error.code + ": " +
        error.message
      );

    }

  });

}
</script>

</body>
</html>
